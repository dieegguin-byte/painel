        <div className="composer-actions"><label className="file-button">{files.length ? `${files.length} print(s)` : "Anexar print(s) (opcional)"}<input type="file" accept="image/*" multiple onChange={(e) => setFiles((fs) => [...fs, ...Array.from(e.target.files || [])])} /></label></div>
        <p className="ficha-note">{ehReagendar ? "Você só explica — o Claude abre o calendário e reagenda na próxima vez que você chamar. Não precisa escolher a data agora." : "Você explica o que rolou — o Claude atualiza o lead (status, próximo passo) na próxima vez que você chamar."}</p>
        <div className="ficha-actions"><button className="primary" onClick={submit} disabled={busy}>Registrar pro Claude</button><button className="ghost" onClick={onClose}>Cancelar</button></div>
      </div>
    </div>
  </div>;
}

// O SELETOR MOSTRA O QUE O APP RECOMENDA, NÃO TUDO QUE CABE (14/08). A lista antiga começava às 08:00 todo
// dia — manhã é exatamente o que ele não quer que apareça por padrão — e deixava clicar num horário
// fisicamente impossível sem nem perguntar. Agora: sugestão primeiro (13h30 pra cima, igreja fora), o resto
// atrás de um botão, e horário arriscado exige um segundo clique de confirmação.
function AgendaPicker({ appointments, appt, onClose, onPicked }) {
  const tipo = appt.tipo || "presencial";
  const cidade = tipo === "presencial" ? (appt.cidade || "") : null;
  const [mostrarTudo, setMostrarTudo] = useState(false);
  const [confirmando, setConfirmando] = useState(null);
  const hoje = new Date();
  const porDia = {};
  appointments.forEach((a) => { if (a.id && a.id === appt.id) return; (porDia[a.data] = porDia[a.data] || []).push(a); });
  const dias = [];
  let escondidos = 0;
  for (let i = 0; i < 14; i++) {
    const d = new Date(hoje); d.setDate(d.getDate() + i);
    const dataISO = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const doDia = porDia[dataISO] || [];
    const ocupados = tipo === "presencial" ? doDia.filter((a) => (a.tipo || "presencial") === "presencial" && cidadeChave(a.cidade) === cidadeChave(cidade)).map((a) => a.hora) : [];
    const todos = horariosParaTipo(dataISO, tipo, ocupados);
    const sugeridos = horariosSugeridos(dataISO, tipo, ocupados, cidade);
    escondidos += todos.length - sugeridos.length;
    const livres = mostrarTudo ? [...new Set([...sugeridos, ...todos])].sort() : sugeridos;
    if (!livres.length) continue;
    const cidadesDoDia = [...new Set(doDia.filter((a) => (a.tipo || "presencial") === "presencial" && a.cidade).map((a) => a.cidade))];
    const outrasCidades = tipo === "presencial" && cidade ? doDia.filter((a) => (a.tipo || "presencial") === "presencial" && a.cidade && a.hora && cidadeChave(a.cidade) !== cidadeChave(cidade)) : [];
    dias.push({ dataISO, doDia, livres, cidadesDoDia, outrasCidades, conflito: outrasCidades.length > 0, igreja: ehDiaDeIgreja(dataISO) && tipo === "presencial" });
  }
  const escolher = (dataISO, h, travado) => {
    const chave = dataISO + " " + h;
    if (travado && confirmando !== chave) { setConfirmando(chave); return; }
    onPicked(dataISO, h);
  };
  return <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal-card small">
      <div className="modal-head"><div><p className="kicker">ESCOLHER DIA E HORÁRIO</p><h2>{appt.titulo || "Compromisso"}</h2></div><button className="ghost" onClick={onClose}>Fechar</button></div>
      <p className="modal-intro">{tipo === "remoto"
        ? "Tarefa remota — sugestão a partir das 13h30; o resto fica atrás do botão abaixo."
        : `Presencial${cidade ? " em " + cidade : ""} — sugestão a partir das 13h30, terça e sábado até 21h, igreja de 18h30 preservada.`}</p>
      {!dias.length ? <div className="empty-state"><b>Sem horário sugerido nos próximos 14 dias.</b><span>Use "ver todos os horários" pra escolher manualmente.</span></div> : dias.map((dia) => <div className="picker-day" key={dia.dataISO}>
        <div className={`picker-day-label${dia.conflito ? " conflito" : ""}`}>{compactDate(dia.dataISO)}{dia.doDia.length ? ` · ${dia.doDia.length} compromisso(s)` : " · dia livre"}{dia.cidadesDoDia.length ? ` · 🏙 ${dia.cidadesDoDia.join(", ")}` : ""}{dia.igreja ? " · ⛪ 18h30" : ""}</div>
        {dia.conflito && <div className="picker-aviso">⚠️ Já tem {dia.outrasCidades.map((a) => `${(a.hora || "").slice(0, 5)} em ${a.cidade}`).join(", ")} — horários em vermelho não dão tempo de serviço + estrada.</div>}
        <div className="picker-slots">{dia.livres.map((h) => {
          const rota = horarioApertado(h, dia.outrasCidades, cidade);
          const igreja = conflitaComIgreja(dia.dataISO, h, tipo, cidade);
          const travado = rota || igreja;
          const chave = dia.dataISO + " " + h;
          const motivo = igreja ? "Serviço + estrada de volta não fecha antes da igreja de 18h30." : "Muito perto do compromisso em outra cidade — serviço + estrada não fecha.";
          return <button key={h} className={`picker-slot${travado ? " risky" : ""}${confirmando === chave ? " confirmando" : ""}`} title={travado ? motivo : ""} onClick={() => escolher(dia.dataISO, h, travado)}>
            {confirmando === chave ? "Confirmar " + h + "?" : h}{igreja && confirmando !== chave ? " ⛪" : ""}
          </button>;
        })}</div>
      </div>)}
      {confirmando && <p className="picker-aviso">Esse horário está marcado como arriscado — clique de novo pra assumir mesmo assim.</p>}
      <div className="ficha-actions"><button type="button" className="ghost" onClick={() => { setMostrarTudo(!mostrarTudo); setConfirmando(null); }}>
        {mostrarTudo ? "Mostrar só os horários sugeridos" : `Ver todos os horários${escondidos ? ` (+${escondidos} fora da sugestão, inclusive manhã)` : ""}`}
      </button></div>
    </div>
  </div>;
}

const FINANCE_ABAS = [{ id: "todos", label: "Todos" }, { id: "empresa", label: "Empresa" }, { id: "pro_labore", label: "Pró-labore" }, { id: "pessoal", label: "Pessoal" }];
function FinanceView({ finances, services, db, demo, mode, notify, onChanged, onVerAPagar }) {
  const [aba, setAba] = useState("todos");
  // FOCO = qual card do topo está selecionado. Diego (29/07): "entradas saídas e saldo ali dá pra fazer
  // outro card como a receber, e todos clicáveis levando a eles". O número parado não servia pra nada —
  // agora cada card é a porta pra lista dele, sem precisar de aba nova no menu.
  const [foco, setFoco] = useState("todos");
  // O Financeiro mostra o que JÁ ACONTECEU. Conta futura (a_pagar) fica de fora da lista porque ela ordena por
  // data: um parcelamento de 12 meses ia empilhar 2027 em cima do que aconteceu hoje e esconder o dia. O que
  // está por vencer aparece resumido na faixa do topo, que leva pra aba "A pagar".
  // A RECEBER TAMBÉM SAI DA LISTA (29/07/2026). Antes o filtro só tirava `a_pagar`, então saldo a receber
  // aparecia em "Lançamentos realizados" com "+ R$ 1.000" verde, idêntico a dinheiro que entrou — mas as
  // métricas do topo (corretamente) não somam a_receber. Lista e saldo não fechavam, e Diego não conseguia
  // saber o que tinha entrado de verdade: "esses a receber parece que já foram lançados, ficou muito
  // estranho a visualização". Dinheiro que ainda não entrou não é lançamento realizado — vai pra faixa
  // de resumo do topo, mesmo tratamento que já era dado às contas a pagar.
  const realizados = finances.filter((item) => item.status !== "a_pagar" && item.status !== "a_receber");
  const daAba = aba === "todos" ? realizados
    : aba === "pro_labore" ? realizados.filter((item) => item.categoria === "Pró-labore" && item.tipo === "entrada")
    : realizados.filter((item) => (item.escopo || "empresa") === aba);
  // MÊS A MÊS (Diego, 01/08): "como virou o mês agora, saber poder voltar e ver o mês passado". Antes a tela
  // era uma lista única desde o começo de tudo — virou agosto e julho inteiro sumiu de vista misturado no
  // meio. Agora abre no mês corrente e anda pra trás/frente num toque. "Tudo" continua existindo pra quando
  // ele quiser o histórico inteiro.
  const [mesSel, setMesSel] = useState(() => mesISO(hojeISO()));
  const andarMes = (delta) => {
    const base = mesSel || mesISO(hojeISO());
    const [ano, mes] = base.split("-").map(Number);
    const d = new Date(ano, mes - 1 + delta, 1);
    setMesSel(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };
  const visiveis = mesSel ? daAba.filter((item) => mesISO(item.data) === mesSel) : daAba;
  // O saldo em CAIXA nunca é do mês — é o acumulado. Mostrar só o resultado do mês no card grande faria ele
  // achar que tem menos dinheiro do que tem. Os dois números convivem: resultado do mês em cima, caixa embaixo.
  const caixaAcumulado = daAba.reduce((soma, i) => soma + (i.tipo === "entrada" ? Number(i.valor) : -Number(i.valor)), 0);
  // O alerta de vencimento mora no Painel (é lá que ele olha todo dia). Aqui fica só uma linha de resumo,
  // pra tela não virar uma parede de cards.
  const hoje = hojeISO();
  const resumo = resumoContas(finances, services, hoje);
  const paidIn = visiveis.filter((item) => item.tipo === "entrada" && (!item.status || item.status === "pago")).reduce((sum, item) => sum + Number(item.valor), 0); const paidOut = visiveis.filter((item) => item.tipo === "saida" && (!item.status || item.status === "pago")).reduce((sum, item) => sum + Number(item.valor), 0);
  const totalAReceber = resumo.aReceber.reduce((s, f) => s + Number(f.valor), 0);
  // A lista de baixo obedece o card selecionado. Só o "A receber" troca o componente inteiro (tem botão de
  // dar baixa); entrada/saída são o mesmo formato de linha, só filtrado.
  const noFoco = foco === "entrada" ? visiveis.filter((i) => i.tipo === "entrada") : foco === "saida" ? visiveis.filter((i) => i.tipo === "saida") : visiveis;
  return <div className="page-grid"><div className="funil-filtros">{FINANCE_ABAS.map((a) => <button key={a.id} className={aba === a.id ? "active" : ""} onClick={() => setAba(a.id)}>{a.label}</button>)}</div>
    <div className="mes-nav">
      <button type="button" className="ghost" onClick={() => andarMes(-1)} disabled={!mesSel} title="Mês anterior">‹</button>
      <strong>{mesSel ? mesLabel(mesSel) : "Todo o histórico"}</strong>
      <button type="button" className="ghost" onClick={() => andarMes(1)} disabled={!mesSel} title="Próximo mês">›</button>
      <button type="button" className={`ghost${mesSel ? "" : " active"}`} onClick={() => setMesSel(mesSel ? "" : mesISO(hojeISO()))}>{mesSel ? "Ver tudo" : "Voltar pro mês"}</button>
    </div>
    {resumo.aPagar.length > 0 && <p className="ficha-note">{money(resumo.totalAPagar)} em {resumo.aPagar.length} conta(s) ainda por pagar
      {resumo.vencidas.length ? ` · ${resumo.vencidas.length} já vencida(s)` : ""}
      {onVerAPagar && <> · <button type="button" className="ficha-link" onClick={onVerAPagar}>ver em A pagar</button></>}</p>}
    {/* 4 CARDS CLICÁVEIS. O de "A receber" é amarelo de propósito: é o único que NÃO é dinheiro no caixa. */}
    <section className="metric-grid finance-metrics">
      <Metric label="Entradas" value={money(paidIn)} detail={foco === "entrada" ? "▾ mostrando só estas" : "Confirmadas · toque para ver"} tone="green" onClick={() => setFoco(foco === "entrada" ? "todos" : "entrada")} />
      <Metric label="Saídas" value={money(paidOut)} detail={foco === "saida" ? "▾ mostrando só estas" : "Confirmadas · toque para ver"} tone="red" onClick={() => setFoco(foco === "saida" ? "todos" : "saida")} />
      <Metric label={mesSel ? "Resultado do mês" : "Saldo"} value={money(paidIn - paidOut)} detail={mesSel ? `Em caixa hoje: ${money(caixaAcumulado)}` : (foco === "todos" ? "▾ tudo que já aconteceu" : "Toque para ver tudo")} tone="orange" onClick={() => setFoco("todos")} />
      <Metric label="A receber" value={money(totalAReceber)} detail={foco === "receber" ? "▾ ainda fora do caixa" : `${resumo.aReceber.length} saldo(s) · toque para ver`} tone="yellow" onClick={() => setFoco(foco === "receber" ? "todos" : "receber")} />
    </section>
    {foco === "receber"
      ? <AReceberBloco finances={finances} services={services} db={db} demo={demo} mode={mode} notify={notify} onChanged={onChanged} />
      : <section className="content-card"><div className="card-head"><div><p className="kicker">DIEGO E CLAUDE · MESMA OPERAÇÃO TIPADA</p><h3>{foco === "entrada" ? "Entradas confirmadas" : foco === "saida" ? "Saídas confirmadas" : "Lançamentos realizados"}</h3></div></div>{noFoco.map((item) => <div className="finance-row" key={item.id}><div><strong>{descricaoFinanceiraVisivel(item.descricao) || item.categoria || "Lançamento"}</strong><span>{compactDate(item.data)} · {item.status || "pago"}</span></div><b className={item.tipo}>{item.tipo === "saida" ? "−" : "+"} {money(item.valor)}</b></div>)}{!noFoco.length && <div className="empty-state"><b>{mesSel ? `Nenhum lançamento em ${mesLabel(mesSel)}.` : "Nada por aqui ainda."}</b>{mesSel && <span>Use as setas pra ver outro mês, ou “Ver tudo”.</span>}</div>}</section>}</div>;
}

function nomeFornecedorVale(descricao) {
  // "Vale - Marcão", "Vale Marcão" e "Vale: Marcão" são a mesma pessoa. O hífen era obrigatório aqui, então
  // os vales digitados sem ele viravam um profissional chamado "Vale Marcão".
  const semPrefixo = (descricao || "").replace(/^Vale\s*[-–—:]?\s*/i, "");
  return semPrefixo.split(/[\(,]/)[0].trim() || "Sem nome";
}
// UMA PESSOA, UMA CONTA. Achado em 07/08/2026 na primeira tela real da aba Profissionais: o Marcão aparecia
// TRÊS vezes — "Vale Marcão" (R$70), "Marcao" sem acento (R$131) e "Marcão" (R$288 + o trabalho). Enquanto
// era só a lista de vales, nome torto era feio; agora que um lado desconta o outro, nome torto dá conta
// ERRADA — ele acertaria com um "Marcão" e continuaria devendo os outros dois. A chave ignora acento, caixa
// e pontuação; o nome mostrado é o mais completo que apareceu.
function chaveProfissional(nome) {
  return String(nome || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() || "sem nome";
}
const VALE_ABATIDO_TAG = "[ABATIDO] ";
// ABA PROFISSIONAIS (era "Vales" até 06/08/2026)
// O nome mudou porque a aba passou a ter os DOIS lados da conta com cada profissional: o que ele já pegou
// adiantado (vale) e o que ele fez pra ganhar (buscar, entregar, o serviço). Diego: "eu tenho que ir anotando
// que ele busca serviço comigo, isso é trabalho dele... só pra não esquecer quando for abater os vales".
// Vale sozinho só mostrava a dívida DELE com o Diego. Faltava a do Diego com ele — que era a que sumia.
function ProfissionaisView({ finances, services, db, demo, mode, notify, onChanged }) {
  const [busyId, setBusyId] = useState(null);
  const [confirmando, setConfirmando] = useState(null);
  const [valores, setValores] = useState({});
  const [novo, setNovo] = useState({ profissional: "", oQue: "busca", detalhe: "", valor: "", data: hojeISO() });
  const vales = finances.filter((f) => f.categoria === "Vale");
  const trabalhos = finances.filter((f) => f.categoria === CATEGORIA_MAO_DE_OBRA && f.status === "a_pagar");
  const trabalhosAbertos = trabalhos.filter(ehTrabalhoAberto);
  // O DINHEIRO DO VALE SAI NA HORA (Diego confirmou em 25/07/2026: "todos vales já saem na hora" — Pix ou
  // dinheiro na mão). Então TODO vale nasce como saída PAGA: o caixa sente no dia em que ele entrega.
  // O que fica pendente NÃO é pagamento, é o DESCONTO no que ele vai pagar pro profissional depois.
  // Por isso "abatido" é marcado no texto e NÃO mexe no status — se mexesse, o mesmo dinheiro sairia duas
  // vezes. Antes o modelo estava invertido (vale entrava como "a pagar" e virava saída ao abater), e por
  // isso 6 vales de R$465,70 não apareciam no caixa mesmo com o dinheiro já tendo saído.
  const pendentes = vales.filter((v) => !(v.descricao || "").startsWith(VALE_ABATIDO_TAG));
  const abatidos = vales.filter((v) => (v.descricao || "").startsWith(VALE_ABATIDO_TAG));
  const totalPendente = pendentes.reduce((sum, v) => sum + Number(v.valor), 0);
  const totalTrabalho = trabalhosAbertos.reduce((sum, t) => sum + Number(t.valor || 0), 0);
  const semValor = trabalhosAbertos.filter((t) => !Number(t.valor)).length;
  // UMA CONTA POR PESSOA: vale e trabalho da mesma pessoa caem na mesma linha, senão o acerto continuaria
  // sendo feito de cabeça. A chave ignora acento e caixa (ver chaveProfissional) porque os vales antigos têm
  // o mesmo nome escrito de três jeitos, e é assim que ele fala: "acertar com o Marcão", um só.
  const contas = {};
  const entrar = (nome) => {
    const chave = chaveProfissional(nome);
    const conta = (contas[chave] ||= { nome, vales: [], trabalhos: [] });
    // Fica com o nome mais completo que apareceu — "Marcão" ganha de "Marcao", e não "Vale Marcão".
    if (nome && nome.length > conta.nome.length) conta.nome = nome;
    return conta;
  };
  pendentes.forEach((v) => entrar(nomeFornecedorVale(v.descricao)).vales.push(v));
  trabalhosAbertos.forEach((t) => entrar(nomeProfissionalMaoDeObra(t.descricao)).trabalhos.push(t));
  const listaContas = Object.values(contas).map((c) => {
    const somaTrabalho = c.trabalhos.reduce((s, t) => s + Number(t.valor || 0), 0);
    const somaVale = c.vales.reduce((s, v) => s + Number(v.valor), 0);
    return { ...c, somaTrabalho, somaVale, liquido: Number((somaTrabalho - somaVale).toFixed(2)), pendencias: c.trabalhos.filter((t) => !Number(t.valor)).length };
  }).sort((a, b) => b.liquido - a.liquido);
  const nomesConhecidos = [...new Set([
    ...(services || []).map((s) => s.responsavel).filter(Boolean),
    ...Object.values(contas).map((c) => c.nome),
  ])];
  const anotarTrabalho = async () => {
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    const profissional = novo.profissional.trim();
    if (!profissional) { notify("Diga de quem é o trabalho — é por ele que o acerto soma.", "error"); return; }
    setBusyId("novo");
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "mao_de_obra_anotada",
        eventoId: "app-mao-de-obra-" + Date.now(),
        dados: { profissional, oQue: novo.oQue, detalhe: novo.detalhe.trim(), valor: novo.valor, data: novo.data, por: "diego" },
      });
      notify(novo.valor ? `Anotado pro ${profissional}. Isso não mexeu no caixa — o dinheiro sai no acerto.` : `Anotado pro ${profissional} sem valor. Ponha o valor antes de acertar.`, "ok");
      setNovo({ profissional, oQue: novo.oQue, detalhe: "", valor: "", data: hojeISO() });
      await onChanged();
    } catch (e) { notify("Não anotou: " + e.message, "error"); } finally { setBusyId(null); }
  };
  const salvarValor = async (item) => {
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusyId(item.id);
    try {
      await processarEventoOperacaoBahia(db, { tipo: "financeiro", eventoId: "app-mao-de-obra-valor-" + item.id + "-" + Date.now(), dados: { financeiroId: item.id, valor: valores[item.id] } });
      notify("Valor anotado. Continua fora do caixa até o acerto.", "ok");
      setValores({ ...valores, [item.id]: "" });
      await onChanged();
    } catch (e) { notify("Não salvou: " + e.message, "error"); } finally { setBusyId(null); }
  };
  const acertar = async (conta) => {
    if (mode === "claude") { notify("No modo Claude, acerte pela operação tipada mao_de_obra_acertada.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusyId("acerto-" + conta.nome);
    try {
      const r = await processarEventoOperacaoBahia(db, {
        tipo: "mao_de_obra_acertada",
        // O id carrega o primeiro trabalho do lote: repetir o botão depois de uma falha retoma o MESMO acerto
        // (não paga duas vezes), mas um segundo acerto com a mesma pessoa no mesmo dia é outro lote e passa.
        eventoId: "app-acerto-" + conta.nome.replace(/\s+/g, "-").toLowerCase() + "-" + conta.trabalhos[0].id,
        dados: { profissional: conta.nome, trabalhoIds: conta.trabalhos.map((t) => t.id), valeIds: conta.vales.map((v) => v.id), data: hojeISO(), por: "diego" },
      });
      const liquido = r?.resultado?.liquido ?? conta.liquido;
      notify(`Acerto com ${conta.nome} fechado: ${money(liquido)} saiu do caixa. Os vales dele já estavam pagos e foram descontados.`, "ok");
      setConfirmando(null);
      await onChanged();
    } catch (e) { notify(e.message, "error"); } finally { setBusyId(null); }
  };
  const marcarAbatido = async (item) => {
    // Abater é só registrar o desconto administrativo. A operação tipada trava status=pago e nunca cria
    // uma segunda saída no caixa.
    if (mode === "claude") { notify("No modo Claude, abata pela operação tipada vale_abatido.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusyId(item.id);
    try {
      await processarEventoOperacaoBahia(db, { tipo: "vale_abatido", eventoId: "app-vale-abatido-" + item.id, dados: { financeiroId: item.id } });
      notify("Vale abatido — descontado do que você paga ao profissional. O caixa não muda: esse dinheiro já saiu no dia do vale.", "ok"); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusyId(null); }
  };
  const acertados = finances.filter((f) => f.categoria === CATEGORIA_MAO_DE_OBRA && (f.descricao || "").startsWith(MAO_DE_OBRA_ACERTADA_TAG));
  return <div className="page-grid">
    <section className="metric-grid finance-metrics">
      <Metric label="Eles têm a receber" value={money(totalTrabalho)} detail={`${trabalhosAbertos.length} trabalho(s)${semValor ? ` · ${semValor} sem valor` : ""}`} tone={semValor ? "orange" : "yellow"} />
      <Metric label="Vales já adiantados" value={money(totalPendente)} detail={`${pendentes.length} vale(s) a descontar`} tone="red" />
      <Metric label="Sai do caixa no acerto" value={money(Math.max(0, totalTrabalho - totalPendente))} detail="Trabalho menos vale" tone="green" />
    </section>

    {/* ANOTAR É O CORAÇÃO DA ABA: se anotar der trabalho, ele não anota, e a busca do Marcão volta a se perder.
        Por isso o formulário fica em cima, aberto, com o nome guardado entre uma anotação e outra — ele
        costuma lançar duas ou três seguidas do mesmo profissional. */}
    <section className="content-card">
      <div className="card-head"><div><p className="kicker">ANOTE NA HORA</p><h3>O que o profissional fez</h3></div></div>
      <p className="ficha-note">Buscou, entregou ou fez o serviço — anote aqui, mesmo sem valor combinado. <strong>Isso não mexe no caixa</strong>: só entra no seu saldo no dia do acerto.</p>
      <div className="form-grid">
        <label>Profissional*<input value={novo.profissional} onChange={(e) => setNovo({ ...novo, profissional: e.target.value })} list="profissionais-acerto" placeholder="Marcão, Marlom pai…" /></label>
        <datalist id="profissionais-acerto">{nomesConhecidos.map((n) => <option key={n} value={n} />)}</datalist>
        <div className="agenda-acoes">
          {Object.entries(TRABALHOS_PROFISSIONAL).map(([chave, rotulo]) => <button key={chave} className={novo.oQue === chave ? "primary" : "ghost"} onClick={() => setNovo({ ...novo, oQue: chave })}>{rotulo}</button>)}
        </div>
        <label>De quem / o quê<input value={novo.detalhe} onChange={(e) => setNovo({ ...novo, detalhe: e.target.value })} placeholder="Poltrona da Andriele, Jardim do Ingá" /></label>
        <div className="row three">
          <label>Valor R$ (se já combinou)<input value={novo.valor} onChange={(e) => setNovo({ ...novo, valor: e.target.value })} placeholder="deixe vazio se for acertar depois" /></label>
          <label>Data<input type="date" value={novo.data} onChange={(e) => setNovo({ ...novo, data: e.target.value })} /></label>
        </div>
        <button className="primary wide" disabled={busyId === "novo"} onClick={anotarTrabalho}>{busyId === "novo" ? "Anotando…" : "Anotar trabalho"}</button>
      </div>
    </section>

    <section className="content-card"><div className="card-head"><div><p className="kicker">CONTA COM CADA UM</p><h3>Acerto por profissional</h3></div></div>
      {!listaContas.length && <div className="empty-state"><b>Nada em aberto com ninguém.</b><span>Anote acima quando alguém buscar, entregar ou fizer um trabalho — e os vales que você adiantar aparecem aqui do lado.</span></div>}
      {listaContas.map((conta) => <div key={conta.nome} className="vale-fornecedor">
        <div className="vale-fornecedor-head"><strong>{conta.nome}</strong><b className={conta.liquido > 0 ? "saida" : ""}>{conta.liquido > 0 ? money(conta.liquido) + " a pagar" : conta.liquido < 0 ? money(-conta.liquido) + " adiantado demais" : "quites"}</b></div>

        {conta.trabalhos.map((t) => <div className="finance-row" key={t.id}>
          <div><strong>{compactDate(t.data)}</strong><span>{(t.descricao || "").replace(/^Mão de obra\s*-\s*/i, "")}</span></div>
          {Number(t.valor)
            ? <b>+ {money(t.valor)}</b>
            : <div className="agenda-acoes">
                <input value={valores[t.id] || ""} onChange={(e) => setValores({ ...valores, [t.id]: e.target.value })} placeholder="R$ combinado" style={{ maxWidth: "8rem" }} />
                <button className="ghost" disabled={busyId === t.id || !(valores[t.id] || "").trim()} onClick={() => salvarValor(t)}>{busyId === t.id ? "..." : "Pôr valor"}</button>
              </div>}
        </div>)}

        {conta.vales.map((v) => <div className="finance-row" key={v.id}>
          <div><strong>{compactDate(v.data)}</strong><span>{v.descricao}</span></div>
          <div className="agenda-acoes"><b className="saida">− {money(v.valor)}</b><button className="ghost" disabled={busyId === v.id} onClick={() => marcarAbatido(v)}>{busyId === v.id ? "..." : "Só abater"}</button></div>
        </div>)}

        {/* O ACERTO PAGA O LÍQUIDO, NUNCA O CHEIO: o vale já saiu do caixa no dia em que ele pegou.
            Pagar o total dos trabalhos aqui faria o mesmo dinheiro sair duas vezes. */}
        {conta.pendencias > 0 && <p className="ficha-note">Falta valor em {conta.pendencias} trabalho(s) — o acerto não fecha assim, senão você paga por baixo.</p>}
        {conta.trabalhos.length > 0 && (confirmando === conta.nome
          ? <div className="agenda-acoes">
              <span>{money(conta.somaTrabalho)} de trabalho {conta.somaVale ? `− ${money(conta.somaVale)} de vale ` : ""}= <strong>{money(Math.max(0, conta.liquido))} do caixa agora</strong></span>
              <button className="primary" disabled={busyId === "acerto-" + conta.nome} onClick={() => acertar(conta)}>{busyId === "acerto-" + conta.nome ? "Fechando…" : "Confirmar acerto"}</button>
              <button className="ghost" onClick={() => setConfirmando(null)}>Cancelar</button>
            </div>
          : <button className="ghost" disabled={conta.pendencias > 0} onClick={() => setConfirmando(conta.nome)}>Acertar com {conta.nome}</button>)}
      </div>)}
    </section>

    {(abatidos.length > 0 || acertados.length > 0) && <section className="content-card"><div className="card-head"><div><p className="kicker">HISTÓRICO</p><h3>Já acertado</h3></div></div>
      {acertados.map((t) => <div className="finance-row" key={t.id}><div><strong>{t.descricao.replace(MAO_DE_OBRA_ACERTADA_TAG, "").replace(/^Mão de obra\s*-\s*/i, "")}</strong><span>{compactDate(t.data)} · pago no acerto</span></div><b>{money(t.valor)}</b></div>)}
      {abatidos.map((v) => <div className="finance-row" key={v.id}><div><strong>{v.descricao.replace(VALE_ABATIDO_TAG, "")}</strong><span>{compactDate(v.data)} · vale abatido</span></div><b className="saida">− {money(v.valor)}</b></div>)}
    </section>}
  </div>;
}

// Compra de material NÃO é uma tabela separada: é um lançamento normal do financeiro (categoria "Material", escopo empresa)
// com fornecedor_id e, quando o material foi pra um trabalho específico, servico_id. Assim o saldo da empresa nunca
// desencontra e a aba Compras é só uma VISTA - mesmo padrão de Vales e Pró-labore. Ver REGRA Nº 8 no Guia da IA.
const CATEGORIA_MATERIAL = "Material";
// Dinheiro que ENTRA por um trabalho. Comparado sem acento porque o banco tem as duas grafias ("Serviço" e
// "Servico") vindas de lançamentos de épocas diferentes — a trava não pode depender do cedilha.
const ehCategoriaServico = (cat) => String(cat || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase() === "servico";
const MATERIAL_EM_MAOS_TAG = "[EM MÃOS] ";
const MATERIAL_EM_TRANSITO_TAG = "[EM TRÂNSITO] ";
function ehCompraMaterial(item) { return item.tipo === "saida" && item.categoria === CATEGORIA_MATERIAL; }
function materialEstaEmMaos(item) { return (item?.descricao || "").startsWith(MATERIAL_EM_MAOS_TAG); }
function materialEstaEmTransito(item) { return (item?.descricao || "").startsWith(MATERIAL_EM_TRANSITO_TAG); }
// Tags são controle interno de cada aba (material em mãos, vale abatido) — no Financeiro elas só poluem.
// Diego, 04/08: "confirmei na aba Vales, lá não era para mexer no financeiro". E não mexeu: o valor e o
// status do vale continuaram iguais. O que mudou foi o NOME do lançamento, que passou a exibir "[ABATIDO]"
// na lista do Financeiro — e ver a linha mudar sozinha depois de mexer noutra aba parece, com toda razão,
// que o caixa foi alterado. Aparência de alteração no dinheiro é tão ruim quanto alteração de verdade.
function descricaoFinanceiraVisivel(descricao) { return String(descricao || "").replace(MATERIAL_EM_MAOS_TAG, "").replace(MATERIAL_EM_TRANSITO_TAG, "").replace(VALE_ABATIDO_TAG, ""); }
// Compra antiga entrou sem fornecedor e fica pedindo atenção. "Conferido" é só a marca de que o Diego já olhou
// e está certo - nunca apaga o lançamento (Regra Nº 7), só tira do que precisa de revisão.
const COMPRA_CONFERIDA_TAG = "[CONFERIDO] ";
// COMO O MATERIAL VIRA COMPROMISSO. Fornecedor com dias de entrega cadastrados ENTREGA, então o que o Diego
// precisa fazer é PEDIR — vira compromisso remoto, um dia antes da entrega (é o "pedido 1 dia antes" que já
// está na observação dos fornecedores). Fornecedor sem dia fixo não entrega: aí é viagem presencial e precisa
// de cidade e hora, senão quebra a Regra Nº 4. Ver [[feedback-operacao-drive-direto-sem-caixa]].
// Conta a pagar e caixa possível num lugar só, porque a decisão é sempre a mesma: "vou ter que pagar isso,
// tenho de onde tirar?". Usado no Painel (alerta com 1 dia de antecedência) e no Financeiro (linha de resumo).
// COMO O APP SABE QUE NÃO TEM PRAZO: pela descrição, que é onde o Classic já diz isso hoje, com estas
// palavras. Não inventei campo novo no banco nem convenção nova que dependa de alguém lembrar de usar —
// funciona no lançamento que JÁ está lá. Se um dia nascer um campo de vencimento de verdade, ele vence
// esta regra e este teste sai.
// Ampliado em 27/08 pelo item A-PAGAR-CONDICIONAL-SERVICO-20260826-1926 (nota 11032, Plástico e Tal,
// R$ 1.316 da Luiza): a condição nem sempre é "quando houver saldo" — ali era "a pagar APÓS O SERVIÇO", e
// a negativa vinha escrita como "vencimento/data exata de pagamento não informados". A versão estreita
// não pegava, e a dívida voltaria a aparecer como vencida.
// A palavra "vencimento" sozinha NÃO basta: a mensalidade da contabilidade diz "vencimento todo dia 20" e
// tem prazo de verdade. Só conta quando ela vem NEGADA na mesma frase.
const SEM_VENCIMENTO = /(vencimento|data (exata )?de pagamento|data exata)[^.;]{0,60}n[ãa]o (informad|confirmad|definid)|sem vencimento|(assim que|quando)[^.;]{0,40}(houver|tiver) saldo|assim que poss[íi]vel|a pagar (ap[óo]s|depois d)|pagar (ap[óo]s|depois d)[^.;]{0,50}(servi[çc]o|entrega|receb)|quando (eu )?(tiver|receber) dinheiro/i;
function resumoContas(finances, services, hoje) {
  const amanha = (() => { const d = new Date(hoje + "T12:00:00"); d.setDate(d.getDate() + 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
  // TRABALHO DE PROFISSIONAL NÃO É CONTA A PAGAR (Diego, 06/08: "não gostei do alerta no painel, aparece que
  // estou devendo o Marcão — queria algo separado lá mesmo em Profissionais"). Anotar que ele buscou um móvel
  // é memória pro acerto, não conta com vencimento: não tem data pra correr atrás de dinheiro, e o valor bruto
  // ainda vai ser abatido dos vales. Sai daqui pelo mesmo motivo que o Vale já saía — os dois vivem na aba
  // Profissionais, onde um desconta o outro.
  const aPagar = (finances || []).filter((f) => f.status === "a_pagar" && f.tipo === "saida" && f.categoria !== "Vale" && f.categoria !== CATEGORIA_MAO_DE_OBRA);
  // OBRIGAÇÃO SEM VENCIMENTO (24/08/2026, caso Ozair — R$ 114 das espumas já em mãos). "Pago assim que
  // houver saldo" NÃO é conta vencida. A data que está no lançamento registra o dia em que a dívida foi
  // reconhecida, não um prazo — o próprio Classic escreve isso na descrição. Contar como vencida fazia o
  // Painel gritar "tem conta vencida" pra sempre por uma dívida que nunca teve prazo, e alerta que mente é
  // alerta que ele para de ler. Some do "vencido", continua visível, dito pelo que é.
  const semPrazoMarcado = (f) => SEM_VENCIMENTO.test(f.descricao || "");
  const semVencimento = aPagar.filter(semPrazoMarcado);
  const comPrazo = aPagar.filter((f) => !semPrazoMarcado(f));
  const vencidas = comPrazo.filter((f) => (f.data || "") < hoje);
  // 1 dia de antecedência: entra no Painel na véspera, não no dia, pra dar tempo de correr atrás do dinheiro.
  const urgentes = comPrazo.filter((f) => (f.data || "") === hoje || (f.data || "") === amanha);
  const aReceber = (finances || []).filter((f) => f.tipo === "entrada" && f.status === "a_receber");
  const comEntrada = new Set((finances || []).filter((f) => f.tipo === "entrada" && f.servico_id).map((f) => f.servico_id));
  const prontosSemCobranca = (services || []).filter((s) => ["entregue", "producao"].includes(s.status) && Number(s.valor_orcamento) > 0 && !comEntrada.has(s.id));
  const soma = (l, campo) => l.reduce((s, i) => s + Number(campo ? i[campo] : i.valor), 0);
  return {
    amanha, aPagar, vencidas, urgentes, semVencimento, aReceber, prontosSemCobranca,
    totalVencidas: soma(vencidas), totalUrgentes: soma(urgentes), totalAPagar: soma(aPagar),
    totalSemVencimento: soma(semVencimento),
    potencialCaixa: soma(aReceber) + soma(prontosSemCobranca, "valor_orcamento"),
  };
}
function materiaisDoCompromisso(finances, agendaId) { return (finances || []).filter((f) => f.agenda_id === agendaId && f.status === "a_pagar" && ehCompraMaterial(f)); }
// O BURACO QUE ISSO TAPA (24/07/2026): ele comprou material de verdade e concluiu o compromisso, e o gasto
// nunca foi lançado — a aba Compras ficou vazia e a margem do serviço, mentirosa. Compromisso de comprar/pedir
// material não pode ser concluído em silêncio: na hora de concluir o app pergunta o valor e lança na mesma
// hora (Regra Nº 8). Avisa, não bloqueia — tem saída pra "não comprei" e pra "lanço depois".
const RE_COMPRA = /\b(comprar|compra|pedir|pedido|buscar|retirar|levar)\b/i;
const RE_INSUMO = /\b(material|materiais|tecido|espuma|percinta|madeira|cord[ãa]o|cola|linha|pvc|p[ée]s?\b|elastico|el[áa]stico|courino|courvim|couro|suede|veludo|chenille|linho|zíper|ziper|grampo|verniz)\b/i;
function ehCompromissoDeCompra(appt, materiais) {
  const t = appt?.titulo || "";
  // Material "pendurado" numa entrega/visita é tarefa lateral da viagem, não transforma o compromisso
  // principal numa compra. Só agenda dedicada de pedir/buscar material abre o fluxo de material.
  if (RE_COMPRA.test(t) && RE_INSUMO.test(t)) return true;
  return (materiais || []).length > 0 && /\b(pedir|pedido|comprar|buscar)\b/i.test(t) && !/\b(entreg|visita|retirada do cliente)\b/i.test(t);
}
// ENTREGA CONCLUÍDA TEM QUE FECHAR O SERVIÇO. Antes, concluir um compromisso de entrega fechava so o
// compromisso: o serviço continuava 'agendado', então voltava pra lista de trabalho ativo e o cliente não
// saía do Painel (Diego em 25/07: "ja foi entregue, nao deixe acontecer mais esse erro de nao sumir
// de lá"). Agora o app pergunta na hora e move o serviço pra Entregue — que é o que faz ele sumir.
function ehCompromissoDeEntrega(appt, svc) {
  if (!svc || !["agendado", "producao"].includes(svc.status)) return false;
  const titulo = appt?.titulo || "";
  return /\b(entreg\w*|devolv\w*)\b/i.test(titulo)
    || (/\blevar\b/i.test(titulo) && /\b(pront\w*|sof[áa]|cadeir\w*|poltron\w*|cabeceir\w*|m[oó]vel|pe[çc]a)\b/i.test(titulo));
}
function planoDeCompra(fornecedor) {
  if (!fornecedor) return null;
  const dias = String(fornecedor.dias_entrega || "").split(",").map((d) => DIAS_SEMANA_MAP[d.trim()]).filter((n) => n !== undefined);
  if (dias.length) {
    const hoje = hojeISO();
    for (let i = 1; i <= 21; i++) {
      const entregaDate = new Date(hoje + "T12:00:00"); entregaDate.setDate(entregaDate.getDate() + i);
      if (!dias.includes(entregaDate.getDay())) continue;
      const pedidoDate = new Date(entregaDate); pedidoDate.setDate(pedidoDate.getDate() - 1);
      while (pedidoDate.getDay() === 0) pedidoDate.setDate(pedidoDate.getDate() - 1);
      const entrega = isoData(entregaDate), pedirEm = isoData(pedidoDate);
      if (pedirEm < hoje) continue; // perdeu o corte desta entrega; usa a próxima, não inventa pedido atrasado
      return { tipo: "remoto", data: pedirEm, hora: null, entrega, rotulo: `Fazer o pedido de material na ${fornecedor.nome} (entrega ${compactDate(entrega)})` };
    }
  }
  // Viagem automática nunca nasce hoje depois que o horário passou nem no domingo. QUEM ESCOLHE A HORA NÃO É
  // AQUI: esta função é pura e não enxerga a agenda, então devolver hora daqui era escolher no escuro (ver
  // planoDeCompraComHorario logo abaixo). Só a DATA sai daqui.
  const dataCompra = proximoDiaUtil(hojeISO());
  return { tipo: "presencial", data: dataCompra, hora: null, entrega: null, rotulo: `Buscar material na ${fornecedor.nome}` };
}
// A VIAGEM DE COMPRA PASSA A OLHAR O DIA (item AGENDA-PREFLIGHT-SOLUCAO-20260824-1557, lacuna registrada na
// auditoria de 27/08 e fechada aqui). O horário da ida à loja saía de `horaSugerida` com lista de ocupados
// VAZIA e sem os compromissos do dia: o app marcava a viagem sem olhar o que já estava marcado, então ela
// podia nascer em cima de outro compromisso — não só apertada, sobreposta. A trava existia e era boa; o que
// faltava era o dado chegar até ela.
//
// Por que duas funções em vez de uma: `planoDeCompra` é chamada de três lugares e dois deles só querem o
// TIPO (remoto ou presencial) e a PREVISÃO DE ENTREGA — não precisam de banco e não podem virar async à toa.
// Quem vai GRAVAR a agenda chama esta aqui, que lê o dia de verdade antes de escolher a hora. É uma consulta
// a mais e só no caminho presencial: pedido remoto não tem hora nem estrada.
//
// `dataForcada` existe porque o chamador pode mandar a data da compra (dados.dataCompra). Sem isso o app
// calculava a hora para um dia e gravava o compromisso em outro — hora certa do dia errado.
async function planoDeCompraComHorario(db, fornecedor, dataForcada) {
  const plano = planoDeCompra(fornecedor);
  if (!plano || plano.tipo !== "presencial") return plano;
  const data = dataForcada || plano.data;
  const { data: doDia, error } = await db.from("agenda").select("id,data,hora,tipo,cidade,status").eq("data", data).eq("status", "planejado");
  if (error) throw error;
  // Mesmo recorte do seletor manual (ver finishTriage): só presencial ocupa slot e só presencial desloca.
  const presenciais = (doDia || []).filter((a) => (a.tipo || "presencial") === "presencial");
  const ocupados = presenciais.map((a) => a.hora?.slice(0, 5)).filter(Boolean);
  return { ...plano, data, hora: horaSugerida(data, "presencial", ocupados, fornecedor.cidade, presenciais) };
}
function compraPrecisaRevisao(item) { return !item.fornecedor_id && !(item.descricao || "").startsWith(COMPRA_CONFERIDA_TAG); }

// ===== CONFIRMAÇÃO DE SERVIÇO — o PDF do fechamento, gerado NO APARELHO =====
//
// O PROBLEMA (item PDF-EXPRESSO-REVISAO-20260827-001): Diego fechou na casa de uma cliente e o documento
// demorou demais, e ainda saiu em versões diferentes do mesmo fechamento. A Skill do Classic já está
// enxuta — o custo não é de decisão, é de MÁQUINA: localizar o modelo .docx, preencher, converter pra PDF
// e renderizar de volta pra conferir "uma página sem corte". Essa cadeia inteira roda longe do celular.
//
// Aqui o caminho é outro: o aparelho JÁ tem os dados (Supabase) e o navegador JÁ imprime PDF. Então o
// documento é montado em HTML na hora e entregue pro "Salvar como PDF" do próprio Android. Sem upload,
// sem conversão, sem ida e volta.
//
// FIDELIDADE AO MODELO MESTRE: as medidas e cores abaixo foram extraídas do
// MODELO_MESTRE_CONFIRMACAO_SERVICO.docx, não escolhidas por gosto — página Letter (12240x15840 twips),
// margens 648/792 twips, Liberation Sans, e a paleta #17365D / #1F2937 / #6B7280 / #F8FAFC / #FFF8E8 /
// #C89B3C. A ordem das seções é a mesma. Isto é uma SEGUNDA RENDERIZAÇÃO do mesmo desenho, não um segundo
// modelo: se o .docx mudar, este bloco muda junto, e isso está dito no retorno técnico.
//
// SÓ FATO CONFIRMADO. Campo sem dado não é preenchido com suposição — a linha some. Em especial:
// "Condição escolhida" do modelo fica FORA por decisão explícita, porque deduzir a condição a partir dos
// lançamentos seria transformar oferta em aceite, que a própria Skill proíbe. Os cartões financeiros saem
// dos lançamentos reais do serviço, e sem valor de orçamento o documento nem é gerado.
const CS_ESC = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ehServicoFechado(s) { return ["agendado", "producao", "entregue", "pago"].includes(s?.status); }
// RETORNO VENCIDO — a data existe e não faz nada (item ATIVOS-COM-DATA-20260827-1805-001).
//
// RETORNO VENCIDO — a data existe e não faz nada (item ATIVOS-COM-DATA-20260827-1805-001).
//
// A trava do banco `servicos_ativo_precisa_prazo` já obriga todo serviço ativo a ter data, e ela ESTÁ sendo
// cumprida: zero lead ou orçamento sem prazo. Só que medido no banco em 28/08 havia **61 leads e orçamentos
// com o prazo já vencido** — 47 há mais de 15 dias e 19 sem nem próxima ação escrita. Rodrigo Monteiro,
// Rafael, Rebeca e Edimaria estavam parados há 34 dias.
//
// Ou seja: a regra estava cumprida e a FINALIDADE dela, não. O sentido da data é fazer o item REAPARECER, e
// ele não reaparecia em lugar nenhum — os blocos de atrasado/hoje/próximos do Painel saem da AGENDA, e
// cliente que só tem lead não tem compromisso marcado. Sumia por completo.
//
// Mesma função usada pelo card do Painel e pelo filtro da aba Leads, de propósito: duas definições de
// "vencido" divergem com o tempo e aí os dois números param de bater.
function retornoVencido(s, hoje) {
  return ["lead", "orcamento"].includes(s?.status) && !!s.prazo && s.prazo < hoje;
}
// Referência derivada do id real do serviço — identificador de verdade, não número inventado.
function referenciaConfirmacao(servicoId) { return "TB-" + String(servicoId || "").replace(/-/g, "").slice(0, 8).toUpperCase(); }
function linhasFinanceirasDaConfirmacao(financeiro) {
  const linhas = [];
  const entradas = (financeiro || []).filter((f) => f.tipo === "entrada" && f.status === "pago");
  const aReceber = (financeiro || []).filter((f) => f.tipo === "entrada" && f.status === "a_receber");
  const soma = (l) => l.reduce((s, f) => s + Number(f.valor || 0), 0);
  if (entradas.length) linhas.push({ rotulo: "Entrada recebida", valor: money(soma(entradas)), nota: entradas.length > 1 ? entradas.length + " recebimentos" : "Recebido em " + compactDate(entradas[0].data) });
  if (aReceber.length) linhas.push({ rotulo: "Saldo", valor: money(soma(aReceber)), nota: "A receber" });
  return linhas.slice(0, 3);
}
// O DOCUMENTO É DO FECHAMENTO, NÃO DO SERVIÇO. Diego comparou o PDF que este app gerava com o
// Confirmacao_Servico_Ivoneide de 22/08 (montado do MODELO_MESTRE_CONFIRMACAO_SERVICO.docx) e o dele era
// melhor. Duas diferenças estruturais, não estéticas:
//
// 1) O documento de 22/08 cobre os DOIS serviços da Ivoneide como UM acordo de R$ 4.800. Aqui eram duas
//    linhas de banco, R$ 2.200 e R$ 2.600, e sairiam dois papéis, nenhum com o valor que a cliente
//    combinou. O commit fa5ce49 tratou isso como colisão de NOME DE ARQUIVO — era sintoma.
// 2) O modelo mestre é um formulário com ROTULO_1..4/DETALHE_1..4 escritos por gente: é por isso que o
//    documento bom diz "Itens: 2 sofás retráteis + 3 poltronas". Isso é SÍNTESE, nenhum campo contém.
//    Sem espaço curado, a versão anterior despejou a `descricao` inteira — o vazamento corrigido em
//    a7a56b0. Documento pobre e vazamento tinham a MESMA causa.
//
// Decisão de Diego em 02/09/2026: HÍBRIDO. Campo curado (`servicos.confirmacao`) manda; sem ele, o app
// deriva como antes. Começa funcionando sem depender de ninguém preencher.
function confirmacaoCuradaDoGrupo(servicos) {
  for (const s of servicos) {

// Serviços que formam UM fechamento. `fechamento_ref` igual e não-nulo = mesmo acordo. Sem ela, o serviço
// é o próprio fechamento — que é o comportamento de sempre, e continua sendo o padrão.
function servicosDoFechamento(servico, todosDoCliente) {
  const ref = servico && servico.fechamento_ref;
  if (!ref) return [servico];
  const grupo = (todosDoCliente || []).filter((s) => s.fechamento_ref === ref && ehServicoFechado(s));
  if (!grupo.length) return [servico];

  // Marcar como já comprado: vira gasto de verdade (status pago, data de hoje) e é a ÚLTIMA chance de dizer
  // pra qual serviço foi o material — muitas vezes na hora de anotar ele ainda não sabia.
  const marcarComprado = async (item) => {
    if (mode === "claude") { notify("No modo Claude, confirme pela operação tipada material_em_maos.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      const servicoId = (confirmando && confirmando.id === item.id && confirmando.servicoId) || item.servico_id || null;
      const agendaLigada = (appointments || []).find((a) => a.id === item.agenda_id);
      const agendaDedicada = !!agendaLigada && ehCompromissoDeCompra(agendaLigada, [item]);
      const operacao = await processarEventoOperacaoBahia(db, {
        tipo: "material_em_maos", eventoId: "app-material-em-maos-financeiro-" + item.id,
        dados: {
          financeiroId: item.id, fornecedorId: item.fornecedor_id, servicoId, valor: item.valor,
          data: hojeISO(), descricao: item.descricao, agendaId: item.agenda_id || null,
          fecharAgenda: agendaDedicada, pagamentoConfirmado: item.status === "pago" || !materialEstaEmTransito(item), por: "diego",
        },
      });
      const r = operacao.resultado;
      notify(r.materiaisPendentes ? `Material confirmado. Ainda faltam ${r.materiaisPendentes} item(ns).` : (r.statusServico === "producao" ? "Material em mãos. O serviço entrou em produção." : "Material de estoque registrado."), "ok");
      setConfirmando(null); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };
  const marcarMaterialPago = async (item) => {
    if (mode === "claude") { notify("No modo Claude, atualize pela operação tipada financeiro.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "financeiro", eventoId: "app-material-pago-" + item.id,
        dados: { financeiroId: item.id, status: "pago", data: hojeISO() },
      });
      notify("Pagamento do material registrado no caixa.", "ok"); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };

  // Material vira compromisso de dois jeitos, porque tem dia que ele faz a viagem só pra isso e tem dia que
  // aproveita uma ida que já estava marcada. Nos dois casos a compra guarda o agenda_id, então o compromisso
  // mostra o selo do material e a trava de rota passa a enxergar essa parada.
  const agendarCompra = async (item) => {
    if (mode === "claude") { notify("No modo Claude, planeje pela operação tipada material_planejado.", "error"); return; }
    const forn = fornecedores.find((f) => f.id === item.fornecedor_id);
    if (!forn) { notify("Escolha o fornecedor antes de agendar.", "error"); return; }
    const plano = planoDeCompra(forn);
    // Presencial sem cidade quebra a Regra Nº 4 e cega a trava de rota. Em vez de mandar ele cadastrar noutro
    // lugar, pergunta aqui na hora e já guarda no fornecedor — não pergunta de novo nas próximas vezes.
    const cidadeInformada = cidadeDraft && cidadeDraft.id === item.id ? cidadeDraft.valor.trim() : "";
    if (plano.tipo === "presencial" && !forn.cidade && !cidadeInformada) {
      setCidadeDraft({ id: item.id, valor: "" });
      notify(`Em qual cidade fica a ${forn.nome}?`, "info");
      return;
    }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      if (cidadeInformada && !forn.cidade) {
        const { error: cidadeErr } = await db.from("fornecedores").update({ cidade: cidadeInformada }).eq("id", forn.id);
        if (cidadeErr) throw cidadeErr;
        forn.cidade = cidadeInformada;
      }
      const operacao = await processarEventoOperacaoBahia(db, {
        tipo: "material_planejado", eventoId: "app-planejar-financeiro-" + item.id,
        dados: {
          financeiroId: item.id, fornecedorId: item.fornecedor_id, servicoId: item.servico_id || null,
          valor: item.valor, dataNecessidade: item.data, descricao: item.descricao, por: "diego",
        },
      });
      const r = operacao.resultado;
      notify(r.tipoCompromisso === "remoto" ? `Pedido agendado para ${compactDate(r.dataCompra)}.` : `Ida agendada para ${compactDate(r.dataCompra)}.`, "ok");
      setCidadeDraft(null); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };
  const pendurarNaViagem = async (item, agendaId) => {
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      const { error } = await db.from("financeiro").update({ agenda_id: agendaId || null }).eq("id", item.id); if (error) throw error;
      notify(agendaId ? "Marcado no compromisso." : "Desvinculado.", "ok"); setVinculando(null); await onChanged();
    } catch (e) { notify("Erro: " + e.message, "error"); } finally { setBusy(false); }
  };
  const proximos = (appointments || []).filter((a) => a.status === "planejado" && a.data >= hojeISO()).sort((a, b) => (a.data + (a.hora || "")).localeCompare(b.data + (b.hora || "")));

  // Compra sem fornecedor (lançada antes desta aba existir): o Diego atribui o fornecedor ou marca conferida.
  const revisar = compras.filter(compraPrecisaRevisao);
  const resolverRevisao = async (item, fornecedorId) => {
    if (mode === "claude") { notify("No modo Claude, reconcilie pela operação tipada correspondente.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      const patch = fornecedorId ? { fornecedor_id: fornecedorId } : { descricao: COMPRA_CONFERIDA_TAG + (item.descricao || "Material") };
      const { error } = await db.from("financeiro").update(patch).eq("id", item.id); if (error) throw error;
      notify(fornecedorId ? "Fornecedor vinculado." : "Conferida — sai da revisão.", "ok"); await onChanged();
    } catch (e) { notify("Erro: " + e.message, "error"); } finally { setBusy(false); }
  };

  const servicosVinculaveis = services.filter((s) => ["agendado", "producao"].includes(s.status));
  const seletorServico = (valor, onPick) => <select value={valor} onChange={(e) => onPick(e.target.value)}>
    <option value="">Estoque geral — sem serviço</option>
    {servicosVinculaveis.map((s) => <option key={s.id} value={s.id}>{(s.clientes?.nome || "Cliente") + " — " + s.titulo}</option>)}
  </select>;

  return <div className="page-grid">
    <ListaDeCompras services={services} db={db} demo={demo} mode={mode} notify={notify} onChanged={onChanged} />

    {/* O RESTO DA ABA É CONTABILIDADE, e por isso vem depois da lista. Diego, 04/08: "essa aba compras não
        está sendo nada funcional... parece financeiro quando era para ser mais uma lista". Os números
        continuam existindo pra quando ele quiser conferir gasto, mas quem abre a aba está indo comprar. */}
    <details className="compras-historico">
      <summary>Gastos com material — números e histórico</summary>
    <section className="metric-grid finance-metrics">
      <Metric label="Material neste mês" value={money(totalMes)} detail={mesLabel(mesAtual)} tone="red" />
      <Metric label="A comprar" value={money(totalAComprar)} detail={`${aComprar.length} item(ns) na lista`} tone="orange" />
      {emMaosAPagar.length > 0 && <Metric label="Em mãos, falta pagar" value={money(totalEmMaosAPagar)} detail={`${emMaosAPagar.length} nota(s) com o fornecedor`} tone="red" />}
      <Metric label="Total em material" value={money(total)} detail={`${compras.length} compra(s)`} tone="green" />
    </section>

    {revisar.length > 0 && <section className="content-card">
      <div className="card-head"><div><p className="kicker">PRECISA DE REVISÃO</p><h3>{revisar.length} compra(s) sem fornecedor</h3></div></div>
      <p className="ficha-note">Lançamentos antigos, de antes desta aba existir. Diga de qual fornecedor foi — ou marque como conferida se já está certo. Nada é apagado.</p>
      {revisar.map((c) => <div className="finance-row" key={c.id}>
        <div><strong>{descricaoFinanceiraVisivel(c.descricao) || "Material"}</strong><span>{compactDate(c.data)} · {money(c.valor)}</span>
          <div className="fornecedor-chips">{fornecedores.map((f) => <button type="button" key={f.id} disabled={busy || mode === "claude"} onClick={() => resolverRevisao(c, f.id)}>{f.nome}</button>)}</div>
        </div>
        <div className="agenda-acoes"><button className="ghost" disabled={busy || mode === "claude"} onClick={() => resolverRevisao(c, null)}>✓ Conferida</button></div>
      </div>)}
    </section>}

    {emTransito.length > 0 && <section className="content-card">
      <div className="card-head"><div><p className="kicker">MATERIAL EM TRÂNSITO</p><h3>Aguardando chegar</h3></div></div>
      <p className="ficha-note">Pedido feito não é material em mãos. O serviço continua agendado até a chegada ser confirmada.</p>
      {emTransito.map((c) => <div className="finance-row" key={c.id}>
        <div><strong>{descricaoFinanceiraVisivel(c.descricao) || "Material"}</strong><span>{nomeFornecedor(c.fornecedor_id)}{c.servico_id ? ` · ${labelServico(c.servico_id)}` : " · estoque"} · {c.status === "pago" ? "pago" : "pagamento pendente"}</span></div>
        <div className="agenda-acoes"><b className={c.status === "pago" ? "saida" : ""}>{money(c.valor)}</b><button className="ghost" disabled={busy || mode === "claude"} onClick={() => marcarComprado(c)}>Chegou — material comigo</button></div>
      </div>)}
    </section>}

    {emMaosAPagar.length > 0 && <section className="content-card">
      <div className="card-head"><div><p className="kicker">MATERIAL RECEBIDO · PAGAMENTO PENDENTE</p><h3>Não deixar o caixa esquecer</h3></div></div>
      {emMaosAPagar.map((c) => <div className="finance-row" key={c.id}><div><strong>{descricaoFinanceiraVisivel(c.descricao) || "Material"}</strong><span>{nomeFornecedor(c.fornecedor_id)} · material já está em mãos</span></div><div className="agenda-acoes"><b>{money(c.valor)}</b><button className="ghost" disabled={busy || mode === "claude"} onClick={() => marcarMaterialPago(c)}>Marcar pagamento</button></div></div>)}
    </section>}

    {aComprar.length > 0 && <section className="content-card">
      <div className="card-head"><div><p className="kicker">LISTA DE COMPRAS</p><h3>Ainda não comprado</h3></div></div>
      <p className="ficha-note">Enquanto está aqui não conta como gasto nem no Financeiro. Só confirme quando o material estiver realmente com você; pedido pago em trânsito não inicia produção.</p>
      {aComprar.map((c) => <div className="finance-row" key={c.id}>
        <div><strong>{descricaoFinanceiraVisivel(c.descricao) || "Material"}</strong><span>{nomeFornecedor(c.fornecedor_id)}{c.servico_id ? ` · ${labelServico(c.servico_id)}` : " · sem serviço vinculado"}</span>
          {(() => {
            const appt = (appointments || []).find((a) => a.id === c.agenda_id);
            if (appt) return <span>📅 {appt.titulo} · {compactDate(appt.data)}{appt.hora ? " " + appt.hora.slice(0, 5) : ""} <button type="button" className="ficha-link" onClick={() => pendurarNaViagem(c, null)}>desvincular</button></span>;
            return <span>Sem dia marcado — o pedido pode passar batido.</span>;
          })()}
          {confirmando && confirmando.id === c.id && !c.servico_id && <label className="material-edit-block">Foi pra qual serviço?{seletorServico(confirmando.servicoId, (v) => setConfirmando({ ...confirmando, servicoId: v }))}</label>}
          {cidadeDraft && cidadeDraft.id === c.id && <label className="material-edit-block">Em qual cidade fica a {nomeFornecedor(c.fornecedor_id)}?
            <input value={cidadeDraft.valor} autoFocus placeholder="Ex: Luziânia" onChange={(e) => setCidadeDraft({ id: c.id, valor: e.target.value })} onKeyDown={(e) => e.key === "Enter" && agendarCompra(c)} />
          </label>}
          {vinculando === c.id && <label className="material-edit-block">Aproveitar qual viagem?
            <select value="" onChange={(e) => e.target.value && pendurarNaViagem(c, e.target.value)}>
              <option value="">Escolha um compromisso já marcado…</option>
              {proximos.map((a) => <option key={a.id} value={a.id}>{compactDate(a.data)}{a.hora ? " " + a.hora.slice(0, 5) : ""} — {a.cidade || "remoto"} · {a.titulo_visivel || a.titulo}</option>)}
            </select>
          </label>}
        </div>
        <div className="agenda-acoes"><b className="saida">{money(c.valor)}</b>
          {!c.agenda_id && !confirmando && <>
            <button className="ghost" disabled={busy || mode === "claude"} onClick={() => agendarCompra(c)}>📅 Agendar ida</button>
            <button className="ghost" disabled={busy || mode === "claude"} onClick={() => setVinculando(vinculando === c.id ? null : c.id)}>🚗 Aproveitar viagem</button>
          </>}
          {confirmando && confirmando.id === c.id
            ? <><button className="primary" disabled={busy} onClick={() => marcarComprado(c)}>Confirmar compra</button><button className="ghost" onClick={() => setConfirmando(null)}>Cancelar</button></>
            : <button className="ghost" disabled={mode === "claude"} onClick={() => setConfirmando({ id: c.id, servicoId: c.servico_id || "" })}>✓ Material está comigo</button>}
        </div>
      </div>)}
    </section>}

    <section className="content-card">
      <div className="card-head"><div><p className="kicker">COMPRAS DE MATERIAL</p><h3>Registrar nova compra</h3></div>
        <button className="ghost" onClick={() => setFormOpen(!formOpen)} disabled={mode === "claude"}>{formOpen ? "Cancelar" : mode === "claude" ? "Só o Diego lança" : "+ Nova compra"}</button></div>
      {formOpen && mode === "diego" && <div className="form-grid">
        <div className="classify">{[[true, "Material está comigo"], [false, "Ainda vou comprar"]].map(([v, label]) => <button key={label} className={draft.jaComprei === v ? "active" : ""} onClick={() => setDraft({ ...draft, jaComprei: v })}>{label}</button>)}</div>
        <label>Fornecedor*
          <div className="fornecedor-chips">{fornecedores.map((f) => <button type="button" key={f.id} className={draft.fornecedorId === f.id ? "active" : ""} onClick={() => setDraft({ ...draft, fornecedorId: f.id })}>{f.nome}</button>)}</div>
        </label>
        <div className="row three">
          <label>Valor R$*<input value={draft.valor} onChange={(e) => setDraft({ ...draft, valor: e.target.value })} placeholder="0,00" /></label>
          <label>{draft.jaComprei ? "Data*" : "Precisa até*"}<input type="date" value={draft.data} onChange={(e) => setDraft({ ...draft, data: e.target.value })} /></label>
          <label>Serviço (opcional){seletorServico(draft.servicoId, (v) => setDraft({ ...draft, servicoId: v }))}</label>
        </div>
        <label>O que comprou<input value={draft.descricao} onChange={(e) => setDraft({ ...draft, descricao: e.target.value })} placeholder="Ex: 4m de linho Klee + espuma D33" /></label>
        <ReviewBox lines={[draft.jaComprei ? "Compra já feita — entra como saída da Empresa" : "Lista de compras — não entra no caixa até você confirmar", draft.fornecedorId ? nomeFornecedor(draft.fornecedorId) : "Sem fornecedor", `${money(parseMoedaBR(draft.valor))} · ${draft.data || "sem data"}`, draft.servicoId ? labelServico(draft.servicoId) : "Estoque geral"]} />
        <button className="primary wide" onClick={salvar} disabled={busy}>{busy ? "Salvando…" : draft.jaComprei ? "Registrar compra" : "Adicionar à lista de compras"}</button>
      </div>}
      {!formOpen && <p className="ficha-note">Compra feita sai como saída da Empresa (categoria Material) — o saldo do Financeiro continua batendo. O que ainda vai comprar fica na lista sem mexer no caixa.</p>}
    </section>

    <div className="funil-filtros">{COMPRAS_ABAS.map((a) => <button key={a.id} className={aba === a.id ? "active" : ""} onClick={() => setAba(a.id)}>{a.label}</button>)}</div>

    <section className="content-card">
      {/* ⚠ NÃO ERA "MARGEM REAL", e o número nunca foi margem: a conta é só orçamento − material.
          Falta mão de obra, deslocamento e a taxa do cartão — na Skill de Orçamentos, margem de
          contribuição é (receita líquida − custo direto − logístico − variáveis) / receita líquida.
          Chamar isso de margem faz o Diego decidir preço com um número que ignora o que ele mais paga.
          O rótulo agora diz exatamente o que a conta faz. A margem de verdade depende de custo de mão de
          obra vinculado ao serviço (`v_servico_aprendizado` já consolida parte disso) e é item próprio —
          ver o recado INTELIGÊNCIA DE SERVIÇO + CONSUMO REAL, de 01/09. */}
      <div className="card-head"><div><p className="kicker">{aba === "servico" ? "SALDO APÓS O MATERIAL, POR SERVIÇO" : "GASTO AGRUPADO"}</p><h3>{compras.length} compra(s)</h3></div></div>
      {!compras.length && <div className="empty-state"><b>Nenhuma compra de material registrada ainda.</b><span>Compras antigas lançadas soltas no Financeiro aparecem aqui depois de reclassificadas.</span></div>}
      {chaves.map((chave) => {
        const itens = grupos[chave];
        const subtotal = itens.reduce((s, c) => s + Number(c.valor), 0);
        const servico = aba === "servico" && chave ? servicoDe(chave) : null;
        const orcamento = Number(servico?.valor_orcamento || 0);
        return <div key={chave || "sem"} className="vale-fornecedor">
          <div className="vale-fornecedor-head"><strong>{tituloGrupo(chave)}</strong><b>{money(subtotal)}</b></div>
          {servico && orcamento > 0 && <div className="finance-row"><div><strong>Sobra depois do material</strong><span>Orçamento {money(orcamento)} − material {money(subtotal)} · ainda NÃO desconta mão de obra, deslocamento nem taxa de cartão</span></div><b className={orcamento - subtotal >= 0 ? "entrada" : "saida"}>{money(orcamento - subtotal)}</b></div>}
          {itens.map((c) => <div className="finance-row" key={c.id}>
            <div><strong>{descricaoFinanceiraVisivel(c.descricao) || "Material"}</strong><span>{compactDate(c.data)}{aba !== "fornecedor" ? ` · ${nomeFornecedor(c.fornecedor_id)}` : ""}{aba !== "servico" && c.servico_id ? ` · ${labelServico(c.servico_id)}` : ""}</span></div>
            <b className="saida">− {money(c.valor)}</b>
          </div>)}
        </div>;
      })}
    </section>
    </details>
  </div>;
}

// LISTA DE COMPRAS. Diego, 04/08: "olha o tanto de coisa para comprar, era para ter uma lista de compras na
// aba Compras... já sabe o que é de cada cliente, não tem uma lista fácil de visualização para eu chegar e
// comprar... ficou muito complicado quando era para ter algo mais simples, parece financeiro quando era para
// ser mais uma lista, com check de cada item".
// Ele está certo e a razão é simples: quem abre essa aba está indo à loja, não fazendo contabilidade. O que
// serve nesse momento é papel de supermercado — o que falta, de quem é, e um quadradinho pra marcar.
// Os itens moram em servicos.materiais_necessarios (jsonb: [{item, comprado}]) porque a informação já nascia
// junto com o serviço — o que muda é ela virar lista marcável em vez de texto solto na descrição.
// O APP APRENDE ONDE CADA MATERIAL É COMPRADO. Diego, 04/08: "quando lançar o cliente eu vou ter que dizer em
// qual loja vou comprar? ainda também não temos os materiais totalmente registrados em cada um". Não deve
// precisar: suede ele compra no Ozair, tecido na Ellis — isso se repete serviço após serviço. Em vez de
// pedir a loja toda vez, o app olha onde um material com nome parecido JÁ foi comprado e preenche sozinho.
// A sugestão aparece marcada com "?" e nunca se disfarça de fato confirmado: palpite exibido como certeza é
// pior que campo vazio, porque manda ele pra loja errada com confiança. Ao marcar comprado, vira confirmada.
function lojaAprendida(nomeItem, services) {
  const norm = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const palavras = norm(nomeItem).split(/[^a-z0-9]+/).filter((p) => p.length > 3);
  if (!palavras.length) return null;
  const placar = {};
  (services || []).forEach((s) => (s.materiais_necessarios || []).forEach((m) => {
    const loja = (m.loja || "").trim();
    if (!loja || m.lojaSugerida) return; // só aprende de loja confirmada, senão o palpite se auto-alimenta
    const alvo = norm(m.item);
    if (palavras.some((p) => alvo.includes(p))) placar[loja] = (placar[loja] || 0) + 1;
  }));
  const melhor = Object.entries(placar).sort((a, b) => b[1] - a[1])[0];
  return melhor ? melhor[0] : null;
}
// Assinatura do que está sendo fechado agora: muda quando entra ou sai item, repete quando é o mesmo clique.
// É o que dá idempotência por ciclo de confirmação em vez de por dia.
function assinaturaDaLista(servico) {
  const abertos = (servico.materiais_necessarios || []).filter((m) => !m.arquivado).map((m) => String(m.item || "").trim().toLowerCase()).sort();
  let h = 0;
  for (const ch of abertos.join("|")) h = ((h << 5) - h + ch.charCodeAt(0)) | 0;
  return abertos.length + "i" + Math.abs(h).toString(36);
}
// ─────────────────────────────────────────────────────────────────────────────────────────────────
// O PAINEL DE COMPRAS MISTURAVA TUDO — e a causa NÃO era a regra, era o FORMATO DO DADO.
//
// Medição de 02/09/2026 sobre os 67 itens vivos de `servicos.materiais_necessarios`: eles chegam em
// CINCO formatos diferentes, porque quem escreve é o Classic, durante a conversa, com o que sabe:
//   Carla    → {item, loja, comprado, pedido, arquivado}                    ← o único que o app entendia
//   Ivoneide → {item, estado:"material_planejado", quantidade_status:"PENDENTE_MEDIDAS_PROFISSIONAL"}
//   Gilmar   → {item, status:"PENDENTE_DE_DEFINICAO", observacao:"...só após avaliação; não inventar"}
//   Jucilene → {item, status:"PREÇO PENDENTE", quantidade_estimada:27}
//   Fabrício → {material:"espuma", densidade:"D40", espessura_cm:7, status:"medido"}   ← SEM a chave `item`
//
// Dois números explicam o sintoma inteiro:
