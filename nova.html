      // texto solto ("entregue" numa observação) destravar produção seria dar poder de escrita a uma
      // heurística de leitura — o oposto do que estas faixas existem pra fazer.
      const pendentes = itens.filter((x) => !x.m.comprado).length;
      const tudoComprado = !pendentes && itens.length > 0;
      const porFaixa = {};
      itens.forEach((x) => { const f = classificarMaterial(x.m); (porFaixa[f.faixa] ||= []).push({ ...x, motivo: f.motivo }); });
      const nComprar = (porFaixa.comprar || []).length;
      const nTravado = (porFaixa.indefinido || []).length;
      const nCaminho = (porFaixa.a_caminho || []).length;
      const resumo = [nComprar ? `${nComprar} pra comprar` : "", nTravado ? `${nTravado} sem definição` : "",
        nCaminho ? `${nCaminho} a caminho` : ""].filter(Boolean).join(" · ") || "tudo em mãos ✓";
      return <div className={`compra-cliente${tudoComprado ? " tudo-comprado" : ""}`} key={s.id}>
        <div className="compra-cliente-head">
          <strong>{s.clientes?.nome || "Cliente"}</strong>
          <span>{resumo}{s.prazo ? ` · ${prazoComRotulo(s)}` : ""}{s.loja_material ? ` · ${s.loja_material}` : ""}</span>
        </div>
        {FAIXAS_MATERIAL.filter((f) => (porFaixa[f.id] || []).length).map((f) => <React.Fragment key={f.id}>
          {/* O cabeçalho da faixa só nasce quando ela tem item — cliente com uma coisa só continua uma
              linha, não vira formulário com quatro títulos vazios. */}
          <div className="compra-faixa"><b>{f.titulo}</b><em>{f.nota}</em></div>
          {(porFaixa[f.id] || []).map(({ m, i, motivo }) => <label className={`compra-item${m.comprado ? " feito" : ""}${f.id === "indefinido" ? " travado" : ""}`} key={i}>
          <input type="checkbox" checked={!!m.comprado} disabled={busy === s.id || mode === "claude"} onChange={() => alternar(s, i)} />
          {/* O nome vem de `rotuloDoMaterial`, não de `m.item`: 3 itens reais não têm essa chave — a espuma
              da Fabrício é {"{material, densidade, espessura_cm}"} — e apareciam como linha em branco. */}
          <span>
            {editandoItem === `${s.id}:${i}`
              ? <input className="compra-item-input" value={itemDraft} autoFocus
                  onClick={(e) => e.preventDefault()} onChange={(e) => setItemDraft(e.target.value)}
                  onBlur={() => salvarItem(s, i)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); salvarItem(s, i); } if (e.key === "Escape") setEditandoItem(null); }} />
              : <b className="compra-item-nome" onClick={(e) => { e.preventDefault(); setItemDraft(rotuloDoMaterial(m)); setEditandoItem(`${s.id}:${i}`); }}>{rotuloDoMaterial(m)}{!m.comprado && m.pedido ? " 🚚 a caminho" : ""}</b>}
            {/* O QUE ESTÁ TRAVANDO, em vez de só "não comprado". Sem isso a faixa vira mais um lugar onde a
                compra está parada sem dizer o que destrava. É o trecho literal do dado, não um rótulo meu. */}
            {motivo && <em className="compra-item-motivo">⏳ {motivo}</em>}
            {editandoLoja === `${s.id}:${i}`
              ? <input className="compra-loja-input" value={lojaDraft} autoFocus list="lojas-conhecidas"
                  onClick={(e) => e.preventDefault()} onChange={(e) => setLojaDraft(e.target.value)}
                  onBlur={() => salvarLoja(s, i)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); salvarLoja(s, i); } }} placeholder="Onde comprar?" />
              : <em className={`compra-item-loja${m.lojaSugerida ? " palpite" : ""}`}
                  onClick={(e) => { e.preventDefault(); setLojaDraft(m.loja || ""); setEditandoLoja(`${s.id}:${i}`); }}>
                  {(m.loja || "").trim() ? m.loja + (m.lojaSugerida ? " ?" : "") : "+ onde comprar"}
                </em>}
          </span>
          <button type="button" className="compra-remover" title="Tirar da lista" disabled={busy === s.id} onClick={(e) => { e.preventDefault(); remover(s, i); }}>✕</button>
        </label>)}
        </React.Fragment>)}
        {/* O tapeceiro pede material a mais no meio do serviço — tem que dar pra somar na hora, sem sair da tela. */}
        <div className="compra-add">
          <input value={novoItem[s.id] || ""} onChange={(e) => setNovoItem((n) => ({ ...n, [s.id]: e.target.value }))}
            onKeyDown={(e) => { if (e.key === "Enter") adicionar(s); }} placeholder="O que mais falta?" disabled={busy === s.id} />
          <button type="button" className="ghost" disabled={busy === s.id || !(novoItem[s.id] || "").trim()} onClick={() => adicionar(s)}>+ Adicionar</button>
        </div>
        {tudoComprado && <button type="button" className={`primary wide${confirmandoLista === s.id ? " confirmando" : ""}`} disabled={busy === s.id} onClick={() => confirmar(s)}>
          {busy === s.id ? "..." : confirmandoLista === s.id
            ? "Está tudo comigo — pode liberar a produção"
            : `✓ Confirmar — está tudo em mãos do ${(s.clientes?.nome || "cliente").split(" ")[0]}`}
        </button>}
        {confirmandoLista === s.id && <p className="ficha-note">Confirmar libera o profissional pra começar. Se algum item ainda está na loja ou a caminho, cancele desmarcando o quadradinho dele.</p>}
      </div>;
    })}
    <datalist id="lojas-conhecidas">{[...new Set((services || []).flatMap((s) => (s.materiais_necessarios || []).map((m) => m.loja)).filter(Boolean))].map((l) => <option key={l} value={l} />)}</datalist>
    <p className="ficha-note">Toque na loja pra trocar. “{"Ozair ?"}” é palpite meu, pelo lugar onde material parecido já foi comprado — marcar como comprado confirma. Marcar o item é só a sua lista: o gasto continua entrando pela compra normal, com fornecedor e valor. Ao confirmar, o cliente sai daqui; se o tapeceiro pedir mais alguma coisa, é só adicionar que ele volta.</p>
  </section>;
}

// SAÍDAS FUTURAS: conta que já está comprometida mas ainda não saiu do caixa (parcela de cartão, aluguel).
// Fica com status "a_pagar", então o saldo do Financeiro NÃO se mexe até ser paga de verdade aqui.
// Vale tem aba própria e material a comprar aparece em Compras — por isso saem desta lista.
// Mão de obra anotada também sai: ela vive na aba Profissionais, onde é somada CONTRA os vales dele. Se
// entrasse aqui, "A pagar" mostraria o valor cheio dos trabalhos ignorando o que já foi adiantado — número
// maior que a dívida real, justamente na tela que ele usa pra decidir de onde tirar dinheiro.
function ehSaidaFutura(item) { return item.tipo === "saida" && item.status === "a_pagar" && item.categoria !== "Vale" && item.categoria !== CATEGORIA_MATERIAL && item.categoria !== CATEGORIA_MAO_DE_OBRA; }
function somaDiaMes(dataISO, meses) {
  const [a, m, d] = dataISO.split("-").map(Number);
  const base = new Date(a, m - 1 + meses, 1);
  const ultimo = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  return `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, "0")}-${String(Math.min(d, ultimo)).padStart(2, "0")}`;
}

// A RECEBER TEM LUGAR PRÓPRIO, MAS NÃO ABA PRÓPRIA (29/07/2026). Diego pediu "outro card que leve a eles,
// tire de lá onde está" — e ao perguntar se precisava de aba nova, a resposta foi não: seria a 11ª aba do
// menu pra duas linhas de conteúdo. Os cards do topo do Financeiro é que são a navegação: clicar em
// "A receber" troca a lista de baixo por este bloco. Antes esse dinheiro vivia misturado nos lançamentos
// realizados com "+ R$ 1.000" verde igual a entrada paga — dava pra achar que já tinha entrado (Oziane).
// O botão "Recebi" é o momento em que vira caixa, pela mesma operação tipada da conta paga.
function ehEntradaFutura(f) { return f.tipo === "entrada" && f.status === "a_receber"; }
function AReceberBloco({ finances, services, db, demo, mode, notify, onChanged }) {
  const [busy, setBusy] = useState(null);
  const hoje = hojeISO();
  const contas = finances.filter(ehEntradaFutura).slice().sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  // Diego, 29/07: "tem mais para receber que não está lá". O card só mostrava quem tem linha a_receber
  // gravada — serviço entregue com valor cheio e nenhuma entrada lançada é dinheiro a receber igual, e ficava
  // invisível justo no lugar onde ele vai olhar pra saber quanto tem pra entrar. Entra aqui, mas separado:
  // não é linha de financeiro, é saldo que ninguém lançou ainda — por isso não tem "Recebi" direto.
  const { prontosSemCobranca } = resumoContas(finances, services, hoje);
  const semLancar = (prontosSemCobranca || []).slice().sort((a, b) => (a.prazo || "").localeCompare(b.prazo || ""));
  // DINHEIRO ÓRFÃO: entrada de serviço que ninguém amarrou a um serviço. A trava nova (ver
  // registrarFinanceiroDaOperacao) impede que apareçam novos, mas os antigos já estavam no banco e é
  // justamente por serem invisíveis que a entrada da Ana Cristina e a da Madalena ficaram 13 dias sem virar
  // saldo a receber. Aparecem aqui porque é o lugar onde a conta não fecha.
  const orfaos = (finances || []).filter((f) => f.tipo === "entrada" && f.status === "pago" && !f.servico_id && ehCategoriaServico(f.categoria));
  const nomeDe = (f) => {
    const svc = (services || []).find((s) => s.id === f.servico_id);
    return svc?.clientes?.nome || descricaoFinanceiraVisivel(f.descricao) || f.categoria || "Serviço";
  };
  const receber = async (item) => {
    if (mode === "claude") { notify("No modo Claude, receba pela operação tipada financeiro com o id existente.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(item.id);
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "financeiro", eventoId: "app-saldo-recebido-" + item.id,
        dados: { financeiroId: item.id, status: "pago", data: hojeISO() },
      });
      notify(`Recebido — ${money(item.valor)} entrou no caixa.`, "ok"); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(null); }
  };
  return <section className="content-card"><div className="card-head"><div><p className="kicker">DINHEIRO COMBINADO, AINDA FORA DO CAIXA</p><h3>Saldos a receber</h3></div></div>
    {!contas.length && !semLancar.length && <div className="empty-state"><b>Nenhum saldo a receber.</b><span>Todo serviço fechado já está pago.</span></div>}
    {contas.map((item) => { const atrasado = (item.data || "") < hoje; return <div className="finance-row" key={item.id}>
      <div><strong>{nomeDe(item)}</strong><span>{atrasado ? `venceu ${compactDate(item.data)} — cobrar` : `previsto ${compactDate(item.data)}`}{item.servico_id ? "" : " · sem serviço vinculado"}</span></div>
      <b className="entrada">+ {money(item.valor)}</b>
      <button className="ghost" disabled={busy === item.id} onClick={() => receber(item)}>Recebi</button>
    </div>; })}
    {!!contas.length && <p className="ficha-note">Nada aqui entra no saldo do Financeiro. Só entra quando você tocar em “Recebi”.</p>}
    {!!semLancar.length && <div style={{ marginTop: contas.length ? 18 : 0, paddingTop: 14, borderTop: "1px dashed var(--line)" }}>
      <p className="kicker">AINDA SEM LANÇAMENTO NENHUM — {money(semLancar.reduce((s, x) => s + Number(x.valor_orcamento || 0), 0))}</p>
      {semLancar.map((s) => <div className="finance-row" key={s.id}>
        <div><strong>{s.clientes?.nome || s.titulo}</strong><span>{s.status === "entregue" ? "entregue" : "em produção"}{s.prazo ? ` · ${prazoComRotulo(s)}` : ""} · valor combinado, nenhuma entrada no financeiro</span></div>
        <b className="entrada">+ {money(s.valor_orcamento)}</b>
        <span className="status-pill">falta lançar</span>
      </div>)}
      <p className="ficha-note">Esses não têm linha no financeiro ainda, então não dá pra tocar em “Recebi”: primeiro lança a entrada do serviço (ou o saldo), depois recebe.</p>
    </div>}
    {!!orfaos.length && <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1px dashed var(--line)" }}>
      <p className="kicker">⚠ ENTRADA SEM SERVIÇO — {money(orfaos.reduce((s, f) => s + Number(f.valor || 0), 0))}</p>
      {orfaos.map((f) => <div className="finance-row" key={f.id}>
        <div><strong>{descricaoFinanceiraVisivel(f.descricao) || f.categoria}</strong><span>recebido {compactDate(f.data)} · está no caixa, mas não sabe de qual serviço</span></div>
        <b className="entrada">+ {money(f.valor)}</b>
      </div>)}
      <p className="ficha-note">Esse dinheiro entrou, mas o serviço dele parece não ter recebido nada — por isso o saldo a receber não foi criado. Peça pro Claude amarrar cada um ao serviço certo.</p>
    </div>}
  </section>;
}

// PLANO DE CAIXA. Diego, 04/08: "queria algo inteligente assim para contas a pagar, que cruzasse... que ela
// visse algo que está para vencer, visse que o caixa está apertado, desse sugestão de qual serviço entregar
// ou lead parado... porque está quase inútil".
// Ele está certo: a lista sozinha diz O QUE vence, e ele já sabe. A pergunta que ele faz de verdade quando
// abre essa aba é "vou dar conta?" — e, se não, "o que eu faço hoje". Isso exige cruzar quatro coisas que já
// estão no banco e nunca se olharam: o caixa de hoje, o que vence, o que está pra entrar, e o trabalho que
// pode virar dinheiro rápido.
// A REGRA DAS SUGESTÕES é distância até o dinheiro, não tamanho do valor. Um serviço pronto só esperando
// entrega vira caixa hoje; um lead de R$5.000 pode não virar nunca. Ordenar por valor mandaria ele atrás do
// mais difícil justamente no dia em que o caixa aperta.
function PlanoDeCaixa({ finances, services, escopo }) {
  const hoje = hojeISO();
  const noEscopo = (f) => escopo === "todos" || (f.escopo || "empresa") === escopo;
  // Caixa = o que já entrou menos o que já saiu. Só "pago" conta: promessa não paga conta de luz.
  const caixa = finances.filter((f) => noEscopo(f) && (f.status === "pago" || !f.status))
    .reduce((s, f) => s + (f.tipo === "entrada" ? Number(f.valor) : -Number(f.valor)), 0);
  const limite = somarDias(hoje, 15); // 15 dias: o horizonte em que ele ainda consegue agir
  const dentro = (d) => (d || "") <= limite;
  const vencendo = finances.filter((f) => noEscopo(f) && ehSaidaFutura(f) && dentro(f.data));
  const totalVence = vencendo.reduce((s, f) => s + Number(f.valor), 0);
  const receber = finances.filter((f) => noEscopo(f) && f.tipo === "entrada" && f.status === "a_receber" && dentro(f.data));
  const totalReceber = receber.reduce((s, f) => s + Number(f.valor), 0);
  const projetado = caixa + totalReceber - totalVence;
  const atrasadas = vencendo.filter((f) => (f.data || "") < hoje);
  // Dinheiro parado em trabalho, por ordem de quão perto está de virar caixa.
  const prontos = (services || []).filter((s) => s.status === "producao" && Number(s.valor_orcamento) > 0
    && !(s.materiais_necessarios || []).some((m) => !m.comprado));
  const receberVencido = receber.filter((f) => (f.data || "") < hoje);
  const emProducao = (services || []).filter((s) => s.status === "producao" && Number(s.valor_orcamento) > 0 && !prontos.includes(s));
  const valorDe = (lista) => lista.reduce((s, x) => s + Number(x.valor_orcamento || x.valor || 0), 0);
  if (!vencendo.length && !receber.length) return null;
  const apertado = projetado < 0;
  const sugestoes = [];
  if (prontos.length) sugestoes.push({ tom: "verde", titulo: `${prontos.length} serviço(s) pronto(s) pra entregar`, valor: valorDe(prontos), nomes: prontos.map((s) => s.clientes?.nome || "cliente"), como: "Material resolvido — entregar já vira dinheiro no caixa." });
  if (receberVencido.length) sugestoes.push({ tom: "amarelo", titulo: `${receberVencido.length} saldo(s) a receber já vencido(s)`, valor: valorDe(receberVencido), nomes: receberVencido.map((f) => descricaoFinanceiraVisivel(f.descricao).slice(0, 28)), como: "Cliente já recebeu ou combinou pagar — é só cobrar." });
  if (emProducao.length) sugestoes.push({ tom: "cinza", titulo: `${emProducao.length} em produção`, valor: valorDe(emProducao), nomes: emProducao.map((s) => s.clientes?.nome || "cliente"), como: "Ainda depende de material ou do profissional." });
  return <section className={`content-card plano-caixa${apertado ? " apertado" : ""}`}>
    <div className="card-head"><div><p className="kicker">PRÓXIMOS 15 DIAS</p>
      <h3>{apertado ? `Falta ${money(Math.abs(projetado))} pra fechar o mês` : `Sobra ${money(projetado)} depois de pagar tudo`}</h3></div></div>
    <div className="plano-linha"><span>Caixa hoje</span><b className={caixa >= 0 ? "entrada" : "saida"}>{money(caixa)}</b></div>
    <div className="plano-linha"><span>A receber até lá {receberVencido.length ? `· ${receberVencido.length} já vencido(s)` : ""}</span><b className="entrada">+ {money(totalReceber)}</b></div>
    <div className="plano-linha"><span>Vence até lá {atrasadas.length ? `· ${atrasadas.length} atrasada(s)` : ""}</span><b className="saida">− {money(totalVence)}</b></div>
    <div className="plano-linha total"><span>{apertado ? "Descoberto" : "Sobra"}</span><b className={apertado ? "saida" : "entrada"}>{money(projetado)}</b></div>
    {!!sugestoes.length && <div className="plano-sugestoes">
      <p className="kicker">{apertado ? "DE ONDE TIRAR — DO MAIS RÁPIDO PRO MAIS DEMORADO" : "DINHEIRO PARADO EM TRABALHO"}</p>
      {sugestoes.map((s, i) => <div className={`plano-sugestao ${s.tom}`} key={i}>
        <div><strong>{s.titulo} · {money(s.valor)}</strong><span>{s.nomes.slice(0, 4).join(" · ")}{s.nomes.length > 4 ? ` +${s.nomes.length - 4}` : ""}</span><em>{s.como}</em></div>
      </div>)}
      {apertado && prontos.length > 0 && <p className="ficha-note">Entregando {prontos.length === 1 ? "esse serviço" : `os ${prontos.length} prontos`} você já cobre {valorDe(prontos) >= Math.abs(projetado) ? "todo o descoberto" : `${money(valorDe(prontos))} do descoberto`}.</p>}
    </div>}
  </section>;
}
function FuturoView({ finances, services, db, demo, mode, notify, onChanged }) {
  const [formOpen, setFormOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const novoDraft = () => ({ descricao: "", valor: "", parcelas: "1", primeiroVenc: somaDiaMes(hojeISO(), 1), escopo: "empresa", categoria: "Conta fixa", eventoId: novoIdLocal() });
  const [draft, setDraft] = useState(() => novoDraft());
  const [verTudo, setVerTudo] = useState(false);
  const [escopoAba, setEscopoAba] = useState("todos"); // Diego: dinheiro pessoal (aluguel) separado do da empresa (cartão)
  // CONTA AGENDADA NÃO É VALOR FIXO. Diego, 04/08: "ali em Contas a pagar, o caso do cartão da minha mãe e
  // outros lugares, deixa eu editar, porque nesse mês mesmo teve uma variação, aumentou o valor". Cartão,
  // luz e água mudam todo mês — o app agendava o valor previsto e depois não deixava acertar. Sem edição, a
  // saída era marcar pago com valor errado (e sujar o caixa) ou apagar e refazer (e perder o histórico).
  const [editando, setEditando] = useState(null);
  const [draftEdit, setDraftEdit] = useState({ descricao: "", valor: "", data: "" });

  const todasContas = finances.filter(ehSaidaFutura);
  const contas = todasContas.filter((c) => escopoAba === "todos" || (c.escopo || "empresa") === escopoAba).slice().sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  const hoje = hojeISO();
  const atrasadas = contas.filter((c) => (c.data || "") < hoje);
  const mesAtual = mesISO(hoje);
  const doMes = contas.filter((c) => mesISO(c.data) === mesAtual);

  // Um parcelamento longo (aluguel de 12 meses) enchia a tela de meses que não mudam decisão nenhuma hoje.
  // Por padrão mostra só o horizonte de decisão - vencidas e os próximos 60 dias - e resume o resto numa linha.
  const horizonte = somaDiaMes(hoje, 2);
  const noHorizonte = contas.filter((c) => (c.data || "") <= horizonte);
  const depois = contas.filter((c) => (c.data || "") > horizonte);
  const visiveis = verTudo ? contas : noHorizonte;
  const porMes = {};
  visiveis.forEach((c) => { (porMes[mesISO(c.data)] ||= []).push(c); });
  const meses = Object.keys(porMes).sort();

  const pagar = async (item) => {
    if (mode === "claude") { notify("No modo Claude, pague pela operação tipada financeiro com o id existente.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "financeiro", eventoId: "app-conta-paga-" + item.id,
        dados: { financeiroId: item.id, status: "pago", data: hojeISO() },
      });
      notify("Pago — agora entra no caixa.", "ok"); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };

  // Edita a conta agendada passando pelo mesmo gateway do resto do dinheiro — nada de UPDATE solto no banco.
  const salvarEdicao = async (item) => {
    if (mode === "claude") { notify("No modo Claude, ajuste pela operação tipada financeiro.", "error"); return; }
    const valor = parseMoedaBR(draftEdit.valor);
    if (!valor || valor <= 0) { notify("Informe um valor válido.", "error"); return; }
    if (!draftEdit.data) { notify("Informe a data de vencimento.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); setEditando(null); return; }

      }

    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }

          <label>Aba<select value={draft.escopo} onChange={(e) => setDraft({ ...draft, escopo: e.target.value })}><option value="empresa">Empresa</option><option value="pessoal">Pessoal</option></select></label>

    <section className="content-card">

      {!contas.length && <div className="empty-state"><b>Nenhuma saída futura agendada.</b><span>Parcela de cartão, aluguel e conta fixa entram aqui e aparecem no mês em que vão pesar.</span></div>}
      {!!contas.length && !noHorizonte.length && !verTudo && <div className="empty-state"><b>Nada vence nos próximos 60 dias.</b></div>}
      {meses.map((m) => <div key={m} className="vale-fornecedor">

        {porMes[m].map((c) => editando === c.id
          ? <div className="finance-row conta-edit" key={c.id}>
              <div className="conta-edit-campos">
                <input value={draftEdit.descricao} onChange={(e) => setDraftEdit((d) => ({ ...d, descricao: e.target.value }))} placeholder="Descrição" />

                  <input inputMode="decimal" value={draftEdit.valor} onChange={(e) => setDraftEdit((d) => ({ ...d, valor: e.target.value }))} placeholder="Valor" />
                  <input type="date" value={draftEdit.data} onChange={(e) => setDraftEdit((d) => ({ ...d, data: e.target.value }))} />
                </div>
                <div className="ficha-actions">
                  <button className="primary" disabled={busy} onClick={() => salvarEdicao(c)}>Salvar</button>
                  <button className="ghost" onClick={() => setEditando(null)}>Cancelar</button>
                </div>
              </div>
            </div>
          : <div className="finance-row" key={c.id}>
              <div><strong>{c.descricao || c.categoria}</strong><span>Vence {compactDate(c.data)} · {c.escopo === "pessoal" ? "Pessoal" : "Empresa"} · {c.categoria}{(c.data || "") < hoje ? " · ATRASADA" : ""}</span></div>
              <div className="agenda-acoes"><b className="saida">{money(c.valor)}</b>
                <button className="ghost" disabled={busy || mode === "claude"} onClick={() => { setEditando(c.id); setDraftEdit({ descricao: descricaoFinanceiraVisivel(c.descricao) || "", valor: String(c.valor), data: c.data || hoje }); }}>Editar</button>
                <button className="ghost" disabled={busy || mode === "claude"} onClick={() => pagar(c)}>Marcar pago</button></div>
            </div>)}
      </div>)}
      {depois.length > 0 && <p className="ficha-note">{verTudo
        ? <>Mostrando tudo, inclusive o que vence depois de {compactDate(horizonte)}. <button type="button" className="ficha-link" onClick={() => setVerTudo(false)}>voltar pros próximos 60 dias</button></>
        : <>Mais {money(depois.reduce((s, c) => s + Number(c.valor), 0))} em {depois.length} conta(s) depois de {compactDate(horizonte)} — parcelas já agendadas, nada pra decidir agora. <button type="button" className="ficha-link" onClick={() => setVerTudo(true)}>ver tudo</button></>}</p>}
    </section>
  </div>;
}

// LOCALIZAÇÃO EXATA DO CLIENTE — item LOC-CLIENTE-20260823-1446.
// Diego pediu para a operação parar de trabalhar só com cidade/bairro e passar a conhecer o
// ponto real. O Classic não consegue fazer essa parte: ele não tem GPS, e link curto do Maps
// (maps.app.goo.gl) ele não abre. Por isso a captura mora aqui, no aparelho que está na rua.
//
// Extrai coordenada de um link do Google Maps colado. As formas que aparecem de verdade:
//   .../place/Nome/@-16.0597,-48.0307,17z/data=!3m1!4b1!4m6!...!8m2!3d-16.0597393!4d-48.030768
//   .../maps/@-16.0597,-48.0307,17z
//   ...?q=-16.05,-48.03   |   ...?api=1&query=-16.05,-48.03
//   o par cru colado no campo: "-16.0597393, -48.030768"
//
// `!3d!4d` vem PRIMEIRO de propósito: é o pino do lugar. O `@` é o centro da tela do mapa, que
// pode estar deslocado da porta se a pessoa arrastou o mapa antes de compartilhar.
//
// Link curto NÃO é resolvido aqui. Resolver exigiria seguir o redirecionamento, e o navegador
// bloqueia isso por CORS. Inventar coordenada a partir de um link que eu não abri seria
// exatamente o "não marcar ponto geocodificado como CONFIRMADA sem evidência" que o pedido proíbe.
function extrairCoordenadaMaps(texto) {
  const t = String(texto || "").trim();
  if (!t) return null;
  // Link do Waze é RECUSADO mesmo trazendo `ll=` legível. O critério de aceite do pedido é
  // explícito: "um link temporário de Waze não é armazenado como localização canônica".
  // Compartilhamento do Waze expira, e o ponto que sobra no cadastro depois disso é uma
  // coordenada que ninguém consegue mais conferir de onde veio. Testado: sem esta linha o
  // extrator engolia `waze.com/ul?ll=...` e gravava como CONFIRMADA.
  if (/waze\.com/i.test(t)) return { waze: true };
  if (/(maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(t)) return { curto: true };
  const valido = (lat, lon) => Number.isFinite(lat) && Number.isFinite(lon)
    && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180
    && !(lat === 0 && lon === 0);
  const tentativas = [
    /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,
    /@(-?\d+\.\d+),(-?\d+\.\d+)/,
    /[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/i,
    /^(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)$/,
  ];
  for (const re of tentativas) {
    const m = t.match(re);
    if (m) {
      const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
      if (valido(lat, lon)) return { lat, lon };
    }
  }
  return null;
}

// Mostrar a origem por extenso importa na rua: "capturado na porta" e "pino que alguém mandou"
// merecem confianças diferentes quando o Waze abrir 40 metros longe.
function origemLocalizacaoLabel(origem) {
  if (origem === "GPS_APP_DIEGO") return "capturado na porta";
  if (origem === "GOOGLE_MAPS_LINK_DIEGO") return "pino do Maps";
  return origem ? String(origem).toLowerCase().replace(/_/g, " ") : "origem não registrada";
}

function FichaModal({ db, demo, notify, clienteId, fornecedores, onClose, onChanged }) {
  const [cliente, setCliente] = useState(null);
  const [servicos, setServicos] = useState([]);
  const [fotos, setFotos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({ nome: "", telefone: "", cidade: "", endereco: "", obs: "" });
  const [saving, setSaving] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [confirmPhoto, setConfirmPhoto] = useState(null);
  const [editandoResp, setEditandoResp] = useState(null);
  const [respDraft, setRespDraft] = useState("");
  const [editandoMaterial, setEditandoMaterial] = useState(null);
  const [materialDraft, setMaterialDraft] = useState({ loja: "", data: "" });
  const [entregando, setEntregando] = useState(null);
  const [valorEntregaDraft, setValorEntregaDraft] = useState("");
  const [overrideMat, setOverrideMat] = useState(null);
  const [recebidoFichaDraft, setRecebidoFichaDraft] = useState("");
  const [avisoDuplicado, setAvisoDuplicado] = useState(null);
  const [capturando, setCapturando] = useState(false);
  const [colarLink, setColarLink] = useState(false);
  const [linkDraft, setLinkDraft] = useState("");

  const load = useCallback(async () => {
    setLoading(true);
    if (demo) {
      const c = demoCustomers.find((x) => x.id === clienteId) || null;
      setCliente(c); setServicos(demoServices.filter((s) => s.cliente_id === clienteId)); setFotos([]);
      if (c) setForm({ nome: c.nome || "", telefone: c.telefone || "", cidade: c.cidade || "", endereco: c.endereco || "", obs: c.obs || "" });
      setLoading(false); return;
    }
    const [c, sv, ft] = await Promise.all([
      db.from("clientes").select("*").eq("id", clienteId).single(),
      db.from("servicos").select("*").eq("cliente_id", clienteId).order("criado_em", { ascending: false }),
      db.from("fotos").select("*").eq("cliente_id", clienteId).order("criado_em", { ascending: false }),
    ]);
    if (c.error) { notify("Erro ao abrir ficha: " + c.error.message, "error"); setLoading(false); return; }
    setCliente(c.data); setServicos(sv.data || []); setFotos(ft.data || []);
    setForm({ nome: c.data.nome || "", telefone: c.data.telefone || "", cidade: c.data.cidade || "", endereco: c.data.endereco || "", obs: c.data.obs || "" });
    setLoading(false);
  }, [db, demo, clienteId, notify]);

  useEffect(() => { load(); }, [load]);

  // IDENTIDADE DE CLIENTE É O TELEFONE, NÃO O NOME. A triagem já avisava de ficha repetida
  // (duplicateCustomers), mas a ficha não avisava nada: dava pra digitar aqui um número que já é de outro
  // cliente e criar a duplicata por dentro, sem passar pela caixa de entrada. Foi assim que a "Ju" virou duas.
  // Avisa e deixa seguir — às vezes marido e esposa dividem o mesmo número, e quem sabe disso é o Diego.
  const saveCliente = async (forcar = false) => {
    if (!form.nome.trim()) { notify("Nome é obrigatório.", "error"); return; }
    const telefone = corrigirTelefone(form.telefone);
    if (telefone === null) { notify("Telefone incompleto — celular precisa de DDD + 8 ou 9 dígitos.", "error"); return; }
    if (demo) { notify("Na demonstração a ficha não é salva.", "info"); setEditing(false); return; }
    setSaving(true);
    if (!forcar && telefone) {
      const { data: mesmoTelefone } = await db.from("clientes").select("id,nome,cidade").eq("telefone", telefone).neq("id", clienteId).limit(1);
      if (mesmoTelefone?.length) { setSaving(false); setAvisoDuplicado(mesmoTelefone[0]); return; }
    }
    const { error } = await db.from("clientes").update({ nome: form.nome.trim(), telefone: telefone || null, cidade: form.cidade.trim() || null, endereco: form.endereco.trim() || null, obs: form.obs.trim() || null }).eq("id", clienteId);
    setSaving(false);
    if (error) { notify("Erro: " + error.message, "error"); return; }
    setAvisoDuplicado(null);
    notify("Ficha atualizada.", "ok"); setEditing(false); await load(); onChanged?.();
  };

  // Grava o ponto e RELÊ antes de dizer que salvou. Sem readback não conta como gravado —
  // é a mesma regra que vale para o resto da operação.
  // `origem_localizacao` guarda COMO o ponto chegou, porque isso muda quanto ele vale:
  // GPS_APP_DIEGO = ele estava fisicamente na porta; GOOGLE_MAPS_LINK_DIEGO = ele colou o pino.
  // Os dois são evidência do próprio Diego, então entram como CONFIRMADA. Palpite não entra.
  // O endereço em texto não é tocado: sobrescrever endereço por inferência é efeito proibido.
  const salvarLocalizacao = async (lat, lon, origem, rotulo) => {
    if (demo) { notify("Na demonstração a localização não é salva.", "info"); return; }
    const { error } = await db.from("clientes").update({
      latitude: lat, longitude: lon, origem_localizacao: origem,
      localizacao_confirmada_em: new Date().toISOString(), localizacao_confianca: "CONFIRMADA",
    }).eq("id", clienteId);
    if (error) { notify("Não gravou: " + error.message, "error"); return; }
    const { data: lido, error: erroLeitura } = await db.from("clientes").select("latitude,longitude").eq("id", clienteId).single();
    if (erroLeitura || lido?.latitude == null) { notify("Gravou, mas não consegui reler para confirmar. Abra a ficha de novo antes de confiar.", "error"); return; }
    notify(`Localização salva (${rotulo}).`, "ok");
    setColarLink(false); setLinkDraft("");
    await load(); onChanged?.();
  };

  // Permissão negada, sem sinal e timeout são três problemas diferentes e a mensagem diz qual foi —
  // "erro ao obter localização" na rua não ajuda ninguém. Nenhum deles quebra a ficha.
  const capturarGPS = () => {
    if (!navigator.geolocation) { notify("Este aparelho não oferece GPS ao navegador.", "error"); return; }
    setCapturando(true);
    navigator.geolocation.getCurrentPosition(
      async (pos) => { setCapturando(false); await salvarLocalizacao(pos.coords.latitude, pos.coords.longitude, "GPS_APP_DIEGO", "GPS, onde você está agora"); },
      (err) => {
        setCapturando(false);
        notify(err.code === 1 ? "Você recusou o acesso à localização. Libere nas permissões do site e tente de novo."
          : err.code === 2 ? "O aparelho não achou sinal agora. Tente a céu aberto, ou cole o link do Maps."
          : "Demorou demais para achar o sinal. Tente de novo, ou cole o link do Maps.", "error");
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  };

  const usarLinkMaps = async () => {
    const r = extrairCoordenadaMaps(linkDraft);
    if (!r) { notify("Não achei coordenada nesse texto. Cole o link do Maps já aberto, ou o par: -16.0597, -48.0307", "error"); return; }
    if (r.waze) { notify("Link do Waze não serve como localização do cliente — ele é temporário. Use ⌖ Capturar aqui, ou o pino do Google Maps.", "error"); return; }
    if (r.curto) { notify("Esse é o link curto — ele não carrega a coordenada. Abra ele, espere o mapa aparecer e copie o endereço da barra do navegador.", "error"); return; }
    await salvarLocalizacao(r.lat, r.lon, "GOOGLE_MAPS_LINK_DIEGO", "pino do Maps");
  };

  const addFoto = async (file) => {
    if (!file) return;
    if (demo) { notify("Na demonstração não dá para subir foto.", "info"); return; }
    setUploading(true);
    try {
      const path = clienteId + "/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const { error: upErr } = await db.storage.from("fotos-servicos").upload(path, file); if (upErr) throw upErr;
      const { data, error } = await db.storage.from("fotos-servicos").createSignedUrl(path, 60 * 60 * 24 * 365); if (error) throw error;
      const { error: insErr } = await db.from("fotos").insert({ cliente_id: clienteId, url: data.signedUrl, tipo: "outro" }); if (insErr) throw insErr;
      notify("Foto adicionada.", "ok"); await load();
    } catch (e) { notify("Erro no upload: " + e.message, "error"); }
    finally { setUploading(false); }
  };

  const removeFoto = async (id) => {
    setConfirmPhoto(null);
    if (demo) { notify("Na demonstração não dá para remover foto.", "info"); return; }
    const { error } = await db.from("fotos").delete().eq("id", id);
    if (error) { notify("Erro: " + error.message, "error"); return; }
    notify("Foto removida.", "ok"); await load();
  };

  const salvarResponsavel = async (servicoId) => {
    if (demo) { notify("Na demonstração a ficha não é salva.", "info"); setEditandoResp(null); return; }
    const { error } = await db.from("servicos").update({ responsavel: respDraft.trim() || null }).eq("id", servicoId);
    if (error) { notify("Erro: " + error.message, "error"); return; }
    notify("Profissional atualizado.", "ok"); setEditandoResp(null); await load(); onChanged?.();
  };

  const salvarMaterial = async (servicoId) => {
    if (demo) { notify("Na demonstração a ficha não é salva.", "info"); setEditandoMaterial(null); return; }
    const loja = materialDraft.loja.trim();
    const data = materialDraft.data;
    if (!loja) { notify("Escolha o fornecedor do material.", "error"); return; }
    const forn = (fornecedores || []).find((f) => (f.nome || "").trim().toLowerCase() === loja.toLowerCase());
    if (!forn) { notify("Esse fornecedor ainda não está cadastrado. Cadastre cidade e dias de entrega antes de planejar.", "error"); return; }
    try {
      const operacao = await processarEventoOperacaoBahia(db, {
        tipo: "material_planejado", eventoId: "app-ficha-material-" + servicoId + "-" + forn.id + "-" + (data || "automatico"),
        dados: { servicoId, fornecedorId: forn.id, dataEntrega: data || undefined, por: "diego" },
      });
      notify(`Material planejado. Ação marcada para ${compactDate(operacao.resultado.dataCompra)}.`, "ok");
      setEditandoMaterial(null); await load(); onChanged?.();
    } catch (e) { notify("O planejamento ficou visível para retomada: " + e.message, "error"); }
  };

  // Pedido do Diego (26/07): compromisso concluído sem escolher "Entreguei" deixava o serviço preso em
  // produção sem jeito de fechar pela ficha. Este botão fecha a entrega direto no serviço, sem precisar
  // de compromisso — usa a mesma operação tipada, só que sem agendaId.
  const confirmarEntrega = async (servicoId) => {
    if (demo) { notify("Na demonstração a ficha não é salva.", "info"); setEntregando(null); return; }
    const valor = parseMoedaBR(valorEntregaDraft);
    if (!valor || valor <= 0) { notify("Qual foi o valor do serviço? Sem isso não dá pra marcar como entregue.", "error"); return; }
    const recebido = parseMoedaBR(recebidoFichaDraft);
    if (recebidoFichaDraft.trim() && !(recebido > 0)) { notify("Não entendi o valor recebido. Escreva só o número, ex: 2.189 ou 2189.", "error"); return; }
    if (recebido > valor) { notify(`Recebido (${money(recebido)}) é maior que o valor do serviço (${money(valor)}). Confira.`, "error"); return; }
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "entrega_concluida", eventoId: "app-ficha-entrega-" + servicoId,
        // Ver comentário no CapacidadeCard: sem `recebimento` o dinheiro não entra no caixa.
        dados: { servicoId, valor, data: hojeISO(), por: "diego", recebimento: recebido > 0 ? { valor: recebido, status: "pago", data: hojeISO() } : null,
          overrideMaterial: overrideMat === servicoId, motivoOverrideMaterial: overrideMat === servicoId ? "Confirmado no segundo clique, pela ficha do cliente" : null },
      });
      notify(recebido > 0 ? `Entregue. ${money(recebido)} no caixa.` : "Entregue. Serviço fechado (sem recebimento).", "ok");
      setEntregando(null); setOverrideMat(null); await load(); onChanged?.();
    } catch (e) {
      // Mesma regra da Capacidade e da agenda: material em aberto pede um segundo clique, e ele fica gravado.
      if (/MATERIAL_PENDENTE/.test(e.message)) { setOverrideMat(servicoId); notify(e.message.replace("MATERIAL_PENDENTE: ", ""), "error"); return; }
      notify("A entrega ficou visível para retomada: " + e.message, "error");
    }
  };

  return <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal-card">
      <div className="modal-head"><div><p className="kicker">FICHA DO CLIENTE</p><h2>{cliente?.nome || "Cliente"}</h2></div><button className="ghost" onClick={onClose}>Fechar</button></div>
      {loading ? <div className="empty-state"><b>Carregando…</b></div> : !cliente ? <div className="empty-state"><b>Cliente não encontrado.</b></div> : <>
        {telefoneCorrigivel(cliente.telefone) && <div className="duplicate-warning"><b>⚠ Esse telefone não abre o WhatsApp</b>
          <span>{corrigirTelefone(cliente.telefone) ? `Falta o 9 do celular — o certo é ${corrigirTelefone(cliente.telefone)}` : "O número não tem o tamanho de um celular brasileiro. Confira com o cliente."}</span>
          {corrigirTelefone(cliente.telefone) && <button onClick={() => { setForm((f) => ({ ...f, telefone: corrigirTelefone(cliente.telefone) })); setEditing(true); }}>Corrigir e revisar</button>}
        </div>}
        {!editing ? <div className="ficha-fields">
          {cliente.telefone && <div className="ficha-field"><small>TELEFONE</small><span>{cliente.telefone}</span></div>}
          {cliente.cidade && <div className="ficha-field"><small>CIDADE</small><span>{cliente.cidade}</span></div>}
          {cliente.endereco && <div className="ficha-field"><small>ENDEREÇO</small><span>{cliente.endereco}</span></div>}
          {cliente.obs && <div className="ficha-field wide"><small>OBSERVAÇÕES</small><span>{cliente.obs}</span></div>}
          {/* LOCALIZAÇÃO EXATA — aparece SEMPRE, inclusive quando falta. Cliente sem ponto continua
              utilizável e a pendência fica dita com todas as letras, sem coordenada inventada. */}
          <div className="ficha-field wide"><small>LOCALIZAÇÃO EXATA</small>
            {cliente.latitude != null
              ? <span>⌖ {cliente.localizacao_confianca === "APROXIMADA" ? "Ponto aproximado" : "Ponto confirmado"} · {origemLocalizacaoLabel(cliente.origem_localizacao)}{cliente.localizacao_confirmada_em ? " · " + new Date(cliente.localizacao_confirmada_em).toLocaleDateString("pt-BR") : ""}</span>
              : <span>⚠ Pendente — a rota para {cliente.endereco ? "no endereço escrito" : "na cidade"}</span>}
          </div>
          <div className="ficha-actions">
            <button className="ghost" onClick={capturarGPS} disabled={capturando}>{capturando ? "Procurando sinal…" : cliente.latitude != null ? "⌖ Atualizar aqui" : "⌖ Capturar aqui"}</button>
            <button className="ghost" onClick={() => { setColarLink((v) => !v); setLinkDraft(""); }}>{colarLink ? "Cancelar" : "Colar link do Maps"}</button>
            {cliente.latitude != null && <a className="ghost" href={urlWaze({ ll: `${cliente.latitude},${cliente.longitude}` })} target={ehAndroid() ? undefined : "_blank"} rel="noreferrer">🧭 Waze</a>}
            {cliente.latitude != null && <a className="ghost" href={`https://www.google.com/maps/search/?api=1&query=${cliente.latitude},${cliente.longitude}`} target="_blank" rel="noreferrer">📍 Maps</a>}
          </div>
          {colarLink && <div className="responsavel-edit-row"><input value={linkDraft} onChange={(e) => setLinkDraft(e.target.value)} placeholder="Cole o link do Google Maps já aberto" autoFocus /><button className="ghost" onClick={usarLinkMaps}>Salvar ponto</button></div>}
          {/* Ficha é nível CLIENTE: aqui o cliente pode ter vários serviços, então `servico_id`
              fica de fora. Escolher um seria adivinhar, e adivinhar é o que gera atendimento errado. */}
          <div className="ficha-actions"><button className="ghost" onClick={() => setEditing(true)}>Editar dados</button>{cliente.telefone && <a className="ghost" href={urlWhatsapp(normalizePhone(cliente.telefone), "")} target={ehAndroid() ? undefined : "_blank"} rel="noreferrer">WhatsApp</a>}<button className="ghost" onClick={() => compartilharGPT(payloadGPT([["cliente_id", cliente.id], ["nome", cliente.nome], ["cidade", cliente.cidade]]), notify)}>💬 ChatGPT</button></div>
        </div> : <div className="ficha-edit form-grid">
          <div className="row"><label>Nome*<input value={form.nome} onChange={(e) => setForm((f) => ({ ...f, nome: e.target.value }))} /></label><label>Telefone<input value={form.telefone} onChange={(e) => setForm((f) => ({ ...f, telefone: e.target.value }))} /></label></div>
          <div className="row"><label>Cidade<input value={form.cidade} onChange={(e) => setForm((f) => ({ ...f, cidade: e.target.value }))} /></label><label>Endereço<input value={form.endereco} onChange={(e) => setForm((f) => ({ ...f, endereco: e.target.value }))} /></label></div>
          <label>Observações<textarea value={form.obs} onChange={(e) => setForm((f) => ({ ...f, obs: e.target.value }))} /></label>
          {avisoDuplicado && <div className="duplicate-warning"><b>⚠ Esse telefone já é de {avisoDuplicado.nome}{avisoDuplicado.cidade ? ` · ${avisoDuplicado.cidade}` : ""}</b>
            <span>Se for a mesma pessoa, cancele e trabalhe na ficha que já existe — duas fichas do mesmo cliente separam o histórico.</span>
            <button onClick={() => saveCliente(true)}>É outra pessoa mesmo — salvar assim</button>
          </div>}
          <div className="ficha-actions"><button className="primary" onClick={() => saveCliente()} disabled={saving}>{saving ? "Salvando…" : "Salvar"}</button><button className="ghost" onClick={() => { setEditing(false); setAvisoDuplicado(null); setForm({ nome: cliente.nome || "", telefone: cliente.telefone || "", cidade: cliente.cidade || "", endereco: cliente.endereco || "", obs: cliente.obs || "" }); }}>Cancelar</button></div>
        </div>}

        <h3 className="ficha-section">Histórico de serviços</h3>
        {!servicos.length ? <div className="empty-state"><b>Nenhum serviço registrado.</b></div> : <div className="ficha-servicos">{servicos.map((s) => { const sugestao = s.sugestao_resposta || ""; const tel = cliente.telefone ? normalizePhone(cliente.telefone) : ""; return <div className={`ficha-servico priority-${s.prioridade || "media"}`} key={s.id}><div className="ficha-servico-main"><strong>{s.titulo}</strong><span>{statusLabel[s.status] || s.status}{s.proxima_acao ? " · " + s.proxima_acao : ""}</span>
          {/* A DESCRIÇÃO ERA UM BURACO NEGRO. Auditoria de 04/08: `servicos.descricao` era gravada em 13
              serviços e não aparecia em NENHUMA tela — só o financeiro renderiza descrição. Era ali que o
              detalhe do que foi combinado (espuma, catraca, tecido) ia parar quando eu processava a ficha,
              e o Diego dizia com razão "está na ficha dele". Estava — num campo que ninguém mostrava.
              Campo que só recebe e nunca devolve não é registro, é perda de informação com passo extra. */}
          {!!(s.descricao || "").trim() && <p className="ficha-servico-desc">{s.descricao}</p>}
          {!!(s.materiais_necessarios || []).length && <p className="ficha-servico-desc">🧵 {(s.materiais_necessarios || []).map((m) => (m.comprado ? "✓ " : "☐ ") + m.item).join(" · ")}</p>}
          {editandoResp === s.id
            ? <div className="responsavel-edit-row"><input value={respDraft} onChange={(e) => setRespDraft(e.target.value)} placeholder="Nome do profissional" autoFocus /><button className="ghost" onClick={() => salvarResponsavel(s.id)}>Salvar</button><button className="ghost" onClick={() => setEditandoResp(null)}>✕</button></div>
            : <button type="button" className="responsavel-badge" onClick={() => { setEditandoResp(s.id); setRespDraft(s.responsavel || ""); }}>{s.responsavel ? `👤 ${s.responsavel}` : "+ Atribuir profissional"}</button>}
          {["agendado", "producao"].includes(s.status) && (editandoMaterial === s.id
            ? <div className="material-edit-block">
                <div className="responsavel-edit-row"><input value={materialDraft.loja} onChange={(e) => setMaterialDraft((m) => ({ ...m, loja: e.target.value }))} placeholder="Loja do material" /><input type="date" title="Previsão de chegada, se já foi informada" value={materialDraft.data} onChange={(e) => setMaterialDraft((m) => ({ ...m, data: e.target.value }))} /><button className="ghost" onClick={() => salvarMaterial(s.id)}>Salvar</button><button className="ghost" onClick={() => setEditandoMaterial(null)}>✕</button></div>
                {!!(fornecedores || []).length && <div className="fornecedor-chips">{fornecedores.map((f) => <button type="button" key={f.id} className={materialDraft.loja.trim() === f.nome ? "active" : ""} onClick={() => setMaterialDraft({ loja: f.nome, data: proximaEntregaFornecedor(f.dias_entrega) || materialDraft.data })}>{f.nome}</button>)}</div>}
              </div>
            : <button type="button" className="responsavel-badge" onClick={() => { setEditandoMaterial(s.id); setMaterialDraft({ loja: s.loja_material || "", data: s.data_entrega_material || "" }); }}>{s.loja_material ? `🧵 ${s.loja_material}${s.data_entrega_material ? " · entrega " + compactDate(s.data_entrega_material) : ""}` : "+ Registrar loja/entrega do material"}</button>)}
          {["agendado", "producao"].includes(s.status) && (entregando === s.id
            ? <div className="entrega-form">
                <label>Valor total do serviço<input value={valorEntregaDraft} onChange={(e) => setValorEntregaDraft(e.target.value)} placeholder="R$" autoFocus /></label>
                <label>Recebeu quanto agora?<input value={recebidoFichaDraft} onChange={(e) => setRecebidoFichaDraft(e.target.value)} placeholder="R$ (vazio = não recebeu nada)" /></label>
                <span className="entrega-hint">{parseMoedaBR(recebidoFichaDraft) > 0 ? `Entra ${money(parseMoedaBR(recebidoFichaDraft))} no caixa da empresa, hoje.` : "Sem recebimento — nada entra no caixa."}</span>
                {overrideMat === s.id && <p className="picker-aviso">Ainda tem material em aberto neste serviço. Confirmando de novo, a entrega sai e a exceção fica no histórico.</p>}
                <div className="ficha-actions"><button className="primary" onClick={() => confirmarEntrega(s.id)}>{overrideMat === s.id ? "Entregar mesmo com material em aberto" : "Confirmar entrega"}</button><button className="ghost" onClick={() => { setEntregando(null); setOverrideMat(null); }}>Cancelar</button></div>
              </div>
            : <button type="button" className="responsavel-badge" onClick={() => { setEntregando(s.id); setOverrideMat(null); setValorEntregaDraft(s.valor_orcamento ? String(s.valor_orcamento) : ""); setRecebidoFichaDraft(""); }}>✅ Marcar como entregue</button>)}
        </div><div className="ficha-servico-meta">{s.valor_orcamento ? <b>{money(s.valor_orcamento)}</b> : <span>—</span>}{s.prazo && <time>{prazoComRotulo(s)}</time>}{(sugestao || tel || ehServicoFechado(s)) && <div className="ficha-servico-acoes">{sugestao && <button className="ghost" title="Copiar sugestão" onClick={() => navigator.clipboard.writeText(sugestao)}>📋</button>}{tel && <a className="ghost" href={urlWhatsapp(tel, sugestao)} target={ehAndroid() ? undefined : "_blank"} rel="noreferrer">WhatsApp</a>}
          {/* CONFIRMAÇÃO DE SERVIÇO — só em trabalho FECHADO. Lead e orçamento não têm acordo pra confirmar,
              e emitir documento comercial em cima de proposta viraria "condição oferecida" virando aceite. */}
          {ehServicoFechado(s) && <button className="ghost" title="Gerar a Confirmação de Serviço em PDF" onClick={() => gerarConfirmacaoServico({ db, demo, cliente, servico: s, servicosDoCliente: servicos, notify })}>📄 Confirmação</button>}</div>}</div></div>; })}</div>}
        <p className="ficha-note">Mudança de status e financeiro continuam no app atual por enquanto.</p>

        <h3 className="ficha-section">Fotos</h3>
        <div className="foto-grid">
          {fotos.map((f) => <div className="foto" key={f.id}><img src={f.url} alt={f.tipo || "foto"} />{f.tipo && <span className="foto-tag">{f.tipo}</span>}{confirmPhoto === f.id ? <div className="foto-confirm"><button onClick={() => removeFoto(f.id)}>Remover</button><button onClick={() => setConfirmPhoto(null)}>Não</button></div> : <button className="foto-rm" onClick={() => setConfirmPhoto(f.id)}>✕</button>}</div>)}
          <label className="foto-add">{uploading ? "Enviando…" : "+ Foto"}<input type="file" accept="image/*" capture="environment" onChange={(e) => addFoto(e.target.files?.[0])} /></label>
        </div>
      </>}
    </div>
  </div>;
}

// BARREIRA (22/08/2026). Sem isto, um erro em QUALQUER componente faz o React desmontar a árvore inteira
// e deixar a página vazia — que num app de fundo escuro é uma tela preta muda, sem nada pra ler nem pra
// clicar. Foi o que aconteceu com a anotação de conversa fora do formato. Agora o erro aparece escrito,
// com o caminho de saída, e fica guardado no aparelho pra eu poder ler depois.
class Barreira extends React.Component {
  constructor(props) { super(props); this.state = { erro: null }; }
  static getDerivedStateFromError(erro) { return { erro }; }
  componentDidCatch(erro, info) {
    try {
      window.localStorage.setItem("tb-ultimo-erro", JSON.stringify({
        em: new Date().toISOString(),
        mensagem: String((erro && erro.message) || erro),
        componente: String((info && info.componentStack) || "").trim().split("\n").slice(0, 6).join(" < ")
      }));
    } catch (e) { /* aparelho sem espaço: perder o registro não pode impedir a tela de aparecer */ }
  }
  render() {
    if (!this.state.erro) return this.props.children;
    return <div className="loading-screen"><div className="login-card">
      <div className="brand-seal">TB</div>
      <h1 style={{ font: "500 26px Georgia,serif", margin: "0 0 10px" }}>O app quebrou nesta tela</h1>
      <p>Não foi você e não se perdeu nada: os dados estão no servidor. Recarregar resolve na maioria das vezes. Se voltar a acontecer, me mande esta mensagem de erro.</p>
      <button className="primary wide" onClick={() => location.reload()}>Recarregar o app</button>
      <button className="ghost wide" style={{ marginTop: 10 }} onClick={() => { location.href = "./socorro.html"; }}>Abrir a página de socorro</button>
      <p style={{ fontSize: 10, color: "#81736a", margin: "16px 0 0", wordBreak: "break-word" }}>{String((this.state.erro && this.state.erro.message) || this.state.erro)}</p>
    </div></div>;
  }
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Barreira><Home /></Barreira>);
</script>
<script>
// O app só monta depois que as quatro bibliotecas responderam de verdade (ver o comentário lá no <head>).
// Antes isto rodava solto: se o Babel não estivesse na página, estourava aqui e a tela ficava preta e muda.
(function () {
  function montar() {
    const source = document.getElementById("app-source").textContent;
    const output = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }], "typescript"],
      filename: "app.tsx",
    }).code;
    const script = document.createElement("script");
    script.textContent = output;
    document.body.appendChild(script);
  }

  TB.carregarTudo()
    .then(() => {
      try { montar(); }
      catch (e) { TB.telaDeSocorro("erro ao montar o app: " + (e && e.message ? e.message : e)); }
    })
    .catch((e) => TB.telaDeSocorro(e && e.message ? e.message : String(e)));

  // Cão de guarda. Erro dentro do próprio app não volta pro try/catch acima (script injetado avisa o
  // window.onerror, não quem o injetou), e o React esvazia a #root quando um componente quebra no primeiro
  // desenho — nos dois casos o que sobraria na tela é preto. Se em 20s nada foi desenhado, explica.
  setTimeout(() => {
    const r = document.getElementById("root");
    if (!r) return;
    // #tb-carregando é o "Carregando" de HTML puro: se ele ainda está aí, o React nunca desenhou.
    // A #root vazia é o outro caminho: componente que quebra no primeiro desenho e o React limpa tudo.
    const naoDesenhou = r.children.length === 0 || !!r.querySelector("#tb-carregando");
    if (naoDesenhou) TB.telaDeSocorro("o app demorou demais para abrir");
  }, 20000);
})();

// O nova.html NÃO registrava o service worker — só o index.html registrava. Quem abrisse direto o app novo
// (que é o caso do dia a dia) nunca instalava o cache, e por isso nada funcionava offline. Registrar aqui
// também: o escopo './' cobre a pasta inteira, então os dois compartilham o mesmo SW.
if ('serviceWorker' in navigator) {
  // O ?v= acompanha a VERSAO dentro do sw.js. Ficou parado no v=12 enquanto o arquivo já ia no v14: o
  // navegador atualiza pelo conteúdo, então funcionava, mas quem lê o código acha que não subiu.
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=17').catch(() => {}));
}
</script>
</body>
</html>
