  const soma = (l, campo) => l.reduce((s, i) => s + Number(campo ? i[campo] : i.valor), 0);
  return {
    amanha, aPagar, vencidas, urgentes, aReceber, prontosSemCobranca,
    totalVencidas: soma(vencidas), totalUrgentes: soma(urgentes), totalAPagar: soma(aPagar),
    potencialCaixa: soma(aReceber) + soma(prontosSemCobranca, "valor_orcamento"),
  };
}
function materiaisDoCompromisso(finances, agendaId) { return (finances || []).filter((f) => f.agenda_id === agendaId && f.status === "a_pagar" && ehCompraMaterial(f)); }
// O BURACO QUE ISSO TAPA (24/07/2026): ele comprou material de verdade e concluiu o compromisso, e o gasto
// nunca foi lançado — a aba Compras ficou vazia e a margem do serviço, mentirosa. Compromisso de comprar/pedir
// material não pode ser concluído em silêncio: na hora de concluir o app pergunta o valor e lança na mesma
// hora (Regra Nº 8). Avisa, não bloqueia — tem saída pra "não comprei" e pra "lanço depois".
const RE_COMPRA = /\b(comprar|compra|pedir|pedido|buscar|retirar|levar)\b/i;
const RE_INSUMO = /\b(material|materiais|tecido|espuma|percinta|madeira|cord[ãa]o|cola|linha|pvc|p[ée]s?\b|elastico|el[áa]stico|courino|courvim|couro|suede|veludo|chenille|linho|zíper|ziper|grampo|verniz)\b/i;
function ehCompromissoDeCompra(appt, materiais) {
  const t = appt?.titulo || "";
  // Material "pendurado" numa entrega/visita é tarefa lateral da viagem, não transforma o compromisso
  // principal numa compra. Só agenda dedicada de pedir/buscar material abre o fluxo de material.
  if (RE_COMPRA.test(t) && RE_INSUMO.test(t)) return true;
  return (materiais || []).length > 0 && /\b(pedir|pedido|comprar|buscar)\b/i.test(t) && !/\b(entreg|visita|retirada do cliente)\b/i.test(t);
}
// ENTREGA CONCLUÍDA TEM QUE FECHAR O SERVIÇO. Antes, concluir um compromisso de entrega fechava so o
// compromisso: o serviço continuava 'agendado', então voltava pra lista de trabalho ativo e o cliente não
// saía do Painel (Diego em 25/07: "ja foi entregue, nao deixe acontecer mais esse erro de nao sumir
// de lá"). Agora o app pergunta na hora e move o serviço pra Entregue — que é o que faz ele sumir.
function ehCompromissoDeEntrega(appt, svc) {
  if (!svc || !["agendado", "producao"].includes(svc.status)) return false;
  const titulo = appt?.titulo || "";
  return /\b(entreg\w*|devolv\w*)\b/i.test(titulo)
    || (/\blevar\b/i.test(titulo) && /\b(pront\w*|sof[áa]|cadeir\w*|poltron\w*|cabeceir\w*|m[oó]vel|pe[çc]a)\b/i.test(titulo));
}
function planoDeCompra(fornecedor) {
  if (!fornecedor) return null;
  const dias = String(fornecedor.dias_entrega || "").split(",").map((d) => DIAS_SEMANA_MAP[d.trim()]).filter((n) => n !== undefined);
  if (dias.length) {
    const hoje = hojeISO();
    for (let i = 1; i <= 21; i++) {
      const entregaDate = new Date(hoje + "T12:00:00"); entregaDate.setDate(entregaDate.getDate() + i);
      if (!dias.includes(entregaDate.getDay())) continue;
      const pedidoDate = new Date(entregaDate); pedidoDate.setDate(pedidoDate.getDate() - 1);
      while (pedidoDate.getDay() === 0) pedidoDate.setDate(pedidoDate.getDate() - 1);
      const entrega = isoData(entregaDate), pedirEm = isoData(pedidoDate);
      if (pedirEm < hoje) continue; // perdeu o corte desta entrega; usa a próxima, não inventa pedido atrasado
      return { tipo: "remoto", data: pedirEm, hora: null, entrega, rotulo: `Fazer o pedido de material na ${fornecedor.nome} (entrega ${compactDate(entrega)})` };
    }
  }
  // Viagem automática nunca nasce hoje às 08h depois que o horário passou nem no domingo.
  return { tipo: "presencial", data: proximoDiaUtil(hojeISO()), hora: "08:00", entrega: null, rotulo: `Buscar material na ${fornecedor.nome}` };
}
function compraPrecisaRevisao(item) { return !item.fornecedor_id && !(item.descricao || "").startsWith(COMPRA_CONFERIDA_TAG); }
function mesISO(data) { return (data || "").slice(0, 7); }
function mesLabel(chave) {
  if (!chave) return "Sem data";
  const d = new Date(`${chave}-01T12:00:00`);
  return Number.isNaN(d.getTime()) ? chave : d.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
}
const COMPRAS_ABAS = [{ id: "mes", label: "Por mês" }, { id: "fornecedor", label: "Por fornecedor" }, { id: "servico", label: "Por serviço" }];

function ComprasView({ finances, fornecedores, services, appointments, db, demo, mode, notify, onChanged }) {
  const [aba, setAba] = useState("mes");
  const [formOpen, setFormOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const novoDraft = () => ({ fornecedorId: "", servicoId: "", valor: "", descricao: "", data: hojeISO(), jaComprei: true, eventoId: novoIdLocal() });
  const [draft, setDraft] = useState(() => novoDraft());
  const [confirmando, setConfirmando] = useState(null); // { id, servicoId } - item da lista sendo marcado como comprado
  const [vinculando, setVinculando] = useState(null); // id do item escolhendo em qual viagem já marcada aproveitar
  const [cidadeDraft, setCidadeDraft] = useState(null); // { id, valor } - cidade do fornecedor perguntada na hora de agendar

  const todas = finances.filter(ehCompraMaterial);
  // "a comprar" é lista de compras (ainda não saiu dinheiro, status a_pagar); só o que já foi comprado conta como gasto.
  const emTransito = todas.filter(materialEstaEmTransito);
  const emMaosAPagar = todas.filter((c) => materialEstaEmMaos(c) && c.status === "a_pagar");
  const aComprar = todas.filter((c) => c.status === "a_pagar" && !materialEstaEmMaos(c) && !materialEstaEmTransito(c));
  const compras = todas.filter((c) => c.status !== "a_pagar");
  const nomeFornecedor = (id) => fornecedores.find((f) => f.id === id)?.nome || "Sem fornecedor";
  const servicoDe = (id) => services.find((s) => s.id === id);
  const total = compras.reduce((soma, c) => soma + Number(c.valor), 0);
  const totalAComprar = todas.filter((c) => c.status === "a_pagar").reduce((soma, c) => soma + Number(c.valor), 0);
  const mesAtual = mesISO(hojeISO());
  const totalMes = compras.filter((c) => mesISO(c.data) === mesAtual).reduce((soma, c) => soma + Number(c.valor), 0);

  const agrupar = (chaveDe) => {
    const grupos = {};
    compras.forEach((c) => { const k = chaveDe(c); (grupos[k] ||= []).push(c); });
    return grupos;
  };
  const grupos = aba === "mes" ? agrupar((c) => mesISO(c.data)) : aba === "fornecedor" ? agrupar((c) => nomeFornecedor(c.fornecedor_id)) : agrupar((c) => c.servico_id || "");
  const chaves = Object.keys(grupos).sort((a, b) => (aba === "mes" ? b.localeCompare(a) : a.localeCompare(b)));

  const labelServico = (id) => {
    if (!id) return "Sem serviço vinculado (estoque geral)";
    const s = servicoDe(id);
    return s ? `${s.clientes?.nome || "Cliente"} — ${s.titulo}` : "Serviço não encontrado";
  };
  const tituloGrupo = (chave) => aba === "mes" ? mesLabel(chave) : aba === "fornecedor" ? chave : labelServico(chave);

  const salvar = async () => {
    if (mode === "claude") { notify("No modo Claude, registre pela operação tipada de material.", "error"); return; }
    if (!draft.fornecedorId) { notify("Escolha o fornecedor.", "error"); return; }
    const valor = parseMoedaBR(draft.valor);
    if (!valor || valor <= 0) { notify("Informe um valor válido.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      const descricao = draft.descricao.trim() || `Material — ${nomeFornecedor(draft.fornecedorId)}`;
      const operacao = draft.jaComprei
        ? await processarEventoOperacaoBahia(db, {
            tipo: "material_em_maos", eventoId: "app-nova-compra-" + draft.eventoId,
            dados: { fornecedorId: draft.fornecedorId, servicoId: draft.servicoId || null, valor, data: draft.data || hojeISO(), descricao, pagamentoConfirmado: true, por: "diego" },
          })
        : await processarEventoOperacaoBahia(db, {
            tipo: "material_planejado", eventoId: "app-nova-compra-" + draft.eventoId,
            dados: { fornecedorId: draft.fornecedorId, servicoId: draft.servicoId || null, valor, dataNecessidade: draft.data, descricao, por: "diego" },
          });
      const r = operacao.resultado;
      notify(draft.jaComprei
        ? (r.statusServico === "producao" ? "Material em mãos. Serviço em produção." : "Compra de estoque registrada.")
        : `Na lista de compras, com ação marcada para ${compactDate(r.dataCompra)}.`, "ok");
      setDraft(novoDraft()); setFormOpen(false); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };

  // Marcar como já comprado: vira gasto de verdade (status pago, data de hoje) e é a ÚLTIMA chance de dizer
  // pra qual serviço foi o material — muitas vezes na hora de anotar ele ainda não sabia.
  const marcarComprado = async (item) => {
    if (mode === "claude") { notify("No modo Claude, confirme pela operação tipada material_em_maos.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      const servicoId = (confirmando && confirmando.id === item.id && confirmando.servicoId) || item.servico_id || null;
      const agendaLigada = (appointments || []).find((a) => a.id === item.agenda_id);
      const agendaDedicada = !!agendaLigada && ehCompromissoDeCompra(agendaLigada, [item]);
      const operacao = await processarEventoOperacaoBahia(db, {
        tipo: "material_em_maos", eventoId: "app-material-em-maos-financeiro-" + item.id,
        dados: {
          financeiroId: item.id, fornecedorId: item.fornecedor_id, servicoId, valor: item.valor,
          data: hojeISO(), descricao: item.descricao, agendaId: item.agenda_id || null,
          fecharAgenda: agendaDedicada, pagamentoConfirmado: item.status === "pago" || !materialEstaEmTransito(item), por: "diego",
        },
      });
      const r = operacao.resultado;
      notify(r.materiaisPendentes ? `Material confirmado. Ainda faltam ${r.materiaisPendentes} item(ns).` : (r.statusServico === "producao" ? "Material em mãos. O serviço entrou em produção." : "Material de estoque registrado."), "ok");
      setConfirmando(null); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };
  const marcarMaterialPago = async (item) => {
    if (mode === "claude") { notify("No modo Claude, atualize pela operação tipada financeiro.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "financeiro", eventoId: "app-material-pago-" + item.id,
        dados: { financeiroId: item.id, status: "pago", data: hojeISO() },
      });
      notify("Pagamento do material registrado no caixa.", "ok"); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };

  // Material vira compromisso de dois jeitos, porque tem dia que ele faz a viagem só pra isso e tem dia que
  // aproveita uma ida que já estava marcada. Nos dois casos a compra guarda o agenda_id, então o compromisso
  // mostra o selo do material e a trava de rota passa a enxergar essa parada.
  const agendarCompra = async (item) => {
    if (mode === "claude") { notify("No modo Claude, planeje pela operação tipada material_planejado.", "error"); return; }
    const forn = fornecedores.find((f) => f.id === item.fornecedor_id);
    if (!forn) { notify("Escolha o fornecedor antes de agendar.", "error"); return; }
    const plano = planoDeCompra(forn);
    // Presencial sem cidade quebra a Regra Nº 4 e cega a trava de rota. Em vez de mandar ele cadastrar noutro
    // lugar, pergunta aqui na hora e já guarda no fornecedor — não pergunta de novo nas próximas vezes.
    const cidadeInformada = cidadeDraft && cidadeDraft.id === item.id ? cidadeDraft.valor.trim() : "";
    if (plano.tipo === "presencial" && !forn.cidade && !cidadeInformada) {
      setCidadeDraft({ id: item.id, valor: "" });
      notify(`Em qual cidade fica a ${forn.nome}?`, "info");
      return;
    }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      if (cidadeInformada && !forn.cidade) {
        const { error: cidadeErr } = await db.from("fornecedores").update({ cidade: cidadeInformada }).eq("id", forn.id);
        if (cidadeErr) throw cidadeErr;
        forn.cidade = cidadeInformada;
      }
      const operacao = await processarEventoOperacaoBahia(db, {
        tipo: "material_planejado", eventoId: "app-planejar-financeiro-" + item.id,
        dados: {
          financeiroId: item.id, fornecedorId: item.fornecedor_id, servicoId: item.servico_id || null,
          valor: item.valor, dataNecessidade: item.data, descricao: item.descricao, por: "diego",
        },
      });
      const r = operacao.resultado;
      notify(r.tipoCompromisso === "remoto" ? `Pedido agendado para ${compactDate(r.dataCompra)}.` : `Ida agendada para ${compactDate(r.dataCompra)}.`, "ok");
      setCidadeDraft(null); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };
  const pendurarNaViagem = async (item, agendaId) => {
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      const { error } = await db.from("financeiro").update({ agenda_id: agendaId || null }).eq("id", item.id); if (error) throw error;
      notify(agendaId ? "Marcado no compromisso." : "Desvinculado.", "ok"); setVinculando(null); await onChanged();
    } catch (e) { notify("Erro: " + e.message, "error"); } finally { setBusy(false); }
  };
  const proximos = (appointments || []).filter((a) => a.status === "planejado" && a.data >= hojeISO()).sort((a, b) => (a.data + (a.hora || "")).localeCompare(b.data + (b.hora || "")));

  // Compra sem fornecedor (lançada antes desta aba existir): o Diego atribui o fornecedor ou marca conferida.
  const revisar = compras.filter(compraPrecisaRevisao);
  const resolverRevisao = async (item, fornecedorId) => {
    if (mode === "claude") { notify("No modo Claude, reconcilie pela operação tipada correspondente.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      const patch = fornecedorId ? { fornecedor_id: fornecedorId } : { descricao: COMPRA_CONFERIDA_TAG + (item.descricao || "Material") };
      const { error } = await db.from("financeiro").update(patch).eq("id", item.id); if (error) throw error;
      notify(fornecedorId ? "Fornecedor vinculado." : "Conferida — sai da revisão.", "ok"); await onChanged();
    } catch (e) { notify("Erro: " + e.message, "error"); } finally { setBusy(false); }
  };

  const servicosVinculaveis = services.filter((s) => ["agendado", "producao"].includes(s.status));
  const seletorServico = (valor, onPick) => <select value={valor} onChange={(e) => onPick(e.target.value)}>
    <option value="">Estoque geral — sem serviço</option>
    {servicosVinculaveis.map((s) => <option key={s.id} value={s.id}>{(s.clientes?.nome || "Cliente") + " — " + s.titulo}</option>)}
  </select>;

  return <div className="page-grid">
    <ListaDeCompras services={services} db={db} demo={demo} mode={mode} notify={notify} onChanged={onChanged} />

    {/* O RESTO DA ABA É CONTABILIDADE, e por isso vem depois da lista. Diego, 04/08: "essa aba compras não
        está sendo nada funcional... parece financeiro quando era para ser mais uma lista". Os números
        continuam existindo pra quando ele quiser conferir gasto, mas quem abre a aba está indo comprar. */}
    <details className="compras-historico">
      <summary>Gastos com material — números e histórico</summary>
    <section className="metric-grid finance-metrics">
      <Metric label="Material neste mês" value={money(totalMes)} detail={mesLabel(mesAtual)} tone="red" />
      <Metric label="A comprar" value={money(totalAComprar)} detail={`${aComprar.length} item(ns) na lista`} tone="orange" />
      <Metric label="Total em material" value={money(total)} detail={`${compras.length} compra(s)`} tone="green" />
    </section>

    {revisar.length > 0 && <section className="content-card">
      <div className="card-head"><div><p className="kicker">PRECISA DE REVISÃO</p><h3>{revisar.length} compra(s) sem fornecedor</h3></div></div>
      <p className="ficha-note">Lançamentos antigos, de antes desta aba existir. Diga de qual fornecedor foi — ou marque como conferida se já está certo. Nada é apagado.</p>
      {revisar.map((c) => <div className="finance-row" key={c.id}>
        <div><strong>{descricaoFinanceiraVisivel(c.descricao) || "Material"}</strong><span>{compactDate(c.data)} · {money(c.valor)}</span>
          <div className="fornecedor-chips">{fornecedores.map((f) => <button type="button" key={f.id} disabled={busy || mode === "claude"} onClick={() => resolverRevisao(c, f.id)}>{f.nome}</button>)}</div>
        </div>
        <div className="agenda-acoes"><button className="ghost" disabled={busy || mode === "claude"} onClick={() => resolverRevisao(c, null)}>✓ Conferida</button></div>
      </div>)}
    </section>}

    {emTransito.length > 0 && <section className="content-card">
      <div className="card-head"><div><p className="kicker">MATERIAL EM TRÂNSITO</p><h3>Aguardando chegar</h3></div></div>
      <p className="ficha-note">Pedido feito não é material em mãos. O serviço continua agendado até a chegada ser confirmada.</p>
      {emTransito.map((c) => <div className="finance-row" key={c.id}>
        <div><strong>{descricaoFinanceiraVisivel(c.descricao) || "Material"}</strong><span>{nomeFornecedor(c.fornecedor_id)}{c.servico_id ? ` · ${labelServico(c.servico_id)}` : " · estoque"} · {c.status === "pago" ? "pago" : "pagamento pendente"}</span></div>
        <div className="agenda-acoes"><b className={c.status === "pago" ? "saida" : ""}>{money(c.valor)}</b><button className="ghost" disabled={busy || mode === "claude"} onClick={() => marcarComprado(c)}>Chegou — material comigo</button></div>
      </div>)}
    </section>}

    {emMaosAPagar.length > 0 && <section className="content-card">
      <div className="card-head"><div><p className="kicker">MATERIAL RECEBIDO · PAGAMENTO PENDENTE</p><h3>Não deixar o caixa esquecer</h3></div></div>
      {emMaosAPagar.map((c) => <div className="finance-row" key={c.id}><div><strong>{descricaoFinanceiraVisivel(c.descricao) || "Material"}</strong><span>{nomeFornecedor(c.fornecedor_id)} · material já está em mãos</span></div><div className="agenda-acoes"><b>{money(c.valor)}</b><button className="ghost" disabled={busy || mode === "claude"} onClick={() => marcarMaterialPago(c)}>Marcar pagamento</button></div></div>)}
    </section>}

    {aComprar.length > 0 && <section className="content-card">
      <div className="card-head"><div><p className="kicker">LISTA DE COMPRAS</p><h3>Ainda não comprado</h3></div></div>
      <p className="ficha-note">Enquanto está aqui não conta como gasto nem no Financeiro. Só confirme quando o material estiver realmente com você; pedido pago em trânsito não inicia produção.</p>
      {aComprar.map((c) => <div className="finance-row" key={c.id}>
        <div><strong>{descricaoFinanceiraVisivel(c.descricao) || "Material"}</strong><span>{nomeFornecedor(c.fornecedor_id)}{c.servico_id ? ` · ${labelServico(c.servico_id)}` : " · sem serviço vinculado"}</span>
          {(() => {
            const appt = (appointments || []).find((a) => a.id === c.agenda_id);
            if (appt) return <span>📅 {appt.titulo} · {compactDate(appt.data)}{appt.hora ? " " + appt.hora.slice(0, 5) : ""} <button type="button" className="ficha-link" onClick={() => pendurarNaViagem(c, null)}>desvincular</button></span>;
            return <span>Sem dia marcado — o pedido pode passar batido.</span>;
          })()}
          {confirmando && confirmando.id === c.id && !c.servico_id && <label className="material-edit-block">Foi pra qual serviço?{seletorServico(confirmando.servicoId, (v) => setConfirmando({ ...confirmando, servicoId: v }))}</label>}
          {cidadeDraft && cidadeDraft.id === c.id && <label className="material-edit-block">Em qual cidade fica a {nomeFornecedor(c.fornecedor_id)}?
            <input value={cidadeDraft.valor} autoFocus placeholder="Ex: Luziânia" onChange={(e) => setCidadeDraft({ id: c.id, valor: e.target.value })} onKeyDown={(e) => e.key === "Enter" && agendarCompra(c)} />
          </label>}
          {vinculando === c.id && <label className="material-edit-block">Aproveitar qual viagem?
            <select value="" onChange={(e) => e.target.value && pendurarNaViagem(c, e.target.value)}>
              <option value="">Escolha um compromisso já marcado…</option>
              {proximos.map((a) => <option key={a.id} value={a.id}>{compactDate(a.data)}{a.hora ? " " + a.hora.slice(0, 5) : ""} — {a.cidade || "remoto"} · {a.titulo}</option>)}
            </select>
          </label>}
        </div>
        <div className="agenda-acoes"><b className="saida">{money(c.valor)}</b>
          {!c.agenda_id && !confirmando && <>
            <button className="ghost" disabled={busy || mode === "claude"} onClick={() => agendarCompra(c)}>📅 Agendar ida</button>
            <button className="ghost" disabled={busy || mode === "claude"} onClick={() => setVinculando(vinculando === c.id ? null : c.id)}>🚗 Aproveitar viagem</button>
          </>}
          {confirmando && confirmando.id === c.id
            ? <><button className="primary" disabled={busy} onClick={() => marcarComprado(c)}>Confirmar compra</button><button className="ghost" onClick={() => setConfirmando(null)}>Cancelar</button></>
            : <button className="ghost" disabled={mode === "claude"} onClick={() => setConfirmando({ id: c.id, servicoId: c.servico_id || "" })}>✓ Material está comigo</button>}
        </div>
      </div>)}
    </section>}

    <section className="content-card">
      <div className="card-head"><div><p className="kicker">COMPRAS DE MATERIAL</p><h3>Registrar nova compra</h3></div>
        <button className="ghost" onClick={() => setFormOpen(!formOpen)} disabled={mode === "claude"}>{formOpen ? "Cancelar" : mode === "claude" ? "Só o Diego lança" : "+ Nova compra"}</button></div>
      {formOpen && mode === "diego" && <div className="form-grid">
        <div className="classify">{[[true, "Material está comigo"], [false, "Ainda vou comprar"]].map(([v, label]) => <button key={label} className={draft.jaComprei === v ? "active" : ""} onClick={() => setDraft({ ...draft, jaComprei: v })}>{label}</button>)}</div>
        <label>Fornecedor*
          <div className="fornecedor-chips">{fornecedores.map((f) => <button type="button" key={f.id} className={draft.fornecedorId === f.id ? "active" : ""} onClick={() => setDraft({ ...draft, fornecedorId: f.id })}>{f.nome}</button>)}</div>
        </label>
        <div className="row three">
          <label>Valor R$*<input value={draft.valor} onChange={(e) => setDraft({ ...draft, valor: e.target.value })} placeholder="0,00" /></label>
          <label>{draft.jaComprei ? "Data*" : "Precisa até*"}<input type="date" value={draft.data} onChange={(e) => setDraft({ ...draft, data: e.target.value })} /></label>
          <label>Serviço (opcional){seletorServico(draft.servicoId, (v) => setDraft({ ...draft, servicoId: v }))}</label>
        </div>
        <label>O que comprou<input value={draft.descricao} onChange={(e) => setDraft({ ...draft, descricao: e.target.value })} placeholder="Ex: 4m de linho Klee + espuma D33" /></label>
        <ReviewBox lines={[draft.jaComprei ? "Compra já feita — entra como saída da Empresa" : "Lista de compras — não entra no caixa até você confirmar", draft.fornecedorId ? nomeFornecedor(draft.fornecedorId) : "Sem fornecedor", `${money(parseMoedaBR(draft.valor))} · ${draft.data || "sem data"}`, draft.servicoId ? labelServico(draft.servicoId) : "Estoque geral"]} />
        <button className="primary wide" onClick={salvar} disabled={busy}>{busy ? "Salvando…" : draft.jaComprei ? "Registrar compra" : "Adicionar à lista de compras"}</button>
      </div>}
      {!formOpen && <p className="ficha-note">Compra feita sai como saída da Empresa (categoria Material) — o saldo do Financeiro continua batendo. O que ainda vai comprar fica na lista sem mexer no caixa.</p>}
    </section>

    <div className="funil-filtros">{COMPRAS_ABAS.map((a) => <button key={a.id} className={aba === a.id ? "active" : ""} onClick={() => setAba(a.id)}>{a.label}</button>)}</div>

    <section className="content-card">
      <div className="card-head"><div><p className="kicker">{aba === "servico" ? "MARGEM REAL POR SERVIÇO" : "GASTO AGRUPADO"}</p><h3>{compras.length} compra(s)</h3></div></div>
      {!compras.length && <div className="empty-state"><b>Nenhuma compra de material registrada ainda.</b><span>Compras antigas lançadas soltas no Financeiro aparecem aqui depois de reclassificadas.</span></div>}
      {chaves.map((chave) => {
        const itens = grupos[chave];
        const subtotal = itens.reduce((s, c) => s + Number(c.valor), 0);
        const servico = aba === "servico" && chave ? servicoDe(chave) : null;
        const orcamento = Number(servico?.valor_orcamento || 0);
        return <div key={chave || "sem"} className="vale-fornecedor">
          <div className="vale-fornecedor-head"><strong>{tituloGrupo(chave)}</strong><b>{money(subtotal)}</b></div>
          {servico && orcamento > 0 && <div className="finance-row"><div><strong>Margem real</strong><span>Orçamento {money(orcamento)} − material {money(subtotal)}</span></div><b className={orcamento - subtotal >= 0 ? "entrada" : "saida"}>{money(orcamento - subtotal)}</b></div>}
          {itens.map((c) => <div className="finance-row" key={c.id}>
            <div><strong>{descricaoFinanceiraVisivel(c.descricao) || "Material"}</strong><span>{compactDate(c.data)}{aba !== "fornecedor" ? ` · ${nomeFornecedor(c.fornecedor_id)}` : ""}{aba !== "servico" && c.servico_id ? ` · ${labelServico(c.servico_id)}` : ""}</span></div>
            <b className="saida">− {money(c.valor)}</b>
          </div>)}
        </div>;
      })}
    </section>
    </details>
  </div>;
}

// LISTA DE COMPRAS. Diego, 04/08: "olha o tanto de coisa para comprar, era para ter uma lista de compras na
// aba Compras... já sabe o que é de cada cliente, não tem uma lista fácil de visualização para eu chegar e
// comprar... ficou muito complicado quando era para ter algo mais simples, parece financeiro quando era para
// ser mais uma lista, com check de cada item".
// Ele está certo e a razão é simples: quem abre essa aba está indo à loja, não fazendo contabilidade. O que
// serve nesse momento é papel de supermercado — o que falta, de quem é, e um quadradinho pra marcar.
// Os itens moram em servicos.materiais_necessarios (jsonb: [{item, comprado}]) porque a informação já nascia
// junto com o serviço — o que muda é ela virar lista marcável em vez de texto solto na descrição.
// O APP APRENDE ONDE CADA MATERIAL É COMPRADO. Diego, 04/08: "quando lançar o cliente eu vou ter que dizer em
// qual loja vou comprar? ainda também não temos os materiais totalmente registrados em cada um". Não deve
// precisar: suede ele compra no Ozair, tecido na Ellis — isso se repete serviço após serviço. Em vez de
// pedir a loja toda vez, o app olha onde um material com nome parecido JÁ foi comprado e preenche sozinho.
// A sugestão aparece marcada com "?" e nunca se disfarça de fato confirmado: palpite exibido como certeza é
// pior que campo vazio, porque manda ele pra loja errada com confiança. Ao marcar comprado, vira confirmada.
function lojaAprendida(nomeItem, services) {
  const norm = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const palavras = norm(nomeItem).split(/[^a-z0-9]+/).filter((p) => p.length > 3);
  if (!palavras.length) return null;
  const placar = {};
  (services || []).forEach((s) => (s.materiais_necessarios || []).forEach((m) => {
    const loja = (m.loja || "").trim();
    if (!loja || m.lojaSugerida) return; // só aprende de loja confirmada, senão o palpite se auto-alimenta
    const alvo = norm(m.item);
    if (palavras.some((p) => alvo.includes(p))) placar[loja] = (placar[loja] || 0) + 1;
  }));
  const melhor = Object.entries(placar).sort((a, b) => b[1] - a[1])[0];
  return melhor ? melhor[0] : null;
}
function ListaDeCompras({ services, db, demo, mode, notify, onChanged }) {
  const [busy, setBusy] = useState(null);
  const [novoItem, setNovoItem] = useState({});
  const [editandoLoja, setEditandoLoja] = useState(null);
  const [lojaDraft, setLojaDraft] = useState("");
  const [editandoItem, setEditandoItem] = useState(null);
  const [itemDraft, setItemDraft] = useState("");
  // VISÃO POR LOJA. Diego, 04/08: "os fornecedores lá ser clicáveis, quando clicar ele me levar a lista
  // daquele fornecedor... e outra opção de copiar, sem check mas organizada, para eu mandar para o WhatsApp
  // do fornecedor o pedido certinho, e um botão marcar todos caso eu mande o pedido".
  // São dois modos de comprar, e cada um pede uma tela: na loja ele confere item a item com o dedo; no
  // WhatsApp ele manda o pedido inteiro de uma vez e marca tudo junto. A lista por cliente continua sendo a
  // visão principal, porque é ela que amarra o material ao serviço.
  const [lojaAberta, setLojaAberta] = useState(null);
  const [copiado, setCopiado] = useState(false);
  // ARQUIVADO = o cliente já saiu da lista. Diego, 04/08: "quando comprar tudo tem que sumir o cliente da aba
  // compras, com um botão confirmar e ele sumir". Sumir sozinho ao marcar o último item seria pior: ele
  // perderia a conferência final e o card evaporaria embaixo do dedo. O botão é o momento de dizer "conferi,
  // pode tirar". Os itens não são apagados (Regra Nº 7) — ficam marcados, só saem da vista.
  // Se o tapeceiro pedir algo depois, o item novo entra sem arquivo e o cliente reaparece na lista sozinho.
  const visiveisDe = (s) => (s.materiais_necessarios || []).filter((m) => !m.arquivado);
  const ativos = (services || []).filter((s) => ["agendado", "producao"].includes(s.status) && visiveisDe(s).length);
  const ordenados = [...ativos].sort((a, b) => String(a.prazo || "9999").localeCompare(String(b.prazo || "9999")));
  const totalItens = ativos.reduce((n, s) => n + visiveisDe(s).length, 0);
  const faltam = ativos.reduce((n, s) => n + visiveisDe(s).filter((m) => !m.comprado).length, 0);
  // Quantos itens pendentes rendem cada loja — o que decide se a viagem vale a pena.
  const porLoja = {};
  ativos.forEach((s) => visiveisDe(s).filter((m) => !m.comprado).forEach((m) => { const L = (m.loja || s.loja_material || "").trim() || "Loja a definir"; porLoja[L] = (porLoja[L] || 0) + 1; }));
  // MARCAR AQUI TEM QUE VALER NO RESTO DO APP. Diego, 04/08: "quando confirmo na aba compras, ela já confirma
  // automaticamente em Capacidade, ou tenho que marcar lá também?". O alerta "Esperando material" já sumia
  // sozinho (lê esta mesma lista), mas a PRÓXIMA AÇÃO do serviço continuava escrita "Comprar o material" no
  // Painel e na ficha — ele compraria tudo e o app seguiria mandando comprar. Meia-ligação é pior que
  // nenhuma: obriga ele a lembrar de atualizar em dois lugares, que é justamente o trabalho que o app deveria
  // tirar. Marcar aqui é o único lugar onde ele toca.
  const gravar = async (servico, novaLista) => {
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(servico.id);
    try {
      const patch = { materiais_necessarios: novaLista, atualizado_em: new Date().toISOString() };
      const pendentes = novaLista.filter((m) => !m.comprado).length;
      const acaoAtual = (servico.proxima_acao || "").toLowerCase();
      // Voltou a faltar material: isso passa na frente de qualquer outra ação. Zerou: só troca se a ação que
      // estava lá era sobre material — pra não apagar uma instrução específica que o Diego tenha escrito.
      if (pendentes) patch.proxima_acao = "Comprar o material";
      else if (!acaoAtual || /material/.test(acaoAtual)) patch.proxima_acao = "Produzir e acompanhar o prazo";
      const { error } = await db.from("servicos").update(patch).eq("id", servico.id);
      if (error) throw error;
      await onChanged?.();
    } catch (e) { notify("Não salvou: " + e.message, "error"); } finally { setBusy(null); }
  };
  // Comprar CONFIRMA a loja: ele foi lá e pegou, então aquele palpite virou fato e pode ensinar os próximos.
  const alternar = (servico, idx) => {
    const lista = (servico.materiais_necessarios || []).map((m, i) => {
      if (i !== idx) return m;
      const comprado = !m.comprado;
      return comprado && m.loja ? { ...m, comprado, lojaSugerida: false } : { ...m, comprado };
    });
    gravar(servico, lista);
  };
  const adicionar = (servico) => {
    const texto = (novoItem[servico.id] || "").trim();
    if (!texto) return;
    setNovoItem((n) => ({ ...n, [servico.id]: "" }));
    const palpite = lojaAprendida(texto, services);
    const novo = palpite ? { item: texto, comprado: false, loja: palpite, lojaSugerida: true } : { item: texto, comprado: false };
    gravar(servico, [...(servico.materiais_necessarios || []), novo]);
  };
  const salvarLoja = (servico, idx) => {
    const nome = lojaDraft.trim();
    setEditandoLoja(null);
    gravar(servico, (servico.materiais_necessarios || []).map((m, i) => i === idx ? { ...m, loja: nome, lojaSugerida: false } : m));
  };
  // Corrigir o texto do item. Diego, 04/08: "eu quero poder corrigir os itens anotados em compras". O nome
  // sai da ficha ou de mim lendo a ficha — vai ter abreviação, medida errada, tecido trocado. Sem editar,
  // o conserto seria apagar e digitar de novo, perdendo a loja já confirmada e o histórico do item.
  const salvarItem = (servico, idx) => {
    const texto = itemDraft.trim();
    setEditandoItem(null);
    if (!texto) return; // vazio não apaga: pra remover existe o ✕, que é explícito
    gravar(servico, (servico.materiais_necessarios || []).map((m, i) => i === idx ? { ...m, item: texto } : m));
  };
  // Itens pendentes de uma loja, de TODOS os clientes — é assim que a compra acontece de verdade.
  const lojaDoItem = (m, s) => ((m.loja || s.loja_material || "").trim() || "Loja a definir");
  const itensDaLoja = (loja) => ativos.flatMap((s) => visiveisDe(s)
    .map((m, vi) => ({ m, s, idx: (s.materiais_necessarios || []).indexOf(m) }))
    .filter((x) => !x.m.comprado && lojaDoItem(x.m, x.s) === loja));
  // Pedido pra colar no WhatsApp do fornecedor. Sem checkbox, sem nome de cliente solto: o fornecedor precisa
  // saber O QUE separar, não pra quem é. O cliente entra só como referência curta, pra ele conferir depois.
  const textoDoPedido = (loja) => {
    const itens = itensDaLoja(loja);
    const linhas = itens.map((x) => `• ${x.m.item} (${(x.s.clientes?.nome || "").split(" ")[0]})`);
    return `Olá! Preciso separar o seguinte material:\n\n${linhas.join("\n")}\n\nObrigado!`;
  };
  const copiarPedido = async (loja) => {
    try {
      await navigator.clipboard.writeText(textoDoPedido(loja));
      setCopiado(true); setTimeout(() => setCopiado(false), 2500);
      notify("Pedido copiado — cole no WhatsApp do fornecedor.", "ok");
    } catch (e) { notify("Não consegui copiar. Segure no texto pra copiar à mão.", "error"); }
  };
  // Marcar tudo de uma loja: um serviço por vez, porque cada um é uma linha no banco.
  const marcarTodosDaLoja = async (loja) => {
    const itens = itensDaLoja(loja);
    const porServico = {};
    itens.forEach((x) => { (porServico[x.s.id] ||= { s: x.s, idxs: [] }).idxs.push(x.idx); });
    for (const { s, idxs } of Object.values(porServico)) {
      const lista = (s.materiais_necessarios || []).map((m, i) => idxs.includes(i) ? { ...m, comprado: true, lojaSugerida: false } : m);
      await gravar(s, lista);
    }
    notify(`${itens.length} item(ns) da ${loja} marcados como resolvidos.`, "ok");
  };
  const remover = (servico, idx) => gravar(servico, (servico.materiais_necessarios || []).filter((_, i) => i !== idx));
  // Confirmar não apaga: arquiva. O que foi comprado continua registrado na ficha do serviço.
  const confirmar = (servico) => gravar(servico, (servico.materiais_necessarios || []).map((m) => m.arquivado ? m : { ...m, comprado: true, arquivado: true }));
  if (!ordenados.length) return <section className="content-card"><div className="card-head"><div><p className="kicker">LISTA DE COMPRAS</p><h3>Nada pra comprar</h3></div></div>
    <div className="empty-state"><b>Nenhum serviço ativo tem material anotado.</b><span>Peça pro Claude anotar o que falta em cada cliente, ou adicione na ficha do serviço.</span></div></section>;
  return <section className="content-card">
    <div className="card-head"><div><p className="kicker">LISTA DE COMPRAS</p><h3>{faltam} item(ns) pra comprar</h3></div>
      {totalItens > faltam && <span className="status-pill">{totalItens - faltam} já comprado(s)</span>}</div>
    {/* QUEM COMPRA PENSA POR LOJA, NÃO POR CLIENTE. Diego, 04/08, sobre o Leandro: "suede amassado grafite e
        espuma D33 no Ozair" e "espuma do encosto é na Ellis Tecidos" — o material de UM cliente vem de lojas
        diferentes, e numa ida à Ellis ele quer pegar o que é da Ellis de todo mundo de uma vez. A lista
        continua por cliente (é assim que ele confere o serviço), mas esta faixa diz onde ir e o que rende
        cada parada. Sem ela, planejar a viagem exigiria ler a lista inteira e montar isso de cabeça. */}
    {!!Object.keys(porLoja).length && <div className="compra-lojas">
      {Object.entries(porLoja).sort((a, b) => b[1] - a[1]).map(([loja, qtd]) => <button type="button" key={loja} className={`compra-loja-chip${lojaAberta === loja ? " active" : ""}`} onClick={() => setLojaAberta(lojaAberta === loja ? null : loja)}>{loja} · {qtd}</button>)}
    </div>}
    {lojaAberta && (() => { const itens = itensDaLoja(lojaAberta); return <div className="compra-loja-painel">
      <div className="compra-loja-head">
        <strong>{lojaAberta}</strong>
        <button type="button" className="ghost" onClick={() => setLojaAberta(null)}>✕ fechar</button>
      </div>
      {!itens.length ? <p className="ficha-note">Nada pendente nesta loja.</p> : <>
        {itens.map((x, n) => <label className="compra-item" key={n}>
          <input type="checkbox" checked={false} disabled={busy === x.s.id || mode === "claude"} onChange={() => alternar(x.s, x.idx)} />
          <span>{x.m.item}<em className="compra-item-loja">{x.s.clientes?.nome || "cliente"}{x.s.prazo ? " · entrega " + compactDate(x.s.prazo) : ""}</em></span>
        </label>)}
        <div className="compra-loja-acoes">
          <button type="button" className="primary" onClick={() => copiarPedido(lojaAberta)}>{copiado ? "✓ copiado" : "📋 Copiar pedido pro WhatsApp"}</button>
          <button type="button" className="ghost" disabled={!!busy} onClick={() => marcarTodosDaLoja(lojaAberta)}>Marcar todos ({itens.length})</button>
        </div>
        <p className="ficha-note">Na loja, vá marcando um a um. Se mandar o pedido pelo WhatsApp, copie e use “Marcar todos” — some daqui e da lista de cada cliente.</p>
      </>}
    </div>; })()}
    {ordenados.map((s) => {
      // Guarda o índice REAL junto do item: a tela mostra só os não arquivados, mas alternar/remover precisam
      // apontar pra posição verdadeira no array salvo.
      const itens = (s.materiais_necessarios || []).map((m, i) => ({ m, i })).filter((x) => !x.m.arquivado);
      const pendentes = itens.filter((x) => !x.m.comprado).length;
      const tudoComprado = !pendentes && itens.length > 0;
      return <div className={`compra-cliente${tudoComprado ? " tudo-comprado" : ""}`} key={s.id}>
        <div className="compra-cliente-head">
          <strong>{s.clientes?.nome || "Cliente"}</strong>
          <span>{pendentes ? `faltam ${pendentes}` : "tudo comprado ✓"}{s.prazo ? ` · entrega ${compactDate(s.prazo)}` : ""}{s.loja_material ? ` · ${s.loja_material}` : ""}</span>
        </div>
        {itens.map(({ m, i }) => <label className={`compra-item${m.comprado ? " feito" : ""}`} key={i}>
          <input type="checkbox" checked={!!m.comprado} disabled={busy === s.id || mode === "claude"} onChange={() => alternar(s, i)} />
          <span>
            {editandoItem === `${s.id}:${i}`
              ? <input className="compra-item-input" value={itemDraft} autoFocus
                  onClick={(e) => e.preventDefault()} onChange={(e) => setItemDraft(e.target.value)}
                  onBlur={() => salvarItem(s, i)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); salvarItem(s, i); } if (e.key === "Escape") setEditandoItem(null); }} />
              : <b className="compra-item-nome" onClick={(e) => { e.preventDefault(); setItemDraft(m.item || ""); setEditandoItem(`${s.id}:${i}`); }}>{m.item}</b>}
            {editandoLoja === `${s.id}:${i}`
              ? <input className="compra-loja-input" value={lojaDraft} autoFocus list="lojas-conhecidas"
                  onClick={(e) => e.preventDefault()} onChange={(e) => setLojaDraft(e.target.value)}
                  onBlur={() => salvarLoja(s, i)} onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); salvarLoja(s, i); } }} placeholder="Onde comprar?" />
              : <em className={`compra-item-loja${m.lojaSugerida ? " palpite" : ""}`}
                  onClick={(e) => { e.preventDefault(); setLojaDraft(m.loja || ""); setEditandoLoja(`${s.id}:${i}`); }}>
                  {(m.loja || "").trim() ? m.loja + (m.lojaSugerida ? " ?" : "") : "+ onde comprar"}
                </em>}
          </span>
          <button type="button" className="compra-remover" title="Tirar da lista" disabled={busy === s.id} onClick={(e) => { e.preventDefault(); remover(s, i); }}>✕</button>
        </label>)}
        {/* O tapeceiro pede material a mais no meio do serviço — tem que dar pra somar na hora, sem sair da tela. */}
        <div className="compra-add">
          <input value={novoItem[s.id] || ""} onChange={(e) => setNovoItem((n) => ({ ...n, [s.id]: e.target.value }))}
            onKeyDown={(e) => { if (e.key === "Enter") adicionar(s); }} placeholder="O que mais falta?" disabled={busy === s.id} />
          <button type="button" className="ghost" disabled={busy === s.id || !(novoItem[s.id] || "").trim()} onClick={() => adicionar(s)}>+ Adicionar</button>
        </div>
        {tudoComprado && <button type="button" className="primary wide" disabled={busy === s.id} onClick={() => confirmar(s)}>
          {busy === s.id ? "..." : `✓ Confirmar — comprei tudo do ${(s.clientes?.nome || "cliente").split(" ")[0]}`}
        </button>}
      </div>;
    })}
    <datalist id="lojas-conhecidas">{[...new Set((services || []).flatMap((s) => (s.materiais_necessarios || []).map((m) => m.loja)).filter(Boolean))].map((l) => <option key={l} value={l} />)}</datalist>
    <p className="ficha-note">Toque na loja pra trocar. “{"Ozair ?"}” é palpite meu, pelo lugar onde material parecido já foi comprado — marcar como comprado confirma. Marcar o item é só a sua lista: o gasto continua entrando pela compra normal, com fornecedor e valor. Ao confirmar, o cliente sai daqui; se o tapeceiro pedir mais alguma coisa, é só adicionar que ele volta.</p>
  </section>;
}

// SAÍDAS FUTURAS: conta que já está comprometida mas ainda não saiu do caixa (parcela de cartão, aluguel).
// Fica com status "a_pagar", então o saldo do Financeiro NÃO se mexe até ser paga de verdade aqui.
// Vale tem aba própria e material a comprar aparece em Compras — por isso saem desta lista.
function ehSaidaFutura(item) { return item.tipo === "saida" && item.status === "a_pagar" && item.categoria !== "Vale" && item.categoria !== CATEGORIA_MATERIAL; }
function somaDiaMes(dataISO, meses) {
  const [a, m, d] = dataISO.split("-").map(Number);
  const base = new Date(a, m - 1 + meses, 1);
  const ultimo = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  return `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, "0")}-${String(Math.min(d, ultimo)).padStart(2, "0")}`;
}

// A RECEBER TEM LUGAR PRÓPRIO, MAS NÃO ABA PRÓPRIA (29/07/2026). Diego pediu "outro card que leve a eles,
// tire de lá onde está" — e ao perguntar se precisava de aba nova, a resposta foi não: seria a 11ª aba do
// menu pra duas linhas de conteúdo. Os cards do topo do Financeiro é que são a navegação: clicar em
// "A receber" troca a lista de baixo por este bloco. Antes esse dinheiro vivia misturado nos lançamentos
// realizados com "+ R$ 1.000" verde igual a entrada paga — dava pra achar que já tinha entrado (Oziane).
// O botão "Recebi" é o momento em que vira caixa, pela mesma operação tipada da conta paga.
function ehEntradaFutura(f) { return f.tipo === "entrada" && f.status === "a_receber"; }
function AReceberBloco({ finances, services, db, demo, mode, notify, onChanged }) {
  const [busy, setBusy] = useState(null);
  const hoje = hojeISO();
  const contas = finances.filter(ehEntradaFutura).slice().sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  // Diego, 29/07: "tem mais para receber que não está lá". O card só mostrava quem tem linha a_receber
  // gravada — serviço entregue com valor cheio e nenhuma entrada lançada é dinheiro a receber igual, e ficava
  // invisível justo no lugar onde ele vai olhar pra saber quanto tem pra entrar. Entra aqui, mas separado:
  // não é linha de financeiro, é saldo que ninguém lançou ainda — por isso não tem "Recebi" direto.
  const { prontosSemCobranca } = resumoContas(finances, services, hoje);
  const semLancar = (prontosSemCobranca || []).slice().sort((a, b) => (a.prazo || "").localeCompare(b.prazo || ""));
  // DINHEIRO ÓRFÃO: entrada de serviço que ninguém amarrou a um serviço. A trava nova (ver
  // registrarFinanceiroDaOperacao) impede que apareçam novos, mas os antigos já estavam no banco e é
  // justamente por serem invisíveis que a entrada da Ana Cristina e a da Madalena ficaram 13 dias sem virar
  // saldo a receber. Aparecem aqui porque é o lugar onde a conta não fecha.
  const orfaos = (finances || []).filter((f) => f.tipo === "entrada" && f.status === "pago" && !f.servico_id && ehCategoriaServico(f.categoria));
  const nomeDe = (f) => {
    const svc = (services || []).find((s) => s.id === f.servico_id);
    return svc?.clientes?.nome || descricaoFinanceiraVisivel(f.descricao) || f.categoria || "Serviço";
  };
  const receber = async (item) => {
    if (mode === "claude") { notify("No modo Claude, receba pela operação tipada financeiro com o id existente.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(item.id);
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "financeiro", eventoId: "app-saldo-recebido-" + item.id,
        dados: { financeiroId: item.id, status: "pago", data: hojeISO() },
      });
      notify(`Recebido — ${money(item.valor)} entrou no caixa.`, "ok"); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(null); }
  };
  return <section className="content-card"><div className="card-head"><div><p className="kicker">DINHEIRO COMBINADO, AINDA FORA DO CAIXA</p><h3>Saldos a receber</h3></div></div>
    {!contas.length && !semLancar.length && <div className="empty-state"><b>Nenhum saldo a receber.</b><span>Todo serviço fechado já está pago.</span></div>}
    {contas.map((item) => { const atrasado = (item.data || "") < hoje; return <div className="finance-row" key={item.id}>
      <div><strong>{nomeDe(item)}</strong><span>{atrasado ? `venceu ${compactDate(item.data)} — cobrar` : `previsto ${compactDate(item.data)}`}{item.servico_id ? "" : " · sem serviço vinculado"}</span></div>
      <b className="entrada">+ {money(item.valor)}</b>
      <button className="ghost" disabled={busy === item.id} onClick={() => receber(item)}>Recebi</button>
    </div>; })}
    {!!contas.length && <p className="ficha-note">Nada aqui entra no saldo do Financeiro. Só entra quando você tocar em “Recebi”.</p>}
    {!!semLancar.length && <div style={{ marginTop: contas.length ? 18 : 0, paddingTop: 14, borderTop: "1px dashed var(--line)" }}>
      <p className="kicker">AINDA SEM LANÇAMENTO NENHUM — {money(semLancar.reduce((s, x) => s + Number(x.valor_orcamento || 0), 0))}</p>
      {semLancar.map((s) => <div className="finance-row" key={s.id}>
        <div><strong>{s.clientes?.nome || s.titulo}</strong><span>{s.status === "entregue" ? "entregue" : "em produção"}{s.prazo ? ` · prazo ${compactDate(s.prazo)}` : ""} · valor combinado, nenhuma entrada no financeiro</span></div>
        <b className="entrada">+ {money(s.valor_orcamento)}</b>
        <span className="status-pill">falta lançar</span>
      </div>)}
      <p className="ficha-note">Esses não têm linha no financeiro ainda, então não dá pra tocar em “Recebi”: primeiro lança a entrada do serviço (ou o saldo), depois recebe.</p>
    </div>}
    {!!orfaos.length && <div style={{ marginTop: 18, paddingTop: 14, borderTop: "1px dashed var(--line)" }}>
      <p className="kicker">⚠ ENTRADA SEM SERVIÇO — {money(orfaos.reduce((s, f) => s + Number(f.valor || 0), 0))}</p>
      {orfaos.map((f) => <div className="finance-row" key={f.id}>
        <div><strong>{descricaoFinanceiraVisivel(f.descricao) || f.categoria}</strong><span>recebido {compactDate(f.data)} · está no caixa, mas não sabe de qual serviço</span></div>
        <b className="entrada">+ {money(f.valor)}</b>
      </div>)}
      <p className="ficha-note">Esse dinheiro entrou, mas o serviço dele parece não ter recebido nada — por isso o saldo a receber não foi criado. Peça pro Claude amarrar cada um ao serviço certo.</p>
    </div>}
  </section>;
}

function FuturoView({ finances, db, demo, mode, notify, onChanged }) {
  const [formOpen, setFormOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const novoDraft = () => ({ descricao: "", valor: "", parcelas: "1", primeiroVenc: somaDiaMes(hojeISO(), 1), escopo: "empresa", categoria: "Conta fixa", eventoId: novoIdLocal() });
  const [draft, setDraft] = useState(() => novoDraft());
  const [verTudo, setVerTudo] = useState(false);
  const [escopoAba, setEscopoAba] = useState("todos"); // Diego: dinheiro pessoal (aluguel) separado do da empresa (cartão)

  const todasContas = finances.filter(ehSaidaFutura);
  const contas = todasContas.filter((c) => escopoAba === "todos" || (c.escopo || "empresa") === escopoAba).slice().sort((a, b) => (a.data || "").localeCompare(b.data || ""));
  const hoje = hojeISO();
  const atrasadas = contas.filter((c) => (c.data || "") < hoje);
  const mesAtual = mesISO(hoje);
  const doMes = contas.filter((c) => mesISO(c.data) === mesAtual);

  // Um parcelamento longo (aluguel de 12 meses) enchia a tela de meses que não mudam decisão nenhuma hoje.
  // Por padrão mostra só o horizonte de decisão - vencidas e os próximos 60 dias - e resume o resto numa linha.
  const horizonte = somaDiaMes(hoje, 2);
  const noHorizonte = contas.filter((c) => (c.data || "") <= horizonte);
  const depois = contas.filter((c) => (c.data || "") > horizonte);
  const visiveis = verTudo ? contas : noHorizonte;
  const porMes = {};
  visiveis.forEach((c) => { (porMes[mesISO(c.data)] ||= []).push(c); });
  const meses = Object.keys(porMes).sort();

  const pagar = async (item) => {
    if (mode === "claude") { notify("No modo Claude, pague pela operação tipada financeiro com o id existente.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "financeiro", eventoId: "app-conta-paga-" + item.id,
        dados: { financeiroId: item.id, status: "pago", data: hojeISO() },
      });
      notify("Pago — agora entra no caixa.", "ok"); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };

  const salvar = async () => {
    if (mode === "claude") { notify("No modo Claude, registre pela operação tipada financeiro.", "error"); return; }
    const total = parseMoedaBR(draft.valor);
    const n = Math.max(1, parseInt(draft.parcelas, 10) || 1);
    if (!draft.descricao.trim()) { notify("Descreva a conta.", "error"); return; }
    if (!total || total <= 0) { notify("Informe um valor válido.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(true);
    try {
      // Parcela vira um lançamento por vencimento: é o que faz o mês seguinte já mostrar o que vai pesar.
      const valorParcela = Math.round((total / n) * 100) / 100;
      const linhas = Array.from({ length: n }, (_, i) => ({
        tipo: "saida", escopo: draft.escopo, categoria: draft.categoria, status: "a_pagar",
        valor: valorParcela, data: somaDiaMes(draft.primeiroVenc, i),
        descricao: n > 1 ? `${draft.descricao.trim()} (${i + 1}/${n})` : draft.descricao.trim(),
      }));
      for (let i = 0; i < linhas.length; i++) {
        await processarEventoOperacaoBahia(db, { tipo: "financeiro", eventoId: "app-conta-" + draft.eventoId + "-parcela-" + (i + 1), dados: linhas[i] });
      }
      notify(n > 1 ? `${n} parcelas agendadas sem duplicar.` : "Conta agendada.", "ok"); setDraft(novoDraft()); setFormOpen(false); await onChanged();
    } catch (e) { notify("A operação ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };

  const EF_ABAS = [{ id: "todos", label: "Todos" }, { id: "empresa", label: "Empresa" }, { id: "pessoal", label: "Pessoal" }];
  return <div className="page-grid">
    <div className="funil-filtros">{EF_ABAS.map((a) => <button key={a.id} className={escopoAba === a.id ? "active" : ""} onClick={() => setEscopoAba(a.id)}>{a.label}</button>)}</div>
    <section className="metric-grid finance-metrics">
      <Metric label="Vence neste mês" value={money(doMes.reduce((s, c) => s + Number(c.valor), 0))} detail={`${doMes.length} conta(s)`} tone="orange" />
      <Metric label="Atrasadas" value={money(atrasadas.reduce((s, c) => s + Number(c.valor), 0))} detail={atrasadas.length ? `${atrasadas.length} vencida(s)` : "Nada vencido"} tone="red" />
      <Metric label="Próximos 60 dias" value={money(noHorizonte.reduce((s, c) => s + Number(c.valor), 0))} detail={`De ${contas.length} conta(s) no total`} tone="green" />
    </section>

    <section className="content-card">
      <div className="card-head"><div><p className="kicker">SAÍDAS FUTURAS</p><h3>Agendar conta ou parcelamento</h3></div>
        <button className="ghost" onClick={() => setFormOpen(!formOpen)} disabled={mode === "claude"}>{formOpen ? "Cancelar" : mode === "claude" ? "Só o Diego lança" : "+ Nova conta"}</button></div>
      {formOpen && mode === "diego" && <div className="form-grid">
        <label>O que é*<input value={draft.descricao} onChange={(e) => setDraft({ ...draft, descricao: e.target.value })} placeholder="Ex: Aluguel · Cartão da mãe · Parcela da carretinha" /></label>
        <div className="row three">
          <label>Valor total R$*<input value={draft.valor} onChange={(e) => setDraft({ ...draft, valor: e.target.value })} placeholder="0,00" /></label>
          <label>Parcelas<input type="number" min="1" value={draft.parcelas} onChange={(e) => setDraft({ ...draft, parcelas: e.target.value })} /></label>
          <label>1º vencimento*<input type="date" value={draft.primeiroVenc} onChange={(e) => setDraft({ ...draft, primeiroVenc: e.target.value })} /></label>
        </div>
        <div className="row three">
          <label>Aba<select value={draft.escopo} onChange={(e) => setDraft({ ...draft, escopo: e.target.value })}><option value="empresa">Empresa</option><option value="pessoal">Pessoal</option></select></label>
          <label>Categoria<select value={draft.categoria} onChange={(e) => setDraft({ ...draft, categoria: e.target.value })}>{["Conta fixa", "Aluguel", "Cartão", "Dívida", "Imposto", "Outros"].map((c) => <option key={c} value={c}>{c}</option>)}</select></label>
        </div>
        <ReviewBox lines={["Não mexe no caixa até você marcar como pago", `${draft.parcelas}x de ${money(parseMoedaBR(draft.valor) / Math.max(1, parseInt(draft.parcelas, 10) || 1))}`, `1º vencimento ${compactDate(draft.primeiroVenc)} · ${draft.escopo}`]} />
        <button className="primary wide" onClick={salvar} disabled={busy}>{busy ? "Salvando…" : "Agendar"}</button>
      </div>}
      {!formOpen && <p className="ficha-note">Tudo aqui está comprometido mas ainda não saiu — o saldo do Financeiro só muda quando você marca como pago.</p>}
    </section>

    <section className="content-card">
      <div className="card-head"><div><p className="kicker">POR VENCIMENTO</p><h3>{verTudo ? `${contas.length} conta(s) a pagar` : `${noHorizonte.length} conta(s) até ${compactDate(horizonte)}`}</h3></div></div>
      {!contas.length && <div className="empty-state"><b>Nenhuma saída futura agendada.</b><span>Parcela de cartão, aluguel e conta fixa entram aqui e aparecem no mês em que vão pesar.</span></div>}
      {!!contas.length && !noHorizonte.length && !verTudo && <div className="empty-state"><b>Nada vence nos próximos 60 dias.</b></div>}
      {meses.map((m) => <div key={m} className="vale-fornecedor">
        <div className="vale-fornecedor-head"><strong>{mesLabel(m)}</strong><b>{money(porMes[m].reduce((s, c) => s + Number(c.valor), 0))}</b></div>
        {porMes[m].map((c) => <div className="finance-row" key={c.id}>
          <div><strong>{c.descricao || c.categoria}</strong><span>Vence {compactDate(c.data)} · {c.escopo === "pessoal" ? "Pessoal" : "Empresa"} · {c.categoria}{(c.data || "") < hoje ? " · ATRASADA" : ""}</span></div>
          <div className="agenda-acoes"><b className="saida">{money(c.valor)}</b><button className="ghost" disabled={busy || mode === "claude"} onClick={() => pagar(c)}>Marcar pago</button></div>
        </div>)}
      </div>)}
      {depois.length > 0 && <p className="ficha-note">{verTudo
        ? <>Mostrando tudo, inclusive o que vence depois de {compactDate(horizonte)}. <button type="button" className="ficha-link" onClick={() => setVerTudo(false)}>voltar pros próximos 60 dias</button></>
        : <>Mais {money(depois.reduce((s, c) => s + Number(c.valor), 0))} em {depois.length} conta(s) depois de {compactDate(horizonte)} — parcelas já agendadas, nada pra decidir agora. <button type="button" className="ficha-link" onClick={() => setVerTudo(true)}>ver tudo</button></>}</p>}
    </section>
  </div>;
}

const DIA_LABEL = { domingo: "domingo", segunda: "segunda", terca: "terça", quarta: "quarta", quinta: "quinta", sexta: "sexta", sabado: "sábado" };
function FornecedoresView({ fornecedores }) {
  return <section className="content-card full"><div className="card-head"><div><p className="kicker">FORNECEDORES</p><h3>{fornecedores.length} cadastrado(s)</h3></div></div>
    <div className="customer-list">{fornecedores.map((f) => <article key={f.id}>
      <div className="customer-avatar">{f.nome.slice(0, 2).toUpperCase()}</div>
      <div>
        <strong>{f.nome}</strong>
        <span>{f.contato_nome ? f.contato_nome + " · " : ""}{f.telefone || "Sem telefone"}</span>
        {f.produtos && <span>{f.produtos}</span>}
        {f.dias_entrega && <span>Entrega {f.dias_entrega.split(",").map((d) => DIA_LABEL[d.trim()] || d.trim()).join(" e ")}</span>}
        {f.observacao && <span>{f.observacao}</span>}
      </div>
      {f.telefone && <a className="ghost" href={`https://wa.me/55${normalizePhone(f.telefone)}`} target="_blank" rel="noreferrer">WhatsApp</a>}
    </article>)}
    {!fornecedores.length && <div className="empty-state"><b>Nenhum fornecedor cadastrado.</b></div>}</div>
  </section>;
}
function CustomersView({ customers, services, search, setSearch, onOpenFicha }) {
  const visible = customers.filter((customer) => `${customer.nome} ${customer.telefone} ${customer.cidade}`.toLowerCase().includes(search.toLowerCase()));
  return <section className="content-card full"><div className="card-head"><div><p className="kicker">BASE ÚNICA</p><h3>{visible.length} clientes</h3></div><input className="search" value={search} onChange={(event) => setSearch(event.target.value)} placeholder="Nome, telefone ou cidade" /></div><div className="customer-list">{visible.map((customer) => <article className="clickable" key={customer.id} onClick={() => onOpenFicha(customer.id)}><div className="customer-avatar">{customer.nome.slice(0, 2).toUpperCase()}</div><div><strong>{customer.nome}</strong><span>{customer.telefone || "Sem telefone"} · {customer.cidade || "Sem cidade"}</span></div><b>{services.filter((service) => service.cliente_id === customer.id && STATUS_VIVOS.includes(service.status)).length} ativo(s)</b></article>)}</div></section>;
}

function FichaModal({ db, demo, notify, clienteId, fornecedores, onClose, onChanged }) {
  const [cliente, setCliente] = useState(null);
  const [servicos, setServicos] = useState([]);
  const [fotos, setFotos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({ nome: "", telefone: "", cidade: "", endereco: "", obs: "" });
  const [saving, setSaving] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [confirmPhoto, setConfirmPhoto] = useState(null);
  const [editandoResp, setEditandoResp] = useState(null);
  const [respDraft, setRespDraft] = useState("");
  const [editandoMaterial, setEditandoMaterial] = useState(null);
  const [materialDraft, setMaterialDraft] = useState({ loja: "", data: "" });
  const [entregando, setEntregando] = useState(null);
  const [valorEntregaDraft, setValorEntregaDraft] = useState("");
  const [recebidoFichaDraft, setRecebidoFichaDraft] = useState("");

  const load = useCallback(async () => {
    setLoading(true);
    if (demo) {
      const c = demoCustomers.find((x) => x.id === clienteId) || null;
      setCliente(c); setServicos(demoServices.filter((s) => s.cliente_id === clienteId)); setFotos([]);
      if (c) setForm({ nome: c.nome || "", telefone: c.telefone || "", cidade: c.cidade || "", endereco: c.endereco || "", obs: c.obs || "" });
      setLoading(false); return;
    }
    const [c, sv, ft] = await Promise.all([
      db.from("clientes").select("*").eq("id", clienteId).single(),
      db.from("servicos").select("*").eq("cliente_id", clienteId).order("criado_em", { ascending: false }),
      db.from("fotos").select("*").eq("cliente_id", clienteId).order("criado_em", { ascending: false }),
    ]);
    if (c.error) { notify("Erro ao abrir ficha: " + c.error.message, "error"); setLoading(false); return; }
    setCliente(c.data); setServicos(sv.data || []); setFotos(ft.data || []);
    setForm({ nome: c.data.nome || "", telefone: c.data.telefone || "", cidade: c.data.cidade || "", endereco: c.data.endereco || "", obs: c.data.obs || "" });
    setLoading(false);
  }, [db, demo, clienteId, notify]);

  useEffect(() => { load(); }, [load]);

  const saveCliente = async () => {
    if (!form.nome.trim()) { notify("Nome é obrigatório.", "error"); return; }
    const telefone = corrigirTelefone(form.telefone);
    if (telefone === null) { notify("Telefone incompleto — celular precisa de DDD + 8 ou 9 dígitos.", "error"); return; }
    if (demo) { notify("Na demonstração a ficha não é salva.", "info"); setEditing(false); return; }
    setSaving(true);
    const { error } = await db.from("clientes").update({ nome: form.nome.trim(), telefone: telefone || null, cidade: form.cidade.trim() || null, endereco: form.endereco.trim() || null, obs: form.obs.trim() || null }).eq("id", clienteId);
    setSaving(false);
    if (error) { notify("Erro: " + error.message, "error"); return; }
    notify("Ficha atualizada.", "ok"); setEditing(false); await load(); onChanged?.();
  };

  const addFoto = async (file) => {
    if (!file) return;
    if (demo) { notify("Na demonstração não dá para subir foto.", "info"); return; }
    setUploading(true);
    try {
      const path = clienteId + "/" + Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const { error: upErr } = await db.storage.from("fotos-servicos").upload(path, file); if (upErr) throw upErr;
      const { data, error } = await db.storage.from("fotos-servicos").createSignedUrl(path, 60 * 60 * 24 * 365); if (error) throw error;
      const { error: insErr } = await db.from("fotos").insert({ cliente_id: clienteId, url: data.signedUrl, tipo: "outro" }); if (insErr) throw insErr;
      notify("Foto adicionada.", "ok"); await load();
    } catch (e) { notify("Erro no upload: " + e.message, "error"); }
    finally { setUploading(false); }
  };

  const removeFoto = async (id) => {
    setConfirmPhoto(null);
    if (demo) { notify("Na demonstração não dá para remover foto.", "info"); return; }
    const { error } = await db.from("fotos").delete().eq("id", id);
    if (error) { notify("Erro: " + error.message, "error"); return; }
    notify("Foto removida.", "ok"); await load();
  };

  const salvarResponsavel = async (servicoId) => {
    if (demo) { notify("Na demonstração a ficha não é salva.", "info"); setEditandoResp(null); return; }
    const { error } = await db.from("servicos").update({ responsavel: respDraft.trim() || null }).eq("id", servicoId);
    if (error) { notify("Erro: " + error.message, "error"); return; }
    notify("Profissional atualizado.", "ok"); setEditandoResp(null); await load(); onChanged?.();
  };

  const salvarMaterial = async (servicoId) => {
    if (demo) { notify("Na demonstração a ficha não é salva.", "info"); setEditandoMaterial(null); return; }
    const loja = materialDraft.loja.trim();
    const data = materialDraft.data;
    if (!loja) { notify("Escolha o fornecedor do material.", "error"); return; }
    const forn = (fornecedores || []).find((f) => (f.nome || "").trim().toLowerCase() === loja.toLowerCase());
    if (!forn) { notify("Esse fornecedor ainda não está cadastrado. Cadastre cidade e dias de entrega antes de planejar.", "error"); return; }
    try {
      const operacao = await processarEventoOperacaoBahia(db, {
        tipo: "material_planejado", eventoId: "app-ficha-material-" + servicoId + "-" + forn.id + "-" + (data || "automatico"),
        dados: { servicoId, fornecedorId: forn.id, dataEntrega: data || undefined, por: "diego" },
      });
      notify(`Material planejado. Ação marcada para ${compactDate(operacao.resultado.dataCompra)}.`, "ok");
      setEditandoMaterial(null); await load(); onChanged?.();
    } catch (e) { notify("O planejamento ficou visível para retomada: " + e.message, "error"); }
  };

  // Pedido do Diego (26/07): compromisso concluído sem escolher "Entreguei" deixava o serviço preso em
  // produção sem jeito de fechar pela ficha. Este botão fecha a entrega direto no serviço, sem precisar
  // de compromisso — usa a mesma operação tipada, só que sem agendaId.
  const confirmarEntrega = async (servicoId) => {
    if (demo) { notify("Na demonstração a ficha não é salva.", "info"); setEntregando(null); return; }
    const valor = parseMoedaBR(valorEntregaDraft);
    if (!valor || valor <= 0) { notify("Qual foi o valor do serviço? Sem isso não dá pra marcar como entregue.", "error"); return; }
    const recebido = parseMoedaBR(recebidoFichaDraft);
    if (recebidoFichaDraft.trim() && !(recebido > 0)) { notify("Não entendi o valor recebido. Escreva só o número, ex: 2.189 ou 2189.", "error"); return; }
    if (recebido > valor) { notify(`Recebido (${money(recebido)}) é maior que o valor do serviço (${money(valor)}). Confira.`, "error"); return; }
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "entrega_concluida", eventoId: "app-ficha-entrega-" + servicoId,
        // Ver comentário no CapacidadeCard: sem `recebimento` o dinheiro não entra no caixa.
        dados: { servicoId, valor, data: hojeISO(), por: "diego", recebimento: recebido > 0 ? { valor: recebido, status: "pago", data: hojeISO() } : null },
      });
      notify(recebido > 0 ? `Entregue. ${money(recebido)} no caixa.` : "Entregue. Serviço fechado (sem recebimento).", "ok");
      setEntregando(null); await load(); onChanged?.();
    } catch (e) { notify("A entrega ficou visível para retomada: " + e.message, "error"); }
  };

  return <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal-card">
      <div className="modal-head"><div><p className="kicker">FICHA DO CLIENTE</p><h2>{cliente?.nome || "Cliente"}</h2></div><button className="ghost" onClick={onClose}>Fechar</button></div>
      {loading ? <div className="empty-state"><b>Carregando…</b></div> : !cliente ? <div className="empty-state"><b>Cliente não encontrado.</b></div> : <>
        {!editing ? <div className="ficha-fields">
          {cliente.telefone && <div className="ficha-field"><small>TELEFONE</small><span>{cliente.telefone}</span></div>}
          {cliente.cidade && <div className="ficha-field"><small>CIDADE</small><span>{cliente.cidade}</span></div>}
          {cliente.endereco && <div className="ficha-field"><small>ENDEREÇO</small><span>{cliente.endereco}</span></div>}
          {cliente.obs && <div className="ficha-field wide"><small>OBSERVAÇÕES</small><span>{cliente.obs}</span></div>}
          <div className="ficha-actions"><button className="ghost" onClick={() => setEditing(true)}>Editar dados</button>{cliente.telefone && <a className="ghost" href={`https://wa.me/55${normalizePhone(cliente.telefone)}`} target="_blank" rel="noreferrer">WhatsApp</a>}</div>
        </div> : <div className="ficha-edit form-grid">
          <div className="row"><label>Nome*<input value={form.nome} onChange={(e) => setForm((f) => ({ ...f, nome: e.target.value }))} /></label><label>Telefone<input value={form.telefone} onChange={(e) => setForm((f) => ({ ...f, telefone: e.target.value }))} /></label></div>
          <div className="row"><label>Cidade<input value={form.cidade} onChange={(e) => setForm((f) => ({ ...f, cidade: e.target.value }))} /></label><label>Endereço<input value={form.endereco} onChange={(e) => setForm((f) => ({ ...f, endereco: e.target.value }))} /></label></div>
          <label>Observações<textarea value={form.obs} onChange={(e) => setForm((f) => ({ ...f, obs: e.target.value }))} /></label>
          <div className="ficha-actions"><button className="primary" onClick={saveCliente} disabled={saving}>{saving ? "Salvando…" : "Salvar"}</button><button className="ghost" onClick={() => { setEditing(false); setForm({ nome: cliente.nome || "", telefone: cliente.telefone || "", cidade: cliente.cidade || "", endereco: cliente.endereco || "", obs: cliente.obs || "" }); }}>Cancelar</button></div>
        </div>}

        <h3 className="ficha-section">Histórico de serviços</h3>
        {!servicos.length ? <div className="empty-state"><b>Nenhum serviço registrado.</b></div> : <div className="ficha-servicos">{servicos.map((s) => { const sugestao = s.sugestao_resposta || ""; const tel = cliente.telefone ? normalizePhone(cliente.telefone) : ""; return <div className={`ficha-servico priority-${s.prioridade || "media"}`} key={s.id}><div className="ficha-servico-main"><strong>{s.titulo}</strong><span>{statusLabel[s.status] || s.status}{s.proxima_acao ? " · " + s.proxima_acao : ""}</span>
          {/* A DESCRIÇÃO ERA UM BURACO NEGRO. Auditoria de 04/08: `servicos.descricao` era gravada em 13
              serviços e não aparecia em NENHUMA tela — só o financeiro renderiza descrição. Era ali que o
              detalhe do que foi combinado (espuma, catraca, tecido) ia parar quando eu processava a ficha,
              e o Diego dizia com razão "está na ficha dele". Estava — num campo que ninguém mostrava.
              Campo que só recebe e nunca devolve não é registro, é perda de informação com passo extra. */}
          {!!(s.descricao || "").trim() && <p className="ficha-servico-desc">{s.descricao}</p>}
          {!!(s.materiais_necessarios || []).length && <p className="ficha-servico-desc">🧵 {(s.materiais_necessarios || []).map((m) => (m.comprado ? "✓ " : "☐ ") + m.item).join(" · ")}</p>}
          {editandoResp === s.id
            ? <div className="responsavel-edit-row"><input value={respDraft} onChange={(e) => setRespDraft(e.target.value)} placeholder="Nome do profissional" autoFocus /><button className="ghost" onClick={() => salvarResponsavel(s.id)}>Salvar</button><button className="ghost" onClick={() => setEditandoResp(null)}>✕</button></div>
            : <button type="button" className="responsavel-badge" onClick={() => { setEditandoResp(s.id); setRespDraft(s.responsavel || ""); }}>{s.responsavel ? `👤 ${s.responsavel}` : "+ Atribuir profissional"}</button>}
          {["agendado", "producao"].includes(s.status) && (editandoMaterial === s.id
            ? <div className="material-edit-block">
                <div className="responsavel-edit-row"><input value={materialDraft.loja} onChange={(e) => setMaterialDraft((m) => ({ ...m, loja: e.target.value }))} placeholder="Loja do material" /><input type="date" title="Previsão de chegada, se já foi informada" value={materialDraft.data} onChange={(e) => setMaterialDraft((m) => ({ ...m, data: e.target.value }))} /><button className="ghost" onClick={() => salvarMaterial(s.id)}>Salvar</button><button className="ghost" onClick={() => setEditandoMaterial(null)}>✕</button></div>
                {!!(fornecedores || []).length && <div className="fornecedor-chips">{fornecedores.map((f) => <button type="button" key={f.id} className={materialDraft.loja.trim() === f.nome ? "active" : ""} onClick={() => setMaterialDraft({ loja: f.nome, data: proximaEntregaFornecedor(f.dias_entrega) || materialDraft.data })}>{f.nome}</button>)}</div>}
              </div>
            : <button type="button" className="responsavel-badge" onClick={() => { setEditandoMaterial(s.id); setMaterialDraft({ loja: s.loja_material || "", data: s.data_entrega_material || "" }); }}>{s.loja_material ? `🧵 ${s.loja_material}${s.data_entrega_material ? " · entrega " + compactDate(s.data_entrega_material) : ""}` : "+ Registrar loja/entrega do material"}</button>)}
          {["agendado", "producao"].includes(s.status) && (entregando === s.id
            ? <div className="entrega-form">
                <label>Valor total do serviço<input value={valorEntregaDraft} onChange={(e) => setValorEntregaDraft(e.target.value)} placeholder="R$" autoFocus /></label>
                <label>Recebeu quanto agora?<input value={recebidoFichaDraft} onChange={(e) => setRecebidoFichaDraft(e.target.value)} placeholder="R$ (vazio = não recebeu nada)" /></label>
                <span className="entrega-hint">{parseMoedaBR(recebidoFichaDraft) > 0 ? `Entra ${money(parseMoedaBR(recebidoFichaDraft))} no caixa da empresa, hoje.` : "Sem recebimento — nada entra no caixa."}</span>
                <div className="ficha-actions"><button className="primary" onClick={() => confirmarEntrega(s.id)}>Confirmar entrega</button><button className="ghost" onClick={() => setEntregando(null)}>Cancelar</button></div>
              </div>
            : <button type="button" className="responsavel-badge" onClick={() => { setEntregando(s.id); setValorEntregaDraft(s.valor_orcamento ? String(s.valor_orcamento) : ""); setRecebidoFichaDraft(""); }}>✅ Marcar como entregue</button>)}
        </div><div className="ficha-servico-meta">{s.valor_orcamento ? <b>{money(s.valor_orcamento)}</b> : <span>—</span>}{s.prazo && <time>{compactDate(s.prazo)}</time>}{(sugestao || tel) && <div className="ficha-servico-acoes">{sugestao && <button className="ghost" title="Copiar sugestão" onClick={() => navigator.clipboard.writeText(sugestao)}>📋</button>}{tel && <a className="ghost" href={`https://wa.me/55${tel}${sugestao ? "?text=" + encodeURIComponent(sugestao) : ""}`} target="_blank" rel="noreferrer">WhatsApp</a>}</div>}</div></div>; })}</div>}
        <p className="ficha-note">Mudança de status e financeiro continuam no app atual por enquanto.</p>

        <h3 className="ficha-section">Fotos</h3>
        <div className="foto-grid">
          {fotos.map((f) => <div className="foto" key={f.id}><img src={f.url} alt={f.tipo || "foto"} />{f.tipo && <span className="foto-tag">{f.tipo}</span>}{confirmPhoto === f.id ? <div className="foto-confirm"><button onClick={() => removeFoto(f.id)}>Remover</button><button onClick={() => setConfirmPhoto(null)}>Não</button></div> : <button className="foto-rm" onClick={() => setConfirmPhoto(f.id)}>✕</button>}</div>)}
          <label className="foto-add">{uploading ? "Enviando…" : "+ Foto"}<input type="file" accept="image/*" capture="environment" onChange={(e) => addFoto(e.target.files?.[0])} /></label>
        </div>
      </>}
    </div>
  </div>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Home />);
</script>
<script>
(function () {
  const source = document.getElementById("app-source").textContent;
  const output = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }], "typescript"],
    filename: "app.tsx",
  }).code;
  const script = document.createElement("script");
  script.textContent = output;
  document.body.appendChild(script);
})();

// O nova.html NÃO registrava o service worker — só o index.html registrava. Quem abrisse direto o app novo
// (que é o caso do dia a dia) nunca instalava o cache, e por isso nada funcionava offline. Registrar aqui
// também: o escopo './' cobre a pasta inteira, então os dois compartilham o mesmo SW.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=10').catch(() => {}));
}
</script>
</body>
</html>
