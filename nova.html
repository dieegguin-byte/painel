    if (error) notify("Erro: " + error.message, "error"); else { setSelectedId(null); await loadAll(); notify("Item excluído.", "ok"); }
  }

  async function answer(item) {
    if (!reply.trim()) return;
    const conversation = [...(item.conversa || []), { de: "diego", texto: reply.trim(), em: new Date().toISOString() }];
    if (demo) { setInbox((items) => items.map((entry) => entry.id === item.id ? { ...entry, status: "respondido", conversa: conversation } : entry)); setReply(""); notify("Resposta enviada.", "ok"); return; }
    const { error } = await db.from("caixa_entrada").update({ status: "respondido", conversa: conversation }).eq("id", item.id).eq("status", "aguardando_voce");
    if (error) notify(error.message, "error"); else { setReply(""); await loadAll(); notify("Resposta enviada para a fila do Claude.", "ok"); }
  }

  // CHEGOU DE QUALQUER APP (Share Target) — Fase 1 da Caixa Universal, item
  // COMPARTILHAMENTO-UNIVERSAL-20260828-001.
  //
  // ⚠ O BURACO QUE ISTO TAPA, e ele era silencioso: o caminho já existia inteiro — o service worker pegava o
  // POST, guardava no cache e abria o app — mas a última etapa jogava a carga em `setComposer`/`setFiles`,
  // que alimentam o card "ANOTAR AGORA". Esse card só renderiza se o Dashboard receber `addInbox`, e ele
  // parou de receber quando a Caixa saiu da tela em 23/08. Pior: o cache era apagado ANTES disso. Ou seja,
  // desde 23/08 compartilhar algo pro app **destruía a carga e não mostrava nada** — com direito a um aviso
  // dizendo "confira e salve", apontando pra uma tela que não existe mais.
  //
  // AGORA SALVA SOZINHO, e essa inversão é decisão dele: o recado de 28/08 diz que o receio antigo (print
  // sem contexto parado por semanas) foi substituído por "quero despejar rápido e processar depois". A
  // entrada nasce BRUTA e NÃO CLASSIFICADA na `caixa_entrada`; quem interpreta é o Classic, depois.
  //
  // ORDEM QUE IMPORTA: persistir primeiro, apagar o cache depois. Se qualquer passo falhar, a carga continua
  // no aparelho e reabrir o app tenta de novo. Sucesso falso aqui é o pior desfecho possível — ele fecharia
  // o app achando que guardou.
  useEffect(() => {
    const endereco = new URL(location.href);
    if (endereco.searchParams.get("compartilhado") !== "1") return;
    let cancelado = false;
    (async () => {
      try {
        if (!("caches" in window)) return;
        // O nome do cache tem a versão do service worker dentro, então procura em vez de chutar —
        // senão isso quebra calado toda vez que o sw.js subir de versão.
        let cache = null, carga = null;
        for (const nome of await caches.keys()) {
          const c = await caches.open(nome);
          const achou = await c.match("./__compartilhado__");
          if (achou) { cache = c; carga = await achou.json(); break; }
        }
        if (!carga || cancelado) return;
        // `carga.arquivos` traz nome e tipo reais. `carga.imagens` é o formato antigo e só tem a URL — fica
        // aceito porque pode haver carga do service worker anterior parada no cache do aparelho dele.
        const listaArquivos = (carga.arquivos && carga.arquivos.length)
          ? carga.arquivos
          : (carga.imagens || []).map((url, i) => ({ url, nome: `compartilhado_${carga.em}_${i}.jpg`, tipo: "image/jpeg" }));
        const recebidos = [];
        for (const item of listaArquivos) {
          const resposta = await cache.match(item.url);
          if (!resposta) continue;
          const blob = await resposta.blob();
          recebidos.push(new File([blob], item.nome, { type: blob.type || item.tipo || "application/octet-stream" }));
        }
        if (cancelado) return;
        // DEMONSTRAÇÃO: não tem banco pra salvar, então só mostra que chegou.
        if (demo) {
          await cache.delete("./__compartilhado__");
          for (const item of listaArquivos) await cache.delete(item.url);
          setTab("painel");
          notify("Chegou o compartilhamento (na demonstração não salva).", "info");
          return;
        }
        // SEM SESSÃO OU SEM BANCO: a carga FICA no cache e ele é avisado de que ainda não foi salva.
        // Sucesso falso aqui é pior que erro: ele fecharia o app achando que guardou.
        if (!db || !session) {
          setCompartilhamentoGuardado(true);
          notify("Guardado no aparelho, ainda NÃO salvo na Caixa — entre na sua conta.", "info");
          return;
        }
        const uploaded = [];
        for (const f of recebidos) {
          const path = `caixa-entrada/${carga.em}_${f.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
          const up = await db.storage.from("fotos-servicos").upload(path, f, { upsert: true });
          if (up.error) throw up.error;
          const assinada = await db.storage.from("fotos-servicos").createSignedUrl(path, 60 * 60 * 24 * 365);
          if (assinada.error) throw assinada.error;
          uploaded.push({ url: assinada.data.signedUrl, fileName: f.name });
        }
        // CONVERSA EXPORTADA DO WHATSAPP. "Exportar conversa" manda um `_chat.txt` e o conteúdo está
        // DENTRO do arquivo — o campo de texto do compartilhamento vem vazio. Sem ler aqui, a Caixa
        // guardaria só um link assinado e o Classic teria que baixar uma URL pra descobrir o que chegou.
        // O arquivo bruto continua no Storage: isto ACRESCENTA o conteúdo, não substitui a evidência.
        const LIMITE_TEXTO = 300000;
        let textoDeArquivos = "";
        for (const f of recebidos) {
          const ehTexto = (f.type || "").startsWith("text/") || /\.(txt|csv|log)$/i.test(f.name);
          if (!ehTexto) continue;
          try {
            let conteudo = (await f.text()).trim();
            if (!conteudo) continue;
            // Conversa de anos passa de megabyte. Corta com aviso VISÍVEL em vez de truncar calado —
            // o arquivo inteiro continua anexado pra quem precisar do resto.
            if (conteudo.length > LIMITE_TEXTO) {
              const total = conteudo.length;
              conteudo = conteudo.slice(0, LIMITE_TEXTO) +
                `\n\n[...cortado aqui: ${f.name} tem ${total} caracteres. O arquivo completo está anexado nesta mesma entrada.]`;
            }
            textoDeArquivos += `\n\n--- conteúdo de ${f.name} ---\n${conteudo}`;
          } catch (e) {
            // Arquivo ilegível não pode derrubar o salvamento: o anexo já subiu e vale como evidência.
            textoDeArquivos += `\n\n[não consegui ler o conteúdo de ${f.name}: ${e.message}]`;
          }
        }
        // IDEMPOTÊNCIA PELO CARIMBO DA CARGA: `carga.em` é gravado pelo service worker no instante do
        // compartilhamento e não muda se o app for recarregado ou reaberto. Mesmo compartilhamento gera
        // sempre o mesmo id, então refresh não vira segunda entrada.
        const id = await uuidDeterministicoEvento("compartilhado-" + carga.em, "caixa");
        const { jaExistia } = await inserirComIdDeterministico(db, "caixa_entrada", id, {
          texto: buildInboxPayload(uploaded, ((carga.texto || "") + textoDeArquivos).trim()), status: "novo", conversa: [], processado: false,
        }, ["texto"]);
        // SÓ AGORA a evidência bruta some do aparelho: depois do insert confirmado, nunca antes.
        // Era aqui o buraco — o app apagava o cache e jogava a carga num campo de texto que não é mais
        // renderizado (a UI da Caixa saiu em 23/08). Compartilhamento entrava e desaparecia em silêncio.
        await cache.delete("./__compartilhado__");
        for (const item of listaArquivos) await cache.delete(item.url);
        if (cancelado) return;
        setTab("painel");
        await loadAll();
        notify(jaExistia ? "Esse compartilhamento já estava na Caixa."
          : `Salvo na Caixa${uploaded.length ? ` com ${uploaded.length} arquivo(s)` : ""}. O Classic processa depois.`, "ok");
      } catch (e) {
        // Falhou: a carga CONTINUA no cache. Reabrir o app tenta de novo.
        notify("Não consegui salvar na Caixa: " + e.message + " — a carga continua guardada no aparelho.", "error");
      } finally {
        history.replaceState(null, "", endereco.pathname);
      }
    })();
    return () => { cancelado = true; };
  // Reentrada é segura: o replaceState tira o ?compartilhado=1 e a guarda do topo corta na hora. E mesmo
  // que rodasse de novo, o id determinístico impede a segunda entrada.
  }, [notify, db, session, demo, loadAll]);

  // A BARRA DE ABAS ROLA ATÉ ONDE VOCÊ ESTÁ. São 10 abas e só 5 cabem num celular de 375px — Compras,
  // A pagar, Profissionais, Clientes e Fornecedores nascem fora da tela. O pior não era estarem escondidas,
  // era abrir uma delas e a barra ficar parada: o Diego ficava dentro de uma aba sem enxergar qual estava
  // marcada. Medido em 07/08: cliquei em Profissionais, a tela trocou e o botão continuou a 507px.
  // Mexe SÓ no scroll da própria barra — nada de scrollIntoView, que arrastaria a página inteira junto.
  useEffect(() => {
    const barra = document.querySelector("nav.mobile-nav");
    const ativo = barra && barra.querySelector("button.active");
    if (!barra || !ativo) return;
    barra.scrollTo({ left: ativo.offsetLeft - (barra.clientWidth - ativo.offsetWidth) / 2, behavior: "smooth" });
  }, [tab]);

  // DESLIZAR PRO LADO TROCA DE ABA — ideia do Diego (07/08/2026): "igual na tela principal do Android".
  // Serve pra VIZINHANÇA, não pra tudo: do Painel até Fornecedores seriam 9 deslizadas, e tela inicial de
  // Android tem 3 ou 4 páginas, não 10. O salto longo continua sendo tocar na barra — que agora rola sozinha
  // até a aba aberta. Os dois se completam em vez de competir.
  // NÃO GUARDA A ORDEM DAS ABAS AQUI. Em vez disso acha o botão ativo na própria barra e clica no vizinho:
  // assim reaproveita o onClick que já existe (que também limpa o item selecionado) e nunca sai de sincronia
  // se a ordem das abas mudar um dia.
  // As guardas, cada uma por um motivo real:
  // - modal aberto: dentro de uma ficha ou confirmação o gesto é do conteúdo, não navegação;
  // - campo de texto: arrastar dentro de um input é selecionar texto;
  // - qualquer coisa que role de lado (a própria barra de abas é uma): o gesto pertence a ela;
  // - o movimento tem que ser claramente horizontal e passar de 60px, senão rolar a lista com o polegar
  //   torto trocaria de aba sem querer — que seria pior que o problema que isso resolve.
  useEffect(() => {
    let x0 = 0, y0 = 0, valido = false;
    const roleDeLado = (alvo) => {
      for (let n = alvo; n && n !== document.body; n = n.parentElement) {
        const cs = getComputedStyle(n);
        if (/auto|scroll/.test(cs.overflowX) && n.scrollWidth > n.clientWidth + 2) return true;
      }
      return false;
    };
    const inicio = (e) => {
      const t = e.touches[0];
      valido = e.touches.length === 1
        && !document.querySelector(".modal-overlay")
        && !(e.target.closest && e.target.closest("input,textarea,select"))
        && !roleDeLado(e.target);
      x0 = t.clientX; y0 = t.clientY;
    };
    const fim = (e) => {
      if (!valido) return;
      valido = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - x0, dy = t.clientY - y0;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      const botoes = [...document.querySelectorAll("nav.mobile-nav button")];
      const atual = botoes.findIndex((b) => b.classList.contains("active"));
      if (atual < 0) return;
      const vizinho = botoes[atual + (dx < 0 ? 1 : -1)];
      if (vizinho) vizinho.click();
    };
    document.addEventListener("touchstart", inicio, { passive: true });
    document.addEventListener("touchend", fim, { passive: true });
    return () => { document.removeEventListener("touchstart", inicio); document.removeEventListener("touchend", fim); };
  }, []);

  async function addInbox() {
    if (!composer.trim() && !files.length) return;
    if (demo) { setInbox((items) => [...items, { id: `demo-${Date.now()}`, texto: composer.trim(), status: "novo", conversa: [], criado_em: new Date().toISOString(), processado: false }]); setComposer(""); setFiles([]); notify("Entrada adicionada na demonstração.", "ok"); return; }
    setBusy(true);
    try {
      const texto = composer.trim();
      const uploaded = [];
      for (const f of files) {
        const path = `caixa-entrada/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
        const { error: uploadError } = await db.storage.from("fotos-servicos").upload(path, f); if (uploadError) throw uploadError;
        const { data, error } = await db.storage.from("fotos-servicos").createSignedUrl(path, 60 * 60 * 24 * 365); if (error) throw error;
        uploaded.push({ url: data.signedUrl, fileName: f.name });
      }
      const payload = buildInboxPayload(uploaded, texto);
      const { error } = await db.from("caixa_entrada").insert({ texto: payload, status: "novo", conversa: [], processado: false }); if (error) throw error;
      setComposer(""); setFiles([]); await loadAll(); notify("Entrada salva na fila.", "ok");
    } catch (error) { notify(error.message, "error"); }
    finally { setBusy(false); }
  }

  async function copyContext() {
    const items = [...(working ? [working] : []), ...claudeQueue].slice(0, 8);
    const lines = [
      "TAPEÇARIA BAHIA — CONTEXTO ENXUTO",
      "Regra: uma entrada por vez; pesquisar antes de criar; nunca excluir.",
      "Financeiro, material, entrega e remarcação: usar somente window.TB_OPERACOES.processar. Nunca criar outro cliente Supabase nem repetir a cadeia em tabelas separadas.",
      "",
    ];
    items.forEach((item, index) => { const parsed = parseInbox(item.texto); const last = [...(item.conversa || [])].reverse().find((message) => message.tipo !== "sistema"); lines.push(`${index + 1}. [${item.status || "novo"}] #${item.id}: ${parsed.text.slice(0, 360) || "[print]"}`); if (last) lines.push(`Última mensagem (${last.de}): ${last.texto.slice(0, 180)}`); });
    await navigator.clipboard.writeText(lines.join("\n")); notify("Contexto enxuto copiado.", "ok");
  }

  // `data` vai junto porque o reagendamento fecha o compromisso antigo: se ele estava marcado pra
  // frente e o Diego resolveu antes, a data tem que virar hoje (mesmo motivo do Concluir).
  // `titulo` e `titulo_visivel` viajam SEPARADOS de propósito: o modal MOSTRA o visível, mas o que ele grava
  // (meta.titulo_original da pendência, e daí o título do compromisso sucessor) é o `titulo` do banco.
  // Se fossem um só, remarcar um bloqueio pessoal escreveria o texto de tela dentro da agenda.
  const abrirReagendar = (a) => setExplicar({ item: { tipoItem: "agenda", id: a.id, titulo: a.titulo, titulo_visivel: a.titulo_visivel, cidade: a.cidade, tipo: a.tipo, servico_id: a.servico_id, data: a.data, hora: a.hora }, kind: "reagendar" });
  // Atualização otimista: some da tela na hora; o loadAll depois só reconcilia com o banco.
  const aplicarResolucao = useCallback((patch) => {
    if (!patch) return;
    if (patch.servicoId) setServices((prev) => prev.map((s) => s.id === patch.servicoId ? {
      ...s,
      proxima_acao: patch.proximaAcao !== undefined ? patch.proximaAcao : s.proxima_acao,
      status: patch.statusServico || s.status,
      valor_orcamento: patch.valorServico || s.valor_orcamento,
    } : s));
    if (patch.agendaId && patch.removerAgenda !== false) setAppointments((prev) => prev.filter((a) => a.id !== patch.agendaId));
  }, []);

  if (booting) return <div className="loading-screen"><div className="brand-seal">TB</div><p>Preparando a central…</p></div>;
  if (!session && !demo) return <div className="login-screen"><div className="login-card"><div className="brand-seal">TB</div><p className="kicker">NOVA CENTRAL OPERACIONAL</p><h1>Tapeçaria Bahia</h1><p>Um ambiente separado para Diego e Claude trabalharem na mesma fila, sem apagar, duplicar ou perder o próximo passo.</p>{compartilhamentoGuardado && <div className="success-box" style={{ marginBottom: 14, textAlign: "left" }}><b>Chegou um compartilhamento.</b><br />Está <b>guardado no aparelho</b> e ainda NÃO foi salvo na Caixa. Entre na sua conta que ele sobe sozinho.</div>}{loginSent ? <div className="success-box">Link enviado. Abra seu e-mail neste aparelho.</div> : <><label>E-mail de acesso<input type="email" value={email} onChange={(event) => setEmail(event.target.value)} placeholder="seu@email.com" onKeyDown={(event) => event.key === "Enter" && sendMagicLink()} /></label><button className="primary" onClick={sendMagicLink} disabled={busy || !email.trim()}>Enviar link de acesso</button></>}<button className="ghost demo-button" onClick={() => setDemo(true)}>Ver demonstração do novo site</button></div></div>;
  if (!demo && pinState === "checking") return <div className="loading-screen"><div className="brand-seal">TB</div><p>Verificando o bloqueio…</p></div>;
  // Falha fechada: não deu pra verificar o bloqueio e não existe hash guardado neste aparelho — não abre.
  if (!demo && pinState === "bloqueado") return <div className="login-screen"><div className="login-card"><div className="brand-seal">TB</div><p className="kicker">BLOQUEADO</p><h1>Não deu pra verificar o PIN</h1><p>A central não conseguiu ler a configuração de bloqueio e este aparelho ainda não tem o PIN guardado. Conecte à internet uma vez e abra de novo — depois disso ele passa a funcionar offline.</p><button className="primary" onClick={() => window.location.reload()}>Tentar de novo</button></div></div>;
  if (!demo && (pinState === "define" || pinState === "enter")) return <PinScreen mode={pinState} onDefine={definePin} onEnter={tryPin} />;

  // Vale pendente = ainda não foi descontado do profissional. O dinheiro já saiu (status pago), então o
  // que marca a pendência é a ausência do [ABATIDO], não o status. Ver Regra Nº 9.
  const valesPendentes = finances.filter((f) => f.categoria === "Vale" && !(f.descricao || "").startsWith(VALE_ABATIDO_TAG)).length;
  // O contador da aba conta as duas pendências do profissional: vale a descontar e trabalho a pagar.
  const contaProfissionais = valesPendentes + finances.filter(ehTrabalhoAberto).length;
  const contasFuturas = finances.filter(ehSaidaFutura).length;
  // A CAIXA SAIU DA NAVEGAÇÃO EM 23/08/2026. Diego parou de lançar pelo app ("só serve de
  // visualização agora", "só o Classic que mexe") e, como ninguém mais abria aquela tela,
  // 25 itens ficaram lá dentro esperando resposta que nunca ia chegar — várias delas
  // perguntas paradas desde 11/08. Aba que ninguém abre não é canal, é gaveta.
  // O código da Caixa continua no arquivo, intacto: se ele voltar a operar pelo app, é só
  // devolver a linha aqui. Nada foi apagado.
  const nav = [
    { id: "painel", label: "Painel", icon: "⌂" }, { id: "leads", label: "Leads", icon: "◇", count: activeServices.length },
    { id: "agenda", label: "Agenda", icon: "□" }, { id: "financeiro", label: "Financeiro", icon: "$" }, { id: "compras", label: "Compras", icon: "▣" }, { id: "futuro", label: "A pagar", icon: "◷", count: contasFuturas }, { id: "vales", label: "Profissionais", icon: "✎", count: contaProfissionais },
    { id: "clientes", label: "Clientes", icon: "○" }, { id: "fornecedores", label: "Fornecedores", icon: "▤" },
    // ESTOQUE É PÁGINA PRÓPRIA, NÃO ABA (item ESTOQUE-V2-APP-20260827-2338-001). O backend do Estoque V2 já
    // estava no Supabase desde 22/08, mas a tela vivia num PR aberto e nunca chegou no app — o Diego
    // perguntou "onde fica o estoque?" e a resposta honesta era "em lugar nenhum".
    //
    // O PR trazia um `estoque-addon.js` que enfiava o botão na barra lateral por fora do React. Não trouxe:
    // abaixo de 850px a barra lateral tem `display:none`, então no CELULAR — que é onde ele usa — o botão
    // não apareceria. Entrando aqui no array, ele nasce nas DUAS barras de uma vez, porque a lateral e a de
    // baixo renderizam da mesma lista. Menos código e sem observer brigando com o React.
    { id: "estoque", label: "Estoque", icon: "▦", pagina: "./estoque.html" },
  ];
  // Item que aponta pra página própria sai do app; o resto continua trocando de aba aqui dentro.
  const irParaAba = (item) => { if (item.pagina) { window.location.href = item.pagina; return; } setTab(item.id); setSelectedId(null); };

  return <div className={`product-shell mode-${mode}`}>
    {notice && <div className={`notice ${notice.kind}`}>{notice.text}</div>}
    {/* SEM SINAL: a tela precisa dizer que está velha, senão ele decide em cima de dado defasado sem saber.
        Fica fixo no topo, acima de tudo, porque nesse estado nada mais na tela pode ser confiado às cegas. */}
    {offlineDesde && <div className="notice error">Sem conexão — mostrando os dados baixados {idadeDoDado(offlineDesde)}. Dá pra consultar agenda, telefone e endereço, mas nada que você mudar agora será salvo.</div>}
    <aside className="side-nav">
      <div className="side-brand"><div className="brand-seal small">TB</div><div><strong>Tapeçaria Bahia</strong><span>Central operacional</span></div></div>
      <nav>{nav.map((item) => <button key={item.id} className={tab === item.id ? "active" : ""} onClick={() => irParaAba(item)}><i>{item.icon}</i><span>{item.label}</span>{item.count !== undefined && <b>{item.count}</b>}</button>)}</nav>
      <div className="operator-card"><span>Operador atual</span><strong>{mode === "claude" ? "Claude" : "Diego"}</strong><small>{mode === "claude" ? "Operações tipadas liberadas · exclusões bloqueadas" : "Controle e aprovações"}</small><button onClick={() => setMode(mode === "claude" ? "diego" : "claude")}>Trocar para {mode === "claude" ? "Diego" : "Claude"}</button></div>
    </aside>
    <main className="workspace">

      {/* A TELA DA CAIXA DE ENTRADA FOI REMOVIDA EM 23/08/2026, a pedido do Diego.

function PinScreen({ mode, onDefine, onEnter }) {
  const [digits, setDigits] = useState("");
  const [first, setFirst] = useState(null);
  const [error, setError] = useState("");
  const [confirming, setConfirming] = useState(false);
  const press = async (key) => {
    setError("");
    if (key === "⌫") { setDigits((d) => d.slice(0, -1)); return; }
    if (digits.length >= 4) return;
    const next = digits + key;
    setDigits(next);
    if (next.length < 4) return;
    if (mode === "define") {
      if (!confirming) { setFirst(next); setConfirming(true); setDigits(""); return; }
      if (next !== first) { setError("Os PINs não batem. Comece de novo."); setFirst(null); setConfirming(false); setDigits(""); return; }
      const ok = await onDefine(next);
      if (!ok) { setDigits(""); }
    } else {
      const ok = await onEnter(next);
      if (!ok) { setError("PIN incorreto."); setDigits(""); }
    }
  };
  const title = mode === "define" ? (confirming ? "Confirme o PIN" : "Crie um PIN") : "Digite seu PIN";
  const sub = mode === "define" ? (confirming ? "Digite os 4 dígitos de novo." : "Escolha 4 dígitos para travar o app no dia a dia.") : "4 dígitos para desbloquear a central.";
  return <div className="login-screen"><div className="login-card pin-card"><div className="brand-seal">TB</div><p className="kicker">{title}</p><p className="pin-sub">{sub}</p><div className="pin-dots">{[0, 1, 2, 3].map((i) => <span key={i} className={i < digits.length ? "filled" : ""} />)}</div>{error && <div className="pin-error">{error}</div>}<div className="pin-pad">{["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].map((key, i) => key === "" ? <span key={i} /> : <button key={i} className="pin-key" onClick={() => press(key)}>{key}</button>)}</div></div></div>;
}

function GuiaModal({ db, demo, notify, onClose }) {
  const [rows, setRows] = useState(null);
  const [drafts, setDrafts] = useState({ empresa: "", como_agir: "", regras: "" });
  const [savingSec, setSavingSec] = useState("");
  useEffect(() => {
    if (demo) { setRows([]); setDrafts({ empresa: "(demonstração) Reforma de estofados em Luziânia-GO e região.", como_agir: "(demonstração) Ler a caixa, pesquisar antes de criar, uma entrada por vez.", regras: REGRAS_SISTEMA_ATUAIS }); return; }
    (async () => {
      const { data, error } = await db.from("guia_ia").select("*").order("secao");
      if (error) { notify("Erro ao ler o guia: " + error.message, "error"); setRows([]); return; }
      setRows(data || []);
      const next = { empresa: "", como_agir: "", regras: "" };
      (data || []).forEach((r) => { if (r.secao in next) next[r.secao] = r.conteudo || ""; });
      setDrafts(next);
    })();
  }, [db, demo, notify]);
  const save = async (sec) => {
    if (demo) { notify("Na demonstração o guia não é salvo.", "info"); return; }
    setSavingSec(sec);
    const { error } = await db.from("guia_ia").upsert({ secao: sec, titulo: SECAO_LABEL[sec], conteudo: drafts[sec], atualizado_em: new Date().toISOString() }, { onConflict: "secao" });
    setSavingSec("");
    if (error) notify("Erro: " + error.message, "error"); else notify("Guia atualizado.", "ok");
  };
  const copiarProtocolos = async () => {
    await navigator.clipboard.writeText(PROTOCOLO_CHAT_OPERACAO + "\n\n---\n\n" + PROTOCOLO_CLAUDE_OPERACAO);
    notify("Instruções do chat e do Claude copiadas.", "ok");
  };
  return <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal-card">
      <div className="modal-head"><div><p className="kicker">CARTILHA DA IA</p><h2>Guia da IA</h2></div><div className="ficha-actions"><button className="ghost" onClick={copiarProtocolos}>Copiar instruções pro chat</button><button className="ghost" onClick={onClose}>Fechar</button></div></div>
      <p className="modal-intro">As regras críticas são travas do app. Este guia explica ao chat como estruturar os fatos e ao Claude como chamar a porta única sem duplicar.</p>
      {rows === null ? <div className="empty-state"><b>Carregando…</b></div> : <>
        <div className="guia-block readonly"><h3>Regras automáticas vigentes</h3><pre>{REGRAS_SISTEMA_ATUAIS}</pre></div>
        <div className="guia-block readonly"><h3>Protocolo do chat e do Claude</h3><pre>{PROTOCOLO_CHAT_OPERACAO + "\n\n" + PROTOCOLO_CLAUDE_OPERACAO}</pre></div>
        {["empresa", "como_agir", "regras"].map((sec) => <div className="guia-block" key={sec}><h3>{SECAO_LABEL[sec]}</h3><textarea value={drafts[sec]} onChange={(e) => setDrafts((d) => ({ ...d, [sec]: e.target.value }))} /><button className="primary" onClick={() => save(sec)} disabled={savingSec === sec}>{savingSec === sec ? "Salvando…" : "Salvar"}</button></div>)}
      </>}
    </div>
  </div>;
}

function QueueItem({ item, selected, onOpen }) {
  const parsed = parseInbox(item.texto); const status = statusDaCaixa(item);
  // O selo de print fica no TOPO, do lado do status. Antes "Contém imagem" ficava numa linha cinza no rodapé
  // do card, do mesmo tamanho de "2 mensagens" — some no meio da fila. E foi assim que o print da Wesliane
  // passou batido (04/08): o item parecia texto puro. Ver REGRA Nº 1.
  return <button className={`queue-item ${selected ? "selected" : ""} status-${status}`} onClick={onOpen}><div className="queue-top"><span className="status-pill">{statusLabel[status]}</span>{!!parsed.images.length && <span className="pill-print">📷 {parsed.images.length > 1 ? `${parsed.images.length} PRINTS` : "PRINT"}</span>}<time>{new Date(item.criado_em).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })}</time></div><strong>{parsed.text.slice(0, 92) || "Print sem anotação"}</strong><small>{parsed.images.length ? "ler o print antes de decidir · " : ""}{item.conversa?.length ? `${item.conversa.length} mensagem(ns)` : "Sem conversa"}</small></button>;
}

    const map = {};
    services.forEach((s) => { if (s.responsavel && ["lead", "orcamento", "agendado", "producao"].includes(s.status)) { const k = s.responsavel.trim(); (map[k] ||= []).push(s); } });

      {form.kind === "financeiro" && <div className="form-grid"><p className="form-title">2 · Financeiro avulso</p><label>Descrição*<input value={form.service} onChange={(event) => updateForm("service", event.target.value)} /></label><div className="row three"><label>Valor R$*<input value={form.value} onChange={(event) => updateForm("value", event.target.value)} /></label><label>Tipo<select value={form.financeType} onChange={(event) => updateForm("financeType", event.target.value)}><option value="saida">Saída</option><option value="entrada">Entrada</option></select></label><label>Status<select value={form.financeStatus} onChange={(event) => updateForm("financeStatus", event.target.value)}><option value="a_pagar">A pagar</option><option value="a_receber">A receber</option><option value="pago">Pago</option></select></label></div><label>Aba<select value={form.financeScope} onChange={(event) => updateForm("financeScope", event.target.value)}><option value="empresa">Empresa</option><option value="pessoal">Pessoal</option></select></label><label>Data*<input type="date" value={form.due} onChange={(event) => updateForm("due", event.target.value)} /></label><p className="ficha-note">Use isto só para fato realmente avulso. Material, Vale, Pró-labore e recebimento de serviço têm operação própria.</p><ReviewBox lines={[form.service || "Sem descrição", `${form.financeType} · ${form.financeStatus}`, `${money(form.value)} · ${form.due || "sem data"}`]} /><button className="primary wide" onClick={props.onFinance} disabled={busy}>Confirmar lançamento</button></div>}
      <div className="ask-panel"><p className="kicker">OU · PEDIR INFORMAÇÃO</p><p>Antes de perguntar, confirme que a resposta não está no próprio sistema.</p><div className="audit-checks"><label><input type="checkbox" checked={form.checkedCustomers} onChange={(event) => updateForm("checkedCustomers", event.target.checked)} />Clientes e serviços</label><label><input type="checkbox" checked={form.checkedAgenda} onChange={(event) => updateForm("checkedAgenda", event.target.checked)} />Agenda</label><label><input type="checkbox" checked={form.checkedFinance} onChange={(event) => updateForm("checkedFinance", event.target.checked)} />Financeiro</label></div><textarea value={form.question} onChange={(event) => updateForm("question", event.target.value)} placeholder="Qual dado crítico falta para decidir?" /><button className="secondary" onClick={props.onAsk} disabled={busy}>Perguntar ao Diego e pausar</button></div>
    </>}
  </div>;
}

function ReviewBox({ lines }) { return <div className="review-box"><p className="kicker">SERÁ GRAVADO</p>{lines.map((line) => <span key={line}>✓ {line}</span>)}</div>; }

// ROTINAS RECORRENTES: "a cada X dias". Sem ultima_execucao => vence hoje (nunca foi feita).
function somarDias(dataISO, dias) { const d = new Date(dataISO + "T12:00:00"); d.setDate(d.getDate() + dias); return d.toISOString().slice(0, 10); }
function proximaRotina(rotina) { return rotina.ultima_execucao ? somarDias(rotina.ultima_execucao, rotina.intervalo_dias) : null; }
function statusRotina(rotina, hoje) {
  const prox = proximaRotina(rotina);
  if (!prox) return { estado: "vencida", dias: 0, prox: hoje };
  const diff = Math.round((new Date(prox + "T12:00:00") - new Date(hoje + "T12:00:00")) / 86400000);
  return { estado: diff < 0 ? "vencida" : diff === 0 ? "hoje" : "futura", dias: diff, prox };
}
function textoRotina(st) {
  if (st.estado === "vencida") return st.dias === 0 ? "Nunca feita" : `Atrasada ${Math.abs(st.dias)} dia(s)`;
  if (st.estado === "hoje") return "Fazer hoje";
  return st.dias === 1 ? "Amanhã" : `Em ${st.dias} dias`;
}
function corCompromisso(data, hoje) { const amanha = new Date(hoje + "T12:00:00"); amanha.setDate(amanha.getDate() + 1); const amanhaISO = amanha.toISOString().slice(0, 10); return data <= hoje ? "alta" : data === amanhaISO ? "media" : "baixa"; }

// Presencial antes de remoto no mesmo dia, depois por hora.
function ordenarCompromisso(a, b) { return (a.data + (a.tipo === "remoto" ? "1" : "0") + (a.hora || "99")).localeCompare(b.data + (b.tipo === "remoto" ? "1" : "0") + (b.hora || "99")); }

function horaFalada(hora) {
  if (!hora) return "";
  const [h, m] = hora.slice(0, 5).split(":");
  return m === "00" ? `${parseInt(h, 10)} horas` : `${parseInt(h, 10)}h${m}`;
}
// "hoje"/"amanhã" soa mais natural numa mensagem pro cliente do que a data cheia.
function quandoFalado(data, hora, hoje) {
  const amanha = new Date(hoje + "T12:00:00"); amanha.setDate(amanha.getDate() + 1);
  const dia = data === hoje ? "hoje" : data === amanha.toISOString().slice(0, 10) ? "amanhã" : `no dia ${compactDate(data)}`;
  const horaTxt = horaFalada(hora);
  return ` ${dia}${horaTxt ? " às " + horaTxt : ""}`;
}
// Sempre gera uma mensagem pronta (mesmo sem sugestao_resposta salva) pra o botão do WhatsApp nunca abrir vazio.
// NUNCA colar a anotação interna dentro da mensagem do cliente. A versão antiga fazia
// `Passando pra confirmar: ${proxima_acao}` e saiu no WhatsApp de uma cliente como "Passando pra
// confirmar: Cobrar retorno — ia decidir com o marido" — recado do Diego pra ele mesmo, mandado
// pra cliente. Diego apontou em 24/07: "tem que ser algo mais natural como eu fiz".
// O título/próxima ação agora só ESCOLHE o texto; o que vai pro cliente é frase de gente.
// QUEM É O INTERLOCUTOR DO COMPROMISSO — item WHATSAPP-SUGESTAO-STATUS-20260824-0805.
// A mensagem do cliente nascia de `proxima_acao + titulo`, que são anotações INTERNAS, e o app
// não distinguia compromisso COM o cliente de compromisso POR CAUSA do cliente. Medido em
// 24/08/2026: o card "Comprar material Nurimar — Plástico & Tal" (uma COMPRA NA LOJA, com o
// sofá dela ainda esperando material) sugeria à cliente "Sua peça está pronta! Posso levar hoje
// às 8 horas?". Como 72 dos 78 serviços ativos estão sem `sugestao_resposta`, esse fallback é o
// caso comum, não a exceção.
//
// Isto não cria regra comercial nova: decide o DESTINATÁRIO, a mesma separação que a rota já faz
// entre destino físico e vínculo de negócio (AGENDA-ROTA-LOCAL-20260823-2105). Compromisso na
// loja é com o fornecedor; cobrar medida é com o profissional. Quando envolve os dois (buscar o
// móvel na casa do cliente e levar ao profissional), o app NÃO escolhe: fica `incerto` e não
// escreve nada. Melhor o Diego escrever do que o app afirmar o que não pode provar.
const semAcento = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, "e");
// Casa pela primeira palavra de 4+ letras: o título traz o apelido da loja, não a razão social
// ("Plástico & Tal Materiais para Estofamentos Ltda." aparece como "Plástico & Tal"). Com
// word-boundary, senão "Ativa" casaria dentro de "ativar".
function marcaDoNome(nome) {
  const p = semAcento(nome).split(/[^a-z0-9]+/).find((x) => x.length >= 4);
  return p ? new RegExp("\\b" + p + "\\b") : null;
}
// Não existe tabela de profissionais: quem executa está em `servicos.responsavel`. Diego fora —
// ele é o operador, não um terceiro com quem se conversa por WhatsApp.
function nomesProfissionais(services) {
  return [...new Set((services || []).map((s) => s.responsavel).filter(Boolean))].filter((n) => semAcento(n) !== "diego");
}
function interlocutorCompromisso(a, svc, fornecedores, profissionais) {
  // Só título e local: descrevem o compromisso em si. `proxima_acao` fala do SERVIÇO inteiro e
  // costuma citar loja ("fechar o Klee 09 na Afibracom") mesmo quando o compromisso é a visita.
  const alvo = semAcento(`${a?.titulo || ""} ${a?.local || ""}`);
  const primeiroNome = semAcento((svc?.clientes?.nome || "").split(" ")[0]);
  const citaCliente = primeiroNome.length >= 3 && new RegExp("\\b" + primeiroNome + "\\b").test(alvo);
  // Nome curto no aviso: o cadastro tem a razão social ("Plástico & Tal Materiais para
  // Estofamentos Ltda.") e o card precisa caber na tela do celular.
  const forn = (fornecedores || []).map((f) => f.nome).filter((n) => n && !/avulsa|diversos/i.test(n))
    .find((n) => marcaDoNome(n)?.test(alvo))?.split(/\s+/).slice(0, 3).join(" ").replace(/[.,]$/, "");
  const prof = (profissionais || []).find((n) => marcaDoNome(n)?.test(alvo));
  if (a?.tipo === "operacional") return { destino: "interno", motivo: "compromisso operacional" };
  if (/\b(tarefa interna|bloqueio|uso interno)\b/.test(alvo)) return { destino: "interno", motivo: "tarefa interna" };
  // "Comprar" nunca é conversa com o cliente, mesmo quando é a ficha dele que motiva a compra.
  if (/\bcompr(a|ar|ei|as)\b/.test(alvo)) return { destino: "interno", motivo: forn ? `compra na ${forn}` : "compra de material" };
  if (forn && !citaCliente) return { destino: "interno", motivo: `é na ${forn}` };
  if (prof && !citaCliente) return { destino: "interno", motivo: `é com ${prof}` };
  if ((forn || prof) && citaCliente) return { destino: "incerto", motivo: `envolve ${forn || prof} e o cliente` };
  return { destino: "cliente", motivo: "" };
}
function mensagemPadraoCompromisso(a, svc, hoje) {
  const nome = svc?.clientes?.nome ? svc.clientes.nome.split(" ")[0] : "";
  const oi = `Oi${nome ? " " + nome : ""}, tudo bem?`;
  const alvo = `${svc?.proxima_acao || ""} ${a.titulo || ""}`.toLowerCase();
  if (a.tipo !== "remoto") {
    const quando = quandoFalado(a.data, a.hora, hoje || hojeISO());
    // Sem ponto e sem endereço na ficha, marcar o horário não resolve: ele sai sem saber onde é.
    // Caso real de 24/08: Kely, visita às 10h, "endereço/localização pendente" no próprio evento.
    const cli = svc?.clientes || {};
    const pedeLocal = (!cli.latitude && !String(cli.endereco || "").trim()) ? " Me manda sua localização também, por favor." : "";
    if (/entreg/.test(alvo)) return `${oi} Sua peça está pronta! Posso levar${quando}?${pedeLocal}`;
    if (/buscar|retirad|retirar|pegar/.test(alvo)) return `${oi} Consigo passar${quando} pra buscar a peça. Fica bom pra você?${pedeLocal}`;
    return `${oi} Consigo passar aí${quando}. Fica bom pra você?${pedeLocal}`;
  }
  if (/or[çc]amento pendente|mandar or[çc]amento|enviar or[çc]amento|passar or[çc]amento/.test(alvo)) return `${oi} Terminei de fazer seu orçamento aqui. Posso te mandar?`;
  if (/confirmar hor[áa]rio|encaixar na rota|confirmar data/.test(alvo)) return `${oi} Consegue me confirmar um horário bom pra você? É pra eu encaixar direito na rota.`;
  if (/medida/.test(alvo)) return `${oi} Preciso passar aí pra tirar as medidas. Que dia fica melhor pra você?`;
  if (/decidir|marido|esposa|pensar|ver com/.test(alvo)) return `${oi} Passando pra saber se vocês já conseguiram decidir. Qualquer dúvida do orçamento eu explico.`;
  if (/cobrar|retorno|resposta|aguardar|retomar|tentar contato|contato/.test(alvo)) return `${oi} Passando pra saber se você ainda tem interesse. Se tiver qualquer dúvida do orçamento, é só falar.`;
  return `${oi} Passando pra falar do seu estofado. Consegue me dar um retorno?`;
}

// Card de AÇÃO do Painel: diz o que fazer, já com a mensagem pronta e o botão do WhatsApp.
// CARD RECOLHÍVEL (Diego, 23/08/2026: "em cada cliente colocar abrir e fechar, só aparecendo
// de cara nome de cliente e cidade").
//
// Fechado: nome, cidade e a hora. A hora fica porque a agenda é lida na ordem do relógio —
// sem ela a lista vira um monte de nomes sem dia. Todo o resto (o que fazer, a mensagem
// sugerida, material, WhatsApp e rota) só aparece quando ele abre o card.
//
// Os botões "Pedir reagendamento", "✓ Concluir" e o de copiar mensagem saíram: eram os
// controles de escrita do app, e quem opera agora é o Classic. Ficaram só as ações que
// levam pra fora — falar com o cliente e traçar a rota.
// COMPARTILHAR COM O CHATGPT (item CLIENTE-CHATGPT-SHARE-20260824-1121, 24/08/2026).
// O botão leva IDENTIDADE, não estado: ids + nome + cidade, e mais nada. Telefone, endereço,
// localização, valor, histórico e observação da ficha ficam de fora de propósito — esse texto
// viaja por fora do app, cai numa conversa nova e não é fonte de verdade de nada. O Classic
// usa os ids pra achar o registro e relê o estado vivo nas fontes oficiais.
// O clique não grava nada em lugar nenhum.
const INSTRUCAO_GPT_CLIENTE = "Inicialize a Operação Bahia antes de responder. Use os identificadores acima apenas para localizar o cliente/serviço e consulte as fontes oficiais atuais. Não trate este texto compartilhado como prova do status atual nem invente fatos ausentes.";
function payloadGPT(campos, assinatura, instrucao) {
  const linhas = [assinatura || "OPERAÇÃO BAHIA — ABRIR CLIENTE"];
  for (const [rotulo, valor] of campos) if (valor) linhas.push(`${rotulo}: ${valor}`);
  linhas.push("origem: app_operacao_bahia", "", "INSTRUÇÃO AO CHATGPT:", instrucao || INSTRUCAO_GPT_CLIENTE);
  return linhas.join("\n");
}

// Web Share abre o menu nativo do Android (onde o app do ChatGPT aparece como destino). Precisa
// sair do clique direto, senão o navegador recusa. Duas coisas NÃO são erro e saem caladas:
// cancelar o menu (AbortError) e o próprio share não existir — aí cai na cópia, que sempre funciona.
async function compartilharGPT(texto, aviso) {
  if (navigator.share) {
    try { await navigator.share({ text: texto }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try {
    await navigator.clipboard.writeText(texto);
    aviso("Contexto copiado — abra o ChatGPT e cole na conversa.", "info");
  } catch (e) {
    aviso("Não deu pra compartilhar nem copiar neste navegador.", "error");
  }
}

function CompromissoCard({ a, svc, cliente, today, materiais, fornecedores, profissionais }) {
  const [aberto, setAberto] = useState(false);
  // Sem `notify` aqui (o card não recebe a prop) — o aviso da cópia vive no próprio card.
  const [avisoGPT, setAvisoGPT] = useState("");
  // A sugestão GRAVADA vence sempre: ela nasce da conversa real, com julgamento comercial.
  // Só quando ela falta é que o app escreve — e apenas se provar que o interlocutor é o cliente.
  const quem = interlocutorCompromisso(a, svc, fornecedores, profissionais);
  // ENVELOPE DE TRIAGEM NÃO GANHA MENSAGEM PRONTA. Apareceu no teste de 27/08, no minuto em que o botão de
  // WhatsApp passou a renderizar: o app montava "Oi, tudo bem? Passando pra falar do SEU ESTOFADO" para um
  // número que ninguém triou ainda — sem cliente, sem serviço, sem saber do que a conversa trata. É a mesma
  // regra que já vale para compromisso interno: o app não fala pelo Diego quando não tem como provar com
  // quem está falando. Aqui ele abre o WhatsApp vazio, que é o certo — o Diego lê a conversa e escreve.
  // MESMA TRAVA, CASO NOVO: compromisso ligado direto ao cliente (sem serviço) também não ganha mensagem
  // pronta. É o caso do Jackson — o serviço não existe justamente porque o que foi combinado estava num
  // áudio que ninguém transcreveu. Sem serviço não há prazo, peça, valor nem próxima ação; a frase padrão
  // sairia adivinhando pelo título ("Retirada" vira "posso buscar a peça hoje?") e isso vai pro WhatsApp da
  // cliente. O botão abre vazio: o vínculo prova COM QUEM ele fala, não O QUE foi combinado.
  const semServico = !svc;
  const sugestao = svc?.sugestao_resposta || (quem.destino === "cliente" && !semServico && !ehEnvelopeDeTriagem(a) ? mensagemPadraoCompromisso(a, svc, today) : "");
  // UMA variável de telefone, um caminho de renderização só. A ficha do cliente continua sendo a primeira
  // fonte; o telefone técnico do envelope de triagem só entra quando ela não existe, e alimenta ESTA mesma
  // variável — o botão de WhatsApp abaixo é o mesmo, sem componente, estilo ou fluxo paralelo.
  // CLIENTE DIRETO NA AGENDA (item COMPROMISSOS-WHATSAPP-JACKSON-20260830-001). Até 31/08 existia UM
  // caminho pro cliente: agenda.servico_id -> servicos.cliente_id. Compromisso de cliente de verdade que
  // ainda não tem serviço caía fora dele — sem nome, sem telefone, sem WhatsApp. O Jackson mostrou o buraco:
  // o serviço não foi criado de propósito (os dados comerciais estavam num áudio que ninguém transcreveu),
  // e criar serviço falso pra fazer um botão nascer seria mentir no banco pra consertar tela.
  // A precedência é a mesma de sempre: quem tem serviço continua resolvendo pelo serviço.
  const cli = svc?.clientes || cliente;
  const tel = (cli?.telefone ? normalizePhone(cli.telefone) : "") || telefoneDaTriagem(a);
  // Telefone técnico quebrado não pode sumir em silêncio: sem isso o envelope volta a parecer um card sem
  // WhatsApp, que é exatamente o defeito que estamos consertando. Erro visível vale mais que omissão.
  const triagemSemTelefone = !tel && ehEnvelopeDeTriagem(a);
  // `titulo_visivel` é o título do registro pessoal vinculado (ver comTituloVisivel). Só existe quando há
  // vínculo real; sem ele nada muda.
  const tituloCard = a.titulo_visivel || a.titulo;
  const oQueFazer = svc?.proxima_acao || tituloCard;
  // ROTA — TRÊS qualidades, e o botão diz honestamente qual é.
  // 1. PONTO: o Classic gravou latitude/longitude do pino que o Diego compartilhou. Porta.
  // 2. ENDEREÇO: sem ponto ainda, o mapa busca o texto. Costuma acertar a rua.
  // 3. SÓ CIDADE: nem endereço tem. Ainda assim o botão aparece, escrito "só cidade" — ele
  //    conhece a região e começa a rota; o que não pode é o app fingir precisão que não tem.
  //
  // A versão anterior escondia o botão quando faltava endereço, e isso o deixou invisível
  // exatamente onde ele foi olhar: Nurimar, Léo e Andriele — os presenciais de 24/08 — estão
  // todos sem endereço na ficha. Regra certa no papel, inútil na estrada.
  // (`cli` sai lá de cima — serviço primeiro, cliente direto da agenda depois.)
  // DESTINO DA ROTA — `agenda.local` VENCE (item AGENDA-ROTA-LOCAL-20260823-2105).
  // Vínculo de negócio e destino físico são coisas diferentes: "comprar o material DA NURIMAR
  // na PLÁSTICO & TAL" tem a Nurimar como cliente e a loja como destino. A versão anterior
  // montava a rota só pelo cliente, então esse compromisso (que nem tem servico_id) caía em
  // "Valparaíso de Goiás" e não levava à loja. Diego testou na rua e nenhum dos dois abriu certo.
  //
  // Nem todo `local` é destino, e os dados reais provam:
  //   "Jardim Ingá" com cidade "Jardim Ingá"            → repete a cidade, não acrescenta nada
  //   "Valparaíso de Goiás — endereço/localização pendente" → é um aviso, não um endereço
  //   "Remoto / WhatsApp"                                → não é lugar
  // Mandar esses textos pro Waze faz ele buscar a frase inteira e errar. Por isso o local só
  // conta quando diz algo que a cidade já não diz.
  const soTexto = (t) => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const localBruto = String(a.local || "").trim();
  // Tem um quarto padrão, e é o que quebrou o botão: o Classic escreve no `local` a PROCEDÊNCIA do ponto,
  // não o ponto. "Águas Claras — ponto exato compartilhado pelo cliente no WhatsApp" (Gilmar, 05/09),
  // "Ponto confirmado pela cliente no WhatsApp" (Marilda). É anotação sobre a coordenada, não endereço —
  // mandar o Waze buscar essa frase é garantir que ele não ache nada. Quem vale aí é a coordenada, abaixo.
  const localUtil = (localBruto
    && soTexto(localBruto) !== soTexto(a.cidade)
    && !/pendente|a confirmar|nao informad|remoto/i.test(soTexto(localBruto))
    && !/ponto (exato|confirmado)|localizacao (compartilhad|confirmad|enviad)/i.test(soTexto(localBruto))) ? localBruto : "";

  const temPonto = cli?.latitude != null && cli?.longitude != null;
  // O PONTO DA PRÓPRIA AGENDA (item WAZE-PONTO-AGENDA-20260829). A tabela `agenda` tem latitude/longitude e
  // o Classic PREENCHE: Gilmar, Fabrício, Marilda, Anny e Jackson estão lá, todos com PONTO_CONFIRMADO. O
  // app nunca olhou pra elas — lia só o ponto do cliente, e o texto do `local` passava na frente dos dois.
  // Medido nos dados reais de 29/08: o Waze abria certo em 2 de 122 compromissos. O Classic gravava a porta
  // e o botão jogava a porta fora pra mandar uma frase pra busca do Waze.
  //
  // Coordenada não se discute com texto: esta é a coordenada DESTE compromisso, então vence o `local` —
  // inclusive quando o local é um terceiro (a loja), porque o ponto foi gravado pra este compromisso.
  // Não desfaz o AGENDA-ROTA-LOCAL-20260823-2105: sem ponto na agenda, o local continua vencendo o ponto do
  // CLIENTE, que é o que impede "comprar o material DA NURIMAR na PLÁSTICO & TAL" de virar rota pra casa
  // da Nurimar. E não desfaz o AGENDA-WAZE-PLACEID-20260824-0824: place id continua sendo o primeiro.
  const pontoAgenda = (a.latitude != null && a.longitude != null) ? `${a.latitude},${a.longitude}` : "";
  const cidadeFim = cli?.cidade || a.cidade;
  // Precedência: ponto do compromisso > destino explícito da agenda > ponto do cliente > endereço > cidade.
  const pontoRota = pontoAgenda || (!localUtil && temPonto ? `${cli.latitude},${cli.longitude}` : "");
  const usarPonto = !!pontoRota;
  const destinoTexto = localUtil ? [localUtil, a.cidade].filter(Boolean).join(", ")
    : cli?.endereco ? [cli.endereco, cidadeFim].filter(Boolean).join(", ")
    : (cidadeFim || "");
  const soCidade = !usarPonto && !localUtil && !cli?.endereco && !!cidadeFim;
  const destinoRota = pontoRota || destinoTexto;
  // PLACE ID DO DESTINO VENCE TUDO (item AGENDA-WAZE-PLACEID-20260824-0824). O Maps já abria certo e o
  // Waze não: com `q=texto` quem escolhe o destino é a busca do Waze, e ela escolheu outro lugar. Place ID
  // é o endereço exato do estabelecimento no mapa — não tem o que escolher errado. Vale só pro Waze; o Maps
  // passou no teste real do Diego e não se mexe no que está funcionando.
  const placeIdAgenda = String(a.google_place_id || "").trim();
  // A ORDEM continua a mesma (place id > ponto > texto) e o transporte intent:// de 27/08 segue intocado.
  // O que mudou é o que conta como "ponto": agora o da agenda também, não só o do cliente — ver pontoRota.
  const linkWaze = placeIdAgenda ? urlWaze({ google_place_id: placeIdAgenda })
    : usarPonto ? urlWaze({ ll: pontoRota })
      : urlWaze({ q: destinoTexto });
  const linkMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(destinoRota)}`;
  const selo = soCidade ? " (só cidade)" : "";
  const nomeCliente = cli?.nome || tituloCard;
  const cidadeCard = a.tipo === "remoto" ? "◌ Remoto" : `⌖ ${cli?.cidade || a.cidade || "Cidade não informada"}`;
  // INSTRUÇÕES DO ATENDIMENTO (Diego, 23/08/2026: "cada cliente com instruções do que precisa
  // ser feito"). Reúne aqui tudo que ele precisa saber ANTES de bater na porta, sem ter que
  // abrir a ficha do cliente: o que fazer, qual é o serviço, o que ainda falta comprar e onde,
  // quanto é, e o que a ficha avisa sobre esse cliente.
  // Só entra o que existe — linha vazia com rótulo bonito é ruído, e ele lê isso dirigindo.
  const materialPendente = (svc?.materiais_necessarios || []).filter((m) => !m.arquivado && !m.comprado);
  const instrucoes = [];
  if (oQueFazer) instrucoes.push(["O QUE FAZER", oQueFazer]);
  if (svc?.titulo && svc.titulo !== oQueFazer && svc.titulo !== a.titulo) instrucoes.push(["SERVIÇO", svc.titulo]);
  if (materialPendente.length) instrucoes.push(["MATERIAL QUE FALTA",
    materialPendente.map((m) => m.item + (m.pedido ? " (já pedido)" : "")).join(" · ")
    + (svc?.loja_material ? " — comprar em " + svc.loja_material : "")]);
  if (Number(svc?.valor_orcamento)) instrucoes.push(["VALOR DO SERVIÇO",
    money(svc.valor_orcamento) + (svc?.prazo ? " · prazo " + compactDate(svc.prazo) : "")]);
  if (cli?.obs) instrucoes.push(["OBSERVAÇÃO DA FICHA", cli.obs]);
  return <article className={`compromisso-card cor-${corCompromisso(a.data, today)}`}>
    <button type="button" className="compromisso-cab" onClick={() => setAberto(!aberto)} aria-expanded={aberto}>
      <span className="compromisso-quando">
        <b>{a.hora ? a.hora.slice(0, 5) : "—"}</b>
        <span>{compactDate(a.data)}</span>
        {a.data < today && <em>atrasado</em>}
      </span>
      <span className="compromisso-idc">
        <strong>{nomeCliente}</strong>
        <span>{cidadeCard}</span>
      </span>
      <span className="compromisso-seta">{aberto ? "▾" : "▸"}</span>
    </button>
    {aberto && <div className="compromisso-corpo">
      <h4>{tituloCard}</h4>
      {/* BLOQUEIO PESSOAL: a linha da agenda existe pra dizer que ele está indisponível, e o registro
          completo continua morando no card Pessoais.
          MUDOU EM 29/08 (item APP-AGENDA-TITULO-PESSOAL-20260829-01): antes o card escondia o motivo de
          propósito — "a operação só precisa saber que o horário não está livre". Só que quem lê a agenda é
          o próprio Diego, e ele estava vendo "Compromisso pessoal" às 14h sem saber que era o parafuso do
          banco do carro. Decisão dele: pessoal tem que ser legível em todo lugar do app. */}
      {a.pessoal_id && <p className="compromisso-material">⛔ Pessoal — você está indisponível neste horário{a.detalhe_visivel ? ` · ${a.detalhe_visivel}` : ""}. O registro completo está no card Pessoais.</p>}
      {!!(materiais || []).length && <p className="compromisso-material">⚑ Aproveitar para o material: {(materiais || []).map((m) => m.descricao || "material").join(" · ")}</p>}
      {/* CONTATO IMPOSSÍVEL: o app mandava "tentar contato de novo" sem existir telefone na ficha, e o Diego
          ficou perguntando "cadê o WhatsApp" desde 16/07 sem resposta (caso real; havia até cliente com ENTREGA marcada e
          ENTREGA marcada sem número). Pedir o que não dá pra fazer é pior que não pedir. */}
      {!tel && (svc?.cliente_id || a.cliente_id) && <p className="compromisso-material">⚠ Sem telefone na ficha — não dá pra fazer esse contato. Pegue o número antes.</p>}
      {triagemSemTelefone && <p className="compromisso-material">⚠ Envelope de triagem com telefone técnico inválido — o app não vai adivinhar o número. Corrija a triagem.</p>}
      {tel && ehEnvelopeDeTriagem(a) && <p className="compromisso-material">✎ Conversa ainda não triada — o WhatsApp abre vazio de propósito. Leia antes de escrever.</p>}
      <div className="compromisso-info">
        {instrucoes.map(([rotulo, texto]) => <React.Fragment key={rotulo}>
          <span className="ci-label">{rotulo}</span><strong>{texto}</strong>
        </React.Fragment>)}
        {sugestao && <q className="compromisso-msg">{sugestao}</q>}
        {/* Sem sugestão porque o app não pôde provar que a conversa é com o cliente. Dizer o
            motivo importa: card mudo faz ele achar que quebrou. O WhatsApp abaixo continua
            abrindo — só que vazio, pra ele escrever. */}
        {!sugestao && quem.destino !== "cliente" && <p className="compromisso-material">
          {quem.destino === "interno"
            ? `✎ Compromisso interno (${quem.motivo}) — sem mensagem pronta pro cliente.`
            : `✎ Este compromisso ${quem.motivo} — escreva você; o app não tem como saber o texto certo.`}
        </p>}
        {/* Card mudo faz ele achar que quebrou — então o motivo aparece aqui também. */}
        {!sugestao && quem.destino === "cliente" && semServico && !ehEnvelopeDeTriagem(a) && cli && <p className="compromisso-material">
          ✎ Compromisso ligado ao cliente, mas ainda sem serviço — o WhatsApp abre vazio de propósito. Nada foi combinado no app pra ele repetir.
        </p>}
        <div className="compromisso-acoes">
          {/* Sem `target="_blank"` no Android, igual ao Waze: aba nova não sabe abrir intent:// e ficaria em branco. */}
          {tel && <a className="btn-wpp" href={urlWhatsapp(tel, sugestao)} target={ehAndroid() ? undefined : "_blank"} rel="noreferrer">Abrir WhatsApp{sugestao ? " com resposta" : ""}</a>}
          {/* Rota só em compromisso presencial — num remoto o botão de mapa é ruído e convida
              pro toque errado. O sufixo do rótulo diz a precisão real do destino. */}
          {a.tipo !== "remoto" && destinoRota && <a className="btn-rota btn-waze" href={linkWaze} target={ehAndroid() ? undefined : "_blank"} rel="noreferrer">🧭 Waze{selo}</a>}
          {a.tipo !== "remoto" && destinoRota && <a className="btn-rota btn-maps" href={linkMaps} target="_blank" rel="noreferrer">📍 Maps{selo}</a>}
          {/* Aqui o `servico_id` é inequívoco: o card TEM um serviço só. Quando o compromisso não
              tem serviço (compra de material, por exemplo), vai só o `agenda_id` — não se adivinha. */}
          <button type="button" className="btn-rota btn-gpt" onClick={() => compartilharGPT(payloadGPT([
            ["cliente_id", svc?.cliente_id || a.cliente_id],
            ["servico_id", svc?.id],
            ["agenda_id", a.id],
            ["nome", cli?.nome],
            ["cidade", cli?.cidade || a.cidade],
            ["compromisso", a.titulo],
          ]), (msg) => setAvisoGPT(msg))}>💬 ChatGPT</button>
        </div>
        {avisoGPT && <p className="compromisso-material">{avisoGPT}</p>}
      </div>
    </div>}
  </article>;
}

// COBRANÇA: linha enxuta, sem hora e sem rota. Vive num bloco próprio do Painel — é o "dia do telefone",
// separado do "dia da estrada". Dois botões só: cobrei (conta +1, volta em 3 dias) e chega (encerra).
// CLIENTE QUE RESPONDEU SAI DA COBRANÇA NA HORA. Diego, 04/08: "em cobranças esperando cliente tem que ter
// um botão para mudar o cliente de lá, como a Neide — ela falou comigo, voltou de viagem e marcou para sábado
// de manhã; lá não tem como eu mover ela, nem te falar que deu certo e você mover agora pra compromisso".
// Sem isso, a cobrança que JÁ deu certo continuava voltando a cada 3 dias, e ele ficava com um cliente
// combinado no cartão de "esperando resposta" — o oposto do que aconteceu. E a única saída era me esperar.
// O botão "Respondeu" pergunta o dia, vira compromisso de verdade e zera o ciclo de tentativas.
// NOTA (24/08/2026): este componente está ÓRFÃO — ninguém o renderiza desde que o app virou
// visualização. Ficou com a mesma trava do CompromissoCard de propósito: se um dia voltar a ser
// usado, volta protegido, não com o bug de sugerir mensagem de cliente em compromisso interno.
function CobrancaCard({ a, svc, today, tentativas, noTeto, onCobrou, onEncerrar, onRespondeu, onInsistirMais, cobradaEm, busy, fornecedores, profissionais }) {
  const [marcando, setMarcando] = useState(false);
  const [dataDraft, setDataDraft] = useState(somarDias(today, 1));
  const [horaDraft, setHoraDraft] = useState("09:00");
  const quem = interlocutorCompromisso(a, svc, fornecedores, profissionais);
  const sugestao = svc?.sugestao_resposta || (quem.destino === "cliente" ? mensagemPadraoCompromisso(a, svc, today) : "");
  const tel = svc?.clientes?.telefone ? normalizePhone(svc.clientes.telefone) : "";
  const atrasada = a.data < today;
  return <article className={`cobranca-item ${noTeto ? "cor-alta" : atrasada ? "cor-media" : "cor-baixa"}`}>
    <div className="cobranca-esq">
      <strong>{svc?.clientes?.nome || "Cliente"}</strong>
      <span>{svc?.proxima_acao || a.titulo}</span>
      {/* O contador é o coração disto: sem ele o Diego não sabia que já tinha tentado 4 vezes (caso Francisco). */}
      <em>{cobradaEm ? `Cobrado agora · volta em ${compactDate(cobradaEm)}` : `${tentativas + 1}ª tentativa de ${COBRANCA_TETO_TENTATIVAS}${atrasada ? ` · desde ${compactDate(a.data)}` : ""}`}</em>
      {cobradaEm && <em className="cobranca-teto">Se ele responder agora, marque aqui mesmo — este cartão fica até você sair do Painel.</em>}
      {noTeto && !cobradaEm && <em className="cobranca-teto">Já foram {COBRANCA_TETO_TENTATIVAS} tentativas sem resposta — o app não insiste mais sozinho. Encerrar ou insistir mais?</em>}
      {!tel && <em className="cobranca-teto">Sem telefone na ficha — não dá pra cobrar. Pegue o número antes.</em>}
    </div>
    {marcando
      ? <div className="cobranca-marcar">
          <div className="row">
            <input type="date" value={dataDraft} onChange={(e) => setDataDraft(e.target.value)} />
            <input type="time" value={horaDraft} onChange={(e) => setHoraDraft(e.target.value)} />
          </div>
          <div className="ficha-actions">
            <button className="primary" disabled={busy} onClick={() => { onRespondeu(a, svc, dataDraft, horaDraft); setMarcando(false); }}>Virar compromisso</button>
            <button className="ghost" onClick={() => setMarcando(false)}>Cancelar</button>
          </div>
        </div>
      : <div className="cobranca-dir">
          {tel && <a className="btn-wpp" href={urlWhatsapp(tel, sugestao)} target={ehAndroid() ? undefined : "_blank"} rel="noreferrer" onClick={() => onCobrou(a, svc)}>{cobradaEm ? "Cobrar de novo" : "Cobrar no WhatsApp"}</a>}
          {sugestao && <button className="ghost" title="Copiar mensagem" onClick={() => navigator.clipboard.writeText(sugestao)}>📋</button>}
          <button className={cobradaEm ? "primary" : "ghost"} disabled={busy} onClick={() => setMarcando(true)}>✓ Respondeu</button>
          {noTeto && <button className="ghost" disabled={busy} onClick={() => onInsistirMais(a, svc)}>Insistir mais</button>}
          <button className={noTeto && !cobradaEm ? "primary" : "ghost"} disabled={busy} onClick={() => onEncerrar(a, svc)}>Chega</button>
        </div>}
  </article>;
}

// A CAIXA FICA ABERTA ONDE ELE JÁ ESTÁ. Diego, 04/08: "aqui no painel a caixa de entrada eu clico em abrir
// fila para depois digitar; acho melhor deixar já a caixa lá pra eu ir colocando de cara logo o compromisso,
// e não precisar clicar para depois colocar". Ele lança do celular no meio do serviço, muitas vezes com uma
// mão só — dois toques antes de escrever é atrito onde não pode ter. O mesmo componente serve o Painel e a
// aba Caixa: um lugar só pra manter, e o que ele digita cai na mesma fila.
function ComposerCaixa({ composer, setComposer, files, setFiles, addInbox, busy, placeholder }) {
  return <div className="composer">
    <textarea value={composer} onChange={(event) => setComposer(event.target.value)} placeholder={placeholder || "Cole uma mensagem, descreva o atendimento ou acrescente uma orientação…"} />
    {files.length > 0 && <div className="composer-files">{files.map((f, i) => <span key={i} className="composer-file-chip">{f.name}<button type="button" onClick={() => setFiles((fs) => fs.filter((_, idx) => idx !== i))}>✕</button></span>)}</div>}
    <div className="composer-actions">
      <label className="file-button">{files.length ? `${files.length} print(s)` : "Adicionar print(s)"}<input type="file" accept="image/*" multiple onChange={(event) => setFiles((fs) => [...fs, ...Array.from(event.target.files || [])])} /></label>
      <button className="primary" onClick={addInbox} disabled={busy || (!composer.trim() && !files.length)}>Salvar na fila</button>
    </div>
  </div>;
}
// Rotinas que vencem hoje ou estão atrasadas aparecem no Painel; "✓ Fiz hoje" reinicia a contagem.
// TUDO RECOLHÍVEL, UM GESTO SÓ (Diego, 04/08 e de novo em 27/08: "quero tudo recolhível no painel"). Cada
// card resolvia isso do seu jeito: uns com um botão "Abrir os N" de largura inteira, outros abertos sempre
// — a lista de contas a pagar, os serviços sem próximo passo, a Capacidade e o campo de anotar não recolhiam
// de jeito nenhum. Resultado: o Painel abria como parede de texto e a agenda do dia ia parar lá embaixo.
//
// Agora o CABEÇALHO INTEIRO é o botão, igual em todos: mesma batida, mesma posição, "▸ ABRIR" / "▾ FECHAR"
// à direita. Um alvo grande vale mais que um chevron pequeno em tela de celular dentro do carro.
//
// FECHAR TROCA LISTA POR NÚMERO, NÃO ESCONDE INFORMAÇÃO: título, contagem e a nota de resumo continuam na
// tela fechado. `resumo` é o que fica visível MESMO fechado e não é decoração — é o aviso de rota, os chips
// de loja, a linha de "quantas atrasadas". O que sai é a lista.
//
// SEMPRE COMEÇA FECHADO, sem exceção e sem memória. Diego, 04/08: "quero tudo recolhível sem abrir sozinho
// no painel principal ao iniciar". Card que abre sozinho porque o app achou urgente vira o estado normal, e
// aí nada é urgente — foi exatamente o que aconteceu com as rotinas atrasadas.
function CardRecolhivel({ className, id, cabecalho, resumo, children }) {
  const [aberto, setAberto] = useState(false);
  return <section id={id} className={className || "content-card"}>
    <button type="button" className="card-toggle" aria-expanded={aberto} onClick={() => setAberto((v) => !v)}>
      <div>{cabecalho}</div>
      <i>{aberto ? "▾ fechar" : "▸ abrir"}</i>
    </button>
    {resumo}
    {aberto && <div className="card-corpo">{children}</div>}
  </section>;
}
function RotinasCard({ rotinas, hoje, db, demo, notify, onChanged }) {
  const [busyId, setBusyId] = useState(null);
  // Atualização otimista: o onChanged recarrega tudo e demora, então a linha só sumiria segundos depois e
  // parecia que o clique não pegou. Aqui a data nova vale na hora e o recarregamento só reconcilia.
  const [feitasAgora, setFeitasAgora] = useState({});
  const comOverride = rotinas.map((r) => feitasAgora[r.id] ? { ...r, ultima_execucao: feitasAgora[r.id] } : r);
  const pendentes = comOverride.map((r) => ({ r, st: statusRotina(r, hoje) })).filter((x) => x.st.estado !== "futura")
    .sort((a, b) => a.st.dias - b.st.dias);
  if (!pendentes.length) return null;
  // Nem sempre ele marca no dia em que fez - lembra depois, ou marca de madrugada quando o dia já virou.
  // Sem o "ontem" a única saída era gravar a data errada e conviver com ela.
  const ontem = (() => { const d = new Date(hoje + "T12:00:00"); d.setDate(d.getDate() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
  const marcarFeita = async (rotina, quando) => {
    if (demo) { notify("Na demonstração a rotina não é salva.", "info"); return; }
    setBusyId(rotina.id);
    try {
      setFeitasAgora((atual) => ({ ...atual, [rotina.id]: quando }));
      const { error } = await db.from("rotinas").update({ ultima_execucao: quando }).eq("id", rotina.id);
      if (error) { setFeitasAgora((atual) => { const copia = { ...atual }; delete copia[rotina.id]; return copia; }); throw error; }
      notify(`"${rotina.titulo}" marcada como feita ${quando === hoje ? "hoje" : "ontem"}.`, "ok"); onChanged();
    } catch (e) { notify("Erro: " + e.message, "error"); } finally { setBusyId(null); }
  };
  // SEPARADO POR COR (Diego, 30/07): os dois grupos do semáforo ficam separados em vez de misturados numa
  // lista só ordenada por dias. O recolher é o do CardRecolhivel — sempre fechado até ele tocar, nunca
  // abrindo sozinho por ter rotina atrasada (Diego, 04/08: "ao abrir o app as rotinas pendentes já abrem,
  // quero que abra só depois de eu clicar"). Como quase sempre há alguma atrasada — lavar o carro, backup —,
  // o automatismo que existia pra chamar atenção era o estado normal, e o que é sempre urgente não é urgente.
  // O título já diz quantas estão atrasadas: isso basta pra decidir se vale abrir agora.
  const atrasadas = pendentes.filter((x) => x.st.estado === "vencida");
  const doDia = pendentes.filter((x) => x.st.estado !== "vencida");
  const linha = ({ r, st }) => <article className={`rotina-item ${st.estado === "vencida" ? "cor-alta" : "cor-media"}`} key={r.id}>
    <div className="rotina-esq">
      <strong>{r.titulo}</strong>
      <span>a cada {r.intervalo_dias} dia(s){r.hora ? ` · ${horaFalada(r.hora)}` : ""}{r.observacao ? ` · ${r.observacao}` : ""}</span>
    </div>
    <div className="rotina-dir">
      <em className={st.estado === "vencida" ? "atrasada" : ""}>{textoRotina(st)}</em>
      <div className="agenda-acoes">
        <button className="ghost" disabled={busyId === r.id} onClick={() => marcarFeita(r, hoje)}>{busyId === r.id ? "..." : "✓ Fiz hoje"}</button>
        <button className="ghost" disabled={busyId === r.id} onClick={() => marcarFeita(r, ontem)}>Fiz ontem</button>
      </div>
    </div>
  </article>;
  return <CardRecolhivel
    cabecalho={<><p className="kicker">ROTINAS RECORRENTES</p><h3>{pendentes.length} rotina(s) pra hoje</h3></>}
    resumo={<p className="ficha-note">{atrasadas.length ? `${atrasadas.length} atrasada(s)` : "Nenhuma atrasada"}{doDia.length ? ` · ${doDia.length} pra hoje` : ""}</p>}>
    {!!atrasadas.length && <><p className="kicker">🔴 ATRASADAS</p><div className="rotina-lista">{atrasadas.map(linha)}</div></>}
    {!!doDia.length && <><p className="kicker" style={{ marginTop: atrasadas.length ? 14 : 0 }}>🟡 PRA HOJE</p><div className="rotina-lista">{doDia.map(linha)}</div></>}
  </CardRecolhivel>;
}

// ===== DOMÍNIO PESSOAIS (item APP-PESSOAIS-CARD-20260824-2145 + adendo CROSSDOMAIN-20260824-2150) =====
//
// REGRA-MÃE: NOTIFICAÇÃO/VENCIMENTO NÃO É CONCLUSÃO. O problema que este card existe pra resolver é o
// lembrete que ele vê passar e ignora — a data chegar não prova que a coisa foi feita. Por isso ATRASADO
// é DERIVADO, nunca gravado: a passagem da data não escreve nada no banco. Se escrevesse, "venceu" viraria
// um evento, e um dia alguém confundiria evento com cumprimento. Só ação explícita muda o estado.
function pessoalAtrasado(p, hoje) { return p.status === "PENDENTE" && !!p.data_alvo && p.data_alvo < hoje; }
const PESSOAL_ASSINATURA_GPT = "PAINEL — ABRIR COMPROMISSO PESSOAL";
const PESSOAL_INSTRUCAO_GPT = "Localize o compromisso pessoal atual pelo identificador acima antes de responder. Se qualquer ação puder alterar a disponibilidade da Operação Bahia, considere também o bloqueio operacional vinculado. Não trate este texto compartilhado como prova de estado atual e não invente detalhes pessoais ausentes.";

function PessoaisCard({ pessoais, hoje, db, demo, notify, onChanged }) {
  const [verConcluidos, setVerConcluidos] = useState(false);
  const [remarcando, setRemarcando] = useState(null);
  const [dataDraft, setDataDraft] = useState("");
  const [busy, setBusy] = useState(null);
  const [avisoGPT, setAvisoGPT] = useState("");

  const ativos = (pessoais || []).filter((p) => p.status === "PENDENTE");
  const encerrados = (pessoais || []).filter((p) => p.status !== "PENDENTE");
  const atrasados = ativos.filter((p) => pessoalAtrasado(p, hoje));
  const proximo = ativos.filter((p) => !pessoalAtrasado(p, hoje)).sort((a, b) => String(a.data_alvo || "9999").localeCompare(String(b.data_alvo || "9999")))[0];
  if (!pessoais || !pessoais.length) return null;

  // O BLOQUEIO SEGUE O ITEM, SEMPRE. O compromisso pessoal é o fato canônico; a linha de agenda com
  // pessoal_id é só indisponibilidade. Concluir/cancelar encerra o bloqueio, remarcar move o bloqueio —
  // e se essa segunda parte falhar, o Diego PRECISA saber, senão fica com "pessoal novo + bloqueio velho"
  // sem ninguém perceber. Falha parcial visível é requisito, não capricho.
  const sincronizarBloqueio = async (pessoalId, patch) => {
    const { error } = await db.from("agenda").update(patch).eq("pessoal_id", pessoalId).eq("status", "planejado");
    if (error) throw new Error("o bloqueio da agenda NÃO acompanhou (" + error.message + ") — refaça a ação");
  };

  const concluir = async (p) => {
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    setBusy(p.id);
    try {
      const agora = new Date().toISOString();
      const { error } = await db.from("pessoais").update({ status: "CONCLUIDO", concluido_em: agora, atualizado_em: agora }).eq("id", p.id);
      if (error) throw error;
      await sincronizarBloqueio(p.id, { status: "feito" });
      notify("Concluído. Continua guardado no histórico.", "ok");
      await onChanged?.();
    } catch (e) { notify("Não concluí: " + e.message, "error"); } finally { setBusy(null); }
  };

  const remarcar = async (p) => {
    if (!dataDraft) { notify("Escolha a data nova.", "error"); return; }
    if (demo) { notify("Na demonstração não salva.", "info"); setRemarcando(null); return; }
    setBusy(p.id);
    try {
      const agora = new Date().toISOString();
      // Rastreável de propósito: guarda de onde veio e conta quantas vezes já andou. Item que remarca
      // toda semana é informação sobre a vida dele, não ruído.
      const { error } = await db.from("pessoais").update({
        data_alvo: dataDraft, remarcado_de: p.data_alvo || null,
        remarcacoes: Number(p.remarcacoes || 0) + 1, atualizado_em: agora,
      }).eq("id", p.id);
      if (error) throw error;
      await sincronizarBloqueio(p.id, { data: dataDraft });
      notify("Remarcado para " + compactDate(dataDraft) + ".", "ok");
      setRemarcando(null); setDataDraft("");
      await onChanged?.();
    } catch (e) { notify("Não remarquei: " + e.message, "error"); } finally { setBusy(null); }
  };

  const linha = (p) => {
    const atrasado = pessoalAtrasado(p, hoje);
    return <article className={`funil-item${atrasado ? " st-lead" : ""}`} key={p.id}>
      <div className="funil-esq">
        <strong>{p.titulo}</strong>
        {/* Horário só aparece quando existe. Compromisso sem hora marcada não ganha hora inventada. */}
        <span>{p.data_alvo ? compactDate(p.data_alvo) : "Sem data marcada"}{p.hora ? " · " + String(p.hora).slice(0, 5) : " · sem horário"}{p.cidade ? " · " + p.cidade : ""}</span>
        {p.descricao && <em>{p.descricao}</em>}
        {p.remarcacoes > 0 && <em>Já remarcado {p.remarcacoes}x{p.remarcado_de ? " · antes era " + compactDate(p.remarcado_de) : ""}</em>}
      </div>
      <div className="funil-dir">
        <span className="status-pill">{atrasado ? "⚠ ATRASADO" : p.status}</span>
        {p.impacto_operacao === "BLOQUEIA_DISPONIBILIDADE" && <span className="responsavel-badge">⛔ Bloqueia agenda</span>}
        {p.impacto_operacao === "A_CONFIRMAR" && p.status === "PENDENTE" && <span className="responsavel-badge">? Impacto a confirmar</span>}
      </div>
      {p.status === "PENDENTE" && <div className="ficha-actions" style={{ width: "100%" }}>
        <button className="ghost" disabled={busy === p.id} onClick={() => concluir(p)}>{busy === p.id ? "..." : "✓ Concluir"}</button>
        <button className="ghost" disabled={busy === p.id} onClick={() => { setRemarcando(remarcando === p.id ? null : p.id); setDataDraft(p.data_alvo || ""); }}>{remarcando === p.id ? "Cancelar" : "↻ Remarcar"}</button>
        {/* Mesmo princípio do botão do cliente: leva IDENTIDADE, não detalhe. Nada de descrição, motivo
            médico, nome de escola ou histórico — só o id, o título e a data. */}
        <button className="ghost" onClick={() => compartilharGPT(payloadGPT([
          ["pessoal_id", p.id], ["titulo", p.titulo], ["data_alvo", p.data_alvo], ["impacto_operacao", p.impacto_operacao],
        ], PESSOAL_ASSINATURA_GPT, PESSOAL_INSTRUCAO_GPT), (msg) => setAvisoGPT(msg))}>💬 ChatGPT</button>
      </div>}
      {remarcando === p.id && <div className="responsavel-edit-row" style={{ width: "100%" }}>
        <input type="date" value={dataDraft} onChange={(e) => setDataDraft(e.target.value)} autoFocus />
        <button className="ghost" disabled={busy === p.id} onClick={() => remarcar(p)}>Salvar data</button>
      </div>}
    </article>;
  };

  const lista = verConcluidos ? encerrados : ativos;
  return <CardRecolhivel
    className={atrasados.length ? "content-card warning-card" : "content-card"}
    cabecalho={<><p className="kicker">PESSOAIS</p>
      <h3>{ativos.length} pendente(s){atrasados.length ? ` · ${atrasados.length} atrasado(s)` : ""}</h3>
      {proximo && <span className="ficha-note" style={{ margin: 0 }}>Próximo: {proximo.titulo}{proximo.data_alvo ? " · " + compactDate(proximo.data_alvo) : ""}</span>}</>}
    resumo={avisoGPT ? <p className="ficha-note">{avisoGPT}</p> : null}>
    <div>
      <div className="funil-filtros">
        <button className={verConcluidos ? "" : "active"} onClick={() => setVerConcluidos(false)}>Ativos</button>
        <button className={verConcluidos ? "active" : ""} onClick={() => setVerConcluidos(true)}>Concluídos</button>
      </div>
      {lista.length ? <div className="funil-lista">{[...lista].sort((a, b) => String(a.data_alvo || "9999").localeCompare(String(b.data_alvo || "9999"))).map(linha)}</div>
        : <div className="empty-state"><b>{verConcluidos ? "Nada concluído ainda." : "Nenhuma pendência pessoal aberta."}</b></div>}
    </div>
  </CardRecolhivel>;
}

// ─────────────────────────────────────────────────────────────────────────────────────────────────
// CLASSIFICADOR ÚNICO DE FLUXO DO SERVIÇO — item PAINEL DE SERVIÇOS FECHADOS SEM AVANÇO (01/09/2026).
//
// O defeito era de RÓTULO, e rótulo errado esconde a causa: o app juntava "não existe texto em
// `proxima_acao`" com "existe ação escrita, mas não há mais nada representando a continuidade" debaixo
// do mesmo título "sem próximo passo".
//
// Caso que revelou (Fabrício, serviço 2aa66eac): `proxima_acao` diz "Combinar horário e retirar o sofá
// até 04-09-2026". Ele NÃO está sem próxima ação — está sem RETIRADA, porque o compromisso de 04/09 foi
// cancelado e ninguém remarcou. Com R$ 2.800 já recebidos. Chamar isso de "sem próxima ação" faz o Diego
// procurar o problema no lugar errado: ele vai ler a frase, ver que existe, e fechar o card.
//
// Uma função só, consumida por Painel, Funil e Capacidade — o recado pede isso explicitamente, e é a
// razão de existir: três telas com três critérios divergentes foi como a Nurimar "sumiu" em agosto.
const FLUXO_TERMINAIS = ["entregue", "pago", "perdido"];
const FLUXO_FECHADOS = ["agendado", "producao"];
// `ctx` traz o estado vivo já indexado: quem monta é `contextoDeFluxo`, uma vez por render, e não cada
// tela do seu jeito.
function classificarFluxoServico(servico, ctx) {
  const s = servico || {};
  if (FLUXO_TERMINAIS.includes(s.status)) return { estado: "normal", causa: "" };
  const temAcao = !!String(s.proxima_acao || "").trim();
  // SEM PRÓXIMA AÇÃO é literal: o campo está vazio. Vale pra qualquer status não terminal, inclusive
  // lead/orçamento — lá é funil comercial, e quem mostra é a aba Leads.
  if (!temAcao) return { estado: "sem_acao", causa: "sem próxima ação definida" };
  // Daqui pra baixo só entra trabalho FECHADO. Lead com próxima ação escrita e sem compromisso é
  // funil normal, não serviço parado — trazer os ~20 pro Painel afogaria os que têm móvel na oficina.
  if (!FLUXO_FECHADOS.includes(s.status)) return { estado: "normal", causa: "" };
  // Remarcação aberta = já está na fila esperando data. Não é esquecimento, e duplicar o aviso aqui
  // seria pedir que ele resolva duas vezes a mesma coisa.
  if (ctx?.emRemarcacao?.has(s.id)) return { estado: "normal", causa: "" };
  // Compromisso planejado é encaminhamento ativo — é o caso normal e sai daqui primeiro.
  if (ctx?.comCompromisso?.has(s.id)) return { estado: "normal", causa: "" };

  // Sem compromisso ativo. Agora a pergunta é POR QUE, e a resposta mais útil vem do histórico:
  // se existia um compromisso e ele foi cancelado, isso é o que precisa ser refeito.
  const cancelado = ctx?.canceladoPorServico?.get(s.id);
  if (cancelado) {
    // O título do compromisso cancelado diz o que era (retirada, entrega, visita) — usar o texto dele é
    // melhor que qualquer rótulo meu, porque foi escrito por quem sabia do caso.
    const oQueEra = String(cancelado.titulo || "").replace(/^PROVIS[ÓO]RIO\s*—\s*/i, "").trim();
    return { estado: "precisa_avancar", causa: `${oQueEra || "compromisso"} foi cancelado — precisa combinar nova data` };
  }
  // MATERIAL É EXPLICAÇÃO SUFICIENTE, e tem card próprio. Duplicar aqui é o "alerta que dá trabalho".
  if (ctx?.esperandoMaterial?.has(s.id)) return { estado: "normal", causa: "" };
  if (s.status === "producao" && !String(s.responsavel || "").trim()) {
    return { estado: "precisa_avancar", causa: "em produção sem profissional atribuído" };
  }
  return { estado: "precisa_avancar", causa: "nunca teve compromisso marcado" };
}
// Índices montados UMA vez. `appointments` são só os planejados (é a carga do app); `agendaHistorico`
// traz cancelada/feita só pra explicar. Agenda cancelada nunca conta como encaminhamento ativo, e agenda
// feita nunca conta como próximo evento — os dois critérios saem de graça dessa separação.
