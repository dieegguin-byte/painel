<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- ZOOM DE DOIS DEDOS DESLIGADO (Diego, 23/08/2026: "zoom com dois dedos... é para tirar").
     Ele usa o app em pé na oficina e dentro do carro: o dedo encosta na tela, a pinça dispara
     sozinha e a tela sai de escala no meio da leitura. Como o app agora é só visualização e
     todo o texto já é dimensionado pra celular, ampliar não resolve nada — só atrapalha.
     Vai nas duas frentes porque uma só não segura: o meta cobre o Android, e o touch-action
     no CSS cobre navegador que ignora user-scalable. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0d0c">
<title>Nova Central Operacional — Tapeçaria Bahia</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<!-- SEM ISTO NAO EXISTE APP INSTALADO. So o index.html (o antigo) apontava pro manifest, entao instalar a
     partir daqui gerava um atalho pelado: sem nome, sem icone maskable, sem "Compartilhar pro painel" - e o
     Share Target nunca ia aparecer no WhatsApp por mais certo que o manifest estivesse. Descoberto em 07/08. -->
<link rel="manifest" href="./manifest.webmanifest">
<!-- TELA PRETA (22/08/2026). O app instalado abriu preto, mudo, antes até da tela de login. As quatro
     bibliotecas vinham por <script src> direto de UMA fonte só (jsdelivr) e o service worker as serve do
     cache. Basta uma delas faltar, vir truncada ou vir trocada por página de portal de operadora para o
     "Babel is not defined" acontecer ANTES de qualquer pixel — e como o fundo do app é escuro, o que sobra
     é uma tela preta sem uma linha de explicação.
     Agora cada biblioteca tem três tentativas: jsdelivr normal, jsdelivr furando o cache (a URL muda, então
     o service worker é obrigado a ir na rede) e o espelho unpkg. E só conta como carregada se o objeto
     global existir de verdade — carregar 200 de lixo não vale. Se mesmo assim faltar, quem aparece é a tela
     de socorro do fim do arquivo, com o motivo escrito e o botão de limpar o cache. Nunca mais tela preta. -->
<script>
window.TB = window.TB || {};
(function () {
  const LIB = {
    supabase: '@supabase/supabase-js@2/dist/umd/supabase.js',
    React: 'react@18.3.1/umd/react.production.min.js',
    ReactDOM: 'react-dom@18.3.1/umd/react-dom.production.min.js',
    Babel: '@babel/standalone@7/babel.min.js'
  };
  TB.faltando = [];

  function baixar(url) {
    return new Promise((ok, falhou) => {
      const s = document.createElement('script');
      s.src = url;
      s.onload = ok;
      s.onerror = () => falhou(new Error('não baixou ' + url));
      document.head.appendChild(s);
    });
  }

  async function garantir(nome) {
    if (window[nome]) return;
    const caminho = LIB[nome];
    const tentativas = [
      'https://cdn.jsdelivr.net/npm/' + caminho,
      'https://cdn.jsdelivr.net/npm/' + caminho + '?tb=' + Date.now(),
      'https://unpkg.com/' + caminho
    ];
    for (const url of tentativas) {
      try { await baixar(url); } catch (e) { continue; }
      if (window[nome]) return;
    }
    TB.faltando.push(nome);
  }

  // ReactDOM só executa depois do React; os outros dois são independentes e vão em paralelo,
  // senão a abertura ficaria mais lenta do que era com as quatro tags soltas.
  TB.carregarTudo = async function () {
    await Promise.all([
      garantir('supabase'),
      garantir('Babel'),
      garantir('React').then(() => garantir('ReactDOM'))
    ]);
    if (TB.faltando.length) throw new Error('não carregou: ' + TB.faltando.join(', '));
  };

  // Guarda o primeiro erro real da página. É o que o Diego consegue me mandar quando algo quebrar.
  window.addEventListener('error', (ev) => {
    if (!TB.primeiroErro) TB.primeiroErro = (ev.message || 'erro') + (ev.filename ? ' — ' + String(ev.filename).split('/').pop() : '');
  });
  window.addEventListener('unhandledrejection', (ev) => {
    const r = ev.reason;
    if (!TB.primeiroErro) TB.primeiroErro = 'promessa rejeitada: ' + (r && r.message ? r.message : String(r));
  });

  TB.limparTudo = async function () {
    try {
      if (window.caches) {
        const chaves = await caches.keys();
        await Promise.all(chaves.map((k) => caches.delete(k)));
      }
      if (navigator.serviceWorker) {
        const registros = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registros.map((r) => r.unregister()));
      }
    } catch (e) { /* se não deu pra limpar, recarregar ainda é melhor que ficar parado */ }
    location.replace(location.pathname + '?limpo=' + Date.now());
  };

  TB.telaDeSocorro = function (motivo) {
    const alvo = document.getElementById('root');
    if (!alvo || alvo.dataset.socorro === '1') return;
    alvo.dataset.socorro = '1';
    const detalhe = [motivo, TB.primeiroErro].filter(Boolean).join(' | ');
    alvo.innerHTML =
      '<div class="loading-screen"><div class="login-card">' +
        '<div class="brand-seal">TB</div>' +
        '<h1 style="font:500 26px Georgia,serif;margin:0 0 10px">O app não conseguiu abrir</h1>' +
        '<p>Quase sempre é o celular servindo uma cópia velha e quebrada do app. O botão abaixo apaga essa cópia e baixa tudo de novo. Seus dados estão no servidor, não se perde nada.</p>' +
        '<button class="primary wide" id="tb-limpar">Limpar e abrir de novo</button>' +
        '<button class="ghost wide" id="tb-tentar" style="margin-top:10px">Só tentar de novo</button>' +
        '<p style="font-size:10px;color:#81736a;margin:16px 0 0;word-break:break-word">' + String(detalhe).replace(/[<>]/g, '') + '</p>' +
      '</div></div>';
    document.getElementById('tb-limpar').onclick = TB.limparTudo;
    document.getElementById('tb-tentar').onclick = () => location.reload();
  };
})();
</script>

*{box-sizing:border-box}html,/* Par do meta viewport: sem pinça e sem duplo-toque, mesmo onde user-scalable=no é ignorado.
   `pan-y` e não `pan-x pan-y` (Diego, 23/08: "tem umas abas que vai para um lado e para o
   outro um pouco, não poderia ter essa folguinha"): com pan-x a PÁGINA INTEIRA aceitava o
   arrasto lateral e escorregava sem ter pra onde ir. Só a barra de abas precisa deslizar —
   ela pede o pan-x pra si logo abaixo. `overscroll-behavior-x:none` mata o repique elástico. */
html,body{touch-action:pan-y;overscroll-behavior-x:none}
/* A barra de abas é o único lugar que desliza de propósito: 9 abas não cabem em 375px.
   `contain` impede que, ao chegar no fim dela, o gesto vaze e arraste a página junto — que
   é exatamente a sensação de folga que ele descreveu. */
.mobile-nav{touch-action:pan-x;overscroll-behavior-x:contain}

/* `minmax(0,1fr)` na coluna unica do .page-grid e a trava de raiz da tela inteira. Sem colunas
   declaradas o grid cria uma coluna implicita `auto`, que e dimensionada pelo min-content do
   maior filho: bastava UMA secao com min-content de 334px pra coluna virar 334 dentro de um
   contedor de 290 e jogar TODAS as secoes pra fora da tela. Com minmax(0,...) a coluna nunca
   passa da largura disponivel e o conteudo se vira quebrando linha — que e o que ele ja sabe
   fazer (forcando a secao a 290px, nada transbordava). */
.page-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:15px}
/* `minmax(0,1fr)` e nao `1fr`: uma trilha `1fr` tem minimo implicito de min-content, entao ela
   se RECUSA a encolher abaixo do texto e estica a grade. Como a grade estica, o pai estica, e
   todo irmao (filtros, barra do mes, botao "Ver tudo") herda largura maior que a tela e some
   na borda. Diego, 24/08: "financeiro e profissionais voltou a ficar cortando descentralizado".
   Medido: com a escala de texto do Android em 130%, "R$ 20.342,65" a 34px pede 190px por
   cartao; dois cartoes davam pagina de 399px numa tela de 320. Ver [[reference-painel-texto-cortado-layout]]. */
.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric-card{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;min-height:112px;min-width:0}.metric-card>span{font-size:8px;text-transform:uppercase;color:var(--dim);letter-spacing:.7px}.metric-card>b{display:block;font-size:26px;margin:11px 0 4px}.metric-card small{color:var(--muted);font-size:9px}.metric-card.orange>b{color:var(--orange2)}.metric-card.red>b{color:#e88477}.metric-card.yellow>b{color:#e4bd72}.metric-card.green>b{color:#9bc7a7}.metric-card.clickable{cursor:pointer;transition:border-color .15s,transform .15s}.metric-card.clickable:hover{border-color:var(--dim);transform:translateY(-1px)}.metric-card.clickable:active{transform:translateY(0)}.content-card{background:linear-gradient(145deg,#1b1613,#15110f);border:1px solid var(--line);border-radius:18px;padding:18px}.content-card.full{min-height:560px}.card-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:14px}.card-head h3{font:500 22px Georgia,serif;margin:0}
.card-toggle{width:100%;display:flex;justify-content:space-between;gap:15px;align-items:center;background:transparent;border:0;color:inherit;text-align:left;padding:0;margin:0}.card-toggle>div{min-width:0}.card-toggle h3{font:500 22px Georgia,serif;margin:0}.card-toggle>i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);flex:none;white-space:nowrap}.card-toggle:hover>i{color:#e0cbb8}.card-toggle[aria-expanded="true"]>i{color:var(--orange2)}.card-corpo{margin-top:14px}
.search{width:min(300px,45%);margin:0}.priority-row{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:11px;padding:11px 3px;border-bottom:1px solid var(--line)}.priority-row:last-child{border-bottom:0}.priority{width:8px;height:8px;border-radius:50%;background:var(--yellow)}.priority.alta{background:var(--red)}.priority.baixa{background:var(--green)}.priority-row strong,.priority-row span{display:block}.priority-row strong{font-size:11px;margin-bottom:3px}.priority-row span,.priority-row time{font-size:9px;color:var(--dim)}.warning-card{padding:15px 18px;border-radius:14px;background:#df6a5d12;border:1px solid #df6a5d3f}.warning-card b,.warning-card span{display:block}.warning-card b{font-size:12px}.warning-card span{font-size:9px;color:var(--muted);margin-top:3px}/* PAINEL: cards de acao grandes (o que fazer + mensagem pronta + WhatsApp) */

/* ==========================================================================
   TEXTO CORTADO NAS LINHAS DE VALOR — Diego, 23/08/2026:
   "desalinhamento está comendo palavras na visualização, está cortando textos,
    por isso estava movendo com folguinha"
   Ele arrastava a tela pro lado pra conseguir ler o pedaço escondido. Quando eu
   tirei a folga lateral, tirei junto o jeito dele de enxergar o texto cortado —
   o deslize era sintoma, o corte é a doença.

   CAUSA MEDIDA: as linhas de Financeiro, Profissionais e Compras são flex com
   descrição à esquerda e valor à direita. O valor tinha `flex-shrink:1` e quebra
   normal, então uma descrição longa (as do acerto do Marcão passam de 100
   caracteres) espremia o valor até sobrar 56px — e "− R$ 1.350,00" se partia em
   SETE linhas, quase um caractere por linha. Medido no app, não deduzido.

   REGRA: dinheiro nunca encolhe e nunca quebra; quem cede espaço é o texto, que
   tem lugar pra quebrar. `min-width:0` é obrigatório no lado do texto — sem ele
   um item flex se recusa a encolher abaixo do conteúdo e empurra o vizinho.
   ========================================================================== */
.finance-row>b,.finance-row>strong:last-child,.plano-linha>b,.plano-linha>strong:last-child,
.conta-linha>b,.vale-linha>b{white-space:nowrap;flex:0 0 auto}
.finance-row>div,.plano-linha>span,.plano-linha>div,.conta-linha>div{min-width:0}
.finance-row strong,.finance-row span,.plano-linha strong,.plano-linha span,
.compra-item-nome,.compra-item-loja{overflow-wrap:break-word}
/* O item de compra também é flex: o nome precisa poder quebrar em vez de empurrar
   o checkbox e o botão de remover pra fora da tela. */
.compra-item>span{min-width:0}

/* PROFISSIONAIS — o cabeçalho de cada conta tem o mesmo defeito: nome à esquerda,
   valor à direita, flex sem proteção. "Marcão" cabe; "Marlom Júnior" com
   "R$ 1.250,00 adiantado demais" ao lado não cabe, e aí um dos dois é triturado.
   A primeira correção só pegou `.finance-row` e deixou este de fora. */
/* `flex-wrap:wrap` como valvula: o nome ja encolhe (min-width:0) e o valor nunca quebra
   (nowrap), mas em tela de 320 a soma "nome + R$ 150,00 adiantado demais" ainda estourava.
   Quando nao couber lado a lado, o valor desce pra linha de baixo em vez de empurrar a pagina. */
.vale-fornecedor-head{gap:10px;align-items:baseline;flex-wrap:wrap}
.vale-fornecedor-head strong{min-width:0;overflow-wrap:break-word}
.vale-fornecedor-head b{white-space:nowrap;flex:0 0 auto}

/* COMPRAS — mesmo caso no cabeçalho da loja e no do cliente. */
.compra-loja-head strong{min-width:0;overflow-wrap:break-word}
.compra-loja-head>*:last-child{flex:0 0 auto}
.compra-cliente-head strong,.compra-cliente-head span{overflow-wrap:break-word}
.compra-item-nome{min-width:0}

@media(max-width:850px){
  /* A data e o status da linha financeira estavam em 8px no celular — menor que a
     letra miúda de contrato. Ele lê isso em pé na oficina e dentro do carro. */
  .finance-row strong{font-size:14px}
  .finance-row span{font-size:12px}
  .finance-row>b{font-size:14px}
  .finance-row{gap:10px}
  /* 11px em cabeçalho de conta e em chip de loja: mesma história. */
  .vale-fornecedor-head{font-size:13px}
  .compra-loja-chip{font-size:12px}
  .compra-item-loja{font-size:12px}

  /* COMPRAS ERA CAIXA DENTRO DE CAIXA DENTRO DE CAIXA. Medido a 375px: dos 375 do
     celular, 98 iam embora só em recuo (15 do workspace + 18 do cartão + 12 do bloco
     do cliente + 4 do item, de cada lado). Sobravam 183px pro nome do item, que então
     quebrava em 3 linhas. Nenhum outro lugar do app empilha quatro níveis assim.
     Apertando os dois níveis internos o nome ganha ~28px e cabe em bem menos linhas,
     sem mudar nada nas outras telas. */
  .content-card .compra-cliente{padding-left:8px;padding-right:8px}
  .compra-item{padding-left:0;padding-right:0}
}

/* ==========================================================================
   O ESTOURO DE VERDADE DA ABA COMPRAS — medido, não deduzido.
   O chip de loja tinha `white-space:nowrap`. Com nome curto ("Ozair") isso é
   inofensivo, mas os nomes reais da operação são frases inteiras:
     "Afibracom (Linho Klee 09 + carpete) + Ozair (D33 selada)"
     "Ellis Tecidos (A91 → Uber para Afibracom) + Afibracom (carpete / consolidação)"
   Um chip desses mede 341px e não pode quebrar, então empurra a PÁGINA para 394px
   numa tela de 375. A página inteira fica mais larga que o celular — e é aí que o
   texto some na borda e ele precisa arrastar pro lado pra ler. Era esta a origem
   da "folguinha", não a rolagem em si.
   Deixar o chip quebrar resolve sem esconder nome nenhum.
   ========================================================================== */

// O pushManager exige a chave como bytes, não como texto.
function chavePushEmBytes(b64) {
  const normal = (b64 + "=".repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(normal);
  const saida = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) saida[i] = bin.charCodeAt(i);
  return saida;
}

// BOTÃO DE LIGAR/DESLIGAR O AVISO. Fica no cabeçalho porque precisa ser achável sem procurar: se ele
// desinstalar e reinstalar o app, o Android cria OUTRO endpoint e a assinatura antiga morre — ele tem
// que conseguir religar sozinho, sem pedir socorro.
//
// PERMISSÃO SÓ SE PEDE UMA VEZ DE VERDADE: negada no Android, o navegador não pergunta de novo, tem que
// ir nos ajustes do sistema. Por isso o pedido acontece só no clique — nunca sozinho ao abrir o app.
function BotaoNotificacao({ db, demo, notify }) {
  const [estado, setEstado] = useState("checando");

  useEffect(() => {
    let vivo = true;
    (async () => {
      const temSuporte = "Notification" in window && "serviceWorker" in navigator && "PushManager" in window;
      if (demo || !db || !temSuporte) { if (vivo) setEstado("indisponivel"); return; }
      if (Notification.permission === "denied") { if (vivo) setEstado("negado"); return; }
      try {
        const reg = await navigator.serviceWorker.ready;
        const assinatura = await reg.pushManager.getSubscription();
        if (vivo) setEstado(assinatura && Notification.permission === "granted" ? "ligado" : "desligado");
      } catch (e) { if (vivo) setEstado("desligado"); }
    })();
    return () => { vivo = false; };
  }, [db, demo]);

  const ligar = useCallback(async () => {
    setEstado("ligando");
    try {
      const permissao = await Notification.requestPermission();
      if (permissao !== "granted") {
        setEstado(permissao === "denied" ? "negado" : "desligado");
        notify("A permissão de notificação não foi concedida.", "error");
        return;
      }
      const reg = await navigator.serviceWorker.ready;
      let assinatura = await reg.pushManager.getSubscription();
      if (!assinatura) {
        assinatura = await reg.pushManager.subscribe({
          // Obrigatório no Chrome: promete que todo push recebido vira notificação visível. O sw.js
          // cumpre isso mostrando um aviso genérico mesmo quando a carga vem vazia.
          userVisibleOnly: true,
          applicationServerKey: chavePushEmBytes(VAPID_PUBLICA),
        });
      }
      const chaves = assinatura.toJSON().keys || {};
      // O endpoint é a identidade do aparelho. Upsert por ele: religar no mesmo celular atualiza a linha
      // em vez de criar uma segunda, que faria toda notificação chegar duplicada.
      const { error } = await db.from("push_assinaturas").upsert({
        endpoint: assinatura.endpoint,
        p256dh: chaves.p256dh,
        auth: chaves.auth,
        aparelho: String(navigator.userAgent || "").slice(0, 180),
        ativo: true, falhas: 0, ultimo_erro: null,
      }, { onConflict: "endpoint" });
      if (error) throw error;
      setEstado("ligado");
      notify("Aviso ligado neste aparelho.", "ok");
    } catch (e) {
      setEstado("desligado");
      notify("Não deu pra ligar o aviso: " + (e?.message || e), "error");
    }
  }, [db, notify]);

  const desligar = useCallback(async () => {
    try {
      const reg = await navigator.serviceWorker.ready;
      const assinatura = await reg.pushManager.getSubscription();
      if (assinatura) {
        // Desativa no banco ANTES de cancelar no aparelho: se a ordem fosse inversa e a rede caísse no
        // meio, o servidor continuaria mandando push pra um endpoint que já não existe mais.
        await db.from("push_assinaturas").update({ ativo: false }).eq("endpoint", assinatura.endpoint);
        await assinatura.unsubscribe();
      }
      setEstado("desligado");
      notify("Aviso desligado neste aparelho.", "info");
    } catch (e) { notify("Não deu pra desligar: " + (e?.message || e), "error"); }
  }, [db, notify]);

  if (estado === "indisponivel" || estado === "checando") return null;
  if (estado === "negado") {
    return <button className="ghost" onClick={() => notify("A permissão está bloqueada pelo Android. Abra os ajustes do site no celular e libere a notificação.", "error")}>🔕 Aviso bloqueado</button>;
  }
  if (estado === "ligado") return <button className="ghost" onClick={desligar} title="Este aparelho está recebendo os avisos">🔔 Aviso ligado</button>;
  return <button className="ghost" onClick={ligar} disabled={estado === "ligando"}>{estado === "ligando" ? "Ligando…" : "🔔 Ativar aviso"}</button>;
}

    const ano = dataExplicita[3] ? (dataExplicita[3].length === 2 ? 2000 + Number(dataExplicita[3]) : Number(dataExplicita[3])) : hoje.getFullYear();

o cliente ("aguardar resposta"), deixar aberta e só ajustar revisar_em. O Diego nunca escolhe data pelo app: ele explica o que aconteceu, e só existe compromisso quando alguém de fato decidiu uma data.

// horário, Compras. Antes só o Painel filtrava; qualquer outro consumidor da lista bruta `appointments`

function compromissosOperacionais(appointments, inbox) {
  const idsEscondidos = new Set(pendenciasRemarcacaoAbertas(inbox).map(({ meta }) => meta.agenda_origem_id).filter(Boolean));

async function criarPendenciaRemarcacao(db, args) {

      const msgs = existente.conversa || [];

      const motivoRepetido = (ultima.motivo || "").trim() === motivoLimpo;
      if (!motivoRepetido) {
        const conversaNova = [...msgs, { de: "diego", tipo: "atualizacao_remarcacao", texto: motivoLimpo, em: agora, meta: { ...ultima, motivo: motivoLimpo, agenda_sucessora_id: null } }];
        const { error: upErr } = await db.from("caixa_entrada").update({ conversa: conversaNova }).eq("id", existente.id); if (upErr) throw upErr;

    tipo_operacional: "remarcacao", versao: 1,

    subestado: "precisa_remarcar", titulo_original: tituloOriginal || null,

// RESOLVER quando existe DATA REAL combinada. Duas estratégias, decididas pelo estado ATUAL da origem (não
// por suposição): se ela ainda está "planejado", nunca foi uma tentativa que aconteceu — é só remarcada NO
// MESMO REGISTRO, sem criar linha nova. Se já está "feito", a origem foi mesmo tentada e encerrada; nasce um
// compromisso NOVO vinculado ao serviço. Nos dois casos grava agenda_sucessora_id ANTES de marcar resolvida.
async function resolverPendenciaComSucessor(db, { pendenciaId, agendaOrigemId, servicoId, data, hora, tipo, cidade, tituloNovo }) {
  const { data: pend, error: leituraErr } = await db.from("caixa_entrada").select("id,conversa,processado,status").eq("id", pendenciaId).single();
  if (leituraErr) throw leituraErr;
  const meta = ultimaMetaRemarcacao(pend);
  if (!meta) throw new Error("Item não é uma pendência de remarcação em aberto.");
  const origemId = meta.agenda_origem_id || agendaOrigemId || null;
  const alvoServicoId = meta.servico_id || servicoId || null;
  if (agendaOrigemId && meta.agenda_origem_id && agendaOrigemId !== meta.agenda_origem_id) throw new Error("A agenda informada não pertence a esta pendência.");
  if (servicoId && meta.servico_id && servicoId !== meta.servico_id) throw new Error("O serviço informado não pertence a esta pendência.");
  if (meta.agenda_sucessora_id) {
    // A sucessora pode ter sido gravada e a aba fechado antes do último UPDATE. Retomar termina a pendência,
    // não cria outro compromisso.
    if (!pend.processado) {
      const { error: resErr } = await db.from("caixa_entrada").update({ status: "resolvido", processado: true, processado_em: new Date().toISOString() }).eq("id", pendenciaId);
      if (resErr) throw resErr;
    }
    return { ok: true, jaResolvida: true, sucessoraId: meta.agenda_sucessora_id };
  }
  if (!data) throw new Error("Informe a data combinada antes de resolver.");
  const tipoFinal = tipo || meta.tipo_original || "remoto";
  const cidadeFinal = tipoFinal === "presencial" ? (cidade || meta.cidade_original || null) : null;
  const horaFinal = tipoFinal === "presencial" ? (hora || null) : null;
  if (tipoFinal === "presencial" && (!cidadeFinal || !horaFinal)) throw new Error("Compromisso presencial exige cidade e hora realmente combinadas.");

  const { data: origem, error: origemErr } = origemId ? await db.from("agenda").select("id,status").eq("id", origemId).maybeSingle() : { data: null, error: null };
  if (origemErr) throw origemErr;

  let sucessoraId;
  if (origem && origem.status === "planejado") {
    // Nunca aconteceu (só foi remarcada antes da data chegar) — atualiza a própria linha, não cria outra.
    const { error: upErr } = await db.from("agenda").update({
      data, hora: horaFinal, tipo: tipoFinal, cidade: cidadeFinal, status: "planejado",
      ...(tituloNovo ? { titulo: tituloNovo } : {}),
    }).eq("id", origemId);
    if (upErr) throw upErr;
    sucessoraId = origemId;
  } else {
    // Foi tentativa real (origem já "feito", ou não existe mais) — nasce um compromisso novo.
    const novoId = await uuidDeterministicoEvento("remarcacao:" + pendenciaId, "agenda-sucessora");
    const { data: novo } = await inserirComIdDeterministico(db, "agenda", novoId, {
      servico_id: alvoServicoId, titulo: tituloNovo || meta.titulo_original || "Compromisso remarcado",
      data, hora: horaFinal, tipo: tipoFinal, cidade: cidadeFinal, status: "planejado",
    }, ["servico_id", "data", "tipo"]);
    sucessoraId = novo.id;
    if (origemId) {
      const historicoId = await uuidDeterministicoEvento("remarcacao:" + pendenciaId, "historico");
      await inserirComIdDeterministico(db, "historico", historicoId, { o_que: "Remarcado", por: "diego", detalhe: "Compromisso de " + (meta.data_original || "?") + " virou novo compromisso em " + data + " (agenda #" + sucessoraId + ")" }, ["o_que", "detalhe"]);
    }
  }

  // Grava a sucessora ANTES de resolver — se cair aqui, o compromisso já existe; só falta marcar a
  // pendência como tratada, e uma nova tentativa de resolução vai achar agenda_sucessora_id preenchido
  // (linha seguinte já devolve jaResolvida:true) em vez de duplicar.
  const indiceMeta = [...(pend.conversa || [])].map((m) => m?.meta?.tipo_operacional).lastIndexOf("remarcacao");
  const conversaNova = (pend.conversa || []).map((m, index) => index === indiceMeta
    ? { ...m, meta: { ...m.meta, agenda_sucessora_id: sucessoraId } } : m);
  const { error: metaErr } = await db.from("caixa_entrada").update({ conversa: conversaNova }).eq("id", pendenciaId);
  if (metaErr) throw metaErr;

  const { error: resErr } = await db.from("caixa_entrada").update({ status: "resolvido", processado: true, processado_em: new Date().toISOString() }).eq("id", pendenciaId);
  if (resErr) throw resErr;
  return { ok: true, jaResolvida: false, sucessoraId };
}
// RESOLVER SEM SUCESSOR — só permitido quando o serviço chegou num estado terminal (entregue, perdido ou
// pago). É a única exceção a "toda pendência precisa de compromisso novo": cliente desistiu, serviço
// encerrou, não existe mais o que remarcar.
async function resolverPendenciaTerminal(db, { pendenciaId, servicoId }) {
  const { data: pend, error: leituraErr } = await db.from("caixa_entrada").select("id,conversa,processado").eq("id", pendenciaId).single();
  if (leituraErr) throw leituraErr;
  const meta = ultimaMetaRemarcacao(pend);
  if (!meta) throw new Error("Item não é uma pendência de remarcação em aberto.");
  if (meta.agenda_sucessora_id) return { ok: true, jaResolvida: true };
  const alvoServicoId = meta.servico_id || servicoId || null;
  if (servicoId && meta.servico_id && servicoId !== meta.servico_id) throw new Error("O serviço informado não pertence a esta pendência.");
  if (!alvoServicoId) throw new Error("Pendência sem serviço vinculado não pode encerrar como terminal.");
  const { data: svc, error: svcErr } = await db.from("servicos").select("status").eq("id", alvoServicoId).maybeSingle();
  if (svcErr) throw svcErr;
  if (!svc || !["entregue", "perdido", "pago"].includes(svc.status)) throw new Error("Serviço não está em estado terminal (entregue/perdido/pago) — não pode encerrar sem sucessor.");
  if (pend.processado) return { ok: true, jaResolvida: true };
  const { error: resErr } = await db.from("caixa_entrada").update({ status: "resolvido", processado: true, processado_em: new Date().toISOString() }).eq("id", pendenciaId);
  if (resErr) throw resErr;
  return { ok: true, jaResolvida: false };

// ===== PORTA ÚNICA DA OPERAÇÃO BAHIA ==============================================================
// O chat/Claude não deve repetir uma cadeia de UPDATEs por conta própria. Cada fato entra aqui com um id
// estável. A própria chave primária UUID das tabelas vira a trava contra duplo clique, nova aba e reprocessar
// o mesmo documento — sem DDL. Se uma etapa falhar, o checkpoint fica aberto em caixa_entrada e o fato não
// desaparece da operação.

function jsonCanonico(value) {
  if (Array.isArray(value)) return value.map(jsonCanonico);

    if (value[key] !== undefined) out[key] = jsonCanonico(value[key]);
    return out;
  }, {});

}
function metaEventoOperacao(item) {
  const msgs = (item?.conversa || []).filter((m) => m?.meta?.tipo_operacional === TIPO_EVENTO_OPERACAO);

}
async function uuidDeterministicoEvento(eventoId, papel) {
  const hex = await sha256("tapecaria-bahia-operacao-v1|" + String(eventoId) + "|" + String(papel));
  const chars = hex.slice(0, 32).split("");
  chars[12] = "5";
  chars[16] = (8 + (parseInt(chars[16], 16) % 4)).toString(16);
  const h = chars.join("");
  return [h.slice(0, 8), h.slice(8, 12), h.slice(12, 16), h.slice(16, 20), h.slice(20, 32)].join("-");

  if ((a === null || a === undefined || a === "") && (b === null || b === undefined || b === "")) return true;
  if (typeof a === "number" || typeof b === "number") return Number(a) === Number(b);
  return String(a) === String(b);
}
async function inserirComIdDeterministico(db, tabela, id, payload, chavesConferencia) {
  const tentativa = await db.from(tabela).insert({ id, ...payload }).select("*").single();
  if (!tentativa.error) return { data: tentativa.data, jaExistia: false };
  if (tentativa.error.code !== "23505") throw tentativa.error;
  const existente = await db.from(tabela).select("*").eq("id", id).single();
  if (existente.error) throw existente.error;
  const divergente = (chavesConferencia || []).find((key) => !mesmoValorBanco(existente.data?.[key], payload[key]));
  if (divergente) throw new Error("O mesmo evento já existe com conteúdo diferente em " + tabela + "." + divergente + ". Crie uma correção com outro eventoId.");
  return { data: existente.data, jaExistia: true };
}
async function lerRegistro(db, tabela, id, campos = "*") {

  const { data, error } = await db.from(tabela).select(campos).eq("id", id).maybeSingle();
  if (error) throw error;
  return data || null;
}

  const msgs = conversa || [];
  const indice = [...msgs].map((m) => m?.meta?.tipo_operacional).lastIndexOf(TIPO_EVENTO_OPERACAO);
  if (indice < 0) throw new Error("Checkpoint sem metadado operacional.");
  return msgs.map((m, i) => i === indice ? { ...m, meta: { ...m.meta, ...patch, resultado: { ...(m.meta.resultado || {}), ...(patch.resultado || {}) } } } : m);

  if (!eventoId || !tipoEvento) throw new Error("A operação exige tipo e eventoId estável.");
  if (eventoId.length > 180) throw new Error("eventoId longo demais.");
  const fingerprint = await sha256(tipoEvento + "|" + JSON.stringify(jsonCanonico(evento.dados || {})));
  const id = await uuidDeterministicoEvento(eventoId, "checkpoint");
  const agora = new Date().toISOString();
  const meta = {
    tipo_operacional: TIPO_EVENTO_OPERACAO, versao: 1, evento_id: eventoId, tipo_evento: tipoEvento,
    fingerprint, fonte_documento_id: evento.fonteDocumentoId || null, lote_id: evento.loteId || null,
    item_ref: evento.itemRef || null, texto_original: evento.textoOriginal || null,

    texto: "Aplicando operação: " + tipoEvento + " · " + eventoId,
    status: "novo", processado: false,
    conversa: [{ de: "ia", tipo: "sistema", texto: "Checkpoint criado antes de alterar a operação.", em: agora, meta }],
  }, []);

  if (metaAtual.fingerprint !== fingerprint) throw new Error("O mesmo eventoId foi reutilizado com dados diferentes. Registre uma correção com novo id.");
  if (atual.processado && metaAtual.estado === "concluido") return { id, jaConcluido: true, resultado: metaAtual.resultado || {} };
  if (inserido.jaExistia) {
    const conversa = trocarMetaEvento(atual.conversa, { estado: "aplicando", etapa: metaAtual.etapa || "retomada", ultimo_erro: null });
    const { error } = await db.from("caixa_entrada").update({ status: "novo", processado: false, conversa }).eq("id", id);

function validarValorPositivo(value, nome = "valor") {

}
async function registrarFinanceiroDaOperacao(db, eventoId, dados, papel = "financeiro") {
  const existente = dados.financeiroId ? await lerRegistro(db, "financeiro", dados.financeiroId) : null;
  if (dados.financeiroId && !existente) throw new Error("Lançamento financeiro informado não existe.");
  const categoria = String(dados.categoria || existente?.categoria || "Outro");
  let tipo = dados.tipo || existente?.tipo || "saida";
  let escopo = dados.escopo || existente?.escopo || "empresa";
  let status = dados.status || existente?.status || "pago";
  if (!["entrada", "saida"].includes(tipo)) throw new Error("Tipo financeiro inválido.");
  if (!["empresa", "pessoal"].includes(escopo)) throw new Error("Escopo financeiro inválido.");
  if (!["pago", "a_pagar", "a_receber"].includes(status)) throw new Error("Status financeiro inválido.");
  if (categoria === "Vale") { tipo = "saida"; escopo = "empresa"; status = "pago"; }
  if (categoria === CATEGORIA_MATERIAL) {
    tipo = "saida"; escopo = "empresa";
    if (!(dados.fornecedorId || existente?.fornecedor_id)) throw new Error("Material exige fornecedorId.");
  }
  // DINHEIRO DE SERVIÇO SEM DONO NÃO ENTRA (Diego, 30/07: "dê um jeito para não acontecer novamente").
  // O que aconteceu: a entrada da Ana Cristina (R$1.107) e a da Madalena (R$1.250) foram lançadas sem
  // servico_id. O dinheiro estava no caixa, certo — mas o serviço parecia não ter recebido nada, o saldo a
  // receber nunca foi criado, e as duas sumiram da cobrança. Foi preciso o Diego lembrar de cabeça pra achar.
  // Mesma trava do Material com fornecedor: entrada de Serviço tem que dizer DE QUEM é. Só vale pra
  // categoria "Serviço" — saldo inicial, empréstimo, pró-labore e reembolso continuam livres, porque esses
  // legitimamente não pertencem a um serviço.
  // Só na CRIAÇÃO (sem financeiroId). Alterar uma linha que já existe continua livre, senão o botão "Recebi"
  // deixaria de funcionar justamente nos saldos antigos que estão sem serviço — travar o conserto do legado
  // seria o oposto do que se quer.
  if (!dados.financeiroId && ehCategoriaServico(categoria) && tipo === "entrada" && !dados.servicoId) {
    throw new Error("Entrada de Serviço exige servicoId — sem isso o dinheiro entra no caixa mas o serviço fica parecendo não pago, e o saldo a receber some da cobrança.");
  }
  // ANOTAÇÃO DE TRABALHO PODE NASCER SEM VALOR (Diego, 06/08: "ele busca e entrega, eu tenho que ir anotando,
  // depois acertamos"). Na hora em que o Marcão sai pra buscar um móvel o preço daquela corrida muitas vezes
  // ainda não está combinado — exigir valor ali faria ele não anotar, que é justamente o esquecimento que essa
  // parte existe pra evitar. O valor entra depois, e o acerto não fecha enquanto sobrar item sem valor.
  // CAMPO VAZIO VIRA ZERO, NÃO NaN. parseMoedaBR("") devolve NaN, e Math.max(0, NaN) continua NaN — que o
  // JSON manda como null e o banco recusa (valor é NOT NULL). Foi exatamente o que aconteceu na primeira noite
  // da aba Profissionais: as quatro tentativas do Diego de anotar trabalho sem valor combinado falharam com
  // 'null value in column "valor"'. O campo vazio é o caminho normal aqui, não a exceção.
  const valorBruto = dados.permiteValorZero ? parseMoedaBR(dados.valor ?? existente?.valor ?? 0) : null;
  const valor = dados.permiteValorZero
    ? (Number.isFinite(valorBruto) && valorBruto > 0 ? valorBruto : 0)
    : validarValorPositivo(dados.valor ?? existente?.valor);
  const data = dados.data || existente?.data || hojeISO();
  const tem = (key) => Object.prototype.hasOwnProperty.call(dados, key);
  const payload = {
    tipo, escopo, categoria, valor, status, data,
    descricao: String(dados.descricao || existente?.descricao || categoria).trim(),
    servico_id: tem("servicoId") ? (dados.servicoId || null) : (existente?.servico_id || null),
    fornecedor_id: tem("fornecedorId") ? (dados.fornecedorId || null) : (existente?.fornecedor_id || null),
    agenda_id: tem("agendaId") ? (dados.agendaId || null) : (existente?.agenda_id || null),
  };
  if (dados.financeiroId) {
    if (existente.servico_id && payload.servico_id && existente.servico_id !== payload.servico_id) throw new Error("O lançamento pertence a outro serviço.");
    const { data: atualizado, error } = await db.from("financeiro").update(payload).eq("id", dados.financeiroId).select("*").single();
    if (error) throw error;
    return { registro: atualizado, jaExistia: true };
  }
  const id = await uuidDeterministicoEvento(eventoId, papel);
  const inserido = await inserirComIdDeterministico(db, "financeiro", id, payload, ["tipo", "escopo", "categoria", "valor", "status", "data", "servico_id", "fornecedor_id", "agenda_id"]);
  return { registro: inserido.data, jaExistia: inserido.jaExistia };
}

      precisaMaterial: dados.precisaMaterial !== false, fornecedorId: dados.fornecedorId || null,
      dataEntrega: dados.dataEntrega, por: dados.por || "claude",
    });

  });

// TRABALHO DO PROFISSIONAL — o outro lado do vale (Diego, 06/08/2026)
// "O Marcão vai pegando vale, mas eu tenho que ir anotando que ele busca serviço comigo — isso é trabalho
// dele, ele busca e entrega, eu tenho que pagar a ele FORA os trabalhos que ele faz. Só pra não esquecer
// quando for abater os vales."
// Até aqui o app só guardava o que SAIU adiantado (o vale). O que o profissional GANHOU ficava na cabeça do
// Diego, e na hora do acerto o que não estivesse lembrado simplesmente não era pago. Agora cada busca,
// entrega ou trabalho vira uma linha do lado dele.
// POR QUE NÃO MEXE NO CAIXA: anotar não é pagar. A linha nasce status "a_pagar" — e o saldo só conta o que
// está "pago" (Regra Nº 5). O dinheiro sai uma vez só, no acerto. É a mesma lógica do vale, ao contrário.
const CATEGORIA_MAO_DE_OBRA = "Mão de obra";
const MAO_DE_OBRA_ACERTADA_TAG = "[ACERTADO] ";
const TRABALHOS_PROFISSIONAL = { busca: "Buscou o móvel", entrega: "Entregou o móvel", servico: "Trabalho no estofado", outro: "Outro trabalho" };
function nomeProfissionalMaoDeObra(descricao) {
  const semTag = (descricao || "").replace(MAO_DE_OBRA_ACERTADA_TAG, "").replace(/^Mão de obra\s*-\s*/i, "");
  return semTag.split(/[·(,]/)[0].trim() || "Sem nome";
}
function ehTrabalhoAberto(item) {
  return item.categoria === CATEGORIA_MAO_DE_OBRA && item.status === "a_pagar" && !(item.descricao || "").startsWith(MAO_DE_OBRA_ACERTADA_TAG);
}

  const detalhe = String(dados.detalhe || "").trim();

// O ACERTO. Do caixa sai só o LÍQUIDO: o que ele fez menos os vales que já saíram. Se saísse o valor cheio
// dos trabalhos, o mesmo dinheiro do vale sairia duas vezes — o erro de R$465,70 de julho, ao contrário.
// Por isso os trabalhos são MARCADOS como acertados (igual o vale abatido) em vez de virarem "pago".
async function aplicarMaoDeObraAcertadaOperacional(db, eventoId, dados) {
  const profissional = String(dados.profissional || "").trim();
  if (!profissional) throw new Error("O acerto é sempre com um profissional.");
  const trabalhoIds = Array.isArray(dados.trabalhoIds) ? dados.trabalhoIds : [];
  const valeIds = Array.isArray(dados.valeIds) ? dados.valeIds : [];
  if (!trabalhoIds.length) throw new Error("Nenhum trabalho anotado para acertar.");
  const trabalhos = [];
  for (const id of trabalhoIds) {
    const item = await lerRegistro(db, "financeiro", id);
    if (!item || item.categoria !== CATEGORIA_MAO_DE_OBRA) throw new Error("Lançamento " + id + " não é trabalho de profissional.");
    if ((item.descricao || "").startsWith(MAO_DE_OBRA_ACERTADA_TAG)) continue;
    if (!Number(item.valor)) throw new Error("Tem trabalho sem valor no acerto (" + (item.descricao || "") + "). Ponha o valor antes de fechar, senão você paga por baixo.");
    trabalhos.push(item);
  }
  const vales = [];
  for (const id of valeIds) {
    const vale = await lerRegistro(db, "financeiro", id);
    if (!vale || vale.categoria !== "Vale") throw new Error("Lançamento " + id + " não é Vale.");
    if ((vale.descricao || "").startsWith(VALE_ABATIDO_TAG)) continue;
    vales.push(vale);
  }
  const totalTrabalho = trabalhos.reduce((soma, item) => soma + Number(item.valor), 0);
  const totalVale = vales.reduce((soma, item) => soma + Number(item.valor), 0);
  const liquido = Number((totalTrabalho - totalVale).toFixed(2));
  if (liquido < 0) throw new Error("Os vales (" + money(totalVale) + ") passam do que ele fez (" + money(totalTrabalho) + "). Tire algum vale deste acerto — ele fica pendente pro próximo.");
  let financeiroId = null;
  if (liquido > 0) {
    const { registro } = await registrarFinanceiroDaOperacao(db, eventoId, {
      tipo: "saida", escopo: "empresa", categoria: CATEGORIA_MAO_DE_OBRA, status: "pago",
      valor: liquido, data: dados.data || hojeISO(),
      descricao: "Acerto com " + profissional + " — " + trabalhos.length + " trabalho(s)" + (totalVale ? " menos " + money(totalVale) + " de vale" : ""),
    }, "financeiro:acerto");
    financeiroId = registro.id;
  }
  for (const item of trabalhos) {
    const { error } = await db.from("financeiro").update({ descricao: MAO_DE_OBRA_ACERTADA_TAG + (item.descricao || CATEGORIA_MAO_DE_OBRA) }).eq("id", item.id);
    if (error) throw error;
  }
  for (const vale of vales) {
    const { error } = await db.from("financeiro").update({ descricao: VALE_ABATIDO_TAG + (vale.descricao || "Vale") }).eq("id", vale.id);
    if (error) throw error;
  }
  await registrarHistoricoDaOperacao(db, eventoId, "acerto-profissional", {
    o_que: "Acerto com " + profissional, por: dados.por || "diego",
    detalhe: money(totalTrabalho) + " de trabalho − " + money(totalVale) + " de vale = " + money(liquido) + " pago do caixa.",
  });
  return { financeiroId, totalTrabalho, totalVale, liquido, trabalhos: trabalhos.length, vales: vales.length };
}

    if (financeiroExistente.fornecedor_id && financeiroExistente.fornecedor_id !== dados.fornecedorId) throw new Error("A compra pertence a outro fornecedor.");
    if (financeiroExistente.servico_id && dados.servicoId && financeiroExistente.servico_id !== dados.servicoId) throw new Error("A compra pertence a outro serviço.");

  // A checagem de cidade vem ANTES de ler a agenda: sem cidade a ida nem existe, não vale gastar consulta.

  const valorServico = dados.valorServico ?? dados.valor;

    status: "agendado", prazo, valor_orcamento: valor || null,
    proxima_acao: dados.fornecedorId ? "Planejar compra do material" : (dados.proximaAcao || "Definir próxima ação"),

  // R$ 4.300,00 à vista/Pix foi enviado, a cliente fechou, e o serviço virou `agendado` com Gaspar,
  // fornecedor e material gravados — mas `valor_orcamento` ficou NULL. Fechou sem preço e ninguém soube.
  // Preço perdido não aparece em lugar nenhum: não entra no a receber, não entra na margem, e só
  // reaparece quando o cliente pergunta quanto é.
  //

  // muda é que ele deixa de ser silencioso: sem valor nasce uma pergunta viva na Caixa, e o resultado
  // volta marcado como incompleto pra nenhum readback declarar sucesso cheio.
  //
  // O app NÃO tenta adivinhar se o preço é desconhecido ou se foi perdido — quem sabe isso é o Diego.

    perguntaValorId = pergunta.id;
  }
  let material = null;
  if (dados.fornecedorId) material = await aplicarMaterialPlanejadoOperacional(db, eventoId, {

    descricao: dados.descricaoMaterial, dataNecessidade: dados.dataNecessidade, dataEntrega: dados.dataEntrega,
    por: dados.por || "claude",

    valorOrcamento: atualizado.valor_orcamento, responsavel: atualizado.responsavel,

async function processarEventoOperacaoBahia(db, evento) {
  if (!db) throw new Error("Conexão do app indisponível.");
  const checkpoint = await iniciarEventoOperacao(db, evento);
  if (checkpoint.jaConcluido) return { ok: true, jaConcluido: true, eventoId: evento.eventoId, resultado: checkpoint.resultado };
  try {
    await marcarEtapaEvento(db, checkpoint.id, "aplicando", checkpoint.resultado);
    let resultado;
    const dados = evento.dados || {};
    switch (evento.tipo) {
      case "financeiro": resultado = await aplicarFinanceiroOperacional(db, evento.eventoId, dados); break;
      case "entrada_servico": resultado = await aplicarEntradaServicoOperacional(db, evento.eventoId, dados); break;
      case "pro_labore": resultado = await aplicarProLaboreOperacional(db, evento.eventoId, dados); break;
      case "vale_entregue": resultado = await aplicarValeEntregueOperacional(db, evento.eventoId, dados); break;
      case "vale_abatido": resultado = await aplicarValeAbatidoOperacional(db, evento.eventoId, dados); break;
      case "mao_de_obra_anotada": resultado = await aplicarMaoDeObraAnotadaOperacional(db, evento.eventoId, dados); break;
      case "mao_de_obra_acertada": resultado = await aplicarMaoDeObraAcertadaOperacional(db, evento.eventoId, dados); break;
      case "servico_fechado": resultado = await aplicarServicoFechadoOperacional(db, evento.eventoId, dados); break;
      case "material_planejado": resultado = await aplicarMaterialPlanejadoOperacional(db, evento.eventoId, dados); break;
      case "material_em_transito": resultado = await aplicarMaterialEmTransitoOperacional(db, evento.eventoId, dados); break;
      case "material_em_maos": resultado = await aplicarMaterialEmMaosOperacional(db, evento.eventoId, dados); break;
      case "lista_compra_confirmada": resultado = await aplicarListaCompraConfirmadaOperacional(db, evento.eventoId, dados); break;
      case "compromisso_concluido": resultado = await aplicarCompromissoConcluidoOperacional(db, evento.eventoId, dados); break;
      case "entrega_concluida": resultado = await aplicarEntregaConcluidaOperacional(db, evento.eventoId, dados); break;
      case "remarcacao_com_data": resultado = await resolverPendenciaComSucessor(db, dados); break;
      case "remarcacao_terminal": resultado = await resolverPendenciaTerminal(db, dados); break;
      default: throw new Error("Tipo de operação não suportado: " + evento.tipo);
    }
    await marcarEtapaEvento(db, checkpoint.id, "verificando", resultado);
    await concluirEventoOperacao(db, checkpoint.id, resultado);
    return { ok: true, jaConcluido: false, eventoId: evento.eventoId, resultado };
  } catch (error) {
    await falharEventoOperacao(db, checkpoint.id, error);
    throw error;
  }
}

        // causa. Item PAINEL DE SERVIÇOS FECHADOS SEM AVANÇO, caso Fabrício.
        // Cinco colunas, não `*`: isto é contexto de explicação, não fonte de operação, e não pode virar
        // uma segunda lista de compromissos que alguém confunda com a de verdade.
        db.from("agenda").select("id,servico_id,status,titulo,data").neq("status", "planejado").order("data", { ascending: false }),
        // ESTOQUE — para o card de Compras poder perguntar "isso você já tem?". A view é security_invoker,
        // então respeita a mesma trava de RLS do resto; sem autorização ela volta VAZIA em vez de dar erro,
        // e o app simplesmente deixa de sugerir — que é o comportamento de antes, não uma tela quebrada.
        db.from("estoque_painel").select("id,item,saldo,unidade,status"),
      ]);
      // `ds` e `es` ficam FORA da conta do firstError de propósito: distância é melhoria com rede embaixo (a
      // const TEMPO_ESTRADA_MIN) e estoque é uma sugestão a mais no card de Compras. Se uma dessas falhar
      // sozinha, o certo é o app abrir normal — e não cair na tela de offline por causa de tabela acessória.
      firstError = [cx, cl, sv, ag, fn, rt, fo, ps].find((result) => result.error)?.error;
    } catch (e) { firstError = e; }
    // SEM SINAL: em vez de tela vazia, abre com a última carga guardada e avisa a idade dela.
    if (firstError) {
      const guardado = lerCacheOffline();
      if (guardado) { aplicarPacote(guardado.pacote); setOfflineDesde(guardado.em); setLoading(false); return; }
      notify(`Erro ao carregar: ${firstError.message}`, "error"); setLoading(false); return;
    }
    setOfflineDesde(null);
    const pacote = { inbox: cx.data || [], customers: cl.data || [], services: sv.data || [], appointments: ag.data || [], finances: fn.data || [], rotinas: rt.data || [], fornecedores: fo.data || [], pessoais: ps.data || [], distancias: ds?.data || [], agendaHistorico: ah?.data || [], estoque: es?.data || [] };
    aplicarPacote(pacote);
    // LEITURA OFFLINE: guarda a última carga boa no aparelho com a hora em que veio. Sem sinal, o app abre
    // com isso em vez de tela vazia — o Diego trabalha em Valparaíso, Novo Gama e Riacho Fundo, onde cair
    // sinal é rotina. Só leitura: gravação offline ficaria numa fila que duplicaria compromisso e bateria
    // nas travas do banco depois, sem ele ver o erro.
    if (!firstError) { try { window.localStorage.setItem(CACHE_OFFLINE, JSON.stringify({ em: Date.now(), pacote })); } catch (e) { /* aparelho sem espaço: segue sem cache */ } }
    setLoading(false);
  }, [db, demo, notify, session, aplicarPacote]);

    let cancelled = false;
    (async () => {
      const { data, error } = await db.from("config").select("pin_hash").eq("id", 1).single();
      if (cancelled) return;
      // FALHA FECHADA. Antes, qualquer erro ao ler a config LIBERAVA a tela (setPinState("ok")) — bastava a
      // consulta falhar pra o bloqueio sumir. Agora o hash conhecido fica guardado no aparelho, então sem

      // a tela fica travada pedindo pra tentar de novo, em vez de abrir. Auditoria de 25/07/2026.
      if (error) {
        const conhecido = window.localStorage.getItem(PIN_HASH_LOCAL);
        if (!conhecido) { setPinState("bloqueado"); return; }
        setPinState(window.sessionStorage.getItem("tb_pin_ok") === "1" ? "ok" : "enter");
        return;
      }
      if (data?.pin_hash) window.localStorage.setItem(PIN_HASH_LOCAL, data.pin_hash);
      if (!data?.pin_hash) setPinState("define");
      else if (window.sessionStorage.getItem("tb_pin_ok") === "1") setPinState("ok");

  async function sendMagicLink() {
    if (!db || !email.trim()) return;
    setBusy(true);

  async function claim(item) {
    if (demo) { setInbox((items) => items.map((entry) => entry.id === item.id ? { ...entry, status: "em_processamento", conversa: eventMessage(entry.conversa, "Triagem iniciada", mode) } : entry)); setSelectedId(item.id); return; }
    if (!db || busy) return;
    const other = inbox.find((entry) => entry.id !== item.id && entry.status === "em_processamento");
    if (other) { notify("Já existe uma entrada em triagem. Termine ou devolva antes.", "error"); return; }
    setBusy(true);
    const origin = item.status || "novo";
    let query = db.from("caixa_entrada").update({ status: "em_processamento", conversa: eventMessage(item.conversa, `Triagem iniciada · origem ${origin}`, mode) }).eq("id", item.id).eq("processado", false);
    query = item.status ? query.eq("status", item.status) : query.is("status", null);
    const { data, error } = await query.select("id").maybeSingle();
    setBusy(false);
    if (error) notify(error.message, "error"); else if (!data) notify("Outra sessão já assumiu esta entrada.", "error"); else { await loadAll(); setSelectedId(item.id); notify("Entrada assumida. Trabalhe somente nela.", "ok"); }
  }

  async function release(item) {
    const origin = (item.conversa || []).findLast((message) => message.tipo === "sistema" && message.texto.includes("origem"))?.texto.split("origem ")[1] || "novo";
    if (demo) { setInbox((items) => items.map((entry) => entry.id === item.id ? { ...entry, status: origin } : entry)); setSelectedId(null); return; }
    const { error } = await db.from("caixa_entrada").update({ status: origin, conversa: eventMessage(item.conversa, "Triagem devolvida à fila", mode) }).eq("id", item.id).eq("status", "em_processamento");
    if (error) notify(error.message, "error"); else { setSelectedId(null); await loadAll(); notify("Entrada devolvida à fila.", "ok"); }
  }

  async function resolveInbox(item, result) {
    if (demo) { setInbox((items) => items.filter((entry) => entry.id !== item.id)); setSelectedId(null); return; }
    // CARIMBO DE PRINT VISTO — o par da trava do banco (caixa_print_precisa_ser_lido).
    // Quem confirma a triagem por esta tela está com a imagem aberta na frente: o painel renderiza os prints
    // numa galeria logo acima do botão. Então este caminho carimba sozinho e o Diego NUNCA é travado — ele
    // não é quem pula print. Quem não passa por aqui é a sessão que grava direto pela REST, e é justamente
    // essa que a trava obriga a abrir o print antes (REGRA Nº 1, o caso da Wesliane em 04/08).
    const temPrint = parseInbox(item.texto || "").images.length > 0;
    const conversa = eventMessage(item.conversa, `Resultado: ${result}`, mode);
    if (temPrint) conversa.push({ de: mode === "claude" ? "ia" : "diego", tipo: "sistema", em: new Date().toISOString(), texto: "Print aberto na tela de triagem antes de confirmar.", meta: { print_lido: true } });
    const { error } = await db.from("caixa_entrada").update({ processado: true, status: "resolvido", conversa }).eq("id", item.id).eq("status", "em_processamento");
    if (error) throw error;
  }

  function updateForm(key, value) { setForm((current) => ({ ...current, [key]: value })); }

  async function finishCustomer(item) {
    if (!form.name.trim() || !form.service.trim() || !form.nextAction.trim() || !form.due) { notify("Nome, serviço, próxima ação e data são obrigatórios.", "error"); return; }
    if (form.addAgenda && form.agendaType === "presencial" && !form.city.trim()) { notify("Compromisso presencial precisa de cidade.", "error"); return; }
    if (form.serviceStatus === "agendado" && form.precisaMaterial && !form.fornecedorId) { notify("Trabalho fechado precisa do fornecedor para o app planejar a compra. Se ainda não sabe, mande a pergunta ao Diego.", "error"); return; }
    const telefone = corrigirTelefone(form.phone);
    if (telefone === null) { notify("Telefone incompleto — celular precisa de DDD + 8 ou 9 dígitos.", "error"); return; }
    if (demo) { await resolveInbox(item, "Ficha e lead criados na demonstração"); notify("Triagem concluída na demonstração.", "ok"); return; }
    setBusy(true);
    let fechamentoSemValor = false;
    try {
      let customer = customers.find((entry) => entry.id === form.customerId) || duplicateCustomers[0] || null;
      if (!customer) {
        const { data, error } = await db.from("clientes").insert({ nome: form.name.trim(), telefone: telefone || null, cidade: form.city.trim() || null, endereco: form.address.trim() || null, obs: parsedSelected.text || null }).select("*").single();
        if (error) throw error; customer = data;
      }
      const { data: sameServices, error: serviceSearchError } = await db.from("servicos").select("*").eq("cliente_id", customer.id).ilike("titulo", form.service.trim()).limit(1);
      if (serviceSearchError) throw serviceSearchError;
      let service = sameServices?.[0] || null;
      if (!service) {
        const { data, error } = await db.from("servicos").insert({ cliente_id: customer.id, titulo: form.service.trim(), status: form.serviceStatus, prioridade: form.priority, proxima_acao: form.nextAction.trim(), prazo: form.due, valor_orcamento: parseMoedaBR(form.value) || null, responsavel: form.responsavel.trim() || null }).select("*").single();
        if (error) throw error; service = data;
      }
      // "Agendado" é trabalho fechado. O fechamento chama a mesma operação usada pelo documento do Drive:
      // ela calcula a compra pelo fornecedor e não deixa Serviço e Agenda divergirem.
      if (form.serviceStatus === "agendado") {
        const fechado = await processarEventoOperacaoBahia(db, {
          tipo: "servico_fechado", eventoId: "caixa-" + item.id + "-servico-fechado",
          textoOriginal: parsedSelected.text,
          dados: {
            servicoId: service.id, prazo: form.due, valorServico: parseMoedaBR(form.value) || null,
            proximaAcao: form.nextAction.trim(), precisaMaterial: form.precisaMaterial,
            fornecedorId: form.precisaMaterial ? form.fornecedorId : null, por: mode,
          },
        });
        // Guarda o que ficou gravado de verdade, não só o status — o carimbo comercial é o valor.
        service = { ...service, status: fechado.resultado.statusServico, valor_orcamento: fechado.resultado.valorOrcamento };
        fechamentoSemValor = fechado.resultado.fechamentoCompleto === false;
      }
      if (form.addAgenda) {
        const doDia = agendaVisivel.filter((entry) => entry.data === form.due && entry.tipo === "presencial");
        const occupied = doDia.map((entry) => entry.hora?.slice(0, 5));
        // O QUE O APP ESCOLHE SOZINHO SEGUE A ROTINA DELE (14/08): antes era o primeiro slot livre — sempre
        // 08:00 — e, sem slot, um 18:00 que cai em cima da igreja de seg/qua/sex. Ver horaSugerida.
        const fallback = horaSugerida(form.due, form.agendaType, occupied, form.city, doDia);
        const appointment = { titulo: `${customer.nome} — ${form.service.trim()}`, data: form.due, hora: form.time || fallback, cidade: form.agendaType === "presencial" ? form.city.trim() : null, tipo: form.agendaType, status: "planejado", servico_id: service.id };
        const { data: linked } = await db.from("agenda").select("id").eq("servico_id", service.id).eq("status", "planejado").limit(1);
        if (linked?.length) { const { error } = await db.from("agenda").update(appointment).eq("id", linked[0].id); if (error) throw error; }
        else { const { error } = await db.from("agenda").insert(appointment); if (error) throw error; }
      }
      if (parsedSelected.imageUrl) {
        const { data: photo } = await db.from("fotos").select("id").eq("cliente_id", customer.id).eq("url", parsedSelected.imageUrl).limit(1);
        if (!photo?.length) await db.from("fotos").insert({ cliente_id: customer.id, url: parsedSelected.imageUrl, tipo: "outro" });
      }
      const { error: hErr } = await db.from("historico").insert({ o_que: `Triagem concluída: ${form.service.trim()}`, por: mode, detalhe: `Fonte caixa_entrada#${item.id} · cliente#${customer.id} · serviço#${service.id}` });
      if (hErr) throw hErr;
      await resolveInbox(item, `cliente #${customer.id} · serviço #${service.id}`);
      await loadAll();
      // Fechamento sem preço não sai daqui dizendo "salvo" e mais nada — a pergunta já está na Caixa.
      notify(fechamentoSemValor
        ? "Salvo, mas o fechamento ficou SEM VALOR. Deixei a pergunta na Caixa."
        : "Ficha e serviço conferidos e salvos.", fechamentoSemValor ? "info" : "ok");
    } catch (error) { notify(`Nada foi encerrado: ${error.message}`, "error"); }
    finally { setBusy(false); }
  }

  async function deleteInboxItem(item) {
    // Pendência de remarcação aberta nunca pode ser excluída — apagar faz o cliente desaparecer de novo.

    if (demo) { setInbox((items) => items.filter((entry) => entry.id !== item.id)); setSelectedId(null); notify("Na demonstração não salva.", "info"); return; }
