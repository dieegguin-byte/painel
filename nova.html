// Rotinas que vencem hoje ou estão atrasadas aparecem no Painel; "✓ Fiz hoje" reinicia a contagem.
function RotinasCard({ rotinas, hoje, db, demo, notify, onChanged }) {
  const [busyId, setBusyId] = useState(null);
  // null = ainda não mexeu, vale o padrão (abre só se tiver atrasada). Precisa ficar aqui em cima, junto dos
  // outros hooks: abaixo tem um `return null` quando não há rotina pendente, e hook depois de return quebra
  // a ordem entre renders.
  const [abertoManual, setAbertoManual] = useState(null);
  // Atualização otimista: o onChanged recarrega tudo e demora, então a linha só sumiria segundos depois e
  // parecia que o clique não pegou. Aqui a data nova vale na hora e o recarregamento só reconcilia.
  const [feitasAgora, setFeitasAgora] = useState({});
  const comOverride = rotinas.map((r) => feitasAgora[r.id] ? { ...r, ultima_execucao: feitasAgora[r.id] } : r);
  const pendentes = comOverride.map((r) => ({ r, st: statusRotina(r, hoje) })).filter((x) => x.st.estado !== "futura")
    .sort((a, b) => a.st.dias - b.st.dias);
  if (!pendentes.length) return null;
  // Nem sempre ele marca no dia em que fez - lembra depois, ou marca de madrugada quando o dia já virou.
  // Sem o "ontem" a única saída era gravar a data errada e conviver com ela.
  const ontem = (() => { const d = new Date(hoje + "T12:00:00"); d.setDate(d.getDate() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
  const marcarFeita = async (rotina, quando) => {
    if (demo) { notify("Na demonstração a rotina não é salva.", "info"); return; }
    setBusyId(rotina.id);
    try {
      setFeitasAgora((atual) => ({ ...atual, [rotina.id]: quando }));
      const { error } = await db.from("rotinas").update({ ultima_execucao: quando }).eq("id", rotina.id);
      if (error) { setFeitasAgora((atual) => { const copia = { ...atual }; delete copia[rotina.id]; return copia; }); throw error; }
      notify(`"${rotina.titulo}" marcada como feita ${quando === hoje ? "hoje" : "ontem"}.`, "ok"); onChanged();
    } catch (e) { notify("Erro: " + e.message, "error"); } finally { setBusyId(null); }
  };
  // RECOLHÍVEL E SEPARADO POR COR (Diego, 30/07). Rotina é a coisa menos urgente do Painel — lavar o carro
  // não decide o dia — e com a lista aberta empurrava a agenda e o dinheiro pra baixo. Fica fechado por
  // padrão; só abre sozinho quando tem rotina ATRASADA, que é quando vale interromper. Dentro, os dois
  // grupos do semáforo ficam separados em vez de misturados numa lista só ordenada por dias.
  const atrasadas = pendentes.filter((x) => x.st.estado === "vencida");
  const doDia = pendentes.filter((x) => x.st.estado !== "vencida");
  const aberto = abertoManual === null ? atrasadas.length > 0 : abertoManual;
  const linha = ({ r, st }) => <article className={`rotina-item ${st.estado === "vencida" ? "cor-alta" : "cor-media"}`} key={r.id}>
    <div className="rotina-esq">
      <strong>{r.titulo}</strong>
      <span>a cada {r.intervalo_dias} dia(s){r.hora ? ` · ${horaFalada(r.hora)}` : ""}{r.observacao ? ` · ${r.observacao}` : ""}</span>
    </div>
    <div className="rotina-dir">
      <em className={st.estado === "vencida" ? "atrasada" : ""}>{textoRotina(st)}</em>
      <div className="agenda-acoes">
        <button className="ghost" disabled={busyId === r.id} onClick={() => marcarFeita(r, hoje)}>{busyId === r.id ? "..." : "✓ Fiz hoje"}</button>
        <button className="ghost" disabled={busyId === r.id} onClick={() => marcarFeita(r, ontem)}>Fiz ontem</button>
      </div>
    </div>
  </article>;
  return <section className="content-card">
    <div className="card-head"><div><p className="kicker">ROTINAS RECORRENTES</p><h3>{pendentes.length} rotina(s) pra hoje</h3></div></div>
    <p className="ficha-note">{atrasadas.length ? `${atrasadas.length} atrasada(s)` : "Nenhuma atrasada"}{doDia.length ? ` · ${doDia.length} pra hoje` : ""}</p>
    <button className="ghost" style={{ width: "100%" }} onClick={() => setAbertoManual(!aberto)}>{aberto ? "Fechar rotinas" : `Abrir as ${pendentes.length}`}</button>
    {aberto && <div style={{ marginTop: 12 }}>
      {!!atrasadas.length && <><p className="kicker">🔴 ATRASADAS</p><div className="rotina-lista">{atrasadas.map(linha)}</div></>}
      {!!doDia.length && <><p className="kicker" style={{ marginTop: atrasadas.length ? 14 : 0 }}>🟡 PRA HOJE</p><div className="rotina-lista">{doDia.map(linha)}</div></>}
    </div>}
  </section>;
}

const SEM_PROFISSIONAL = "Sem profissional atribuído";
// PAINEL: capacidade por profissional - clica no nome pra ver os servicos dele (mesmo padrao da Agenda: colapsado, expande no clique)
function CapacidadeCard({ services, finances, fornecedores, db, demo, notify, onChanged }) {
  const [aberto, setAberto] = useState(null);
  const [entregando, setEntregando] = useState(null);
  const [valorDraft, setValorDraft] = useState("");
  const [recebidoDraft, setRecebidoDraft] = useState("");
  const [busyMaterial, setBusyMaterial] = useState(null);
  // ESPERANDO MATERIAL MORA AQUI (Diego, 30/07): "esse aviso deveria estar na parte de capacidade
  // profissional; se não dá pra automatizar, deixa um botão onde eu clico que já comprei e muda o status".
  // Faz sentido: quem não pode começar é o profissional, então o alerta pertence ao card dele — e não a um
  // aviso solto que só informava, sem deixar resolver. O estado continua DERIVADO (nada de status novo).
  const materiaisPendentesDe = (servicoId) => (finances || []).filter((f) => ehCompraMaterial(f) && f.servico_id === servicoId && !materialEstaEmMaos(f));
  const temMatEmMaos = (servicoId) => (finances || []).some((f) => ehCompraMaterial(f) && f.servico_id === servicoId && materialEstaEmMaos(f));
  // FALTA MATERIAL É FATO ANOTADO, NÃO DEDUÇÃO POR AUSÊNCIA. Diego, 04/08: "os serviços que estão faltando
  // material não estão como o da Carla, e os que estão para entregar ainda estão marcando errado como voltou
  // para oficina". O erro anterior foi meu: eu tratava "não tem compra lançada" como "falta comprar", então a
  // Ana Cristina e a Madalena — prontas, só esperando entrega — apareciam pedindo material que ninguém devia.
  // Ausência de dado não é informação. Agora a fonte é a lista de compras (materiais_necessarios): tem item
  // não marcado, está esperando material; não tem, está pronto pra andar.
  const materiaisAnotadosPendentes = (s) => (s.materiais_necessarios || []).filter((m) => !m.comprado).length;
  const esperandoMaterial = (s) => {
    if (!["agendado", "producao"].includes(s.status)) return false;
    if (materiaisAnotadosPendentes(s)) return true;
    if (materiaisPendentesDe(s.id).length) return true;
    return s.status === "agendado" && !!s.loja_material && !temMatEmMaos(s.id);
  };
  // "JÁ COMPREI" = o fato MATERIAL_EM_MÃOS, o único que apaga o alerta. Usa a compra já lançada quando ela
  // existe (aí nem pergunta fornecedor); se só havia a loja no cadastro do serviço, resolve o fornecedor pelo
  // nome e entra com semValor, que libera a produção sem travar esperando o valor exato.
  const marcarMaterialEmMaos = async (s) => {
    if (demo) { notify("Na demonstração não salva.", "info"); return; }
    const pendente = materiaisPendentesDe(s.id)[0] || null;
    const fornecedor = pendente ? null : (fornecedores || []).find((f) => (f.nome || "").trim().toLowerCase() === String(s.loja_material || "").trim().toLowerCase());
    if (!pendente && !fornecedor) { notify(`Não achei a compra nem o fornecedor "${s.loja_material || "?"}" no cadastro. Lance a compra na aba Compras primeiro.`, "error"); return; }
    setBusyMaterial(s.id);
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "material_em_maos", eventoId: "app-material-maos-" + (pendente ? pendente.id : s.id),
        dados: pendente
          ? { financeiroId: pendente.id, servicoId: s.id, data: hojeISO(), por: "diego" }
          : { fornecedorId: fornecedor.id, servicoId: s.id, semValor: true, data: hojeISO(), por: "diego" },
      });
      notify(`Material do ${s.clientes?.nome || "serviço"} está em mãos — o profissional pode começar.`, "ok");
      await onChanged?.();
    } catch (e) { notify("Ficou visível para retomada: " + e.message, "error"); } finally { setBusyMaterial(null); }
  };
  // Pedido do Diego (26/07): "melhor ter um botão na produção pra eu marcar como concluído" — direto no
  // card de capacidade, sem precisar abrir a ficha. Mesma operação tipada da ficha, só o gatilho é outro.
  const confirmarEntrega = async (servicoId) => {
    if (demo) { notify("Na demonstração não salva.", "info"); setEntregando(null); return; }
    const valor = parseMoedaBR(valorDraft);
    if (!valor || valor <= 0) { notify("Qual foi o valor do serviço? Sem isso não dá pra marcar como entregue.", "error"); return; }
    const recebido = parseMoedaBR(recebidoDraft);
    if (recebidoDraft.trim() && !(recebido > 0)) { notify("Não entendi o valor recebido. Escreva só o número, ex: 2.189 ou 2189.", "error"); return; }
    if (recebido > valor) { notify(`Recebido (${money(recebido)}) é maior que o valor do serviço (${money(valor)}). Confira.`, "error"); return; }
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "entrega_concluida", eventoId: "app-capacidade-entrega-" + servicoId,
        // `recebimento` é o que faz o dinheiro entrar no caixa. Sem isto a entrega fechava o serviço e o
        // valor digitado não virava nada — bug real do sofá do Gerson em 29/07.
        dados: { servicoId, valor, data: hojeISO(), por: "diego", recebimento: recebido > 0 ? { valor: recebido, status: "pago", data: hojeISO() } : null },
      });
      notify(recebido > 0 ? `Entregue. ${money(recebido)} no caixa.` : "Entregue. Serviço fechado (sem recebimento).", "ok");
      setEntregando(null); await onChanged?.();
    } catch (e) { notify("A entrega ficou visível para retomada: " + e.message, "error"); }
  };
  const porProfissional = useMemo(() => {
    const map = {};
    // Capacidade é só trabalho FECHADO que ocupa alguém: agendado e produção. Lead e orçamento são funil
    // comercial - ninguém está trabalhando neles, e contá-los inflava o card (52 itens onde havia 1 real).
    // Sem responsável entra num grupo próprio: é carga de verdade sem dono definido, não pode sumir do radar.
    (services || []).forEach((s) => { if (["agendado", "producao"].includes(s.status)) { const k = s.responsavel?.trim() || SEM_PROFISSIONAL; (map[k] ||= []).push(s); } });
    return map;
  }, [services]);
  // "Sem profissional" fica sempre por último, mesmo sendo o maior grupo - é pendência, não capacidade.
  const nomes = Object.entries(porProfissional).sort((a, b) => (a[0] === SEM_PROFISSIONAL) - (b[0] === SEM_PROFISSIONAL) || b[1].length - a[1].length);
  if (!nomes.length) return null;
  return <section className="content-card">
    <div className="card-head"><div><p className="kicker">CAPACIDADE</p><h3>Profissionais em serviço</h3></div></div>
    <div className="capacidade-profissionais">{nomes.map(([nome, lista]) => { const isAberto = aberto === nome; return <div className={`capacidade-item${isAberto ? " active" : ""}`} key={nome}>
      <button type="button" className="capacidade-item-head" onClick={() => setAberto(isAberto ? null : nome)}>
        <span>{nome === SEM_PROFISSIONAL ? "⚠ " + nome : nome}</span><b>{lista.length} ativo{lista.length > 1 ? "s" : ""}</b><i>{isAberto ? "▲" : "▼"}</i>
      </button>
      {/* PRODUÇÃO NA FRENTE, AGENDADO NO FINAL DA FILA. Regra do Diego (25/07): "agendado tem que ir para o
          final da fila". Produção é peça na bancada com prazo correndo; agendado é trabalho fechado que ainda
          não começou. Dentro de cada grupo, prazo mais apertado primeiro. */}
      {isAberto && <div className="capacidade-item-corpo">{[...lista].sort((a, b) => (a.status === "agendado") - (b.status === "agendado") || String(a.prazo || "9999").localeCompare(String(b.prazo || "9999"))).map((s) => <div className="capacidade-servico" key={s.id}>
        <strong>{s.clientes?.nome || "Cliente"}</strong><span>{s.titulo}</span><em>{statusLabel[s.status] || s.status}{s.prazo ? " · " + compactDate(s.prazo) : ""}</em>
        {esperandoMaterial(s) && <div className="material-pendente">
          <em>⏳ Esperando material{s.loja_material ? " · " + s.loja_material : ""} — o profissional não começa sem ele.</em>
          {/* Dizer O QUE falta economiza uma ida à aba Compras só pra lembrar. */}
          {!!materiaisAnotadosPendentes(s) && <span className="material-itens">{(s.materiais_necessarios || []).filter((m) => !m.comprado).map((m) => m.item).join(" · ")}</span>}
          <button type="button" className="ghost" disabled={busyMaterial === s.id} onClick={(e) => { e.stopPropagation(); marcarMaterialEmMaos(s); }}>{busyMaterial === s.id ? "..." : "📦 Já comprei, está em mãos"}</button>
        </div>}
        {entregando === s.id
          ? <div className="entrega-form">
              <label>Valor total do serviço<input value={valorDraft} onChange={(e) => setValorDraft(e.target.value)} placeholder="R$" autoFocus /></label>
              {/* O BURACO QUE ISTO TAPA (29/07): antes só existia o campo de valor, que servia pra trava do
                  banco e NÃO virava dinheiro no caixa. Diego entregou o sofá do Gerson, digitou o que
                  recebeu, e o financeiro ficou zerado — "pra que isso se não é pra ir pro financeiro". */}
              <label>Recebeu quanto agora?<input value={recebidoDraft} onChange={(e) => setRecebidoDraft(e.target.value)} placeholder="R$ (vazio = não recebeu nada)" /></label>
              <span className="entrega-hint">{parseMoedaBR(recebidoDraft) > 0 ? `Entra ${money(parseMoedaBR(recebidoDraft))} no caixa da empresa, hoje.` : "Sem recebimento — nada entra no caixa."}</span>
              <div className="ficha-actions"><button className="primary" onClick={() => confirmarEntrega(s.id)}>Confirmar entrega</button><button className="ghost" onClick={() => setEntregando(null)}>Cancelar</button></div>
            </div>
          : <button type="button" className={esperandoMaterial(s) ? "ghost sutil" : "ghost"} onClick={(e) => { e.stopPropagation(); setEntregando(s.id); setValorDraft(s.valor_orcamento ? String(s.valor_orcamento) : ""); setRecebidoDraft(""); }}>{esperandoMaterial(s) ? "Entregar mesmo assim" : "✅ Marcar como entregue"}</button>}
      </div>)}</div>}
    </div>; })}</div>
  </section>;
}

const PAINEL_TIPO_FILTROS = [{ id: "todos", label: "Todos" }, { id: "presencial", label: "⌖ Presencial" }, { id: "remoto", label: "◌ Remoto" }];
function Dashboard({ inbox, services, appointments, finances, rotinas, customers, fornecedores, db, demo, notify, onRotinaChanged, onServicoChanged, onOpenQueue, onConcluir, onReschedule, onSemProximaAcao, onOpenFicha }) {
  const [filtroTipo, setFiltroTipo] = useState("todos");
  const today = hojeISO();
  // `appointments` já chega filtrado pela coleção central (compromissosOperacionais, calculada uma vez na
  // raiz) — compromisso com pendência de remarcação aberta nunca chega até aqui. Só resta separar por data.
  // ROTA × COBRANÇA (28/07/2026): a agenda só mostra o que tem hora/deslocamento. Cobrança sai daqui e vai
  // pro bloco próprio, senão o dia parece ter 16 compromissos quando a estrada tem 3. Ver ehCobranca().
  const svcDe = (a) => services.find((s) => s.id === a.servico_id);
  // REFINAMENTO 29/07 (Diego: "esperando cliente / sua vez não é cobrança"): só sai da agenda o que espera o
  // CLIENTE. Remoto sem hora que depende do Diego (entregar a cabeceira, cobrar o profissional, revisar) é
  // trabalho dele esperando dia — volta pra agenda com Concluir/Reagendar, sem botão de WhatsApp e fora do
  // ciclo de 3 dias, que não faz sentido nenhum pra tarefa própria. Antes os dois viravam CobrancaCard.
  const cobrancasAll = appointments.filter((entry) => ehCobranca(entry) && esperandoCliente(entry, svcDe(entry)));
  const idsCobranca = new Set(cobrancasAll.map((entry) => entry.id));
  const rotaAll = appointments.filter((entry) => !idsCobranca.has(entry.id));
  const dueAll = rotaAll.filter((entry) => entry.data <= today); const futurosAll = rotaAll.filter((entry) => entry.data > today); const noAction = services.filter((entry) => !entry.proxima_acao); const openFin = finances.filter((entry) => entry.status && entry.status !== "pago" && entry.data <= today);
  // Atualização otimista pra a linha sumir NA HORA: sem isto ela só sairia depois do loadAll (5 queries) e
  // parecia que o clique não pegou — mesmo bug já corrigido nos compromissos em 15/07.
  // Guarda a DATA resolvida, não `true`: o ciclo recicla a mesma linha da agenda mudando a data, então
  // marcar o id pra sempre esconderia a próxima volta da cobrança numa aba deixada aberta.
  const [resolvidas, setResolvidas] = useState({});
  const [busyCobranca, setBusyCobranca] = useState(null);
  const cobrarCliente = cobrancasAll.filter((a) => a.data <= today && resolvidas[a.id] !== a.data);
  // A LISTA FICA FECHADA (Diego, 29/07: "está poluindo o painel"). Cobrar 12 clientes no WhatsApp não é
  // decisão, é tarefa em lote — o Painel mostra o tamanho e o valor em jogo, e a lista abre num toque, aqui
  // mesmo. Sem aba nova: o dia do telefone continua sendo uma coisa só, não uma navegação.
  const [listaCobrancas, setListaCobrancas] = useState(false);
  const valorEmJogo = cobrarCliente.reduce((soma, a) => soma + Number(svcDe(a)?.valor_orcamento || 0), 0);
  const qtdNoTeto = cobrarCliente.filter((a) => cobrancaNoTeto(svcDe(a))).length;
  // COBREI: conta a tentativa e empurra o ciclo. O link do WhatsApp abre normalmente; isto roda em paralelo.
  const onCobrou = async (a, svc) => {
    const proxima = somarDias(today, COBRANCA_INTERVALO_DIAS);
    const nTent = cobrancaTentativas(svc) + 1;
    setResolvidas((r) => ({ ...r, [a.id]: a.data }));
    if (demo) { notify(`Cobrança registrada (demo) — voltaria em ${compactDate(proxima)}.`, "ok"); return; }
    try {
      if (svc) {
        // `prazo` acompanha a data da cobrança pra Leads/varredura não mostrarem prazo vencido de um item
        // que na verdade está no ciclo. O QUANDO tem uma fonte só: agenda.data. Não guardo data duplicada.
        // MAS SÓ ENQUANTO O PRAZO FOR "VALIDADE DO LEAD" (auditoria 04/08). Em lead/orçamento o prazo é
        // interno — quando revisar. De agendado em diante ele é OUTRA COISA: a data de entrega combinada com
        // o cliente, que a lista de compras ordena e o atraso mede. Empurrar esse prazo a cada cobrança
        // apagaria a promessa feita ao cliente pra caber um lembrete interno — o serviço nunca pareceria
        // atrasado porque a régua andava junto.
        const patch = { tentativas: nTent, atualizado_em: new Date().toISOString() };
        if (["lead", "orcamento"].includes(svc.status)) patch.prazo = proxima;
        const { error } = await db.from("servicos").update(patch).eq("id", svc.id);
        if (error) throw error;
      }
      const { error: aErr } = await db.from("agenda").update({ data: proxima }).eq("id", a.id);
      if (aErr) throw aErr;
      notify(`${nTent}ª tentativa registrada. Volta em ${compactDate(proxima)}.`, "ok");
      onServicoChanged();
    } catch (e) { setResolvidas((r) => { const c = { ...r }; delete c[a.id]; return c; }); notify("Erro: " + e.message, "error"); }
  };
  // CHEGA: encerra na hora, a qualquer momento, sem precisar chegar no teto (decisão do Diego, 28/07).
  // Nunca deleta — Regra Nº 7. Vira `perdido` com o motivo e o número de tentativas registrado.
  const onEncerrar = async (a, svc) => {
    const nTent = cobrancaTentativas(svc);
    setBusyCobranca(a.id);
    setResolvidas((r) => ({ ...r, [a.id]: a.data }));
    if (demo) { notify("Encerrado (demo).", "ok"); setBusyCobranca(null); return; }
    try {
      if (svc) {
        const motivo = `Encerrado por Diego em ${compactDate(today)} após ${nTent} tentativa(s) de contato sem retorno.`;
        const { error } = await db.from("servicos").update({ status: "perdido", proxima_acao: motivo, atualizado_em: new Date().toISOString() }).eq("id", svc.id);
        if (error) throw error;
        await db.from("historico").insert({ o_que: `Cobrança encerrada: ${svc.clientes?.nome || a.titulo}`, por: "diego", detalhe: motivo });
      }
      const { error: aErr } = await db.from("agenda").update({ status: "feito" }).eq("id", a.id);
      if (aErr) throw aErr;
      notify("Encerrado. Saiu da fila.", "ok");
      onServicoChanged();
    } catch (e) { setResolvidas((r) => { const c = { ...r }; delete c[a.id]; return c; }); notify("Erro: " + e.message, "error"); }
    finally { setBusyCobranca(null); }
  };
  const porTipo = (list) => filtroTipo === "todos" ? list : list.filter((entry) => (entry.tipo || "presencial") === filtroTipo);
  const due = porTipo(dueAll); const futuros = porTipo(futurosAll);
  const irParaVencendo = () => { if (dueAll.length === 0) return; setFiltroTipo("todos"); document.getElementById("secao-vencendo")?.scrollIntoView({ behavior: "smooth", block: "start" }); };
  return <div className="page-grid"><section className="hero-summary"><div><p className="kicker">VISÃO OPERACIONAL</p><h2>Clareza antes de velocidade.</h2><p>O site separa a vez do Claude, a sua vez e as decisões que exigem aprovação.</p></div><button className="primary" onClick={onOpenQueue}>Abrir fila de entrada</button></section><section className="metric-grid"><Metric label="Para Claude" value={inbox.filter((entry) => ["novo", "respondido"].includes(entry.status || "novo")).length} detail="Novos e respondidos" tone="orange" /><Metric label="Aguardando você" value={inbox.filter((entry) => entry.status === "aguardando_voce").length} detail="Perguntas no app" tone="red" /><Metric label="Agenda vencendo" value={dueAll.length} detail="Hoje ou atrasada" tone="yellow" onClick={dueAll.length > 0 ? irParaVencendo : null} /><Metric label="Sem próxima ação" value={noAction.length} detail="Leads que podem parar" tone="green" onClick={noAction.length > 0 ? onSemProximaAcao : null} /></section>
    <RotinasCard rotinas={rotinas || []} hoje={today} db={db} demo={demo} notify={notify} onChanged={onRotinaChanged} />
    <CapacidadeCard services={services} finances={finances} fornecedores={fornecedores} db={db} demo={demo} notify={notify} onChanged={onServicoChanged} />
    {/* SAIU DO PAINEL em 30/07/2026 o card "N cliente(s) esperando remarcação". Diego: "achei desnecessário
        pra mim, se tem o aviso aqui para Claude". Ele estava certo: remarcar é trabalho que o Claude resolve
        pela caixa, e o item já conta no badge da aba Caixa — o card só repetia isso ocupando o topo da tela
        que ele usa pra decidir o dia. A pendência continua protegida no banco (não pode ser excluída aberta,
        ver recusaSeForPendenciaAberta) e visível na fila; o que saiu foi só o aviso duplicado. */}
    {(dueAll.length > 0 || futurosAll.length > 0) && <div className="funil-filtros">{PAINEL_TIPO_FILTROS.map((f) => <button key={f.id} className={filtroTipo === f.id ? "active" : ""} onClick={() => setFiltroTipo(f.id)}>{f.label}</button>)}</div>}
    {(() => {
      // CONTA CHEGANDO: entra sozinho no Painel na véspera do vencimento (e fica enquanto estiver vencida),
      // com o caixa possível do lado — porque a pergunta que ele faz é "tenho de onde tirar?".
      const r = resumoContas(finances, services, today);
      if (!r.vencidas.length && !r.urgentes.length) return null;
      const linha = (f) => `${f.descricao || f.categoria} · ${money(f.valor)} · ${(f.data || "") < today ? "venceu " + compactDate(f.data) : (f.data === today ? "vence HOJE" : "vence amanhã")}`;
      return <section className="warning-card">
        <b>{money(r.totalVencidas + r.totalUrgentes)} a pagar {r.vencidas.length ? "— tem conta vencida" : "nas próximas 24h"}</b>
        {[...r.vencidas, ...r.urgentes].slice(0, 5).map((f) => <span key={f.id}>{linha(f)}</span>)}
        {r.potencialCaixa > 0
          ? <span>💰 Dá pra levantar {money(r.potencialCaixa)}{r.prontosSemCobranca.length ? ` — ${r.prontosSemCobranca.slice(0, 3).map((s) => s.clientes?.nome || s.titulo).join(", ")} sem pagamento registrado` : ""}</span>
          : <span>Nenhum serviço pronto pra cobrar no momento.</span>}
      </section>;
    })()}
    {/* SAIU o card "material sem dia marcado pra pedir": desde 25/07 o material que entra na lista de compras
        já nasce com compromisso na agenda, então esse aviso só acenderia pra lançamento velho — ruído diário
        pra um caso que não se repete. O que trava produção continua avisado no card "esperando material". */}
    {/* CLIENTE SEM TELEFONE NÃO É CARD DE AVISO, É PERGUNTA. Diego em 25/07: "deveria usar a função perguntas
        no app de qualquer dúvida". Faltar telefone não é estado que ele resolve olhando o Painel — é dado que
        só ele tem. Então o Claude manda pra caixa como `aguardando_voce`, que já tem campo de resposta e conta
        na métrica "Aguardando você". Card de aviso fica reservado pra estado que o app deduz e ele decide
        (faltando material, agendado sem valor). Ver Regra Nº 13. */}
    {/* O card solto "N serviço(s) esperando material" virou uma linha DENTRO do card de Capacidade, no
        serviço de cada profissional, com o botão "Já comprei" (Diego, 30/07). A regra não mudou — o alerta
        só apaga com o fato MATERIAL_EM_MÃOS, pedido pago em trânsito não apaga —, mudou o lugar: agora ele
        aparece onde ele já olha pra saber quem está com o quê, e dá pra resolver no mesmo toque. */}
    {(() => {
      // AGENDADO É TRABALHO FECHADO, NÃO VISITA DE ORÇAMENTO. Regra do Diego (25/07): "agendado que cair lá
      // e depois de fechado o serviço com entrada mesmo". Visita de orçamento marcada como agendado entrava
      // no card de Capacidade como trabalho precisando de profissional — ja aconteceu com duas visitas de orcamento.
      // O sinal objetivo de "fechado" é ter entrada registrada no financeiro.
      // Cuidado com falso alarme: tem serviço fechado com recibo que so e PAGO na entrega (caso real com recibo emitido) —
      // esse não tem entrada e está certo. O sinal de "não fechou nada" é não ter NEM valor NEM entrada.
      // SAIU DO PAINEL em 25/07 a pedido do Diego: isto é diagnóstico de arrumação, não decisão do dia.
      // Ver serviço mal classificado é trabalho de varredura, não coisa pra encarar toda manhã. A regra
      // continua valendo (agendado = fechado); o que saiu foi o card diário.
      return null;
    })()}
    {due.length > 0 && <section id="secao-vencendo" className="content-card"><div className="card-head"><div><p className="kicker">AGENDA</p><h3>Compromissos de hoje e atrasados</h3></div></div><AvisoRota compromissos={due.filter((a) => a.data === today)} />{[...due].sort(ordenarCompromisso).map((a) => <CompromissoCard key={a.id} a={a} svc={services.find((s) => s.id === a.servico_id)} today={today} onConcluir={onConcluir} onReschedule={onReschedule} materiais={materiaisDoCompromisso(finances, a.id)} />)}</section>}
    {/* ===== COBRANÇAS: o "dia do telefone", fora da rota (Diego, 28/07) ===== */}
    {cobrarCliente.length > 0 && <section className="content-card"><div className="card-head"><div><p className="kicker">COBRANÇAS · ESPERANDO O CLIENTE</p><h3>{cobrarCliente.length} pra cobrar hoje</h3></div></div>
      <p className="ficha-note">{valorEmJogo > 0 ? `${money(valorEmJogo)} em jogo · ` : ""}não é rota, resolve no celular. Cada uma volta sozinha em {COBRANCA_INTERVALO_DIAS} dias; na {COBRANCA_TETO_TENTATIVAS}ª sem resposta o app propõe encerrar.</p>
      {qtdNoTeto > 0 && <p className="ficha-note"><b>{qtdNoTeto} já no limite de {COBRANCA_TETO_TENTATIVAS} tentativas</b> — essas precisam de decisão sua: insistir ou encerrar.</p>}
      <button className="ghost" style={{ width: "100%" }} onClick={() => setListaCobrancas((v) => !v)}>{listaCobrancas ? "Fechar lista" : `Abrir a lista de ${cobrarCliente.length}`}</button>
      {listaCobrancas && <div style={{ marginTop: 12 }}>
        {[...cobrarCliente].sort((x, y) => (cobrancaNoTeto(svcDe(y)) ? 1 : 0) - (cobrancaNoTeto(svcDe(x)) ? 1 : 0) || (x.data || "").localeCompare(y.data || "")).map((a) => { const svc = svcDe(a); return <CobrancaCard key={a.id} a={a} svc={svc} today={today} tentativas={cobrancaTentativas(svc)} noTeto={cobrancaNoTeto(svc)} onCobrou={onCobrou} onEncerrar={onEncerrar} busy={busyCobranca === a.id} />; })}
      </div>}
    </section>}
    {futuros.length > 0 && <section className="content-card"><div className="card-head"><div><p className="kicker">AGENDA</p><h3>Próximos compromissos</h3></div></div>{[...futuros].sort(ordenarCompromisso).map((a) => <CompromissoCard key={a.id} a={a} svc={services.find((s) => s.id === a.servico_id)} today={today} onConcluir={onConcluir} onReschedule={onReschedule} materiais={materiaisDoCompromisso(finances, a.id)} />)}</section>}
    {filtroTipo !== "todos" && due.length === 0 && futuros.length === 0 && (dueAll.length > 0 || futurosAll.length > 0) && <div className="empty-state"><b>Nenhum compromisso {filtroTipo} no momento.</b></div>}
    {/* SAIU o aviso financeiro do rodapé: era o mesmo assunto do card "a pagar" lá em cima, só que sem o
        valor e sem o caixa possível — repetia a preocupação sem ajudar a decidir. Diego, 25/07. */}</div>;
}
function Metric({ label, value, detail, tone, onClick }) { return <article className={`metric-card ${tone}${onClick ? " clickable" : ""}`} onClick={onClick || undefined}><span>{label}</span><b>{String(value).padStart(2, "0")}</b><small>{detail}</small></article>; }

const FUNIL_FILTROS = [{ id: "todos", label: "Todos" }, { id: "sem_acao", label: "Sem ação" }, { id: "lead", label: "Lead" }, { id: "orcamento", label: "Orçamento" }, { id: "agendado", label: "Agendado" }, { id: "producao", label: "Em produção" }, { id: "entregue", label: "Entregue" }];
function LeadsView({ services, search, setSearch, onOpenFicha, initialFiltro, onConsumedInitialFiltro }) {
  const [filtroStatus, setFiltroStatus] = useState(initialFiltro || "todos");
  useEffect(() => { if (onConsumedInitialFiltro) onConsumedInitialFiltro(); }, []);
  // Mesma fila do card de Capacidade: produção primeiro (peça na bancada, prazo correndo), agendado no
  // final (fechado mas nem começou), e dentro de cada faixa o prazo mais apertado na frente.
  const ORDEM_FILA = { producao: 0, lead: 1, orcamento: 1, agendado: 2, entregue: 3, pago: 4, perdido: 5 };
  const visible = services.filter((service) => `${service.clientes?.nome} ${service.titulo}`.toLowerCase().includes(search.toLowerCase())).filter((service) => filtroStatus === "todos" || (filtroStatus === "sem_acao" ? !service.proxima_acao : service.status === filtroStatus))
    .sort((a, b) => (ORDEM_FILA[a.status] ?? 9) - (ORDEM_FILA[b.status] ?? 9) || String(a.prazo || "9999").localeCompare(String(b.prazo || "9999")));
  return <section className="content-card full"><div className="card-head"><div><p className="kicker">FUNIL DE TRABALHO</p><h3>{visible.length} serviços ativos</h3></div><input className="search" value={search} onChange={(event) => setSearch(event.target.value)} placeholder="Buscar cliente ou serviço" /></div>
    <div className="funil-filtros">{FUNIL_FILTROS.map((f) => <button key={f.id} className={filtroStatus === f.id ? "active" : ""} onClick={() => setFiltroStatus(f.id)}>{f.label}</button>)}</div>
    <div className="funil-lista">{visible.map((service) => <article className={`funil-item st-${service.status || "lead"}`} key={service.id} onClick={() => onOpenFicha(service.cliente_id)}>
      <div className="funil-esq">
        <strong>{service.clientes?.nome || "Cliente"}</strong>
        <span>{service.titulo}</span>
        <em>→ {service.proxima_acao || "Sem próxima ação"}</em>
      </div>
      <div className="funil-dir">
        <span className="status-pill">{statusLabel[service.status] || service.status}</span>
        {service.responsavel && <span className="responsavel-badge">👤 {service.responsavel}</span>}
        <b>{service.valor_orcamento ? money(service.valor_orcamento) : "—"}</b>
        <time>{compactDate(service.prazo)}</time>
      </div>
    </article>)}
    {!visible.length && <div className="empty-state"><b>Nenhum serviço nesse filtro.</b></div>}</div></section>;
}

// Colapsado: só o essencial pra bater o olho (dia + rota). Clica pra abrir os compromissos do dia.
function AgendaView({ appointments, services, finances, onReschedule, onConcluir, onAdd }) {
  const [diaAberto, setDiaAberto] = useState(null);
  const hoje = hojeISO();
  // A agenda é ROTA. Cobrança (remoto sem hora) mora no Painel, não aqui — senão um dia com 3 idas reais
  // aparece com 16 linhas e deixa de servir pra planejar deslocamento. Ver ehCobranca() e o bloco
  // "Cobranças" do Dashboard. Decisão do Diego em 28/07/2026.
  const daRota = (appointments || []).filter((a) => !ehCobranca(a));
  const qtdCobrancas = (appointments || []).length - daRota.length;
  const groups = daRota.reduce((acc, item) => { (acc[item.data] ||= []).push(item); return acc; }, {});
  const dias = Object.keys(groups).sort();
  return <section className="content-card full">
    <div className="card-head"><div><p className="kicker">ROTINA E DESLOCAMENTO</p><h3>Agenda planejada</h3></div><button className="primary" onClick={onAdd}>+ Adicionar</button></div>
    {qtdCobrancas > 0 && <p className="ficha-note">Só rota aqui. {qtdCobrancas} cobrança(s) sem hora ficam no Painel, em “Cobranças”.</p>}
    {!dias.length && <div className="empty-state"><b>Sem compromissos planejados.</b><span>Toque em “+ Adicionar” para criar.</span></div>}
    <div className="agenda-dias">{dias.map((date) => {
      const items = groups[date];
      const cor = corCompromisso(date, hoje);
      const presenciais = items.filter((a) => (a.tipo || "presencial") === "presencial" && a.cidade);
      const cidadesUnicas = [...new Map(presenciais.map((a) => [cidadeChave(a.cidade), a.cidade])).values()];
      const temRemoto = items.some((a) => a.tipo === "remoto");
      const aberto = diaAberto === date;
      const dt = new Date(date + "T12:00:00");
      const numero = dt.getDate();
      const mes = dt.toLocaleDateString("pt-BR", { month: "short" }).replace(".", "");
      const semana = dt.toLocaleDateString("pt-BR", { weekday: "short" }).replace(".", "");
      return <div className={`agenda-dia-card cor-${cor}`} key={date}>
        <button className="agenda-dia-head" onClick={() => setDiaAberto(aberto ? null : date)}>
          <div className="agenda-dia-data"><b>{numero}</b><span>{semana}</span><em>{mes}</em></div>
          <div className="agenda-dia-badges">
            {cidadesUnicas.map((c) => <span className="badge-cidade" key={c}>⌖ {c}</span>)}
            {temRemoto && <span className="badge-remoto">◌ Remoto</span>}
            {analisarRotaDoDia(items) && <span className="badge-cidade badge-rota">⚠ Rota volta pra trás</span>}
            {cidadesUnicas.length > 1 && <span className="badge-conflito">⚠️ 2 rotas</span>}
          </div>
          <div className="agenda-dia-meta"><b>{items.length}</b><span>{items.length === 1 ? "compromisso" : "compromissos"}</span></div>
          <i className="agenda-dia-seta">{aberto ? "▲" : "▼"}</i>
        </button>
        {aberto && <div className="agenda-dia-corpo"><AvisoRota compromissos={items} />{[...items].sort(ordenarCompromisso).map((a) => <CompromissoCard key={a.id} a={a} svc={services.find((s) => s.id === a.servico_id)} today={hoje} onConcluir={onConcluir} onReschedule={onReschedule} materiais={materiaisDoCompromisso(finances, a.id)} />)}</div>}
      </div>;
    })}</div>
  </section>;
}

function AddAgendaModal({ appointments, db, demo, notify, onClose, onDone }) {
  const [form, setForm] = useState({ titulo: "", tipo: "presencial", cidade: "" });
  const [pickerOpen, setPickerOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const submit = () => {
    if (!form.titulo.trim()) { notify("Descreva o compromisso.", "error"); return; }
    if (form.tipo === "presencial" && !form.cidade.trim()) { notify("Compromisso presencial precisa de cidade.", "error"); return; }
    setPickerOpen(true);
  };
  const onPicked = async (dataISO, hora) => {
    setPickerOpen(false);
    if (demo) { notify("Na demonstração a agenda não é salva.", "info"); onClose(); return; }
    setBusy(true);
    try {
      const { error } = await db.from("agenda").insert({ titulo: form.titulo.trim(), data: dataISO, hora, cidade: form.tipo === "presencial" ? form.cidade.trim() : null, tipo: form.tipo, status: "planejado" });
      if (error) throw error;
      notify("Compromisso adicionado.", "ok"); onDone();
    } catch (e) { notify("Erro: " + e.message, "error"); } finally { setBusy(false); }
  };
  const apptDesc = { titulo: form.titulo.trim() || "Novo compromisso", tipo: form.tipo, cidade: form.tipo === "presencial" ? form.cidade.trim() : null };
  return <>
    <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}><div className="modal-card small">
      <div className="modal-head"><div><p className="kicker">NOVO COMPROMISSO</p><h2>Adicionar</h2></div><button className="ghost" onClick={onClose}>Fechar</button></div>
      <div className="form-grid">
        <label>Compromisso*<input value={form.titulo} onChange={(e) => setForm((f) => ({ ...f, titulo: e.target.value }))} /></label>
        <div className="row"><label>Tipo<select value={form.tipo} onChange={(e) => setForm((f) => ({ ...f, tipo: e.target.value }))}><option value="presencial">Presencial</option><option value="remoto">Remoto</option></select></label><label>Cidade{form.tipo === "presencial" ? "*" : ""}<input value={form.cidade} onChange={(e) => setForm((f) => ({ ...f, cidade: e.target.value }))} disabled={form.tipo === "remoto"} /></label></div>
        <button className="primary wide" onClick={submit} disabled={busy}>Escolher dia e horário</button>
      </div>
    </div></div>
    {pickerOpen && <AgendaPicker appointments={appointments} appt={apptDesc} onClose={() => setPickerOpen(false)} onPicked={onPicked} />}
  </>;
}

function ConcluirModal({ db, demo, notify, appt, materiais, fornecedores, services, svc, onClose, onDone }) {
  const [step, setStep] = useState("choose");
  const [pendente, setPendente] = useState("");
  const [files, setFiles] = useState([]);
  const [busy, setBusy] = useState(false);
  const [valorCompra, setValorCompra] = useState("");
  const [fornecedorId, setFornecedorId] = useState((materiais || [])[0]?.fornecedor_id || "");
  const [pagamentoConfirmado, setPagamentoConfirmado] = useState(false);
  const [valorEntrega, setValorEntrega] = useState(svc?.valor_orcamento ? String(svc.valor_orcamento) : "");
  const [profissional, setProfissional] = useState(svc?.responsavel || "");
  const ehCompra = ehCompromissoDeCompra(appt, materiais);
  const ehEntrega = ehCompromissoDeEntrega(appt, svc);
  const ehPedidoRemoto = ehCompra && appt.tipo === "remoto";
  // BUSCAR O MÓVEL É SUCESSO, NÃO PENDÊNCIA. Diego, 04/08: "quando eu pegar o serviço, por exemplo da
  // Andriele, eu vou colocar em concluído parcial que busquei e deixei em tal profissional". Só que "Parcial"
  // cria pendência de REMARCAÇÃO — o app entendia como algo que deu errado e mandava reagendar, quando na
  // verdade o trabalho acabou de começar. E era nesse mesmo momento que ele sabia com quem ia deixar a peça,
  // mas não tinha onde dizer: por isso Gabriela, José Ângelo e Andriele estavam sem profissional.
  // Este caminho junta as três coisas num toque: conclui a busca, põe o serviço em produção e grava quem
  // ficou com ela.
  const ehBuscaDeServico = !ehCompra && !ehEntrega && svc && svc.status === "agendado" && appt.tipo === "presencial";
  const openParcial = () => { setPendente(sugerirPendente(appt.titulo)); setStep("parcial"); };
  // Compra pergunta o valor; entrega pergunta se o serviço acabou. O resto conclui direto como sempre.
  const concluirTotal = () => ehCompra ? setStep("compra") : ehEntrega ? setStep("entrega") : doTotal();
  // Entregou de verdade: o SERVIÇO vira Entregue e sai da lista de trabalho ativo. A trava do banco
  // (servicos_entregue_precisa_valor) exige valor, então se a ficha não tiver, o app pede aqui.
  const doEntrega = async () => {
    const valor = parseMoedaBR(valorEntrega);
    if (!valor || valor <= 0) { notify("Qual foi o valor do serviço? Sem isso não dá pra marcar como entregue.", "error"); return; }
    if (!svc?.id) { notify("Esta entrega não está ligada a um serviço.", "error"); return; }
    if (demo) { notify("Entregue (demo).", "ok"); onDone({ agendaId: appt.id, servicoId: svc.id, statusServico: "entregue", valorServico: valor, proximaAcao: null }); return; }
    setBusy(true);
    try {
      const operacao = await processarEventoOperacaoBahia(db, {
        tipo: "entrega_concluida", eventoId: "app-entrega-agenda-" + appt.id,
        dados: { agendaId: appt.id, servicoId: svc.id, valor, data: hojeISO(), por: "diego" },
      });
      if (files.length) {
        try {
          const uploaded = await uploadFiles();
          const nota = `Entrega concluída: "${appt.titulo}". Print(s) para conferir a ficha.${svc.id ? " (serviço #" + svc.id + ")" : ""}`;
          const { error: cxErr } = await db.from("caixa_entrada").insert({ texto: buildInboxPayload(uploaded, nota), status: "novo", conversa: [], processado: false }); if (cxErr) throw cxErr;
        } catch (upErr) { notify("Entrega fechada, mas os prints não anexaram: " + upErr.message, "error"); }
      }
      notify("Entregue. Serviço, agenda e histórico foram atualizados juntos.", "ok");
      onDone({ agendaId: appt.id, servicoId: svc.id, statusServico: "entregue", valorServico: valor, proximaAcao: null, resultado: operacao.resultado });
    } catch (e) { notify("A entrega ficou visível para retomada: " + e.message, "error"); }
    finally { setBusy(false); }
  };
  const uploadFiles = async () => {
    const uploaded = [];
    for (const f of files) {
      const path = `caixa-entrada/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
      const { error: uploadError } = await db.storage.from("fotos-servicos").upload(path, f); if (uploadError) throw uploadError;
      const { data, error } = await db.storage.from("fotos-servicos").createSignedUrl(path, 60 * 60 * 24 * 365); if (error) throw error;
      uploaded.push({ url: data.signedUrl, fileName: f.name });
    }
    return uploaded;
  };
  const doTotal = async () => {
    if (demo) { notify("Concluído (demo).", "ok"); onDone({ agendaId: appt.id, servicoId: appt.servico_id || null, proximaAcao: null }); return; }
    setBusy(true);
    try {
      await processarEventoOperacaoBahia(db, {
        tipo: "compromisso_concluido", eventoId: "app-conclusao-agenda-" + appt.id,
        dados: { agendaId: appt.id, servicoId: appt.servico_id || null, data: hojeISO(), proximaAcao: null, por: "diego" },
      });
      if (files.length) {
        try {
          const uploaded = await uploadFiles();
          const nota = `Concluído: "${appt.titulo}"${appt.cidade ? " · " + appt.cidade : ""}. Print(s) anexado(s) pro Claude ver e atualizar a ficha/foto.${appt.servico_id ? " (serviço #" + appt.servico_id + ")" : ""}`;
          const { error: cxErr } = await db.from("caixa_entrada").insert({ texto: buildInboxPayload(uploaded, nota), status: "novo", conversa: [], processado: false }); if (cxErr) throw cxErr;
        } catch (upErr) { notify("Compromisso concluído, mas os prints não anexaram: " + upErr.message, "error"); }
      }
      notify("Concluído.", "ok"); onDone({ agendaId: appt.id, servicoId: appt.servico_id || null, proximaAcao: null });
    } catch (e) { notify("A conclusão ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };
  // "Busquei e deixei com o Fulano": conclui o compromisso (que já leva o serviço pra produção no gateway) e
  // grava o responsável. O profissional é opcional — se ele ainda não sabe com quem vai deixar, a busca não
  // pode ficar travada por causa disso; o serviço entra em produção do mesmo jeito e o nome entra depois.
  const doBuscou = async () => {
    const nome = profissional.trim();
    if (demo) { notify("Registrado (demo).", "ok"); onDone({ agendaId: appt.id, servicoId: appt.servico_id || null, statusServico: "producao", proximaAcao: null }); return; }
    setBusy(true);
    try {
      const operacao = await processarEventoOperacaoBahia(db, {
        tipo: "compromisso_concluido", eventoId: "app-conclusao-agenda-" + appt.id,
        dados: { agendaId: appt.id, servicoId: appt.servico_id || null, data: hojeISO(), por: "diego" },
      });
      const r = operacao.resultado;
      if (nome && appt.servico_id && nome !== (svc?.responsavel || "")) {
        const { error } = await db.from("servicos").update({ responsavel: nome, atualizado_em: new Date().toISOString() }).eq("id", appt.servico_id);
        if (error) throw error;
      }
      notify(nome ? `Buscado e com ${nome}. O serviço entrou em produção.` : "Buscado. O serviço entrou em produção.", "ok");
      onDone({ agendaId: appt.id, servicoId: r.servicoId, statusServico: r.statusServico, proximaAcao: r.proximaAcao });
    } catch (e) { notify("Ficou visível para retomada: " + e.message, "error"); } finally { setBusy(false); }
  };
  // Lança o gasto e SÓ DEPOIS conclui: se a gravação do dinheiro falhar, o compromisso continua aberto,
  // porque compromisso fechado sem o gasto lançado é exatamente o que a gente está tentando evitar.
  const doCompra = async () => {
    const valor = parseMoedaBR(valorCompra);
    if (!valor || valor <= 0) { notify("Quanto ficou a compra?", "error"); return; }
    if (!fornecedorId) { notify("De qual fornecedor? (Regra Nº 8: material sempre com fornecedor)", "error"); return; }
    if (demo) { notify("Compra lançada (demo).", "ok"); onDone({ agendaId: appt.id, servicoId: appt.servico_id || null, statusServico: "producao", proximaAcao: "Produzir e acompanhar o prazo" }); return; }
    setBusy(true);
    try {
      const pendentes = (materiais || []);
      const alvo = pendentes[0] || null;
      const servicoAlvo = alvo?.servico_id || appt.servico_id || null;
      const faseEvento = ehPedidoRemoto ? "transito" : "em-maos";
      const eventoId = alvo?.id ? "app-material-" + faseEvento + "-financeiro-" + alvo.id : "app-material-" + faseEvento + "-agenda-" + appt.id;
      const operacao = await processarEventoOperacaoBahia(db, {
        tipo: ehPedidoRemoto ? "material_em_transito" : "material_em_maos", eventoId,
        dados: {
          financeiroId: alvo?.id || null, servicoId: servicoAlvo, fornecedorId, valor,
          data: hojeISO(), descricao: alvo?.descricao || appt.titulo, agendaId: appt.id,
          fecharAgenda: true, pagamentoConfirmado: ehPedidoRemoto ? pagamentoConfirmado : true, por: "diego",
        },
      });
      const r = operacao.resultado;
      notify(ehPedidoRemoto
        ? (pagamentoConfirmado ? "Pedido registrado e pago. O serviço aguarda o material chegar." : "Pedido registrado sem mexer no caixa. O serviço aguarda o material chegar.")
        : (r.materiaisPendentes ? `Material registrado. Ainda faltam ${r.materiaisPendentes} item(ns); o serviço ainda não iniciou produção.` : "Material em mãos. O serviço entrou em produção."), "ok");
      onDone({ agendaId: appt.id, removerAgenda: r.agendaId === appt.id, servicoId: r.servicoId, statusServico: r.statusServico, proximaAcao: ehPedidoRemoto ? "Aguardar chegada do material" : (r.materiaisPendentes ? "Buscar materiais restantes" : "Produzir e acompanhar o prazo") });
    } catch (e) { notify("A compra ficou visível para retomada: " + e.message, "error"); }
    finally { setBusy(false); }
  };
  // Saída sem atrito: comprou mas não tem o valor agora. Não trava o dia dele, mas também não deixa sumir —
  // cai na caixa pro Claude cobrar depois. Ver [[feedback-travas-inteligentes-no-app]].
  const doCompraDepois = async () => {
    if (!fornecedorId) { notify("De qual fornecedor? Preciso disso mesmo quando o valor vem depois.", "error"); return; }
    if (demo) { onDone({ agendaId: appt.id, servicoId: appt.servico_id || null, statusServico: "producao", proximaAcao: "Produzir e acompanhar o prazo" }); return; }
    setBusy(true);
    try {
      const alvo = (materiais || [])[0] || null;
      if (ehPedidoRemoto) throw new Error("Pedido remoto sem valor fica aberto: informe o valor ou registre uma pendência explicando o que falta.");
      const operacao = await processarEventoOperacaoBahia(db, {
        tipo: "material_em_maos", eventoId: alvo?.id ? "app-material-em-maos-financeiro-" + alvo.id : "app-material-sem-valor-agenda-" + appt.id,
        dados: {
          financeiroId: alvo?.id || null, servicoId: alvo?.servico_id || appt.servico_id || null,
          fornecedorId, agendaId: appt.id, data: hojeISO(), descricao: alvo?.descricao || appt.titulo,
          semValor: true, fecharAgenda: true, pagamentoConfirmado: false, por: "diego",
        },
      });
      const r = operacao.resultado;
      notify(r.materiaisPendentes ? `Material registrado, mas ainda faltam ${r.materiaisPendentes} item(ns). O valor ficou como pergunta visível.` : "Material em mãos. A produção andou e o valor ficou como pergunta visível.", "ok");
      onDone({ agendaId: appt.id, removerAgenda: r.agendaId === appt.id, servicoId: r.servicoId, statusServico: r.statusServico, proximaAcao: r.materiaisPendentes ? "Buscar materiais restantes" : "Produzir e acompanhar o prazo" });
    } catch (e) { notify("A compra ficou visível para retomada: " + e.message, "error"); }
    finally { setBusy(false); }
  };
  const doParcial = async () => {
    if (!pendente.trim()) { notify("Explique o que ficou pendente.", "error"); return; }
    if (demo) { notify("Anotado (demo).", "ok"); onDone({ agendaId: appt.id, servicoId: appt.servico_id || null, proximaAcao: pendente.trim() }); return; }
    setBusy(true);
    try {
      // ORDEM (corrigida em 25/07/2026 após revisão): a pendência nasce ANTES de qualquer upload ou
      // alteração destrutiva na agenda — upload é o passo mais lento e mais propenso a falhar (conexão
      // ruim na estrada), e se ele travasse ANTES da pendência existir, o cliente ficaria sem nenhuma
      // garantia de visibilidade até o Diego tentar de novo.
      const pend = await criarPendenciaRemarcacao(db, {
        agendaOrigemId: appt.id, servicoId: appt.servico_id || null,
        clienteNome: svc?.clientes?.nome || null, tituloOriginal: appt.titulo,
        cidadeOriginal: appt.cidade || null, tipoOriginal: appt.tipo || null,
        dataOriginal: appt.data, horaOriginal: appt.hora || null,
        motivo: pendente.trim(),
      });
      // Histórico só se o motivo for de fato novo — duplo clique com o MESMO texto não duplica o registro.
      if (!pend.motivoRepetido) {
        const { error: hErr } = await db.from("historico").insert({ o_que: `"${appt.titulo}": não concluído`, por: "diego", detalhe: "Ficou pendente: " + pendente.trim() });
        if (hErr) throw hErr;
      }
      if (appt.servico_id) {
        const { error: sErr } = await db.from("servicos").update({ proxima_acao: "Remarcar — " + pendente.trim().slice(0, 140), atualizado_em: new Date().toISOString() }).eq("id", appt.servico_id);
        if (sErr) throw sErr;
      }
      // SÓ AGORA a alteração destrutiva na agenda original. "Feito" só quando a data já tinha chegado (hoje
      // ou passado) — resultado verdadeiro. Se ainda era futuro quando foi desmarcado, fica "planejado" no
      // banco mesmo: forçar "feito" mentiria a data (o trigger empurraria pra hoje) sobre algo que não
      // aconteceu. resolverPendenciaComSucessor decide o resto quando a data nova existir.
      if (appt.data <= hojeISO()) {
        const { error } = await db.from("agenda").update({ status: "feito" }).eq("id", appt.id); if (error) throw error;
      }
      // Upload por último, best-effort: a garantia real (a pendência) já está de pé.
      if (files.length) {
        try { const uploaded = await uploadFiles(); await anexarArquivosNaPendencia(db, pend.id, uploaded); }
        catch (upErr) { notify("Anotado, mas o(s) print(s) não anexaram: " + upErr.message, "error"); onDone({ agendaId: appt.id, servicoId: appt.servico_id || null, proximaAcao: pendente.trim() }); return; }
      }
      notify("Anotado. Foi pra \"Precisa remarcar\" — o Claude organiza a nova data quando processar.", "ok");
      onDone({ agendaId: appt.id, servicoId: appt.servico_id || null, proximaAcao: pendente.trim() });
    } catch (e) { notify("Erro: " + e.message, "error"); } finally { setBusy(false); }
  };
  const filePicker = <div className="composer-actions"><label className="file-button">{files.length ? `${files.length} print(s)` : "Anexar print(s) (opcional)"}<input type="file" accept="image/*" multiple onChange={(e) => setFiles((fs) => [...fs, ...Array.from(e.target.files || [])])} /></label></div>;
  return <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal-card small">
      <div className="modal-head"><div><p className="kicker">CONCLUIR COMPROMISSO</p><h2>{appt.titulo}</h2></div><button className="ghost" onClick={onClose}>Fechar</button></div>
      {step === "choose" ? <div className="concluir-opcoes">
        <p className="modal-intro">Foi concluído totalmente ou ficou pendência?</p>
        {files.length > 0 && <div className="composer-files">{files.map((f, i) => <span key={i} className="composer-file-chip">{f.name}<button type="button" onClick={() => setFiles((fs) => fs.filter((_, idx) => idx !== i))}>✕</button></span>)}</div>}
        {filePicker}
        {ehBuscaDeServico && <button className="primary wide" onClick={() => setStep("buscou")} disabled={busy}>📦 Busquei — deixei com o profissional</button>}
        <button className={ehBuscaDeServico ? "ghost wide" : "primary wide"} onClick={concluirTotal} disabled={busy}>✔ Concluído total — acabou</button>
        {!ehCompra && !ehEntrega && svc && ["agendado", "producao"].includes(svc.status) && <button className="ghost wide" onClick={() => setStep("entrega")} disabled={busy}>Foi a entrega final — fechar o serviço</button>}
        <button className="secondary wide" onClick={openParcial} disabled={busy}>🟡 Parcial — falta algo, o Claude reagenda</button>
      </div> : step === "buscou" ? <div className="form-grid">
        <p className="modal-intro">A peça de {svc?.clientes?.nome || "esse cliente"} veio pra oficina. O serviço entra em produção agora — com quem ela ficou?</p>
        <label>Profissional<input value={profissional} onChange={(e) => setProfissional(e.target.value)} list="profissionais-conhecidos" placeholder="Nome de quem ficou com a peça" autoFocus /></label>
        <datalist id="profissionais-conhecidos">{[...new Set((services || []).map((s) => s.responsavel).filter(Boolean))].map((n) => <option key={n} value={n} />)}</datalist>
        <p className="ficha-note">Pode deixar em branco se ainda não definiu — o serviço entra em produção do mesmo jeito e você atribui depois.</p>
        <div className="ficha-actions"><button className="primary" onClick={doBuscou} disabled={busy}>Confirmar</button><button className="ghost" onClick={() => setStep("choose")} disabled={busy}>Voltar</button></div>
      </div> : step === "compra" ? <div className="form-grid">
        <p className="modal-intro">{ehPedidoRemoto ? "Isso é um pedido remoto. Registrar o pedido não significa que o material chegou." : "Isso é uma busca presencial de material. Quanto ficou? Só entra em produção quando o material estiver com você."}</p>
        <label>Valor da compra*<input inputMode="decimal" value={valorCompra} onChange={(e) => setValorCompra(e.target.value)} placeholder="Ex: 85,00" /></label>
        {ehPedidoRemoto && <label className="check"><input type="checkbox" checked={pagamentoConfirmado} onChange={(e) => setPagamentoConfirmado(e.target.checked)} />O dinheiro já saiu agora</label>}
        <label>Fornecedor*<select value={fornecedorId} onChange={(e) => setFornecedorId(e.target.value)}>
          <option value="">Selecione…</option>
          {(fornecedores || []).map((f) => <option key={f.id} value={f.id}>{f.nome}</option>)}
        </select></label>
        {appt.servico_id && <p className="ficha-note">Vai entrar vinculado ao serviço deste compromisso — é o que faz a margem real aparecer.</p>}
        <div className="ficha-actions"><button className="primary" onClick={doCompra} disabled={busy}>{ehPedidoRemoto ? "Registrar pedido e concluir" : "Material comigo — concluir"}</button><button className="ghost" onClick={() => { setPendente("Material não foi comprado; precisa remarcar a compra"); setStep("parcial"); }} disabled={busy}>Não comprei nada</button></div>
        {!ehPedidoRemoto && <button className="ghost wide" onClick={doCompraDepois} disabled={busy}>Material comigo, mas o valor eu passo depois</button>}
      </div> : step === "entrega" ? <div className="form-grid">
        <p className="modal-intro">Entregou mesmo? Então o serviço de {svc?.clientes?.nome || "esse cliente"} fecha aqui e sai da sua lista.</p>
        <label>Valor do serviço*<input inputMode="decimal" value={valorEntrega} onChange={(e) => setValorEntrega(e.target.value)} placeholder="Ex: 450,00" /></label>
        <p className="ficha-note">Sem valor o serviço não pode ser marcado como entregue — é o que evita trabalho entregue sem faturamento registrado.</p>
        <div className="ficha-actions"><button className="primary" onClick={doEntrega} disabled={busy}>Entreguei — fechar o serviço</button><button className="ghost" onClick={doTotal} disabled={busy}>Só esse compromisso, o serviço continua</button></div>
      </div> : <div className="form-grid">
        <label>Explique o que ficou pendente<textarea value={pendente} onChange={(e) => setPendente(e.target.value)} /></label>
        {files.length > 0 && <div className="composer-files">{files.map((f, i) => <span key={i} className="composer-file-chip">{f.name}<button type="button" onClick={() => setFiles((fs) => fs.filter((_, idx) => idx !== i))}>✕</button></span>)}</div>}
        {filePicker}
        <p className="ficha-note">Você só explica o que faltou — o Claude reagenda na próxima vez que você chamar. Não precisa escolher data agora.</p>
        <div className="ficha-actions"><button className="primary" onClick={doParcial} disabled={busy}>Registrar pro Claude</button><button className="ghost" onClick={() => setStep("choose")}>Voltar</button></div>
      </div>}
    </div>
  </div>;
}

function ExplicarModal({ db, demo, notify, item, kind, onClose, onDone }) {
  const ehReagendar = kind === "reagendar";
  const [texto, setTexto] = useState(ehReagendar ? sugerirPendente(item.titulo) : "");
  const [files, setFiles] = useState([]);
  const [busy, setBusy] = useState(false);
  const submit = async () => {
    if (!texto.trim()) { notify("Escreva uma explicação pro Claude.", "error"); return; }
    const alvoServicoDemo = item.tipoItem === "agenda" ? item.servico_id : item.id;
    if (demo) { notify("Anotado (demo).", "ok"); onDone({ agendaId: (item.tipoItem === "agenda" && ehReagendar) ? item.id : null, servicoId: alvoServicoDemo || null, proximaAcao: null }); return; }
    setBusy(true);
    const alvoServico = item.tipoItem === "agenda" ? item.servico_id : item.id;
    const fazerUpload = async () => {
      const up = [];
      for (const f of files) {
        const path = `caixa-entrada/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
        const { error: uploadError } = await db.storage.from("fotos-servicos").upload(path, f); if (uploadError) throw uploadError;
        const { data, error } = await db.storage.from("fotos-servicos").createSignedUrl(path, 60 * 60 * 24 * 365); if (error) throw error;
        up.push({ url: data.signedUrl, fileName: f.name });
      }
      return up;
    };
    try {
      if (item.tipoItem === "agenda" && ehReagendar) {
        // ORDEM: pendência primeiro (garantia de visibilidade), upload por último (mais lento, mais
        // propenso a falhar) — mesmo raciocínio do doParcial (ConcluirModal). Ver Regra Nº 12.
        const pend = await criarPendenciaRemarcacao(db, {
          agendaOrigemId: item.id, servicoId: alvoServico,
          clienteNome: item.cliente || null, tituloOriginal: item.titulo,
          cidadeOriginal: item.cidade || null, tipoOriginal: item.tipo || null,
          dataOriginal: item.data || null, horaOriginal: item.hora || null,
          motivo: texto.trim(),
        });
        if (!pend.motivoRepetido) {
          const { error: hErr } = await db.from("historico").insert({ o_que: `Reagendar: ${item.titulo}`, por: "diego", detalhe: texto.trim() });
          if (hErr) throw hErr;
        }
        if (alvoServico) {
          const { error: sErr } = await db.from("servicos").update({ proxima_acao: "Remarcar — " + texto.trim().slice(0, 140), atualizado_em: new Date().toISOString() }).eq("id", alvoServico);
          if (sErr) throw sErr;
        }
        if (item.data && item.data <= hojeISO()) {
          const { error } = await db.from("agenda").update({ status: "feito" }).eq("id", item.id); if (error) throw error;
        }
        if (files.length) {
          try { const uploaded = await fazerUpload(); await anexarArquivosNaPendencia(db, pend.id, uploaded); }
          catch (upErr) { notify("Anotado, mas o(s) print(s) não anexaram: " + upErr.message, "error"); onDone({ agendaId: item.id, servicoId: alvoServico || null, proximaAcao: null }); return; }
        }
        notify("Anotado. Foi pra \"Precisa remarcar\" — o Claude organiza a nova data quando processar.", "ok");
        onDone({ agendaId: item.id, servicoId: alvoServico || null, proximaAcao: null });
      } else {
        // "Concluir lead" — caminho hoje sem botão que o chame, comportamento anterior preservado.
        const uploaded = await fazerUpload();
        const ref = `(serviço #${item.id})`;
        const nota = `Concluir lead: ${item.titulo}. O que aconteceu: ${texto.trim()}. ${ref}`;
        const { error: cxErr } = await db.from("caixa_entrada").insert({ texto: buildInboxPayload(uploaded, nota), status: "novo", conversa: [], processado: false }); if (cxErr) throw cxErr;
        if (alvoServico) { const { error: sErr } = await db.from("servicos").update({ proxima_acao: null, atualizado_em: new Date().toISOString() }).eq("id", alvoServico); if (sErr) throw sErr; }
        const { error: hErr2 } = await db.from("historico").insert({ o_que: `Concluir lead: ${item.titulo}`, por: "diego", detalhe: texto.trim() }); if (hErr2) throw hErr2;
        notify("Anotado. Saiu da lista — o Claude cuida disso quando você chamar.", "ok");
        onDone({ agendaId: null, servicoId: alvoServico || null, proximaAcao: null });
      }
    } catch (e) { notify("Erro: " + e.message, "error"); } finally { setBusy(false); }
  };
  return <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal-card small">
      <div className="modal-head"><div><p className="kicker">{ehReagendar ? "REAGENDAR" : "CONCLUIR"}</p><h2>{item.titulo}</h2></div><button className="ghost" onClick={onClose}>Fechar</button></div>
      <div className="form-grid">
        <label>{ehReagendar ? "O que explicar pro Claude?" : "O que foi feito / o que o Claude deve fazer?"}<textarea value={texto} onChange={(e) => setTexto(e.target.value)} /></label>
        {files.length > 0 && <div className="composer-files">{files.map((f, i) => <span key={i} className="composer-file-chip">{f.name}<button type="button" onClick={() => setFiles((fs) => fs.filter((_, idx) => idx !== i))}>✕</button></span>)}</div>}
        <div className="composer-actions"><label className="file-button">{files.length ? `${files.length} print(s)` : "Anexar print(s) (opcional)"}<input type="file" accept="image/*" multiple onChange={(e) => setFiles((fs) => [...fs, ...Array.from(e.target.files || [])])} /></label></div>
        <p className="ficha-note">{ehReagendar ? "Você só explica — o Claude abre o calendário e reagenda na próxima vez que você chamar. Não precisa escolher a data agora." : "Você explica o que rolou — o Claude atualiza o lead (status, próximo passo) na próxima vez que você chamar."}</p>
        <div className="ficha-actions"><button className="primary" onClick={submit} disabled={busy}>Registrar pro Claude</button><button className="ghost" onClick={onClose}>Cancelar</button></div>
      </div>
    </div>
  </div>;
}

function AgendaPicker({ appointments, appt, onClose, onPicked }) {
  const tipo = appt.tipo || "presencial";
  const cidade = tipo === "presencial" ? (appt.cidade || "") : null;
  const hoje = new Date();
  const porDia = {};
  appointments.forEach((a) => { if (a.id && a.id === appt.id) return; (porDia[a.data] = porDia[a.data] || []).push(a); });
  const dias = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(hoje); d.setDate(d.getDate() + i);
    const dataISO = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const doDia = porDia[dataISO] || [];
    const ocupados = tipo === "presencial" ? doDia.filter((a) => (a.tipo || "presencial") === "presencial" && cidadeChave(a.cidade) === cidadeChave(cidade)).map((a) => a.hora) : [];
    const livres = horariosParaTipo(dataISO, tipo, ocupados);
    if (!livres.length) continue;
    const cidadesDoDia = [...new Set(doDia.filter((a) => (a.tipo || "presencial") === "presencial" && a.cidade).map((a) => a.cidade))];
    const outrasCidades = tipo === "presencial" && cidade ? doDia.filter((a) => (a.tipo || "presencial") === "presencial" && a.cidade && a.hora && cidadeChave(a.cidade) !== cidadeChave(cidade)) : [];
    dias.push({ dataISO, doDia, livres, cidadesDoDia, outrasCidades, conflito: outrasCidades.length > 0 });
  }
  return <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal-card small">
      <div className="modal-head"><div><p className="kicker">ESCOLHER DIA E HORÁRIO</p><h2>{appt.titulo || "Compromisso"}</h2></div><button className="ghost" onClick={onClose}>Fechar</button></div>
      <p className="modal-intro">{tipo === "remoto" ? "Tarefa remota — qualquer horário das 07h às 22h." : `Presencial${cidade ? " em " + cidade : ""} — respeitando sua rotina da semana.`}</p>
      {!dias.length ? <div className="empty-state"><b>Sem horário livre nos próximos 14 dias.</b></div> : dias.map((dia) => <div className="picker-day" key={dia.dataISO}>
        <div className={`picker-day-label${dia.conflito ? " conflito" : ""}`}>{compactDate(dia.dataISO)}{dia.doDia.length ? ` · ${dia.doDia.length} compromisso(s)` : " · dia livre"}{dia.cidadesDoDia.length ? ` · 🏙 ${dia.cidadesDoDia.join(", ")}` : ""}</div>
        {dia.conflito && <div className="picker-aviso">⚠️ Já tem {dia.outrasCidades.map((a) => `${(a.hora || "").slice(0, 5)} em ${a.cidade}`).join(", ")} — horários em vermelho não dão tempo de serviço + estrada.</div>}
        <div className="picker-slots">{dia.livres.map((h) => { const risky = horarioApertado(h, dia.outrasCidades, cidade); return <button key={h} className={`picker-slot${risky ? " risky" : ""}`} title={risky ? "Muito perto do compromisso em outra cidade — serviço + estrada não fecha." : ""} onClick={() => onPicked(dia.dataISO, h)}>{h}</button>; })}</div>
      </div>)}
    </div>
  </div>;
}

const FINANCE_ABAS = [{ id: "todos", label: "Todos" }, { id: "empresa", label: "Empresa" }, { id: "pro_labore", label: "Pró-labore" }, { id: "pessoal", label: "Pessoal" }];
function FinanceView({ finances, services, db, demo, mode, notify, onChanged, onVerAPagar }) {
  const [aba, setAba] = useState("todos");
  // FOCO = qual card do topo está selecionado. Diego (29/07): "entradas saídas e saldo ali dá pra fazer
  // outro card como a receber, e todos clicáveis levando a eles". O número parado não servia pra nada —
  // agora cada card é a porta pra lista dele, sem precisar de aba nova no menu.
  const [foco, setFoco] = useState("todos");
  // O Financeiro mostra o que JÁ ACONTECEU. Conta futura (a_pagar) fica de fora da lista porque ela ordena por
  // data: um parcelamento de 12 meses ia empilhar 2027 em cima do que aconteceu hoje e esconder o dia. O que
  // está por vencer aparece resumido na faixa do topo, que leva pra aba "A pagar".
  // A RECEBER TAMBÉM SAI DA LISTA (29/07/2026). Antes o filtro só tirava `a_pagar`, então saldo a receber
  // aparecia em "Lançamentos realizados" com "+ R$ 1.000" verde, idêntico a dinheiro que entrou — mas as
  // métricas do topo (corretamente) não somam a_receber. Lista e saldo não fechavam, e Diego não conseguia
  // saber o que tinha entrado de verdade: "esses a receber parece que já foram lançados, ficou muito
  // estranho a visualização". Dinheiro que ainda não entrou não é lançamento realizado — vai pra faixa
  // de resumo do topo, mesmo tratamento que já era dado às contas a pagar.
  const realizados = finances.filter((item) => item.status !== "a_pagar" && item.status !== "a_receber");
  const daAba = aba === "todos" ? realizados
    : aba === "pro_labore" ? realizados.filter((item) => item.categoria === "Pró-labore" && item.tipo === "entrada")
    : realizados.filter((item) => (item.escopo || "empresa") === aba);
  // MÊS A MÊS (Diego, 01/08): "como virou o mês agora, saber poder voltar e ver o mês passado". Antes a tela
  // era uma lista única desde o começo de tudo — virou agosto e julho inteiro sumiu de vista misturado no
  // meio. Agora abre no mês corrente e anda pra trás/frente num toque. "Tudo" continua existindo pra quando
  // ele quiser o histórico inteiro.
  const [mesSel, setMesSel] = useState(() => mesISO(hojeISO()));
  const andarMes = (delta) => {
    const base = mesSel || mesISO(hojeISO());
    const [ano, mes] = base.split("-").map(Number);
    const d = new Date(ano, mes - 1 + delta, 1);
    setMesSel(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };
  const visiveis = mesSel ? daAba.filter((item) => mesISO(item.data) === mesSel) : daAba;
  // O saldo em CAIXA nunca é do mês — é o acumulado. Mostrar só o resultado do mês no card grande faria ele
  // achar que tem menos dinheiro do que tem. Os dois números convivem: resultado do mês em cima, caixa embaixo.
  const caixaAcumulado = daAba.reduce((soma, i) => soma + (i.tipo === "entrada" ? Number(i.valor) : -Number(i.valor)), 0);
  // O alerta de vencimento mora no Painel (é lá que ele olha todo dia). Aqui fica só uma linha de resumo,
  // pra tela não virar uma parede de cards.
  const hoje = hojeISO();
  const resumo = resumoContas(finances, services, hoje);
  const paidIn = visiveis.filter((item) => item.tipo === "entrada" && (!item.status || item.status === "pago")).reduce((sum, item) => sum + Number(item.valor), 0); const paidOut = visiveis.filter((item) => item.tipo === "saida" && (!item.status || item.status === "pago")).reduce((sum, item) => sum + Number(item.valor), 0);
  const totalAReceber = resumo.aReceber.reduce((s, f) => s + Number(f.valor), 0);
  // A lista de baixo obedece o card selecionado. Só o "A receber" troca o componente inteiro (tem botão de
  // dar baixa); entrada/saída são o mesmo formato de linha, só filtrado.
  const noFoco = foco === "entrada" ? visiveis.filter((i) => i.tipo === "entrada") : foco === "saida" ? visiveis.filter((i) => i.tipo === "saida") : visiveis;
  return <div className="page-grid"><div className="funil-filtros">{FINANCE_ABAS.map((a) => <button key={a.id} className={aba === a.id ? "active" : ""} onClick={() => setAba(a.id)}>{a.label}</button>)}</div>
    <div className="mes-nav">
      <button type="button" className="ghost" onClick={() => andarMes(-1)} disabled={!mesSel} title="Mês anterior">‹</button>
      <strong>{mesSel ? mesLabel(mesSel) : "Todo o histórico"}</strong>
      <button type="button" className="ghost" onClick={() => andarMes(1)} disabled={!mesSel} title="Próximo mês">›</button>
      <button type="button" className={`ghost${mesSel ? "" : " active"}`} onClick={() => setMesSel(mesSel ? "" : mesISO(hojeISO()))}>{mesSel ? "Ver tudo" : "Voltar pro mês"}</button>
    </div>
    {resumo.aPagar.length > 0 && <p className="ficha-note">{money(resumo.totalAPagar)} em {resumo.aPagar.length} conta(s) ainda por pagar
      {resumo.vencidas.length ? ` · ${resumo.vencidas.length} já vencida(s)` : ""}
      {onVerAPagar && <> · <button type="button" className="ficha-link" onClick={onVerAPagar}>ver em A pagar</button></>}</p>}
    {/* 4 CARDS CLICÁVEIS. O de "A receber" é amarelo de propósito: é o único que NÃO é dinheiro no caixa. */}
    <section className="metric-grid finance-metrics">
      <Metric label="Entradas" value={money(paidIn)} detail={foco === "entrada" ? "▾ mostrando só estas" : "Confirmadas · toque para ver"} tone="green" onClick={() => setFoco(foco === "entrada" ? "todos" : "entrada")} />
      <Metric label="Saídas" value={money(paidOut)} detail={foco === "saida" ? "▾ mostrando só estas" : "Confirmadas · toque para ver"} tone="red" onClick={() => setFoco(foco === "saida" ? "todos" : "saida")} />
      <Metric label={mesSel ? "Resultado do mês" : "Saldo"} value={money(paidIn - paidOut)} detail={mesSel ? `Em caixa hoje: ${money(caixaAcumulado)}` : (foco === "todos" ? "▾ tudo que já aconteceu" : "Toque para ver tudo")} tone="orange" onClick={() => setFoco("todos")} />
      <Metric label="A receber" value={money(totalAReceber)} detail={foco === "receber" ? "▾ ainda fora do caixa" : `${resumo.aReceber.length} saldo(s) · toque para ver`} tone="yellow" onClick={() => setFoco(foco === "receber" ? "todos" : "receber")} />
    </section>
    {foco === "receber"
      ? <AReceberBloco finances={finances} services={services} db={db} demo={demo} mode={mode} notify={notify} onChanged={onChanged} />
      : <section className="content-card"><div className="card-head"><div><p className="kicker">DIEGO E CLAUDE · MESMA OPERAÇÃO TIPADA</p><h3>{foco === "entrada" ? "Entradas confirmadas" : foco === "saida" ? "Saídas confirmadas" : "Lançamentos realizados"}</h3></div></div>{noFoco.map((item) => <div className="finance-row" key={item.id}><div><strong>{descricaoFinanceiraVisivel(item.descricao) || item.categoria || "Lançamento"}</strong><span>{compactDate(item.data)} · {item.status || "pago"}</span></div><b className={item.tipo}>{item.tipo === "saida" ? "−" : "+"} {money(item.valor)}</b></div>)}{!noFoco.length && <div className="empty-state"><b>{mesSel ? `Nenhum lançamento em ${mesLabel(mesSel)}.` : "Nada por aqui ainda."}</b>{mesSel && <span>Use as setas pra ver outro mês, ou “Ver tudo”.</span>}</div>}</section>}</div>;
}

function nomeFornecedorVale(descricao) {
  const semPrefixo = (descricao || "").replace(/^Vale\s*-\s*/i, "");
  return semPrefixo.split(/[\(,]/)[0].trim() || "Sem nome";
}
const VALE_ABATIDO_TAG = "[ABATIDO] ";

  const [busyId, setBusyId] = useState(null);

    <section className="content-card"><div className="card-head"><div><p className="kicker">CONTROLE DE VALES</p><h3>Pendentes de abater</h3></div></div>
      {!pendentes.length && <div className="empty-state"><b>Nenhum vale pendente.</b><span>Quando você der um vale a um profissional, ele aparece aqui até marcar como abatido.</span></div>}
      {Object.entries(porFornecedor).map(([nome, itens]) => { const subtotal = itens.reduce((s, v) => s + Number(v.valor), 0); return <div key={nome} className="vale-fornecedor">
        <div className="vale-fornecedor-head"><strong>{nome}</strong><b>{money(subtotal)}</b></div>
        {itens.map((v) => <div className="finance-row" key={v.id}><div><strong>{compactDate(v.data)}</strong><span>{v.descricao}</span></div><div className="agenda-acoes"><b className="saida">− {money(v.valor)}</b><button className="ghost" disabled={busyId === v.id} onClick={() => marcarAbatido(v)}>{busyId === v.id ? "..." : "Marcar abatido"}</button></div></div>)}
      </div>; })}
    </section>

  </div>;
}

// Compra de material NÃO é uma tabela separada: é um lançamento normal do financeiro (categoria "Material", escopo empresa)
// com fornecedor_id e, quando o material foi pra um trabalho específico, servico_id. Assim o saldo da empresa nunca
// desencontra e a aba Compras é só uma VISTA - mesmo padrão de Vales e Pró-labore. Ver REGRA Nº 8 no Guia da IA.
const CATEGORIA_MATERIAL = "Material";
// Dinheiro que ENTRA por um trabalho. Comparado sem acento porque o banco tem as duas grafias ("Serviço" e
// "Servico") vindas de lançamentos de épocas diferentes — a trava não pode depender do cedilha.
const ehCategoriaServico = (cat) => String(cat || "").normalize("NFD").replace(/[̀-ͯ]/g, "").trim().toLowerCase() === "servico";
const MATERIAL_EM_MAOS_TAG = "[EM MÃOS] ";
const MATERIAL_EM_TRANSITO_TAG = "[EM TRÂNSITO] ";
function ehCompraMaterial(item) { return item.tipo === "saida" && item.categoria === CATEGORIA_MATERIAL; }
function materialEstaEmMaos(item) { return (item?.descricao || "").startsWith(MATERIAL_EM_MAOS_TAG); }
function materialEstaEmTransito(item) { return (item?.descricao || "").startsWith(MATERIAL_EM_TRANSITO_TAG); }
// Tags são controle interno de cada aba (material em mãos, vale abatido) — no Financeiro elas só poluem.
// Diego, 04/08: "confirmei na aba Vales, lá não era para mexer no financeiro". E não mexeu: o valor e o
// status do vale continuaram iguais. O que mudou foi o NOME do lançamento, que passou a exibir "[ABATIDO]"
// na lista do Financeiro — e ver a linha mudar sozinha depois de mexer noutra aba parece, com toda razão,
// que o caixa foi alterado. Aparência de alteração no dinheiro é tão ruim quanto alteração de verdade.
function descricaoFinanceiraVisivel(descricao) { return String(descricao || "").replace(MATERIAL_EM_MAOS_TAG, "").replace(MATERIAL_EM_TRANSITO_TAG, "").replace(VALE_ABATIDO_TAG, ""); }
// Compra antiga entrou sem fornecedor e fica pedindo atenção. "Conferido" é só a marca de que o Diego já olhou
// e está certo - nunca apaga o lançamento (Regra Nº 7), só tira do que precisa de revisão.
const COMPRA_CONFERIDA_TAG = "[CONFERIDO] ";
// COMO O MATERIAL VIRA COMPROMISSO. Fornecedor com dias de entrega cadastrados ENTREGA, então o que o Diego
// precisa fazer é PEDIR — vira compromisso remoto, um dia antes da entrega (é o "pedido 1 dia antes" que já
// está na observação dos fornecedores). Fornecedor sem dia fixo não entrega: aí é viagem presencial e precisa
// de cidade e hora, senão quebra a Regra Nº 4. Ver [[feedback-operacao-drive-direto-sem-caixa]].
// Conta a pagar e caixa possível num lugar só, porque a decisão é sempre a mesma: "vou ter que pagar isso,
// tenho de onde tirar?". Usado no Painel (alerta com 1 dia de antecedência) e no Financeiro (linha de resumo).
function resumoContas(finances, services, hoje) {
  const amanha = (() => { const d = new Date(hoje + "T12:00:00"); d.setDate(d.getDate() + 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; })();
  const aPagar = (finances || []).filter((f) => f.status === "a_pagar" && f.tipo === "saida" && f.categoria !== "Vale");
  const vencidas = aPagar.filter((f) => (f.data || "") < hoje);
  // 1 dia de antecedência: entra no Painel na véspera, não no dia, pra dar tempo de correr atrás do dinheiro.
  const urgentes = aPagar.filter((f) => (f.data || "") === hoje || (f.data || "") === amanha);
  const aReceber = (finances || []).filter((f) => f.tipo === "entrada" && f.status === "a_receber");
  const comEntrada = new Set((finances || []).filter((f) => f.tipo === "entrada" && f.servico_id).map((f) => f.servico_id));
  const prontosSemCobranca = (services || []).filter((s) => ["entregue", "producao"].includes(s.status) && Number(s.valor_orcamento) > 0 && !comEntrada.has(s.id));
