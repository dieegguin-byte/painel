function normalizePhone(value) {
  let digits = value.replace(/\D/g, "");
  if ((digits.length === 12 || digits.length === 13) && digits.startsWith("55")) digits = digits.slice(2);
  return digits;
}
// TRAVA DE TELEFONE (na gravação, não em aviso pro Diego arrumar depois): celular BR tem DDD + 9 + 8 dígitos.
// Número antigo vem com 10 dígitos, sem o 9 - e aí o link do WhatsApp não abre. Aqui o 9 é colocado sozinho e
// o telefone sai sempre no mesmo formato. Retorna null quando não dá pra salvar (o form barra e avisa).
function corrigirTelefone(value) {
  let d = String(value || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.length > 11 && d.startsWith("55")) d = d.slice(2);
  if (d.length === 10) d = d.slice(0, 2) + "9" + d.slice(2); // faltava o 9 do celular
  if (d.length !== 11) return null;
  return `+55 ${d.slice(0, 2)} ${d.slice(2, 7)}-${d.slice(7)}`;
}

function extractLead(text) {
  const raw = text || "";

  const name = nameMatch ? nameMatch[1].trim() : "";
  let stripped = raw;
  if (phoneMatch) stripped = stripped.replace(new RegExp(phoneMatch[0].replace(/[().]/g, "\\$&") + "\\.?", ""), " ");

function detectCidade(text) {

function detectValor(text) {

// Dia da semana (0=domingo … 6=sábado), aceitando com e sem acento.
const DIAS_SEMANA = { domingo: 0, segunda: 1, "terça": 2, terca: 2, quarta: 3, quinta: 4, sexta: 5, "sábado": 6, sabado: 6 };
function isoData(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function detectPrazo(text) {
  const t = text.toLowerCase();
  const hoje = new Date();
  if (/\bhoje\b/.test(t)) return isoData(hoje);
  if (/\bdepois de amanh[ãa]/.test(t)) { const d = new Date(hoje); d.setDate(d.getDate() + 2); return isoData(d); }
  if (/\bamanh[ãa]/.test(t)) { const d = new Date(hoje); d.setDate(d.getDate() + 1); return isoData(d); }
  const dataExplicita = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if (dataExplicita) {
    const dia = Number(dataExplicita[1]), mes = Number(dataExplicita[2]) - 1;
    const ano = dataExplicita[3] ? (dataExplicita[3].length === 2 ? 2000 + Number(dataExplicita[3]) : Number(dataExplicita[3])) : hoje.getFullYear();
    const d = new Date(ano, mes, dia);
    if (!isNaN(d.getTime())) { if (!dataExplicita[3] && d < hoje) d.setFullYear(d.getFullYear() + 1); return isoData(d); }
  }
  const diaDoMes = t.match(/\bdia\s+(\d{1,2})\b/);
  if (diaDoMes) { const d = new Date(hoje.getFullYear(), hoje.getMonth(), Number(diaDoMes[1])); if (d < hoje) d.setMonth(d.getMonth() + 1); return isoData(d); }
  for (const [nome, alvo] of Object.entries(DIAS_SEMANA)) {
    if (new RegExp("\\b" + nome + "(-feira)?\\b").test(t)) {
      const d = new Date(hoje); let diff = alvo - d.getDay(); if (diff <= 0) diff += 7; d.setDate(d.getDate() + diff);
      return isoData(d);
    }
  }
  return "";
}
// VALOR EM DINHEIRO DIGITADO POR GENTE (29/07/2026). O app fazia `Number(txt.replace(",", "."))` em 12
// lugares — o que quebra no formato brasileiro: Diego digitou "2.189" no valor da entrega do Gerson e o
// banco gravou R$ 2,19. Erro de mil vezes num valor real, sem nenhum aviso.
// Regra: vírgula presente = decimal brasileiro (ponto é milhar). Só pontos = milhar quando sobram 3
// dígitos depois do último ponto ("2.189" → 2189), decimal quando sobram 1 ou 2 ("2.19" → 2.19).
function parseMoedaBR(valor) {
  const txt = String(valor ?? "").trim().replace(/[^\d.,]/g, "");
  if (!txt) return NaN;
  if (txt.includes(",")) return Number(txt.replace(/\./g, "").replace(",", "."));
  const partes = txt.split(".");
  if (partes.length > 1 && partes[partes.length - 1].length === 3) return Number(partes.join(""));
  return Number(txt);
}

}

  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));

// RESOLVER quando existe DATA REAL combinada. Duas estratégias, decididas pelo estado ATUAL da origem (não
// por suposição): se ela ainda está "planejado", nunca foi uma tentativa que aconteceu — é só remarcada NO
// MESMO REGISTRO, sem criar linha nova. Se já está "feito", a origem foi mesmo tentada e encerrada; nasce um
// compromisso NOVO vinculado ao serviço. Nos dois casos grava agenda_sucessora_id ANTES de marcar resolvida.
async function resolverPendenciaComSucessor(db, { pendenciaId, agendaOrigemId, servicoId, data, hora, tipo, cidade, tituloNovo }) {
  const { data: pend, error: leituraErr } = await db.from("caixa_entrada").select("id,conversa,processado,status").eq("id", pendenciaId).single();
  if (leituraErr) throw leituraErr;
  const meta = ultimaMetaRemarcacao(pend);
  if (!meta) throw new Error("Item não é uma pendência de remarcação em aberto.");
  const origemId = meta.agenda_origem_id || agendaOrigemId || null;
  const alvoServicoId = meta.servico_id || servicoId || null;
  if (agendaOrigemId && meta.agenda_origem_id && agendaOrigemId !== meta.agenda_origem_id) throw new Error("A agenda informada não pertence a esta pendência.");
  if (servicoId && meta.servico_id && servicoId !== meta.servico_id) throw new Error("O serviço informado não pertence a esta pendência.");
  if (meta.agenda_sucessora_id) {
    // A sucessora pode ter sido gravada e a aba fechado antes do último UPDATE. Retomar termina a pendência,
    // não cria outro compromisso.
    if (!pend.processado) {
      const { error: resErr } = await db.from("caixa_entrada").update({ status: "resolvido", processado: true, processado_em: new Date().toISOString() }).eq("id", pendenciaId);
      if (resErr) throw resErr;
    }
    return { ok: true, jaResolvida: true, sucessoraId: meta.agenda_sucessora_id };
  }
  if (!data) throw new Error("Informe a data combinada antes de resolver.");
  const tipoFinal = tipo || meta.tipo_original || "remoto";
  const cidadeFinal = tipoFinal === "presencial" ? (cidade || meta.cidade_original || null) : null;
  const horaFinal = tipoFinal === "presencial" ? (hora || null) : null;
  if (tipoFinal === "presencial" && (!cidadeFinal || !horaFinal)) throw new Error("Compromisso presencial exige cidade e hora realmente combinadas.");

  const { data: origem, error: origemErr } = origemId ? await db.from("agenda").select("id,status").eq("id", origemId).maybeSingle() : { data: null, error: null };
  if (origemErr) throw origemErr;

  let sucessoraId;
  if (origem && origem.status === "planejado") {
    // Nunca aconteceu (só foi remarcada antes da data chegar) — atualiza a própria linha, não cria outra.
    const { error: upErr } = await db.from("agenda").update({
      data, hora: horaFinal, tipo: tipoFinal, cidade: cidadeFinal, status: "planejado",
      ...(tituloNovo ? { titulo: tituloNovo } : {}),
    }).eq("id", origemId);
    if (upErr) throw upErr;
    sucessoraId = origemId;
  } else {
    // Foi tentativa real (origem já "feito", ou não existe mais) — nasce um compromisso novo.
    const novoId = await uuidDeterministicoEvento("remarcacao:" + pendenciaId, "agenda-sucessora");
    const { data: novo } = await inserirComIdDeterministico(db, "agenda", novoId, {
      servico_id: alvoServicoId, titulo: tituloNovo || meta.titulo_original || "Compromisso remarcado",
      data, hora: horaFinal, tipo: tipoFinal, cidade: cidadeFinal, status: "planejado",
    }, ["servico_id", "data", "tipo"]);
    sucessoraId = novo.id;
    if (origemId) {
      const historicoId = await uuidDeterministicoEvento("remarcacao:" + pendenciaId, "historico");
      await inserirComIdDeterministico(db, "historico", historicoId, { o_que: "Remarcado", por: "diego", detalhe: "Compromisso de " + (meta.data_original || "?") + " virou novo compromisso em " + data + " (agenda #" + sucessoraId + ")" }, ["o_que", "detalhe"]);
    }
  }

  // Grava a sucessora ANTES de resolver — se cair aqui, o compromisso já existe; só falta marcar a
  // pendência como tratada, e uma nova tentativa de resolução vai achar agenda_sucessora_id preenchido
  // (linha seguinte já devolve jaResolvida:true) em vez de duplicar.
  const indiceMeta = [...(pend.conversa || [])].map((m) => m?.meta?.tipo_operacional).lastIndexOf("remarcacao");
  const conversaNova = (pend.conversa || []).map((m, index) => index === indiceMeta
    ? { ...m, meta: { ...m.meta, agenda_sucessora_id: sucessoraId } } : m);
  const { error: metaErr } = await db.from("caixa_entrada").update({ conversa: conversaNova }).eq("id", pendenciaId);
  if (metaErr) throw metaErr;

  const { error: resErr } = await db.from("caixa_entrada").update({ status: "resolvido", processado: true, processado_em: new Date().toISOString() }).eq("id", pendenciaId);
  if (resErr) throw resErr;
  return { ok: true, jaResolvida: false, sucessoraId };
}
// RESOLVER SEM SUCESSOR — só permitido quando o serviço chegou num estado terminal (entregue, perdido ou
// pago). É a única exceção a "toda pendência precisa de compromisso novo": cliente desistiu, serviço
// encerrou, não existe mais o que remarcar.
async function resolverPendenciaTerminal(db, { pendenciaId, servicoId }) {
  const { data: pend, error: leituraErr } = await db.from("caixa_entrada").select("id,conversa,processado").eq("id", pendenciaId).single();
  if (leituraErr) throw leituraErr;
  const meta = ultimaMetaRemarcacao(pend);
  if (!meta) throw new Error("Item não é uma pendência de remarcação em aberto.");
  if (meta.agenda_sucessora_id) return { ok: true, jaResolvida: true };
  const alvoServicoId = meta.servico_id || servicoId || null;
  if (servicoId && meta.servico_id && servicoId !== meta.servico_id) throw new Error("O serviço informado não pertence a esta pendência.");
  if (!alvoServicoId) throw new Error("Pendência sem serviço vinculado não pode encerrar como terminal.");
  const { data: svc, error: svcErr } = await db.from("servicos").select("status").eq("id", alvoServicoId).maybeSingle();
  if (svcErr) throw svcErr;
  if (!svc || !["entregue", "perdido", "pago"].includes(svc.status)) throw new Error("Serviço não está em estado terminal (entregue/perdido/pago) — não pode encerrar sem sucessor.");
  if (pend.processado) return { ok: true, jaResolvida: true };
  const { error: resErr } = await db.from("caixa_entrada").update({ status: "resolvido", processado: true, processado_em: new Date().toISOString() }).eq("id", pendenciaId);
  if (resErr) throw resErr;

}
// EXCLUIR PENDÊNCIA OPERACIONAL É SEMPRE RECUSADO — Regra Nº 7 (nunca apagar) vale em dobro aqui: apagar uma
// pendência aberta faz o cliente desaparecer de novo, exatamente o problema que este desenho existe pra

  const meta = ultimaMetaRemarcacao(item);

// ===== PORTA ÚNICA DA OPERAÇÃO BAHIA ==============================================================
// O chat/Claude não deve repetir uma cadeia de UPDATEs por conta própria. Cada fato entra aqui com um id
// estável. A própria chave primária UUID das tabelas vira a trava contra duplo clique, nova aba e reprocessar
// o mesmo documento — sem DDL. Se uma etapa falhar, o checkpoint fica aberto em caixa_entrada e o fato não
// desaparece da operação.
const TIPO_EVENTO_OPERACAO = "evento_operacao_bahia";
function jsonCanonico(value) {
  if (Array.isArray(value)) return value.map(jsonCanonico);
  if (value && typeof value === "object") return Object.keys(value).sort().reduce((out, key) => {
    if (value[key] !== undefined) out[key] = jsonCanonico(value[key]);
    return out;
  }, {});
  return value;
}
function metaEventoOperacao(item) {
  const msgs = (item?.conversa || []).filter((m) => m?.meta?.tipo_operacional === TIPO_EVENTO_OPERACAO);
  return msgs.length ? msgs[msgs.length - 1].meta : null;
}
async function uuidDeterministicoEvento(eventoId, papel) {
  const hex = await sha256("tapecaria-bahia-operacao-v1|" + String(eventoId) + "|" + String(papel));
  const chars = hex.slice(0, 32).split("");
  chars[12] = "5";
  chars[16] = (8 + (parseInt(chars[16], 16) % 4)).toString(16);
  const h = chars.join("");
  return [h.slice(0, 8), h.slice(8, 12), h.slice(12, 16), h.slice(16, 20), h.slice(20, 32)].join("-");
}
function mesmoValorBanco(a, b) {
  if ((a === null || a === undefined || a === "") && (b === null || b === undefined || b === "")) return true;
  if (typeof a === "number" || typeof b === "number") return Number(a) === Number(b);
  return String(a) === String(b);
}
async function inserirComIdDeterministico(db, tabela, id, payload, chavesConferencia) {
  const tentativa = await db.from(tabela).insert({ id, ...payload }).select("*").single();
  if (!tentativa.error) return { data: tentativa.data, jaExistia: false };
  if (tentativa.error.code !== "23505") throw tentativa.error;
  const existente = await db.from(tabela).select("*").eq("id", id).single();
  if (existente.error) throw existente.error;
  const divergente = (chavesConferencia || []).find((key) => !mesmoValorBanco(existente.data?.[key], payload[key]));
  if (divergente) throw new Error("O mesmo evento já existe com conteúdo diferente em " + tabela + "." + divergente + ". Crie uma correção com outro eventoId.");
  return { data: existente.data, jaExistia: true };
}
async function lerRegistro(db, tabela, id, campos = "*") {
  if (!id) return null;
  const { data, error } = await db.from(tabela).select(campos).eq("id", id).maybeSingle();
  if (error) throw error;
  return data || null;
}
function trocarMetaEvento(conversa, patch) {
  const msgs = conversa || [];
  const indice = [...msgs].map((m) => m?.meta?.tipo_operacional).lastIndexOf(TIPO_EVENTO_OPERACAO);
  if (indice < 0) throw new Error("Checkpoint sem metadado operacional.");
  return msgs.map((m, i) => i === indice ? { ...m, meta: { ...m.meta, ...patch, resultado: { ...(m.meta.resultado || {}), ...(patch.resultado || {}) } } } : m);
}
async function iniciarEventoOperacao(db, evento) {
  const eventoId = String(evento?.eventoId || "").trim();
  const tipoEvento = String(evento?.tipo || "").trim();

  if (eventoId.length > 180) throw new Error("eventoId longo demais.");
  const fingerprint = await sha256(tipoEvento + "|" + JSON.stringify(jsonCanonico(evento.dados || {})));
  const id = await uuidDeterministicoEvento(eventoId, "checkpoint");

    tipo_operacional: TIPO_EVENTO_OPERACAO, versao: 1, evento_id: eventoId, tipo_evento: tipoEvento,

    item_ref: evento.itemRef || null, texto_original: evento.textoOriginal || null,

    texto: "Aplicando operação: " + tipoEvento + " · " + eventoId,
    status: "novo", processado: false,
    conversa: [{ de: "ia", tipo: "sistema", texto: "Checkpoint criado antes de alterar a operação.", em: agora, meta }],
  }, []);
  const atual = inserido.data;
  const metaAtual = metaEventoOperacao(atual);
  if (!metaAtual || metaAtual.evento_id !== eventoId || metaAtual.tipo_evento !== tipoEvento) throw new Error("Colisão de checkpoint operacional.");
  if (metaAtual.fingerprint !== fingerprint) throw new Error("O mesmo eventoId foi reutilizado com dados diferentes. Registre uma correção com novo id.");
  if (atual.processado && metaAtual.estado === "concluido") return { id, jaConcluido: true, resultado: metaAtual.resultado || {} };
  if (inserido.jaExistia) {
    const conversa = trocarMetaEvento(atual.conversa, { estado: "aplicando", etapa: metaAtual.etapa || "retomada", ultimo_erro: null });
    const { error } = await db.from("caixa_entrada").update({ status: "novo", processado: false, conversa }).eq("id", id);
    if (error) throw error;
  }

}

async function aplicarEntregaConcluidaOperacional(db, eventoId, dados) {

  // (caso do compromisso já ter sido concluído separado — antes o serviço ficava preso em produção).

  const servico = await lerRegistro(db, "servicos", servicoId);
  if (!servico) throw new Error("Serviço não encontrado.");
  if (!["agendado", "producao", "entregue"].includes(servico.status)) throw new Error("Serviço em " + servico.status + " não pode ser entregue.");
  const valor = validarValorPositivo(dados.valor || servico.valor_orcamento, "valor do serviço");
  const dataReal = dados.data || hojeISO();
  const { data: atualizado, error } = await db.from("servicos").update({
    status: "entregue", valor_orcamento: valor, proxima_acao: null, atualizado_em: new Date().toISOString(),

  });

  if (cxErr) throw cxErr;

    const recebimento = typeof dados.recebimento === "object" ? dados.recebimento : {};

    // o recebido abate o que já está lançado, na ordem de vencimento, e só o que sobrar vira linha nova.
    const { data: abertos, error: abertosErr } = await db.from("financeiro")
      .select("id,valor,data,descricao").eq("servico_id", servicoId).eq("tipo", "entrada")
      .eq("status", "a_receber").order("data", { ascending: true });
    if (abertosErr) throw abertosErr;
    let restante = valorRecebido;
    for (const linha of abertos || []) {
      if (restante <= 0) break;
      const valorLinha = parseMoedaBR(linha.valor) || 0;
      if (restante >= valorLinha) {
        await registrarFinanceiroDaOperacao(db, eventoId, { financeiroId: linha.id, status: "pago", data: dataRecebimento });
        quitados.push(linha.id);
        restante = Number((restante - valorLinha).toFixed(2));
      } else {
        // Recebeu menos que o saldo: a linha aberta fica só com o que ainda falta e o que entrou de verdade
        // vira uma linha paga própria — o caixa mostra o dinheiro real e o resto continua cobrável.
        const { error: parcialErr } = await db.from("financeiro")
          .update({ valor: Number((valorLinha - restante).toFixed(2)) }).eq("id", linha.id);

          tipo: "entrada", escopo: "empresa", categoria: recebimento.categoria || "Serviço", status: "pago",

          descricao: recebimento.descricao || "Recebimento parcial — " + (servico.titulo || "serviço"),
          servicoId, agendaId: agenda?.id || null,
        }, "financeiro:recebimento-parcial");
        financeiroId = parcial.registro.id;
        restante = 0;

async function aplicarServicoFechadoOperacional(db, eventoId, dados) {

  if (!prazo) throw new Error("Serviço ativo exige prazo.");
  if (dados.precisaMaterial !== false && !dados.fornecedorId) throw new Error("Trabalho fechado precisa do fornecedor para planejar o material. Se ainda não souber, pergunte na Caixa.");
  const valorServico = dados.valorServico ?? dados.valor;

  let material = null;
  if (dados.fornecedorId) material = await aplicarMaterialPlanejadoOperacional(db, eventoId, {
    servicoId: servico.id, fornecedorId: dados.fornecedorId, valor: dados.valorMaterial,
    descricao: dados.descricaoMaterial, dataNecessidade: dados.dataNecessidade, dataEntrega: dados.dataEntrega,
    por: dados.por || "claude",
  });
  await registrarHistoricoDaOperacao(db, eventoId, "servico-fechado", { o_que: "Serviço fechado", por: dados.por || "claude", detalhe: "Serviço #" + servico.id + (material?.agendaId ? " · compra agenda #" + material.agendaId : "") });
  return { servicoId: servico.id, statusServico: atualizado.status, material };
}
async function processarEventoOperacaoBahia(db, evento) {
  if (!db) throw new Error("Conexão do app indisponível.");
  const checkpoint = await iniciarEventoOperacao(db, evento);
  if (checkpoint.jaConcluido) return { ok: true, jaConcluido: true, eventoId: evento.eventoId, resultado: checkpoint.resultado };
  try {
    await marcarEtapaEvento(db, checkpoint.id, "aplicando", checkpoint.resultado);
    let resultado;
    const dados = evento.dados || {};
    switch (evento.tipo) {
      case "financeiro": resultado = await aplicarFinanceiroOperacional(db, evento.eventoId, dados); break;
      case "entrada_servico": resultado = await aplicarEntradaServicoOperacional(db, evento.eventoId, dados); break;
      case "pro_labore": resultado = await aplicarProLaboreOperacional(db, evento.eventoId, dados); break;
      case "vale_entregue": resultado = await aplicarValeEntregueOperacional(db, evento.eventoId, dados); break;
      case "vale_abatido": resultado = await aplicarValeAbatidoOperacional(db, evento.eventoId, dados); break;
      case "servico_fechado": resultado = await aplicarServicoFechadoOperacional(db, evento.eventoId, dados); break;
      case "material_planejado": resultado = await aplicarMaterialPlanejadoOperacional(db, evento.eventoId, dados); break;
      case "material_em_transito": resultado = await aplicarMaterialEmTransitoOperacional(db, evento.eventoId, dados); break;
      case "material_em_maos": resultado = await aplicarMaterialEmMaosOperacional(db, evento.eventoId, dados); break;
      case "compromisso_concluido": resultado = await aplicarCompromissoConcluidoOperacional(db, evento.eventoId, dados); break;
      case "entrega_concluida": resultado = await aplicarEntregaConcluidaOperacional(db, evento.eventoId, dados); break;
      case "remarcacao_com_data": resultado = await resolverPendenciaComSucessor(db, dados); break;
      case "remarcacao_terminal": resultado = await resolverPendenciaTerminal(db, dados); break;
      default: throw new Error("Tipo de operação não suportado: " + evento.tipo);
    }
    await marcarEtapaEvento(db, checkpoint.id, "verificando", resultado);
    await concluirEventoOperacao(db, checkpoint.id, resultado);
    return { ok: true, jaConcluido: false, eventoId: evento.eventoId, resultado };
  } catch (error) {
    await falharEventoOperacao(db, checkpoint.id, error);
    throw error;
  }
}

const DIAS_SEMANA_MAP = { domingo: 0, segunda: 1, terca: 2, quarta: 3, quinta: 4, sexta: 5, sabado: 6 };
function proximaEntregaFornecedor(diasEntrega) {
  if (!diasEntrega) return null;
  const permitidos = diasEntrega.split(",").map((d) => DIAS_SEMANA_MAP[d.trim()]).filter((n) => n !== undefined);
  if (!permitidos.length) return null;
  const hoje = new Date(); hoje.setHours(12, 0, 0, 0);
  for (let i = 1; i <= 14; i++) { const cand = new Date(hoje); cand.setDate(cand.getDate() + i); if (permitidos.includes(cand.getDay())) return `${cand.getFullYear()}-${String(cand.getMonth() + 1).padStart(2, "0")}-${String(cand.getDate()).padStart(2, "0")}`; }
  return null;
}
function gerarSlots(ini, fim) { const slots = []; let [h, m] = ini.split(":").map(Number); const [hf, mf] = fim.split(":").map(Number); while (h < hf || (h === hf && m < mf)) { slots.push(String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0")); m += 60; if (m >= 60) { m -= 60; h += 1; } } return slots; }
function horariosParaTipo(dataISO, tipo, ocupados) { if (tipo === "remoto") return gerarSlots(JANELA_REMOTO[0], JANELA_REMOTO[1]); const dia = new Date(dataISO + "T00:00:00").getDay(); const occ = new Set((ocupados || []).filter(Boolean).map((h) => h.slice(0, 5))); const livres = []; for (const [ini, fim] of (JANELAS_SEMANA[dia] || [])) gerarSlots(ini, fim).forEach((h) => { if (!occ.has(h)) livres.push(h); }); return livres; }
function minutosDoHorario(h) { const [hh, mm] = String(h || "").split(":").map(Number); return (hh || 0) * 60 + (mm || 0); }
// O MESMO LUGAR ESCRITO DE DUAS FORMAS VIRAVA DUAS CIDADES. O fornecedor Seu Andrade está cadastrado como
// "Jardim do Ingá" (é o nome certo do lugar) e a tabela de estrada usa "jardim inga" — sem casar, o par não
// era encontrado e o app assumia o default cego de 60 min onde são 15. Erro silencioso: a trava de rota
// simplesmente calculava errado, sem avisar ninguém. Em vez de forçar o cadastro a escrever torto, o app
// aceita as duas formas. Diego, 30/07: "andrade jardim do inga".
const CIDADE_SINONIMOS = { "jardim do inga": "jardim inga", "inga": "jardim inga", "aguas lindas": "aguas lindas de goias", "valparaiso de goias": "valparaiso", "sao sebastiao": "sao sebastiao" };
function cidadeChave(c) {
  const base = String(c || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").split("(")[0].split("-")[0].trim();
  return CIDADE_SINONIMOS[base] || base;
}
function tempoEstradaMin(c1, c2) { const a = cidadeChave(c1), b = cidadeChave(c2); if (!a || !b || a === b) return 0; return TEMPO_ESTRADA_MIN[[a, b].sort().join("|")] ?? 60; }
function horarioApertado(h, outros, cidadeNova) { return (outros || []).some((a) => Math.abs(minutosDoHorario(h) - minutosDoHorario(a.hora)) < tempoEstradaMin(cidadeNova, a.cidade) + DURACAO_SERVICO_MIN); }
// TRAVA DE ROTA. As praças do Diego ficam num corredor saindo de Luziânia (Valparaíso > Riacho Fundo > Águas
// Claras > Brasília), então a distância até a base serve de posição na estrada. Se a ordem do dia não for
// crescente ou decrescente nessa posição, ele está indo e voltando - foi o erro de 24/07 (Riacho Fundo antes
// de Valparaíso, tendo que terminar em Águas Claras). Aqui a gente compara a estrada da ordem marcada com a
// da melhor ordem e avisa a diferença. É aviso, não bloqueio: a decisão continua sendo do Diego.
function distanciaDaBase(cidade) { return tempoEstradaMin(CIDADE_BASE, cidade); }
function estradaTotalMin(paradas) {
  let total = 0, atual = CIDADE_BASE;
  paradas.forEach((p) => { total += tempoEstradaMin(atual, p.cidade); atual = p.cidade; });
  return total + tempoEstradaMin(atual, CIDADE_BASE);
}
function analisarRotaDoDia(compromissos) {
  const paradas = (compromissos || [])
    .filter((a) => a.tipo === "presencial" && a.cidade && a.hora)
    .sort((a, b) => minutosDoHorario(a.hora) - minutosDoHorario(b.hora));
  if (paradas.length < 2) return null;
  const melhor = paradas.slice().sort((a, b) => distanciaDaBase(a.cidade) - distanciaDaBase(b.cidade));
  const atualMin = estradaTotalMin(paradas), melhorMin = estradaTotalMin(melhor);
  const economia = atualMin - melhorMin;

  return { economia, atualMin, melhorMin, ordemAtual: paradas.map((p) => p.cidade), ordemSugerida: melhor.map((p) => p.cidade) };

  const r = analisarRotaDoDia(compromissos);

  return <div className="danger-box"><b>⚠ Essa rota volta pra trás — cerca de {r.economia} min a mais de estrada.</b>
    <span>Marcado: {r.ordemAtual.join(" → ")}</span>
    <span>Melhor ordem: {r.ordemSugerida.join(" → ")}</span>
  </div>;
}

      notify(`Erro ao carregar: ${firstError.message}`, "error"); setLoading(false); return;
    }
    setOfflineDesde(null);
    const pacote = { inbox: cx.data || [], customers: cl.data || [], services: sv.data || [], appointments: ag.data || [], finances: fn.data || [], rotinas: rt.data || [], fornecedores: fo.data || [] };
    aplicarPacote(pacote);
    // LEITURA OFFLINE: guarda a última carga boa no aparelho com a hora em que veio. Sem sinal, o app abre
    // com isso em vez de tela vazia — o Diego trabalha em Valparaíso, Novo Gama e Riacho Fundo, onde cair
    // sinal é rotina. Só leitura: gravação offline ficaria numa fila que duplicaria compromisso e bateria
    // nas travas do banco depois, sem ele ver o erro.
    if (!firstError) { try { window.localStorage.setItem(CACHE_OFFLINE, JSON.stringify({ em: Date.now(), pacote })); } catch (e) { /* aparelho sem espaço: segue sem cache */ } }
    setLoading(false);
  }, [db, demo, notify, session, aplicarPacote]);

  useEffect(() => { if (demo || session) loadAll(); }, [demo, session, loadAll]);

  useEffect(() => {
    if (demo) { setPinState("ok"); return; }
    if (!db || !session) { setPinState("checking"); return; }
    let cancelled = false;
    (async () => {
      const { data, error } = await db.from("config").select("pin_hash").eq("id", 1).single();
      if (cancelled) return;
      // FALHA FECHADA. Antes, qualquer erro ao ler a config LIBERAVA a tela (setPinState("ok")) — bastava a
      // consulta falhar pra o bloqueio sumir. Agora o hash conhecido fica guardado no aparelho, então sem
      // sinal o PIN continua sendo pedido e continua funcionando; e se nunca vimos o hash e a leitura falha,
      // a tela fica travada pedindo pra tentar de novo, em vez de abrir. Auditoria de 25/07/2026.
      if (error) {
        const conhecido = window.localStorage.getItem(PIN_HASH_LOCAL);
        if (!conhecido) { setPinState("bloqueado"); return; }
        setPinState(window.sessionStorage.getItem("tb_pin_ok") === "1" ? "ok" : "enter");
        return;
      }
      if (data?.pin_hash) window.localStorage.setItem(PIN_HASH_LOCAL, data.pin_hash);
      if (!data?.pin_hash) setPinState("define");
      else if (window.sessionStorage.getItem("tb_pin_ok") === "1") setPinState("ok");
      else setPinState("enter");
    })();
    return () => { cancelled = true; };
  }, [db, session, demo]);

    // Sem sinal a consulta não responde: cai no hash guardado, senão o PIN nunca abriria offline.

  const backupAll = useCallback(async () => {

      }

      a.href = URL.createObjectURL(blob);
      a.download = "backup-tapecaria-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(a.href);

  const agendaVisivel = useMemo(() => compromissosOperacionais(appointments, inbox), [appointments, inbox]);
  const claudeQueue = useMemo(() => inbox.filter((item) => ["respondido", "novo"].includes(item.status || "novo")).sort((a, b) => {

  async function sendMagicLink() {
    if (!db || !email.trim()) return;
    setBusy(true);

  async function claim(item) {
    if (demo) { setInbox((items) => items.map((entry) => entry.id === item.id ? { ...entry, status: "em_processamento", conversa: eventMessage(entry.conversa, "Triagem iniciada", mode) } : entry)); setSelectedId(item.id); return; }
    if (!db || busy) return;
    const other = inbox.find((entry) => entry.id !== item.id && entry.status === "em_processamento");
    if (other) { notify("Já existe uma entrada em triagem. Termine ou devolva antes.", "error"); return; }
    setBusy(true);
    const origin = item.status || "novo";
    let query = db.from("caixa_entrada").update({ status: "em_processamento", conversa: eventMessage(item.conversa, `Triagem iniciada · origem ${origin}`, mode) }).eq("id", item.id).eq("processado", false);
    query = item.status ? query.eq("status", item.status) : query.is("status", null);
    const { data, error } = await query.select("id").maybeSingle();
    setBusy(false);
    if (error) notify(error.message, "error"); else if (!data) notify("Outra sessão já assumiu esta entrada.", "error"); else { await loadAll(); setSelectedId(item.id); notify("Entrada assumida. Trabalhe somente nela.", "ok"); }
  }

  function updateForm(key, value) { setForm((current) => ({ ...current, [key]: value })); }

  async function finishCustomer(item) {
    if (!form.name.trim() || !form.service.trim() || !form.nextAction.trim() || !form.due) { notify("Nome, serviço, próxima ação e data são obrigatórios.", "error"); return; }
    if (form.addAgenda && form.agendaType === "presencial" && !form.city.trim()) { notify("Compromisso presencial precisa de cidade.", "error"); return; }
    if (form.serviceStatus === "agendado" && form.precisaMaterial && !form.fornecedorId) { notify("Trabalho fechado precisa do fornecedor para o app planejar a compra. Se ainda não sabe, mande a pergunta ao Diego.", "error"); return; }
    const telefone = corrigirTelefone(form.phone);
    if (telefone === null) { notify("Telefone incompleto — celular precisa de DDD + 8 ou 9 dígitos.", "error"); return; }
    if (demo) { await resolveInbox(item, "Ficha e lead criados na demonstração"); notify("Triagem concluída na demonstração.", "ok"); return; }
    setBusy(true);
    try {
      let customer = customers.find((entry) => entry.id === form.customerId) || duplicateCustomers[0] || null;
      if (!customer) {
        const { data, error } = await db.from("clientes").insert({ nome: form.name.trim(), telefone: telefone || null, cidade: form.city.trim() || null, endereco: form.address.trim() || null, obs: parsedSelected.text || null }).select("*").single();
        if (error) throw error; customer = data;
      }
      const { data: sameServices, error: serviceSearchError } = await db.from("servicos").select("*").eq("cliente_id", customer.id).ilike("titulo", form.service.trim()).limit(1);
      if (serviceSearchError) throw serviceSearchError;
      let service = sameServices?.[0] || null;
      if (!service) {
        const { data, error } = await db.from("servicos").insert({ cliente_id: customer.id, titulo: form.service.trim(), status: form.serviceStatus, prioridade: form.priority, proxima_acao: form.nextAction.trim(), prazo: form.due, valor_orcamento: parseMoedaBR(form.value) || null, responsavel: form.responsavel.trim() || null }).select("*").single();
        if (error) throw error; service = data;
      }
      // "Agendado" é trabalho fechado. O fechamento chama a mesma operação usada pelo documento do Drive:
      // ela calcula a compra pelo fornecedor e não deixa Serviço e Agenda divergirem.
      if (form.serviceStatus === "agendado") {
        const fechado = await processarEventoOperacaoBahia(db, {
          tipo: "servico_fechado", eventoId: "caixa-" + item.id + "-servico-fechado",
          textoOriginal: parsedSelected.text,
          dados: {
            servicoId: service.id, prazo: form.due, valorServico: parseMoedaBR(form.value) || null,
            proximaAcao: form.nextAction.trim(), precisaMaterial: form.precisaMaterial,
            fornecedorId: form.precisaMaterial ? form.fornecedorId : null, por: mode,
          },
        });
        service = { ...service, status: fechado.resultado.statusServico };
      }
      if (form.addAgenda) {
        const occupied = agendaVisivel.filter((entry) => entry.data === form.due && entry.tipo === "presencial").map((entry) => entry.hora?.slice(0, 5));
        const fallback = horariosParaTipo(form.due, form.agendaType, occupied)[0] || "18:00";
        const appointment = { titulo: `${customer.nome} — ${form.service.trim()}`, data: form.due, hora: form.time || fallback, cidade: form.agendaType === "presencial" ? form.city.trim() : null, tipo: form.agendaType, status: "planejado", servico_id: service.id };
        const { data: linked } = await db.from("agenda").select("id").eq("servico_id", service.id).eq("status", "planejado").limit(1);
        if (linked?.length) { const { error } = await db.from("agenda").update(appointment).eq("id", linked[0].id); if (error) throw error; }
        else { const { error } = await db.from("agenda").insert(appointment); if (error) throw error; }
      }
      if (parsedSelected.imageUrl) {
        const { data: photo } = await db.from("fotos").select("id").eq("cliente_id", customer.id).eq("url", parsedSelected.imageUrl).limit(1);
        if (!photo?.length) await db.from("fotos").insert({ cliente_id: customer.id, url: parsedSelected.imageUrl, tipo: "outro" });
      }
      const { error: hErr } = await db.from("historico").insert({ o_que: `Triagem concluída: ${form.service.trim()}`, por: mode, detalhe: `Fonte caixa_entrada#${item.id} · cliente#${customer.id} · serviço#${service.id}` });
      if (hErr) throw hErr;
      await resolveInbox(item, `cliente #${customer.id} · serviço #${service.id}`);
      await loadAll(); notify("Ficha e serviço conferidos e salvos.", "ok");
    } catch (error) { notify(`Nada foi encerrado: ${error.message}`, "error"); }
    finally { setBusy(false); }
  }

  async function finishAgenda(item) {
    if (!form.service.trim() || !form.due || (form.agendaType === "presencial" && !form.city.trim())) { notify("Título, data e cidade presencial são obrigatórios.", "error"); return; }
    if (demo) { await resolveInbox(item, "Compromisso criado na demonstração"); notify("Compromisso registrado.", "ok"); return; }
    setBusy(true);
    try {
      const occupied = agendaVisivel.filter((entry) => entry.data === form.due && entry.tipo === "presencial").map((entry) => entry.hora?.slice(0, 5));
      const fallback = horariosParaTipo(form.due, form.agendaType, occupied)[0] || "18:00";
      const payload = { titulo: form.service.trim(), data: form.due, hora: form.time || fallback, cidade: form.agendaType === "presencial" ? form.city.trim() : null, tipo: form.agendaType, status: "planejado" };

      let id = same?.[0]?.id;

  async function addInbox() {
    if (!composer.trim() && !files.length) return;
    if (demo) { setInbox((items) => [...items, { id: `demo-${Date.now()}`, texto: composer.trim(), status: "novo", conversa: [], criado_em: new Date().toISOString(), processado: false }]); setComposer(""); setFiles([]); notify("Entrada adicionada na demonstração.", "ok"); return; }
    setBusy(true);
    try {
      const texto = composer.trim();
      const uploaded = [];
      for (const f of files) {
        const path = `caixa-entrada/${Date.now()}_${f.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
        const { error: uploadError } = await db.storage.from("fotos-servicos").upload(path, f); if (uploadError) throw uploadError;
        const { data, error } = await db.storage.from("fotos-servicos").createSignedUrl(path, 60 * 60 * 24 * 365); if (error) throw error;
        uploaded.push({ url: data.signedUrl, fileName: f.name });
      }
      const payload = buildInboxPayload(uploaded, texto);
      const { error } = await db.from("caixa_entrada").insert({ texto: payload, status: "novo", conversa: [], processado: false }); if (error) throw error;
      setComposer(""); setFiles([]); await loadAll(); notify("Entrada salva na fila.", "ok");
    } catch (error) { notify(error.message, "error"); }
    finally { setBusy(false); }
  }

  async function copyContext() {
    const items = [...(working ? [working] : []), ...claudeQueue].slice(0, 8);
    const lines = [
      "TAPEÇARIA BAHIA — CONTEXTO ENXUTO",
      "Regra: uma entrada por vez; pesquisar antes de criar; nunca excluir.",
      "Financeiro, material, entrega e remarcação: usar somente window.TB_OPERACOES.processar. Nunca criar outro cliente Supabase nem repetir a cadeia em tabelas separadas.",
      "",
    ];
    items.forEach((item, index) => { const parsed = parseInbox(item.texto); const last = [...(item.conversa || [])].reverse().find((message) => message.tipo !== "sistema"); lines.push(`${index + 1}. [${item.status || "novo"}] #${item.id}: ${parsed.text.slice(0, 360) || "[print]"}`); if (last) lines.push(`Última mensagem (${last.de}): ${last.texto.slice(0, 180)}`); });
    await navigator.clipboard.writeText(lines.join("\n")); notify("Contexto enxuto copiado.", "ok");
  }

  // `data` vai junto porque o reagendamento fecha o compromisso antigo: se ele estava marcado pra
  // frente e o Diego resolveu antes, a data tem que virar hoje (mesmo motivo do Concluir).
  const abrirReagendar = (a) => setExplicar({ item: { tipoItem: "agenda", id: a.id, titulo: a.titulo, cidade: a.cidade, tipo: a.tipo, servico_id: a.servico_id, data: a.data, hora: a.hora }, kind: "reagendar" });

  const aplicarResolucao = useCallback((patch) => {
    if (!patch) return;
    if (patch.servicoId) setServices((prev) => prev.map((s) => s.id === patch.servicoId ? {
      ...s,
      proxima_acao: patch.proximaAcao !== undefined ? patch.proximaAcao : s.proxima_acao,
      status: patch.statusServico || s.status,
      valor_orcamento: patch.valorServico || s.valor_orcamento,

  if (booting) return <div className="loading-screen"><div className="brand-seal">TB</div><p>Preparando a central…</p></div>;
  if (!session && !demo) return <div className="login-screen"><div className="login-card"><div className="brand-seal">TB</div><p className="kicker">NOVA CENTRAL OPERACIONAL</p><h1>Tapeçaria Bahia</h1><p>Um ambiente separado para Diego e Claude trabalharem na mesma fila, sem apagar, duplicar ou perder o próximo passo.</p>{loginSent ? <div className="success-box">Link enviado. Abra seu e-mail neste aparelho.</div> : <><label>E-mail de acesso<input type="email" value={email} onChange={(event) => setEmail(event.target.value)} placeholder="seu@email.com" onKeyDown={(event) => event.key === "Enter" && sendMagicLink()} /></label><button className="primary" onClick={sendMagicLink} disabled={busy || !email.trim()}>Enviar link de acesso</button></>}<button className="ghost demo-button" onClick={() => setDemo(true)}>Ver demonstração do novo site</button></div></div>;
  if (!demo && pinState === "checking") return <div className="loading-screen"><div className="brand-seal">TB</div><p>Verificando o bloqueio…</p></div>;
  // Falha fechada: não deu pra verificar o bloqueio e não existe hash guardado neste aparelho — não abre.
  if (!demo && pinState === "bloqueado") return <div className="login-screen"><div className="login-card"><div className="brand-seal">TB</div><p className="kicker">BLOQUEADO</p><h1>Não deu pra verificar o PIN</h1><p>A central não conseguiu ler a configuração de bloqueio e este aparelho ainda não tem o PIN guardado. Conecte à internet uma vez e abra de novo — depois disso ele passa a funcionar offline.</p><button className="primary" onClick={() => window.location.reload()}>Tentar de novo</button></div></div>;
  if (!demo && (pinState === "define" || pinState === "enter")) return <PinScreen mode={pinState} onDefine={definePin} onEnter={tryPin} />;

  // Vale pendente = ainda não foi descontado do profissional. O dinheiro já saiu (status pago), então o
  // que marca a pendência é a ausência do [ABATIDO], não o status. Ver Regra Nº 9.
  const valesPendentes = finances.filter((f) => f.categoria === "Vale" && !(f.descricao || "").startsWith(VALE_ABATIDO_TAG)).length;
  const contasFuturas = finances.filter(ehSaidaFutura).length;
  const nav = [
    { id: "painel", label: "Painel", icon: "⌂" }, { id: "caixa", label: "Caixa", icon: "◎", count: inbox.length }, { id: "leads", label: "Leads", icon: "◇", count: activeServices.length },
    { id: "agenda", label: "Agenda", icon: "□" }, { id: "financeiro", label: "Financeiro", icon: "$" }, { id: "compras", label: "Compras", icon: "▣" }, { id: "futuro", label: "A pagar", icon: "◷", count: contasFuturas }, { id: "vales", label: "Vales", icon: "✎", count: valesPendentes },
    { id: "clientes", label: "Clientes", icon: "○" }, { id: "fornecedores", label: "Fornecedores", icon: "▤" },
  ];

  return <div className={`product-shell mode-${mode}`}>
    {notice && <div className={`notice ${notice.kind}`}>{notice.text}</div>}
    {/* SEM SINAL: a tela precisa dizer que está velha, senão ele decide em cima de dado defasado sem saber.
        Fica fixo no topo, acima de tudo, porque nesse estado nada mais na tela pode ser confiado às cegas. */}
    {offlineDesde && <div className="notice error">Sem conexão — mostrando os dados baixados {idadeDoDado(offlineDesde)}. Dá pra consultar agenda, telefone e endereço, mas nada que você mudar agora será salvo.</div>}
    <aside className="side-nav">
      <div className="side-brand"><div className="brand-seal small">TB</div><div><strong>Tapeçaria Bahia</strong><span>Central operacional</span></div></div>
      <nav>{nav.map((item) => <button key={item.id} className={tab === item.id ? "active" : ""} onClick={() => { setTab(item.id); setSelectedId(null); }}><i>{item.icon}</i><span>{item.label}</span>{item.count !== undefined && <b>{item.count}</b>}</button>)}</nav>
      <div className="operator-card"><span>Operador atual</span><strong>{mode === "claude" ? "Claude" : "Diego"}</strong><small>{mode === "claude" ? "Operações tipadas liberadas · exclusões bloqueadas" : "Controle e aprovações"}</small><button onClick={() => setMode(mode === "claude" ? "diego" : "claude")}>Trocar para {mode === "claude" ? "Diego" : "Claude"}</button></div>
    </aside>
    <main className="workspace">
      <header className="workspace-header"><div><p className="kicker">{mode === "claude" ? "MODO CLAUDE · OPERAÇÃO SEGURA" : "MODO DIEGO · CONTROLE TOTAL"}</p><h1>{tab === "caixa" ? "Caixa de entrada" : nav.find((item) => item.id === tab)?.label}</h1></div><div className="header-actions"><button className="ghost" onClick={() => setShowGuia(true)}>📖 Guia da IA</button><button className="ghost" onClick={copyContext}>Copiar contexto</button>{!demo && <button className="ghost" onClick={backupAll}>⬇ Backup</button>}<button className="ghost" onClick={loadAll}>{loading ? "Atualizando…" : "Atualizar"}</button>{demo ? <button className="ghost" onClick={() => setDemo(false)}>Sair da demo</button> : <button className="ghost" onClick={() => { window.sessionStorage.removeItem("tb_pin_ok"); db.auth.signOut(); }}>Sair</button>}</div></header>

      {tab === "caixa" && <div className="inbox-layout">
        <section className="queue-column">
          <div className="composer"><textarea value={composer} onChange={(event) => setComposer(event.target.value)} placeholder="Cole uma mensagem, descreva o atendimento ou acrescente uma orientação…" />{files.length > 0 && <div className="composer-files">{files.map((f, i) => <span key={i} className="composer-file-chip">{f.name}<button type="button" onClick={() => setFiles((fs) => fs.filter((_, idx) => idx !== i))}>✕</button></span>)}</div>}<div className="composer-actions"><label className="file-button">{files.length ? `${files.length} print(s)` : "Adicionar print(s)"}<input type="file" accept="image/*" multiple onChange={(event) => setFiles((fs) => [...fs, ...Array.from(event.target.files || [])])} /></label><button className="primary" onClick={addInbox} disabled={busy || (!composer.trim() && !files.length)}>Salvar na fila</button></div></div>
          <div className="queue-summary"><div><span>Para Claude</span><b>{claudeQueue.length}</b></div><div><span>Em triagem</span><b>{working ? 1 : 0}</b></div><div><span>Aguardando você</span><b>{waiting.length}</b></div></div>
          {working && <QueueItem item={working} selected={selectedId === working.id} onOpen={() => setSelectedId(working.id)} />}
          {claudeQueue.map((item) => <QueueItem key={item.id} item={item} selected={selectedId === item.id} onOpen={() => setSelectedId(item.id)} />)}
          {waiting.map((item) => <QueueItem key={item.id} item={item} selected={selectedId === item.id} onOpen={() => setSelectedId(item.id)} />)}
          {!inbox.length && <div className="empty-state"><b>Fila limpa.</b><span>Cole uma mensagem acima para iniciar.</span></div>}
        </section>
        <section className="triage-column">
          {!selected && <div className="triage-welcome"><div className="big-orb">◎</div><p className="kicker">UMA TAREFA POR VEZ</p><h2>{working ? "Retome a triagem em andamento" : claudeQueue.length ? "Abra o próximo item da fila" : "Nada pede ação agora"}</h2><p>O conteúdo original, as buscas e o formulário ficam juntos para evitar releitura e cliques errados.</p>{working ? <button className="primary" onClick={() => setSelectedId(working.id)}>Retomar</button> : claudeQueue[0] && <button className="primary" onClick={() => claim(claudeQueue[0])}>Pegar próximo item</button>}</div>}
          {selected && <TriagePanel item={selected} parsed={parsedSelected} mode={mode} form={form} updateForm={updateForm} customers={customers} duplicateCustomers={duplicateCustomers} services={services} appointments={agendaVisivel} finances={finances} fornecedores={fornecedores} busy={busy} reply={reply} setReply={setReply} onClaim={() => claim(selected)} onRelease={() => release(selected)} onAnswer={() => answer(selected)} onCustomer={() => finishCustomer(selected)} onAgenda={() => finishAgenda(selected)} onFinance={() => finishFinance(selected)} onAsk={() => askDiego(selected)} onEdit={(texto) => editInboxNote(selected, texto)} onDelete={() => deleteInboxItem(selected)} />}
        </section>
      </div>}

      {tab === "painel" && <Dashboard inbox={inbox} services={activeServices} appointments={agendaVisivel} finances={finances} rotinas={rotinas} customers={customers} fornecedores={fornecedores} db={db} demo={demo} notify={notify} onRotinaChanged={loadAll} onServicoChanged={loadAll} onOpenFicha={setFichaId} onOpenQueue={() => setTab("caixa")} onConcluir={setConcluirAppt} onReschedule={abrirReagendar} onSemProximaAcao={() => { setLeadsFiltroInicial("sem_acao"); setTab("leads"); }} />}
      {tab === "leads" && <LeadsView services={activeServices} search={search} setSearch={setSearch} onOpenFicha={setFichaId} initialFiltro={leadsFiltroInicial} onConsumedInitialFiltro={() => setLeadsFiltroInicial("todos")} />}
      {tab === "agenda" && <AgendaView appointments={agendaVisivel} services={services} finances={finances} onReschedule={abrirReagendar} onConcluir={setConcluirAppt} onAdd={() => setAddAgendaOpen(true)} />}
      {tab === "financeiro" && <FinanceView finances={finances} services={services} db={db} demo={demo} mode={mode} notify={notify} onChanged={loadAll} onVerAPagar={() => setTab("futuro")} />}
      {tab === "compras" && <ComprasView finances={finances} fornecedores={fornecedores} services={services} appointments={agendaVisivel} db={db} demo={demo} mode={mode} notify={notify} onChanged={loadAll} />}
      {tab === "futuro" && <FuturoView finances={finances} db={db} demo={demo} mode={mode} notify={notify} onChanged={loadAll} />}
      {tab === "vales" && <ValesView finances={finances} db={db} demo={demo} mode={mode} notify={notify} onChanged={loadAll} />}
      {tab === "clientes" && <CustomersView customers={customers} services={services} search={search} setSearch={setSearch} onOpenFicha={setFichaId} />}

    {showGuia && <GuiaModal db={db} demo={demo} notify={notify} onClose={() => setShowGuia(false)} />}
    {fichaId && <FichaModal db={db} demo={demo} notify={notify} clienteId={fichaId} fornecedores={fornecedores} onClose={() => setFichaId(null)} onChanged={loadAll} />}
    {explicar && <ExplicarModal db={db} demo={demo} notify={notify} item={explicar.item} kind={explicar.kind} onClose={() => setExplicar(null)} onDone={(patch) => { setExplicar(null); aplicarResolucao(patch); if (!demo) loadAll(); }} />}
    {concluirAppt && <ConcluirModal db={db} demo={demo} notify={notify} appt={concluirAppt} materiais={materiaisDoCompromisso(finances, concluirAppt.id)} fornecedores={fornecedores} services={services} svc={services.find((s) => s.id === concluirAppt.servico_id)} onClose={() => setConcluirAppt(null)} onDone={(patch) => { setConcluirAppt(null); aplicarResolucao(patch); if (!demo) loadAll(); }} />}
    {addAgendaOpen && <AddAgendaModal appointments={agendaVisivel} db={db} demo={demo} notify={notify} onClose={() => setAddAgendaOpen(false)} onDone={() => { setAddAgendaOpen(false); loadAll(); }} />}
  </div>;
}

function PinScreen({ mode, onDefine, onEnter }) {
  const [digits, setDigits] = useState("");
  const [first, setFirst] = useState(null);
  const [error, setError] = useState("");
  const [confirming, setConfirming] = useState(false);
  const press = async (key) => {
    setError("");
    if (key === "⌫") { setDigits((d) => d.slice(0, -1)); return; }
    if (digits.length >= 4) return;
    const next = digits + key;
    setDigits(next);
    if (next.length < 4) return;
    if (mode === "define") {
      if (!confirming) { setFirst(next); setConfirming(true); setDigits(""); return; }
      if (next !== first) { setError("Os PINs não batem. Comece de novo."); setFirst(null); setConfirming(false); setDigits(""); return; }
      const ok = await onDefine(next);
      if (!ok) { setDigits(""); }
    } else {
      const ok = await onEnter(next);
      if (!ok) { setError("PIN incorreto."); setDigits(""); }
    }
  };
  const title = mode === "define" ? (confirming ? "Confirme o PIN" : "Crie um PIN") : "Digite seu PIN";
  const sub = mode === "define" ? (confirming ? "Digite os 4 dígitos de novo." : "Escolha 4 dígitos para travar o app no dia a dia.") : "4 dígitos para desbloquear a central.";
  return <div className="login-screen"><div className="login-card pin-card"><div className="brand-seal">TB</div><p className="kicker">{title}</p><p className="pin-sub">{sub}</p><div className="pin-dots">{[0, 1, 2, 3].map((i) => <span key={i} className={i < digits.length ? "filled" : ""} />)}</div>{error && <div className="pin-error">{error}</div>}<div className="pin-pad">{["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].map((key, i) => key === "" ? <span key={i} /> : <button key={i} className="pin-key" onClick={() => press(key)}>{key}</button>)}</div></div></div>;
}

function GuiaModal({ db, demo, notify, onClose }) {
  const [rows, setRows] = useState(null);
  const [drafts, setDrafts] = useState({ empresa: "", como_agir: "", regras: "" });
  const [savingSec, setSavingSec] = useState("");
  useEffect(() => {
    if (demo) { setRows([]); setDrafts({ empresa: "(demonstração) Reforma de estofados em Luziânia-GO e região.", como_agir: "(demonstração) Ler a caixa, pesquisar antes de criar, uma entrada por vez.", regras: REGRAS_SISTEMA_ATUAIS }); return; }
    (async () => {
      const { data, error } = await db.from("guia_ia").select("*").order("secao");
      if (error) { notify("Erro ao ler o guia: " + error.message, "error"); setRows([]); return; }
      setRows(data || []);
      const next = { empresa: "", como_agir: "", regras: "" };
      (data || []).forEach((r) => { if (r.secao in next) next[r.secao] = r.conteudo || ""; });
      setDrafts(next);
    })();
  }, [db, demo, notify]);
  const save = async (sec) => {
    if (demo) { notify("Na demonstração o guia não é salvo.", "info"); return; }
    setSavingSec(sec);
    const { error } = await db.from("guia_ia").upsert({ secao: sec, titulo: SECAO_LABEL[sec], conteudo: drafts[sec], atualizado_em: new Date().toISOString() }, { onConflict: "secao" });
    setSavingSec("");
    if (error) notify("Erro: " + error.message, "error"); else notify("Guia atualizado.", "ok");
  };
  const copiarProtocolos = async () => {
    await navigator.clipboard.writeText(PROTOCOLO_CHAT_OPERACAO + "\n\n---\n\n" + PROTOCOLO_CLAUDE_OPERACAO);
    notify("Instruções do chat e do Claude copiadas.", "ok");
  };
  return <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
    <div className="modal-card">
      <div className="modal-head"><div><p className="kicker">CARTILHA DA IA</p><h2>Guia da IA</h2></div><div className="ficha-actions"><button className="ghost" onClick={copiarProtocolos}>Copiar instruções pro chat</button><button className="ghost" onClick={onClose}>Fechar</button></div></div>
      <p className="modal-intro">As regras críticas são travas do app. Este guia explica ao chat como estruturar os fatos e ao Claude como chamar a porta única sem duplicar.</p>
      {rows === null ? <div className="empty-state"><b>Carregando…</b></div> : <>
        <div className="guia-block readonly"><h3>Regras automáticas vigentes</h3><pre>{REGRAS_SISTEMA_ATUAIS}</pre></div>
        <div className="guia-block readonly"><h3>Protocolo do chat e do Claude</h3><pre>{PROTOCOLO_CHAT_OPERACAO + "\n\n" + PROTOCOLO_CLAUDE_OPERACAO}</pre></div>
        {["empresa", "como_agir", "regras"].map((sec) => <div className="guia-block" key={sec}><h3>{SECAO_LABEL[sec]}</h3><textarea value={drafts[sec]} onChange={(e) => setDrafts((d) => ({ ...d, [sec]: e.target.value }))} /><button className="primary" onClick={() => save(sec)} disabled={savingSec === sec}>{savingSec === sec ? "Salvando…" : "Salvar"}</button></div>)}
      </>}
    </div>
  </div>;
}

function QueueItem({ item, selected, onOpen }) {

}

function TriagePanel(props) {
  const { item, parsed, mode, form, updateForm, customers, duplicateCustomers, services, appointments, fornecedores, busy, reply, setReply } = props;
  const status = item.status || "novo";

  const relatedServices = form.customerId ? services.filter((entry) => entry.cliente_id === form.customerId && STATUS_VIVOS.includes(entry.status)) : [];
  const cityConflicts = form.due && form.agendaType === "presencial" ? appointments.filter((entry) => entry.data === form.due && entry.tipo === "presencial" && entry.cidade && form.city && entry.cidade.toLowerCase() !== form.city.toLowerCase()) : [];
  const porProfissional = useMemo(() => {
    const map = {};

    {editing ? <article className="source-card"><p className="kicker">EDITAR ANOTAÇÃO</p><textarea className="edit-note" value={editText} onChange={(e) => setEditText(e.target.value)} />{!!parsed.images.length && <div className="source-gallery">{parsed.images.map((img, i) => <a key={i} href={img.url} target="_blank" rel="noreferrer"><img src={img.url} alt={img.fileName} /></a>)}</div>}<div className="ficha-actions"><button className="primary" onClick={() => { props.onEdit(editText); setEditing(false); }}>Salvar</button><button className="ghost" onClick={() => { setEditText(parsed.text); setEditing(false); }}>Cancelar</button></div></article>

    {status === "aguardando_voce" && <div className="answer-box"><label>Sua resposta para o Claude<textarea value={reply} onChange={(event) => setReply(event.target.value)} placeholder="Responda aqui; a entrada voltará automaticamente para a fila do Claude." /></label><button className="primary" onClick={props.onAnswer} disabled={!reply.trim()}>Enviar resposta</button></div>}
    {["novo", "respondido"].includes(status) && <div className="claim-box"><h3>Esta entrada ainda não está travada.</h3><p>Assuma antes de alterar dados. Se outra sessão já pegou, esta operação será recusada.</p><button className="primary" onClick={props.onClaim} disabled={busy}>Iniciar triagem segura</button></div>}

function ReviewBox({ lines }) { return <div className="review-box"><p className="kicker">SERÁ GRAVADO</p>{lines.map((line) => <span key={line}>✓ {line}</span>)}</div>; }

// ROTINAS RECORRENTES: "a cada X dias". Sem ultima_execucao => vence hoje (nunca foi feita).
function somarDias(dataISO, dias) { const d = new Date(dataISO + "T12:00:00"); d.setDate(d.getDate() + dias); return d.toISOString().slice(0, 10); }
function proximaRotina(rotina) { return rotina.ultima_execucao ? somarDias(rotina.ultima_execucao, rotina.intervalo_dias) : null; }
function statusRotina(rotina, hoje) {
  const prox = proximaRotina(rotina);
  if (!prox) return { estado: "vencida", dias: 0, prox: hoje };
  const diff = Math.round((new Date(prox + "T12:00:00") - new Date(hoje + "T12:00:00")) / 86400000);
  return { estado: diff < 0 ? "vencida" : diff === 0 ? "hoje" : "futura", dias: diff, prox };
}
function textoRotina(st) {
  if (st.estado === "vencida") return st.dias === 0 ? "Nunca feita" : `Atrasada ${Math.abs(st.dias)} dia(s)`;
  if (st.estado === "hoje") return "Fazer hoje";
  return st.dias === 1 ? "Amanhã" : `Em ${st.dias} dias`;
}
function corCompromisso(data, hoje) { const amanha = new Date(hoje + "T12:00:00"); amanha.setDate(amanha.getDate() + 1); const amanhaISO = amanha.toISOString().slice(0, 10); return data <= hoje ? "alta" : data === amanhaISO ? "media" : "baixa"; }

// Presencial antes de remoto no mesmo dia, depois por hora.
function ordenarCompromisso(a, b) { return (a.data + (a.tipo === "remoto" ? "1" : "0") + (a.hora || "99")).localeCompare(b.data + (b.tipo === "remoto" ? "1" : "0") + (b.hora || "99")); }

function horaFalada(hora) {
  if (!hora) return "";
  const [h, m] = hora.slice(0, 5).split(":");
  return m === "00" ? `${parseInt(h, 10)} horas` : `${parseInt(h, 10)}h${m}`;
}
// "hoje"/"amanhã" soa mais natural numa mensagem pro cliente do que a data cheia.
function quandoFalado(data, hora, hoje) {
  const amanha = new Date(hoje + "T12:00:00"); amanha.setDate(amanha.getDate() + 1);
  const dia = data === hoje ? "hoje" : data === amanha.toISOString().slice(0, 10) ? "amanhã" : `no dia ${compactDate(data)}`;
  const horaTxt = horaFalada(hora);
  return ` ${dia}${horaTxt ? " às " + horaTxt : ""}`;
}
// Sempre gera uma mensagem pronta (mesmo sem sugestao_resposta salva) pra o botão do WhatsApp nunca abrir vazio.
// NUNCA colar a anotação interna dentro da mensagem do cliente. A versão antiga fazia
// `Passando pra confirmar: ${proxima_acao}` e saiu no WhatsApp de uma cliente como "Passando pra
// confirmar: Cobrar retorno — ia decidir com o marido" — recado do Diego pra ele mesmo, mandado
// pra cliente. Diego apontou em 24/07: "tem que ser algo mais natural como eu fiz".
// O título/próxima ação agora só ESCOLHE o texto; o que vai pro cliente é frase de gente.
function mensagemPadraoCompromisso(a, svc, hoje) {
  const nome = svc?.clientes?.nome ? svc.clientes.nome.split(" ")[0] : "";
  const oi = `Oi${nome ? " " + nome : ""}, tudo bem?`;
  const alvo = `${svc?.proxima_acao || ""} ${a.titulo || ""}`.toLowerCase();
  if (a.tipo !== "remoto") {
    const quando = quandoFalado(a.data, a.hora, hoje || hojeISO());
    if (/entreg/.test(alvo)) return `${oi} Sua peça está pronta! Posso levar${quando}?`;
    if (/buscar|retirad|retirar|pegar/.test(alvo)) return `${oi} Consigo passar${quando} pra buscar a peça. Fica bom pra você?`;
    return `${oi} Consigo passar aí${quando}. Fica bom pra você?`;
  }
  if (/or[çc]amento pendente|mandar or[çc]amento|enviar or[çc]amento|passar or[çc]amento/.test(alvo)) return `${oi} Terminei de fazer seu orçamento aqui. Posso te mandar?`;
  if (/confirmar hor[áa]rio|encaixar na rota|confirmar data/.test(alvo)) return `${oi} Consegue me confirmar um horário bom pra você? É pra eu encaixar direito na rota.`;
  if (/medida/.test(alvo)) return `${oi} Preciso passar aí pra tirar as medidas. Que dia fica melhor pra você?`;
  if (/decidir|marido|esposa|pensar|ver com/.test(alvo)) return `${oi} Passando pra saber se vocês já conseguiram decidir. Qualquer dúvida do orçamento eu explico.`;
  if (/cobrar|retorno|resposta|aguardar|retomar|tentar contato|contato/.test(alvo)) return `${oi} Passando pra saber se você ainda tem interesse. Se tiver qualquer dúvida do orçamento, é só falar.`;
  return `${oi} Passando pra falar do seu estofado. Consegue me dar um retorno?`;
}

// COBRANÇA: linha enxuta, sem hora e sem rota. Vive num bloco próprio do Painel — é o "dia do telefone",

function CobrancaCard({ a, svc, today, tentativas, noTeto, onCobrou, onEncerrar, busy }) {

    <div className="cobranca-esq">
      <strong>{svc?.clientes?.nome || "Cliente"}</strong>
      <span>{svc?.proxima_acao || a.titulo}</span>
      {/* O contador é o coração disto: sem ele o Diego não sabia que já tinha tentado 4 vezes (caso Francisco). */}
      <em>{tentativas + 1}ª tentativa de {COBRANCA_TETO_TENTATIVAS}{atrasada ? ` · desde ${compactDate(a.data)}` : ""}</em>
      {noTeto && <em className="cobranca-teto">Já foram {COBRANCA_TETO_TENTATIVAS} tentativas sem resposta — o app não insiste mais. Encerrar?</em>}
      {!tel && <em className="cobranca-teto">Sem telefone na ficha — não dá pra cobrar. Pegue o número antes.</em>}
    </div>
    <div className="cobranca-dir">
      {tel && <a className="btn-wpp" href={`https://wa.me/55${tel}${sugestao ? "?text=" + encodeURIComponent(sugestao) : ""}`} target="_blank" rel="noreferrer" onClick={() => onCobrou(a, svc)}>Cobrar no WhatsApp</a>}

      <button className={noTeto ? "primary" : "ghost"} disabled={busy} onClick={() => onEncerrar(a, svc)}>Chega</button>
