<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Operação Bahia V4 — Protótipo</title>
<style>
:root{--bg:#0b1020;--p:#111827;--p2:#172033;--line:#29364e;--text:#f8fafc;--muted:#94a3b8;--gold:#d9a441;--gold2:#f0c76e;--green:#46b981;--red:#ef6a62;--orange:#e49a46;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}body{background:radial-gradient(circle at 75% -15%,#d9a44124,transparent 32rem),linear-gradient(#090e1a,#0b1020 55%)}button,textarea{font:inherit}.side{position:fixed;inset:0 auto 0 0;width:240px;padding:20px 13px;display:flex;flex-direction:column;background:#090f1dea;border-right:1px solid var(--line);backdrop-filter:blur(20px)}.brand{display:flex;gap:11px;align-items:center;padding:4px 7px 20px}.mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#111827;font:bold 20px Georgia}.brand strong,.brand span{display:block}.brand strong{font-size:13px}.brand span{font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.8px}.nav{display:flex;flex-direction:column;gap:4px}.nav button,.bottom button,.sheet button{border:0;color:var(--muted);background:transparent;border-radius:11px;min-height:42px;padding:8px 10px;text-align:left;display:grid;grid-template-columns:32px 1fr;align-items:center;cursor:pointer}.nav button i,.bottom button i,.sheet button i{font-style:normal;text-align:center;color:#7789a5}.nav button.on,.sheet button.on{background:linear-gradient(90deg,#d9a44122,#d9a44108);color:#ffe1a3;box-shadow:inset 3px 0 var(--gold)}.safe{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--p);display:flex;gap:10px;align-items:center}.dot{width:9px;height:9px;background:var(--green);border-radius:50%;box-shadow:0 0 0 5px #46b9811c}.safe strong,.safe small{display:block}.safe strong{font-size:10px}.safe small{color:var(--muted);font-size:8px;margin-top:3px}.work{margin-left:240px;padding:25px 28px 100px;max-width:1450px}.top{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:22px}.ey{margin:0 0 5px;color:var(--gold2);font-size:8px;font-weight:850;letter-spacing:1.3px}.top h1{margin:0;font:500 34px Georgia}.badges{display:flex;gap:6px}.badge{display:inline-flex;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:7px;font-weight:850;letter-spacing:.5px;text-transform:uppercase}.badge.ok{color:#a7e4c8;border-color:#46b98166;background:#46b98112}.badge.warn{color:#ffd99e;border-color:#e49a4666;background:#e49a4614}.badge.danger{color:#ffc1bc;border-color:#ef6a6266;background:#ef6a6214}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#172033ef,#101827ef)}.hero{padding:22px;display:flex;align-items:end;justify-content:space-between;gap:22px;box-shadow:0 24px 70px #0004}.hero h2,.section h3,.capture h3{margin:0;font:500 23px Georgia}.hero p,.capture p,.placeholder p{color:var(--muted);font-size:11px;line-height:1.6;max-width:760px}.primary,.secondary,.ghost{min-height:41px;padding:9px 14px;border-radius:10px;font-size:10px;font-weight:800;cursor:pointer}.primary{border:1px solid #edc972;background:linear-gradient(145deg,#e4b759,#b77c26);color:#111827}.secondary{border:1px solid #52617a;background:#1c2940;color:#f3f6fa}.ghost{border:1px solid var(--line);background:transparent;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{padding:15px;min-height:112px}.metric strong,.metric span,.metric small{display:block}.metric strong{font:500 31px Georgia}.metric span{font-size:10px;font-weight:800;margin-top:6px}.metric small{font-size:8px;color:var(--muted);margin-top:4px;line-height:1.4}.section{margin-top:18px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.head h3{font-size:20px}.decision{padding:14px 15px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:8px}.decision h4{margin:7px 0 4px;font-size:12px}.decision p{margin:0;color:var(--muted);font-size:9px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:13px;margin-top:15px}.block{padding:17px}.row{display:grid;grid-template-columns:52px 1fr auto;gap:9px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}.row time{color:var(--gold2);font-size:10px;font-weight:800}.row strong,.row span{display:block}.row strong{font-size:10px}.row span{font-size:8px;color:var(--muted);margin-top:3px}.auto{padding:10px 0;border-top:1px solid var(--line)}.auto:first-of-type{border-top:0}.auto strong,.auto span{display:block}.auto strong{font-size:10px}.auto span{font-size:8px;color:var(--muted);margin-top:3px}.capture{margin-top:15px;padding:18px}.capture textarea{width:100%;min-height:88px;margin-top:8px;background:#0b1323;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;outline:0}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.placeholder{min-height:480px;display:grid;place-content:center;text-align:center;justify-items:center;padding:30px}.placeholder .icon{width:64px;height:64px;border-radius:19px;display:grid;place-items:center;border:1px solid #d9a44144;background:#d9a44113;color:var(--gold2);font-size:21px;font-weight:800;margin-bottom:15px}.placeholder h2{margin:0;font:500 30px Georgia}.rule{border:1px dashed #40516d;border-radius:12px;padding:12px 14px;margin-top:13px;font-size:9px;color:var(--muted)}.bottom,.sheetWrap{display:none}.toast{position:fixed;right:16px;top:16px;z-index:90;max-width:360px;padding:11px 13px;background:#26334a;border:1px solid #465572;border-radius:11px;font-size:10px;box-shadow:0 18px 50px #0007}.toast[hidden]{display:none}@media(max-width:820px){.side{display:none}.work{margin:0;padding:17px 13px 92px}.top{align-items:start}.badges .badge:first-child{display:none}.hero{display:block;padding:18px}.hero .primary{width:100%;margin-top:7px}.metrics{grid-template-columns:repeat(2,1fr)}.metric{min-height:100px}.decision{align-items:stretch;flex-direction:column}.decision .secondary{width:100%}.two{grid-template-columns:1fr}.row{grid-template-columns:46px 1fr}.row .badge{grid-column:2}.bottom{position:fixed;display:grid;grid-template-columns:repeat(6,1fr);inset:auto 0 0;padding:5px 5px calc(5px + env(safe-area-inset-bottom));background:#090f1df5;border-top:1px solid var(--line);z-index:40}.bottom button{min-width:0;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;justify-content:center;gap:3px;text-align:center}.bottom button span{font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.bottom button.on{box-shadow:inset 0 2px var(--gold);color:#ffe1a3}.sheetWrap.show{display:block;position:fixed;inset:0;z-index:60}.back{position:absolute;inset:0;border:0;background:#0009}.sheet{position:absolute;inset:auto 0 0;background:#111827;border:1px solid var(--line);border-radius:21px 21px 0 0;padding:10px 13px calc(16px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 10px;font:500 19px Georgia}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.sheet button{min-height:70px;border:1px solid var(--line);background:var(--p2);display:flex;flex-direction:column;text-align:center;justify-content:center;gap:5px}.sheet button span{font-size:8px}.actions .primary{flex:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const main=[['hoje','⌂','Hoje'],['clientes','◎','Clientes'],['servicos','◇','Serviços'],['agenda','□','Agenda'],['compras','▣','Compras'],['financeiro','$','Financeiro']];
const more=[['profissionais','P','Profissionais'],['fornecedores','F','Fornecedores'],['crescimento','↗','Crescimento'],['automacao','⚙','Automação'],['sites','</>','Sites & Tecnologia'],['config','⋯','Configurações']];
const desc={clientes:'Pessoa e relacionamento. Leads serão uma visão, não um silo separado.',servicos:'Orçamento → fechado → material → produção → entrega → encerramento.',agenda:'Compromissos, bloqueios, rota e estado confirmado/provisório/sugestão.',compras:'Materiais, pedidos, trânsito, material em mãos e fornecedores.',financeiro:'Entradas, saídas, a receber, a pagar, contas e vínculo com serviços.',profissionais:'Capacidade, serviços atribuídos, trabalhos, vales e acertos.',fornecedores:'Cadastro, cidade, entrega, produtos e relação com compras.',crescimento:'Atribuição, campanhas, Windsor, funil e resultado real de marketing.',automacao:'Eventos, comandos, aprovações, execuções, checkpoints e falhas.',sites:'Registro de sites, GitHub, tracking, ambientes e saúde de deploy.',config:'Preferências e integrações. Regras permanentes continuam no Mapa + Skills.'};
let active='hoje',sheet=false;const app=document.querySelector('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const badge=(t,c='')=>`<span class="badge ${c}">${esc(t)}</span>`;
const btn=(x,cl='')=>`<button class="${cl} ${active===x[0]?'on':''}" data-nav="${x[0]}"><i>${esc(x[1])}</i><span>${esc(x[2])}</span></button>`;
function hoje(){return `<section class="hero card"><div><p class="ey">AGORA</p><h2>Avaliar próximo deslocamento</h2><p>Exemplo visual: a V4 combina agenda, cidade, material e prioridade antes de recomendar a próxima ação.</p></div><button class="primary" data-toast="Protótipo: nenhuma ação foi executada.">Ver contexto completo</button></section><section class="metrics"><article class="metric card"><strong>2</strong><span>decisões</span><small>realmente dependem de você</small></article><article class="metric card"><strong>1</strong><span>material</span><small>bloqueando produção</small></article><article class="metric card"><strong>3</strong><span>retornos</span><small>com ação comercial</small></article><article class="metric card"><strong>0</strong><span>falhas</span><small>de integração</small></article></section><section class="section"><div class="head"><div><p class="ey">EXCEÇÕES</p><h3>Precisa de você</h3></div>${badge('2 decisões','warn')}</div><article class="decision card"><div>${badge('P1','danger')}<h4>Confirmar dado ambíguo de um orçamento</h4><p>O sistema encontrou duas associações plausíveis. Nenhuma escrita foi feita.</p></div><button class="secondary" data-toast="Aprovações entram depois do shadow mode.">Revisar</button></article><article class="decision card"><div>${badge('P2','warn')}<h4>Autorizar alteração externa</h4><p>Exemplo de ação em plataforma externa que exige aprovação antes de executar.</p></div><button class="secondary" data-toast="Protótipo sem Windsor ou escrita externa.">Abrir decisão</button></article></section><section class="two"><article class="block card"><div class="head"><div><p class="ey">AGENDA & ROTA</p><h3>Próximos</h3></div></div><div class="row"><time>09:30</time><div><strong>Follow-up remoto</strong><span>sem deslocamento</span></div>${badge('provisório','warn')}</div><div class="row"><time>14:30</time><div><strong>Visita de avaliação</strong><span>Luziânia</span></div>${badge('confirmado','ok')}</div><div class="row"><time>17:10</time><div><strong>Retirada</strong><span>Jardim Ingá</span></div>${badge('sugestão')}</div></article><article class="block card"><div class="head"><div><p class="ey">AUTOMAÇÃO</p><h3>Sistema trabalhando</h3></div>${badge('sem escrita','ok')}</div><div class="auto"><strong>Operação contínua</strong><span>Eventos → comandos → readback</span></div><div class="auto"><strong>Checkpoint 06h</strong><span>Briefing e reconciliação</span></div><div class="auto"><strong>Checkpoint 23h55</strong><span>Auditoria independente</span></div></article></section><section class="capture card"><p class="ey">CAPTURA RÁPIDA</p><h3>O que aconteceu?</h3><p>Na V4 você informa o fato. O sistema identifica o domínio; não existe Caixa de Entrada para classificar manualmente.</p><textarea placeholder="Cliente, pagamento, material, compromisso, retirada, entrega..."></textarea><div class="actions"><button class="ghost" data-toast="Anexo desabilitado no protótipo.">＋ Foto/arquivo</button><button class="primary" data-toast="Protótipo: nada foi salvo.">Registrar fato</button></div></section>`}
function page(id){if(id==='hoje')return hoje();const x=[...main,...more].find(a=>a[0]===id)||['','•',id];return `<section class="placeholder card"><div class="icon">${esc(x[1])}</div><p class="ey">MÓDULO V4</p><h2>${esc(x[2])}</h2><p>${esc(desc[id]||'Estrutura reservada para a próxima fase.')}</p><div class="rule"><strong>Nesta primeira entrega:</strong> somente arquitetura e navegação. Sem conexão com produção.</div></section>`}
function render(){const x=[...main,...more].find(a=>a[0]===active)||main[0];app.innerHTML=`<aside class="side"><div class="brand"><div class="mark">B</div><div><strong>Operação Bahia</strong><span>V4 · laboratório</span></div></div><nav class="nav">${main.map(x=>btn(x)).join('')}<div style="height:1px;background:var(--line);margin:7px 9px"></div>${more.map(x=>btn(x)).join('')}</nav><div class="safe card"><span class="dot"></span><div><strong>Produção protegida</strong><small>Mock data · zero escrita</small></div></div></aside><main class="work"><header class="top"><div><p class="ey">OPERAÇÃO BAHIA V4</p><h1>${esc(x[2])}</h1></div><div class="badges">${badge('PROTÓTIPO','warn')}${badge('SEM ESCRITA','ok')}</div></header>${page(active)}<p style="text-align:center;color:#64748b;font-size:8px;margin-top:25px">Protótipo isolado · nenhuma integração de produção carregada.</p></main><nav class="bottom">${main.slice(0,5).map(x=>btn(x)).join('')}<button data-more="1" class="${sheet?'on':''}"><i>⋯</i><span>Mais</span></button></nav><div class="sheetWrap ${sheet?'show':''}"><button class="back" data-more="0"></button><section class="sheet"><h3>Mais módulos</h3><div class="grid">${[main[5],...more].map(x=>btn(x)).join('')}</div></section></div><div id="toast" class="toast" hidden></div>`;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{active=b.dataset.nav;sheet=false;render()});document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{sheet=b.dataset.more==='1';render()});document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast))}
function toast(m){const t=document.querySelector('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2500)}render();
</script>
</body>
</html>
