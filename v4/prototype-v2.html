
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Operação Bahia V4 — Protótipo V2</title><style>
:root{--bg:#08111f;--p:#101b2d;--p2:#142238;--line:#293a55;--txt:#f7f9fc;--mut:#91a2ba;--gold:#d8a345;--gold2:#f0c978;--ok:#43bb82;--warn:#e4a04e;--bad:#ef6c63;--info:#66a4ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt)}body{background:radial-gradient(circle at 85% -10%,#d8a34520,transparent 28rem),linear-gradient(#07101d,#08111f 50%,#091425)}button,input,textarea{font:inherit}button{cursor:pointer}.side{position:fixed;inset:0 auto 0 0;width:238px;padding:18px 12px;display:flex;flex-direction:column;background:#07101dee;border-right:1px solid var(--line);z-index:20}.brand{display:flex;gap:10px;align-items:center;padding:4px 7px 18px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold2),#b77b27);color:#101827;font:800 20px Georgia}.brand strong,.brand small{display:block}.brand strong{font-size:13px}.brand small{font-size:8px;color:var(--mut);letter-spacing:.8px;text-transform:uppercase;margin-top:3px}.nav{display:flex;flex-direction:column;gap:4px}.nav button,.bottom button,.sheet button{border:0;background:transparent;color:var(--mut);border-radius:11px;min-height:42px;padding:8px 10px}.nav button{display:grid;grid-template-columns:31px 1fr;text-align:left;align-items:center}.nav button.on,.sheet button.on{color:#ffe4ac;background:linear-gradient(90deg,#d8a34522,#d8a34508);box-shadow:inset 3px 0 var(--gold)}.line{height:1px;background:var(--line);margin:7px 9px}.guard{margin-top:auto;border:1px solid var(--line);background:var(--p);border-radius:14px;padding:11px;display:flex;gap:9px;align-items:center}.dot{width:9px;height:9px;background:var(--ok);border-radius:50%;box-shadow:0 0 0 5px #43bb821c}.guard strong,.guard small{display:block}.guard strong{font-size:10px}.guard small{font-size:8px;color:var(--mut);margin-top:3px}.main{margin-left:238px;padding:23px 26px 95px;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.ey{margin:0 0 5px;font-size:8px;font-weight:900;letter-spacing:1.2px;color:var(--gold2)}h1,h2,h3{font-family:Georgia,serif;font-weight:500}.top h1{margin:0;font-size:33px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{display:inline-flex;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--mut);font-size:7px;font-weight:850;text-transform:uppercase}.ok{color:#a8e7ca;border-color:#43bb8266;background:#43bb8211}.warn{color:#ffdc9f;border-color:#e4a04e66;background:#e4a04e11}.bad{color:#ffc1bd;border-color:#ef6c6366;background:#ef6c6311}.info{color:#bdd8ff;border-color:#66a4ff66;background:#66a4ff11}.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#142238ee,#0e192aee)}.hero{padding:20px;display:flex;justify-content:space-between;align-items:end;gap:16px}.hero h2{margin:0 0 5px;font-size:24px}.hero p,.mut{margin:0;color:var(--mut);font-size:10px;line-height:1.55}.btn{min-height:39px;border-radius:10px;padding:8px 12px;font-size:9px;font-weight:850}.primary{border:1px solid #edcc7a;background:linear-gradient(145deg,#e4b759,#b87924);color:#111827}.secondary{border:1px solid #526783;background:#1b2b44;color:#f7f9fc}.ghost{border:1px solid var(--line);background:transparent;color:var(--mut)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px}.metric{padding:13px;min-height:99px}.metric b,.metric span,.metric small{display:block}.metric b{font:500 28px Georgia}.metric span{font-size:9px;font-weight:850;margin-top:5px}.metric small{font-size:8px;color:var(--mut);margin-top:4px}.section{margin-top:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.head h3{margin:0;font-size:19px}.decision,.row{padding:12px 13px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.decision{margin-top:7px}.decision h4{font-size:10px;margin:7px 0 3px}.decision p{font-size:8px;color:var(--mut);margin:0}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:11px}.block{padding:15px}.list{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center}.list:first-of-type{border-top:0}.list strong,.list small{display:block}.list strong{font-size:9px}.list small{font-size:7px;color:var(--mut);margin-top:3px}.time{min-width:44px;color:var(--gold2);font-size:10px;font-weight:850}.capture{padding:16px}.capture textarea,.search{width:100%;border:1px solid var(--line);border-radius:11px;background:#091426;color:var(--txt);padding:10px;outline:0}.capture textarea{min-height:78px;margin-top:8px}.toolbar{display:flex;justify-content:space-between;gap:8px;margin-top:8px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:9px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--p);color:var(--mut);border-radius:999px;padding:7px 10px;font-size:8px}.tabs button.on{background:var(--gold2);border-color:var(--gold2);color:#111827;font-weight:850}.search{margin-bottom:9px}.table{overflow:hidden}.thead,.trow{display:grid;gap:9px;align-items:center;padding:10px 12px}.thead{background:#0c1728;color:#7f91aa;font-size:7px;font-weight:850;text-transform:uppercase}.trow{border-top:1px solid var(--line);font-size:9px}.trow strong,.trow small{display:block}.trow small{font-size:7px;color:var(--mut);margin-top:2px}.c4{grid-template-columns:1.25fr .85fr .85fr auto}.c5{grid-template-columns:1.25fr .9fr .75fr .75fr auto}.kanban{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:8px;overflow:auto}.lane{min-width:190px;padding:10px}.lane h4{margin:0 0 8px;font-size:9px;text-transform:uppercase}.ticket{border:1px solid var(--line);border-radius:11px;padding:9px;background:#0d192a;margin-top:7px}.ticket strong,.ticket small{display:block}.ticket strong{font-size:9px}.ticket small{font-size:7px;color:var(--mut);margin-top:3px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini{padding:13px}.mini h4{margin:0 0 4px;font-size:10px}.mini p{font-size:8px;color:var(--mut);line-height:1.5;margin:0}.kpi{font:500 24px Georgia;margin:8px 0 2px}.funnel{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.step{padding:11px;text-align:center}.step b{font:500 24px Georgia;display:block}.step span{font-size:7px;color:var(--mut)}.bottom,.sheetWrap{display:none}.toast{position:fixed;right:15px;top:15px;z-index:80;padding:10px 12px;border:1px solid #4b607e;border-radius:11px;background:#263752;font-size:9px;max-width:330px}.toast[hidden]{display:none}.foot{text-align:center;color:#64748b;font-size:7px;margin-top:22px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.funnel{grid-template-columns:repeat(3,1fr)}}@media(max-width:820px){.side{display:none}.main{margin:0;padding:15px 12px 87px}.top{align-items:flex-start}.top h1{font-size:28px}.badges .badge:first-child{display:none}.hero{display:block;padding:16px}.hero .btn{width:100%;margin-top:11px}.metrics{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.decision{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.funnel{grid-template-columns:repeat(2,1fr)}.thead{display:none}.trow{display:grid!important;grid-template-columns:1fr auto!important}.trow>*:not(:first-child):not(:last-child){grid-column:1}.trow>*:last-child{grid-column:2;grid-row:1}.kanban{grid-template-columns:repeat(4,225px)}.bottom{position:fixed;display:grid;grid-template-columns:repeat(6,1fr);inset:auto 0 0;z-index:40;background:#07101df7;border-top:1px solid var(--line);padding:5px 5px calc(5px + env(safe-area-inset-bottom))}.bottom button{min-height:51px;min-width:0;padding:3px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.bottom button span:last-child{font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.bottom button.on{color:#ffe3aa;box-shadow:inset 0 2px var(--gold)}.sheetWrap.show{display:block;position:fixed;inset:0;z-index:60}.back{position:absolute;inset:0;border:0;background:#0009}.sheet{position:absolute;inset:auto 0 0;background:#101b2d;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:11px 12px calc(15px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 9px;font-size:18px}.sheetgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.sheet button{min-height:68px;border:1px solid var(--line);background:var(--p2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}.sheet button span:last-child{font-size:7px}}
</style></head><body><div id="app"></div><script>
const main=[['hoje','⌂','Hoje'],['clientes','◎','Clientes'],['servicos','◇','Serviços'],['agenda','□','Agenda'],['compras','▣','Compras'],['financeiro','$','Financeiro']],more=[['profissionais','P','Profissionais'],['fornecedores','F','Fornecedores'],['crescimento','↗','Crescimento'],['automacao','⚙','Automação'],['sites','</>','Sites & Tec.'],['config','⋯','Config']];let active='hoje',sheet=false,cf='todos';const A=document.querySelector('#app'),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),B=(t,c='')=>`<span class="badge ${c}">${E(t)}</span>`,N=x=>`<button class="${active===x[0]?'on':''}" data-nav="${x[0]}"><span>${E(x[1])}</span><span>${E(x[2])}</span></button>`,T=()=>[...main,...more].find(x=>x[0]===active)?.[2]||'Hoje',M=(v,n,s)=>`<article class="metric card"><b>${v}</b><span>${n}</span><small>${s}</small></article>`;
const data={clientes:[['Cliente exemplo · Luziânia','Luziânia','Orçamento','Follow-up','warn'],['Cliente exemplo · Park Way','Brasília','Fechado','Comprar tecido','ok'],['Cliente exemplo · Valparaíso','Valparaíso','Novo','Pedir fotos','info'],['Cliente exemplo · Jardim Ingá','Luziânia','Produção','Conferir entrega','ok']],servicos:[['Sofá retrátil 3L','Orçamento','R$ 3.200','Follow-up'],['6 cadeiras jantar','Fechado','R$ 2.450','Comprar tecido'],['Poltrona + puff','Material','R$ 1.800','Aguardar fornecedor'],['Sofá 2,40m','Produção','R$ 2.900','Conferir prazo']],agenda:[['09:30','Follow-up remoto','WhatsApp','provisório','warn'],['14:30','Visita de avaliação','Luziânia','confirmado','ok'],['16:10','Buscar material','Valparaíso','sugestão','info'],['17:10','Retirada','Jardim Ingá','sugestão','info']],compras:[['Tecido · serviço B','Fornecedor 1','Comprar hoje','bad'],['Espuma · serviço C','Fornecedor 2','Em trânsito','info'],['Percinta · mínimo','Fornecedor 3','Planejado','warn'],['Pistão cadeira','Fornecedor 4','Em mãos','ok']],fin:[['Entrada serviço','Entrada','Empresa','R$ 1.250','Recebido','ok'],['Material','Saída','Empresa','R$ 480','Pago','info'],['Saldo entrega','Entrada','Empresa','R$ 900','A receber','warn'],['Vale profissional','Saída','Empresa','R$ 150','A compensar','warn']]};
function hoje(){return `<section class="hero card"><div><p class="ey">AGORA · MOTOR DE DECISÃO</p><h2>Resolver material antes do próximo deslocamento</h2><p>A V4 cruza agenda, cidade, bloqueios, prioridade comercial e capacidade antes de recomendar uma ação. Aqui é só simulação.</p></div><button class="btn primary" data-toast="Explicação mock: nenhuma ação real foi executada.">Ver por quê</button></section><section class="metrics">${M('2','decisões','dependem de você')}${M('1','bloqueio','material impede produção')}${M('3','retornos','com ação hoje')}${M('0','falhas','no laboratório')}</section><section class="section"><div class="head"><div><p class="ey">EXCEÇÕES, NÃO CAIXA</p><h3>Precisa de você</h3></div>${B('2 decisões','warn')}</div><article class="decision card"><div>${B('P1','bad')}<h4>Pagamento com associação ambígua</h4><p>Duas possibilidades; escrita bloqueada até confirmação humana.</p></div><button class="btn secondary" data-toast="Na fase sombra isto só será simulado.">Revisar</button></article><article class="decision card"><div>${B('P2','warn')}<h4>Alteração externa de campanha</h4><p>Leitura automática; mudança no Windsor continua exigindo autorização.</p></div><button class="btn secondary" data-toast="Windsor está desligado neste protótipo.">Abrir</button></article></section><section class="section grid2"><article class="block card"><div class="head"><div><p class="ey">AGENDA & ROTA</p><h3>Próximos</h3></div></div>${data.agenda.slice(0,3).map(x=>`<div class="list"><span class="time">${x[0]}</span><div><strong>${x[1]}</strong><small>${x[2]}</small></div>${B(x[3],x[4])}</div>`).join('')}</article><article class="block card"><div class="head"><div><p class="ey">AUTOMAÇÃO</p><h3>Sistema trabalhando</h3></div>${B('shadow','info')}</div><div class="list"><span>↻</span><div><strong>Motor contínuo</strong><small>evento → decisão → comando → readback</small></div>${B('24h','ok')}</div><div class="list"><span>06</span><div><strong>Checkpoint 06h</strong><small>briefing + reconciliação</small></div>${B('supervisor')}</div><div class="list"><span>55</span><div><strong>Auditoria 23h55</strong><small>falhas, duplicidade, recibo</small></div>${B('supervisor')}</div></article></section><section class="section capture card"><p class="ey">CAPTURA RÁPIDA</p><h3 style="margin:0">O que aconteceu?</h3><p class="mut">Você informa o fato. A V4 propõe domínio e efeitos; não existe Caixa para organizar depois.</p><textarea placeholder="Ex.: cliente aprovou, pagou entrada e pediu retirada terça à tarde..."></textarea><div class="toolbar"><button class="btn ghost" data-toast="Anexos ainda desligados.">＋ Foto</button><button class="btn primary" data-toast="Simulação concluída; nada foi salvo.">Simular registro</button></div></section>`}
function clientes(){let rows=data.clientes.filter(x=>cf==='todos'||x[2].toLowerCase().includes(cf));return `<div class="tabs"><button class="${cf==='todos'?'on':''}" data-cf="todos">Todos</button><button class="${cf==='novo'?'on':''}" data-cf="novo">Novos</button><button class="${cf==='orçamento'?'on':''}" data-cf="orçamento">Orçamento</button><button class="${cf==='fechado'?'on':''}" data-cf="fechado">Fechados</button><button class="${cf==='produção'?'on':''}" data-cf="produção">Produção</button></div><input class="search" placeholder="Buscar cliente, cidade ou telefone (mock)"><section class="card table"><div class="thead c4"><span>Cliente</span><span>Cidade</span><span>Etapa</span><span>Próxima ação</span></div>${rows.map(x=>`<div class="trow c4"><div><strong>${x[0]}</strong><small>Lead é fase, não módulo separado.</small></div><div>${x[1]}</div><div>${B(x[2],x[4])}</div><button class="btn ghost" data-toast="Abriria timeline única do cliente.">${x[3]}</button></div>`).join('')}</section>`}
function servicos(){let gs=['Orçamento','Fechado','Material','Produção'];return `<section class="kanban">${gs.map(g=>`<article class="lane card"><h4>${g}</h4>${data.servicos.filter(s=>s[1]===g).map(s=>`<div class="ticket"><strong>${s[0]}</strong><small>${s[2]}</small><small>Próxima: ${s[3]}</small></div>`).join('')}</article>`).join('')}</section><section class="section block card"><p class="ey">CONTRATO DA V4</p><h3 style="margin-top:0">Serviço vira eixo da execução</h3><p class="mut">Orçamento → fechado → material → produção → entrega → encerramento, com fotos, profissional, custos, agenda e financeiro vinculados ao mesmo serviço.</p></section>`}
function agenda(){return `<section class="hero card"><div><p class="ey">AGENDA OPERACIONAL</p><h2>Confirmado ≠ provisório ≠ sugestão</h2><p>O sistema não transforma follow-up interno ou encaixe de rota em compromisso externo com cliente.</p></div>${B('Calendar = espelho','info')}</section><section class="section card">${data.agenda.map(x=>`<div class="row"><div><strong>${x[0]} · ${x[1]}</strong><small>${x[2]}</small></div>${B(x[3],x[4])}</div>`).join('')}</section>`}
function compras(){return `<section class="metrics">${M('1','comprar hoje','bloqueia serviço')}${M('1','em trânsito','aguardando fornecedor')}${M('1','em mãos','pode liberar produção')}${M('1','planejado','sem urgência')}</section><section class="section card table"><div class="thead c4"><span>Material</span><span>Fornecedor</span><span>Estado</span><span>Ação</span></div>${data.compras.map(x=>`<div class="trow c4"><div><strong>${x[0]}</strong><small>Vinculado ao serviço quando aplicável.</small></div><div>${x[1]}</div><div>${B(x[2],x[3])}</div><button class="btn ghost" data-toast="Abriria pedido + itens + readback.">Detalhes</button></div>`).join('')}</section>`}
function financeiro(){return `<section class="metrics">${M('R$ 2.150','entradas mock','recebido + a receber')}${M('R$ 630','saídas mock','empresa')}${M('R$ 900','a receber','saldo entrega')}${M('R$ 150','a compensar','vale')}</section><section class="section card table"><div class="thead c5"><span>Lançamento</span><span>Tipo</span><span>Escopo</span><span>Valor</span><span>Status</span></div>${data.fin.map(x=>`<div class="trow c5"><div><strong>${x[0]}</strong><small>Dados fictícios.</small></div><div>${x[1]}</div><div>${x[2]}</div><div>${x[3]}</div><div>${B(x[4],x[5])}</div></div>`).join('')}</section>`}
function profissionais(){return `<section class="cards">${[['Profissional A','Premium · rápido','2','72%'],['Profissional B','Premium · detalhista','1','48%'],['Profissional C','Custo-benefício · rápido','3','85%']].map(x=>`<article class="mini card"><p class="ey">CAPACIDADE</p><h4>${x[0]}</h4><p>${x[1]}</p><div class="kpi">${x[2]}</div><p>serviços ativos · carga ${x[3]}</p></article>`).join('')}</section>`}
function fornecedores(){return `<section class="cards">${['Tecidos','Espumas','Ferragens'].map((x,i)=>`<article class="mini card"><p class="ey">${x.toUpperCase()}</p><h4>Fornecedor exemplo ${i+1}</h4><p>Cidade, dias de entrega, produtos e histórico de compras numa entidade única.</p><div class="kpi">${i+2}</div><p>itens relacionados no mock</p></article>`).join('')}</section>`}
function crescimento(){return `<section class="hero card"><div><p class="ey">CRESCIMENTO</p><h2>Do investimento até margem</h2><p>Windsor lê mídia; Supabase guarda fatos. A V4 conecta atribuição real até orçamento, fechamento, receita recebida e margem.</p></div>${B('sem Windsor no mock','warn')}</section><section class="section funnel">${[['R$250','Invest.'],['38','Contatos'],['16','Orçam.'],['6','Fechados'],['R$11,4k','Receita'],['R$6,2k','Margem']].map(x=>`<article class="step card"><b>${x[0]}</b><span>${x[1]}</span></article>`).join('')}</section><section class="section grid2"><article class="block card"><p class="ey">ATRIBUIÇÃO</p><h3 style="margin-top:0">Só com evidência</h3><p class="mut">tracking_ref, gclid/gbraid/wbraid, UTMs ou confirmação explícita.</p></article><article class="block card"><p class="ey">MUDANÇA EXTERNA</p><h3 style="margin-top:0">Aprovação obrigatória</h3><p class="mut">Pausar anúncio, orçamento, CPC ou campanha continua atrás de autorização humana.</p></article></section>`}
function automacao(){return `<section class="cards">${[['CONTÍNUO','Motor por eventos','24h','Avança o seguro e cria exceção só quando necessário.','info'],['06:00','Abertura','✓','Briefing, divergências e prioridades.','ok'],['23:00','Planejamento','✓','Prepara o dia seguinte.','ok'],['23:30','Fechamento','✓','Reconcilia fatos e execução.','ok'],['23:55','Auditoria','✓','Procura falha, duplicidade e ausência de recibo.','ok'],['EXCEÇÕES','Precisa de você','2','Somente decisão não segura para automatizar.','warn']].map(x=>`<article class="mini card"><p class="ey">${x[0]}</p><h4>${x[1]}</h4><div class="kpi">${x[2]}</div><p>${x[3]}</p><div style="margin-top:8px">${B(x[0]==='CONTÍNUO'?'shadow':'supervisor',x[4])}</div></article>`).join('')}</section>`}
function sites(){return `<section class="cards">${[['Tapeçaria Bahia','site oficial','produção','ok'],['Painel Operacional','dieegguin-byte/painel','V3 produção','ok'],['Operação Bahia V4','branch isolada','laboratório','info']].map(x=>`<article class="mini card"><p class="ey">SITE / SISTEMA</p><h4>${x[0]}</h4><p>${x[1]}</p><div class="kpi">100%</div><p>saúde mock · ${x[2]}</p><div style="margin-top:8px">${B(x[2],x[3])}</div></article>`).join('')}</section><section class="section block card"><p class="ey">PUBLICAÇÃO</p><h3 style="margin-top:0">Allowlist + branch + PR</h3><p class="mut">Cada site será cadastrado explicitamente; nenhum agente recebe acesso genérico a qualquer repositório.</p></section>`}
function config(){return `<section class="grid2"><article class="block card"><p class="ey">FONTES OFICIAIS</p><h3 style="margin-top:0">Responsabilidades separadas</h3><div class="list"><span>DB</span><div><strong>Supabase</strong><small>fatos vivos</small></div>${B('oficial','ok')}</div><div class="list"><span>CAL</span><div><strong>Calendar</strong><small>espelho da agenda</small></div>${B('espelho','info')}</div><div class="list"><span>LIB</span><div><strong>Biblioteca + Skills</strong><small>regras</small></div>${B('oficial','ok')}</div></article><article class="block card"><p class="ey">TRAVAS</p><h3 style="margin-top:0">Laboratório seguro</h3><div class="list"><span>×</span><div><strong>Sem escrita real</strong><small>Supabase, Calendar, Windsor e sites desligados.</small></div>${B('travado','ok')}</div><div class="list"><span>×</span><div><strong>Sem segredos</strong><small>Nenhuma chave no frontend.</small></div>${B('travado','ok')}</div></article></section>`}
const pages={hoje,clientes,servicos,agenda,compras,financeiro,profissionais,fornecedores,crescimento,automacao,sites,config};function render(){A.innerHTML=`<aside class="side"><div class="brand"><div class="logo">B</div><div><strong>Operação Bahia</strong><small>V4 · laboratório</small></div></div><nav class="nav">${main.map(N).join('')}<div class="line"></div>${more.map(N).join('')}</nav><div class="guard"><span class="dot"></span><div><strong>Produção protegida</strong><small>mock · zero escrita</small></div></div></aside><main class="main"><header class="top"><div><p class="ey">OPERAÇÃO BAHIA V4</p><h1>${E(T())}</h1></div><div class="badges">${B('protótipo V2','warn')}${B('sem escrita','ok')}${B('dados fictícios','info')}</div></header>${(pages[active]||hoje)()}<p class="foot">Laboratório V4 · nenhuma integração de produção carregada.</p></main><nav class="bottom">${main.slice(0,5).map(N).join('')}<button data-more="1" class="${sheet?'on':''}"><span>⋯</span><span>Mais</span></button></nav><div class="sheetWrap ${sheet?'show':''}"><button class="back" data-more="0"></button><section class="sheet"><h3>Mais módulos</h3><div class="sheetgrid">${[main[5],...more].map(N).join('')}</div></section></div><div id="toast" class="toast" hidden></div>`;bind()}function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{active=b.dataset.nav;sheet=false;render()});document.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{sheet=b.dataset.more==='1';render()});document.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));document.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{cf=b.dataset.cf;render()})}function toast(m){let t=document.querySelector('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}render();
</script></body></html>
