<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f0d0c">
<title>Diagnóstico — Operação Bahia</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0f0d0c;--surface:#181412;--surface2:#211a16;--line:#3a2d26;--line2:#4b392f;--text:#fff4e9;--muted:#baa99b;--dim:#81736a;--orange:#d86d36;--orange2:#f19b65;--green:#75a987;--red:#df6a5d;--yellow:#d4a64e;--shadow:0 18px 55px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}.shell{min-height:100vh;background:radial-gradient(circle at 80% -5%,#3a1c0f 0,transparent 25%),var(--bg)}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:#14110fee;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:10px}.seal{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#ed9057,#9f4621);font:700 14px Georgia,serif}.brand strong,.brand span{display:block}.brand strong{font-size:14px}.brand span{font-size:10px;color:var(--dim)}.back,.btn{border:1px solid var(--line2);background:var(--surface2);color:#f1c09d;padding:10px 13px;border-radius:10px;font-size:11px;font-weight:750;text-decoration:none}.main{max-width:1180px;margin:auto;padding:24px 16px 90px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px}.kicker{margin:0 0 5px;color:var(--orange2);font-size:9px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase}.head h1{margin:0;font:500 30px Georgia,serif}.head p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.55;max-width:760px}.readonly{display:inline-flex;margin-top:10px;border:1px solid #75a98755;background:#75a98710;color:#9bc7a7;border-radius:999px;padding:5px 9px;font-size:9px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric,.card{background:linear-gradient(145deg,#1b1613,#15110f);border:1px solid var(--line);border-radius:15px;padding:14px}.metric span{display:block;font-size:8px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase}.metric b{display:block;font-size:25px;margin:9px 0 3px}.metric small{font-size:9px;color:var(--muted)}.metric.good b{color:#9bc7a7}.metric.warn b{color:#e4bd72}.metric.bad b{color:#e88477}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card h2{font:500 20px Georgia,serif;margin:0 0 6px}.card>p{font-size:10px;color:var(--muted);line-height:1.5;margin:0 0 12px}.issue{padding:10px 0;border-bottom:1px solid var(--line)}.issue:last-child{border-bottom:0}.issue strong,.issue span,.issue small{display:block}.issue strong{font-size:11px}.issue span{font-size:9px;color:var(--muted);margin-top:3px}.issue small{font-size:8px;color:var(--dim);margin-top:4px}.pill{display:inline-flex!important;width:max-content;border:1px solid var(--line2);border-radius:999px;padding:3px 7px;margin-top:5px!important;font-size:8px!important;font-weight:800}.pill.bad{border-color:#df6a5d55;color:#e88477}.pill.warn{border-color:#d4a64e55;color:#e4bd72}.empty{padding:24px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:12px;font-size:10px}.error{padding:13px;border:1px solid #df6a5d55;background:#df6a5d0d;border-radius:12px;color:#ffd8d2;font-size:11px}.loading{min-height:45vh;display:grid;place-items:center;color:var(--muted)}
@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.main{padding-left:12px;padding-right:12px}.brand span{display:none}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><div class="seal">TB</div><div><strong>Operação Bahia</strong><span>Saúde das inteligências</span></div></div><a class="back" href="./nova.html">← Central</a></header>
<main class="main">
  <div class="head"><div><p class="kicker">CONFIG / DIAGNÓSTICO</p><h1>Inteligências</h1><p>Mostra se os dados que alimentam orçamento, compras e profissionais estão realmente chegando ao estado oficial. Não calcula preço nem altera serviço.</p><span class="readonly">SOMENTE LEITURA</span></div><button class="btn" id="refresh">Atualizar</button></div>
  <div id="root"><div class="loading">Carregando diagnóstico…</div></div>
</main>
</div>
<script>
const SUPABASE_URL='https://iymlzdcloaeyybhefywp.supabase.co';
const SUPABASE_KEY='sb_publishable_kGmPlLLQdFSxdslH6Y9f2w_Cuox7hFm';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const root=document.getElementById('root');
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v)=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0);
function metric(label,value,note,kind=''){return `<div class="metric ${kind}"><span>${esc(label)}</span><b>${esc(value)}</b><small>${esc(note)}</small></div>`}
function serviceRow(s){const cls=s.estado_aprendizado==='SEM_AMOSTRA'?'bad':'warn';return `<div class="issue"><strong>${esc(s.cliente_nome||'Cliente')} — ${esc(s.titulo||'Serviço')}</strong><span>${esc(s.status)} · material pago ${money(s.material_pago)} · mão de obra paga ${money(s.mao_obra_paga)}</span><small>${esc(s.profissional_referencia||'profissional não identificado')} · ${s.fotos_total||0} foto(s)</small><span class="pill ${cls}">${esc(s.estado_aprendizado)}</span></div>`}
async function carregar(){
  root.innerHTML='<div class="loading">Carregando diagnóstico…</div>';
  try{
    const {data:sess}=await db.auth.getSession();
    if(!sess.session){root.innerHTML='<div class="error">Sessão não encontrada. Abra a Central, faça login e volte ao Diagnóstico.</div>';return}
    const [h,p,s]=await Promise.all([
      db.from('v_saude_inteligencias').select('*').single(),
      db.from('v_profissionais_pendentes_normalizacao').select('*').limit(20),
      db.from('v_servico_aprendizado').select('*').in('status',['agendado','producao','entregue']).order('amostras_total',{ascending:true}).limit(30)
    ]);
    if(h.error)throw h.error;if(p.error)throw p.error;if(s.error)throw s.error;
    const x=h.data||{};
    const incompletos=(s.data||[]).filter(v=>v.estado_aprendizado!=='COMPLETA');
    const pendProf=p.data||[];
    root.innerHTML=`
      <section class="metrics">
        ${metric('Amostras técnicas',x.amostras_total||0,'casos estruturados',x.amostras_total?'good':'warn')}
        ${metric('Materiais sem serviço',x.materiais_pagos_sem_servico||0,`de ${x.materiais_pagos_total||0} compras pagas`,x.materiais_pagos_sem_servico?'bad':'good')}
        ${metric('Profissionais normalizados',x.profissionais_normalizados||0,`${x.servicos_profissional_so_texto||0} serviços ainda só em texto`,x.profissionais_normalizados?'good':'warn')}
        ${metric('Fotos sem amostra',x.fotos_sem_amostra||0,`de ${x.fotos_total||0} fotos`,x.fotos_sem_amostra?'warn':'good')}
        ${metric('Ativos sem materiais',x.servicos_ativos_sem_materiais||0,`de ${x.servicos_ativos||0} serviços ativos`,x.servicos_ativos_sem_materiais?'bad':'good')}
        ${metric('Amostras completas',x.amostras_completas||0,'prontas para comparação futura',x.amostras_completas?'good':'warn')}
        ${metric('Calibração pendente',x.amostras_pendentes_calibracao||0,'foto/medida/quantidade faltando',x.amostras_pendentes_calibracao?'warn':'good')}
        ${metric('Cobertura viva','OK','Supabase + RLS + views','good')}
      </section>
      <section class="grid">
        <article class="card"><h2>Serviços que ainda não ensinam</h2><p>Prioridade para completar foto, medidas, consumo e custo real sem inventar dados.</p>${incompletos.length?incompletos.map(serviceRow).join(''):'<div class="empty">Nenhuma lacuna encontrada neste recorte.</div>'}</article>
        <article class="card"><h2>Identidades ainda em texto</h2><p>Nomes detectados em profissional/responsável que ainda não têm entidade normalizada. Esta lista é diagnóstico; não converte automaticamente responsável em profissional.</p>${pendProf.length?pendProf.map(v=>`<div class="issue"><strong>${esc(v.nome)}</strong><span>${esc(v.ocorrencias)} ocorrência(s)</span></div>`).join(''):'<div class="empty">Nenhum nome pendente.</div>'}</article>
      </section>`;
  }catch(e){root.innerHTML=`<div class="error">Falha ao ler o diagnóstico: ${esc(e.message||e)}</div>`}
}
document.getElementById('refresh').onclick=carregar;
window.addEventListener('load',carregar);
</script>
</body>
</html>
