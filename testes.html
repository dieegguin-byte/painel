<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script>
const saida = document.getElementById("saida");
const placar = document.getElementById("placar");
let passou = 0, falhou = 0;
function grupo(nome) { const d = document.createElement("div"); d.className = "grupo"; d.textContent = nome; saida.appendChild(d); }
function checar(nome, condicao, detalhe) {
  const d = document.createElement("div");
  d.className = "t " + (condicao ? "ok" : "falhou");
  d.textContent = nome;
  if (detalhe !== undefined && !condicao) { const s = document.createElement("span"); s.className = "detalhe"; s.textContent = "recebi: " + JSON.stringify(detalhe); d.appendChild(s); }
  saida.appendChild(d);
  condicao ? passou++ : falhou++;
}
const igual = (a, b) => JSON.stringify(a) === JSON.stringify(b);

// ---------------------------------------------------------------------------
// BANCO FALSO. Só o que as operações usam: from(tabela).select().eq().eq() /
// .update().eq().select().single() / .insert(). Guarda as linhas em memória e
// registra tudo que foi escrito, pra o teste conferir o efeito.
// ---------------------------------------------------------------------------
function bancoFalso(tabelas) {
  const dados = JSON.parse(JSON.stringify(tabelas || {}));
  const escritas = [];
  const falhas = {}; // { tabela: "update" } faz aquela escrita falhar, pra testar estado parcial
  const filtrar = (linhas, filtros) => linhas.filter((l) => filtros.every(([col, val]) => l[col] === val));
  function consulta(tabela, modo, payload) {
    const linhas = dados[tabela] || (dados[tabela] = []);
    const filtros = [];
    const api = {
      eq(col, val) { filtros.push([col, val]); return api; },
      select() { return api; },
      single() { return api.then((r) => ({ data: (r.data || [])[0] || null, error: r.error })); },
      maybeSingle() { return api.single(); },
      then(resolve) {
        if (falhas[tabela] === modo) return resolve({ data: null, error: { message: "falha simulada em " + tabela + "." + modo } });
        if (modo === "select") return resolve({ data: filtrar(linhas, filtros), error: null });
        if (modo === "update") {
          const alvos = filtrar(linhas, filtros);
          alvos.forEach((l) => Object.assign(l, payload));
          escritas.push({ tabela, modo, payload, ids: alvos.map((l) => l.id) });
          return resolve({ data: alvos, error: null });
        }
        if (modo === "insert") {
          const novos = (Array.isArray(payload) ? payload : [payload]).map((p, n) => ({ id: tabela[0] + "-novo-" + (linhas.length + n + 1), ...p }));
          linhas.push(...novos);
          escritas.push({ tabela, modo, payload });
          return resolve({ data: novos, error: null });
        }
        return resolve({ data: null, error: null });
      },
    };
    return api;
  }
  return {
    dados, escritas, falhas,
    from(tabela) {
      return {
        select: () => consulta(tabela, "select"),
        update: (payload) => consulta(tabela, "update", payload),
        insert: (payload) => consulta(tabela, "insert", payload),
        delete: () => consulta(tabela, "delete"),
      };
    },
  };
}

// Carrega o código do app do mesmo jeito que a página real: pega o <script type="text/plain" id="app-source">
// do nova.html, transpila com Babel (runtime clássico) e roda. Assim o teste sempre usa o código publicado,
// nunca uma cópia que envelhece.
async function carregarApp() {
  const html = await fetch("nova.html?t=" + Date.now()).then((r) => r.text());
  const doc = new DOMParser().parseFromString(html, "text/html");
  const fonte = doc.querySelector("#app-source")?.textContent;
  if (!fonte) throw new Error("não achei o #app-source dentro do nova.html");
  // React não existe aqui: as funções puras e as operações não precisam dele, mas o arquivo inteiro
  // referencia React no topo. Basta um objeto de mentira pra o script rodar até o fim.
  window.React = window.React || { createElement: () => null, useState: () => [null, () => {}], useEffect: () => {}, useMemo: (f) => f(), useCallback: (f) => f, useRef: () => ({ current: null }), Fragment: "fragment" };
  window.ReactDOM = window.ReactDOM || { createRoot: () => ({ render: () => {} }) };
  window.supabase = window.supabase || { createClient: () => ({ auth: { getSession: async () => ({ data: { session: null } }), onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } }) } }) };
  const saidaBabel = Babel.transform(fonte, { presets: [["react", { runtime: "classic" }], "typescript"], filename: "app.tsx" }).code;
  const script = document.createElement("script");
  script.textContent = saidaBabel;
  document.body.appendChild(script);
}

(async () => {
  try { await carregarApp(); } catch (e) { placar.textContent = "NÃO CONSEGUI CARREGAR O APP: " + e.message; placar.style.color = "#e8776a"; return; }

  est = await materialPendenteDoServico(semFinanceiro(), servicoCom([{ item: "Velho", comprado: false, arquivado: true }]));

  est = await materialPendenteDoServico(semFinanceiro(), servicoCom([]));

  const comCompraEmTransito = bancoFalso({ financeiro: [{ id: "f1", servico_id: "svc-1", tipo: "saida", categoria: "Material", descricao: "Tecido", status: "a_pagar" }] });
  est = await materialPendenteDoServico(comCompraEmTransito, servicoCom([{ item: "Espuma", comprado: true }]));
  checar("lista toda em mãos, mas compra do financeiro sem [EM MÃOS] = pendente", est.pendente && est.faltaChegar.length === 1, est);

  est = await materialPendenteDoServico(comCompraEmMaos, servicoCom([{ item: "Espuma", comprado: true }]));

  est = await materialPendenteDoServico(misturado, servicoCom([{ item: "Pés de canto", comprado: false }]));
  checar("faltando nas duas, a próxima ação é comprar (o que depende dele)", proximaAcaoPorMaterial(est) === "Comprar o material", proximaAcaoPorMaterial(est));

  // =========================================================================
  grupo("Confirmar a lista de compras (lista_compra_confirmada)");
  // =========================================================================
  const bancoConfirmar = (materiais, financeiro) => bancoFalso({
    servicos: [{ id: "svc-1", status: "agendado", titulo: "Reforma de sofá", materiais_necessarios: materiais }],
    financeiro: financeiro || [], historico: [], caixa_entrada: [],
  });

  let db1 = bancoConfirmar([{ item: "Espuma", comprado: true }]);
  let erro = null;
  try { await aplicarListaCompraConfirmadaOperacional(db1, "ev-1", { servicoId: "svc-1" }); } catch (e) { erro = e.message; }

  let db4 = bancoConfirmar([{ item: "Espuma", comprado: true }], [{ id: "f1", servico_id: "svc-1", tipo: "saida", categoria: "Material", descricao: "Tecido encomendado", status: "a_pagar" }]);

  checar("e a próxima ação vira aguardar a chegada", db4.dados.servicos[0].proxima_acao === "Aguardar chegada do material", db4.dados.servicos[0].proxima_acao);

  let db5 = bancoConfirmar([{ item: "Espuma", comprado: true }]);
  db5.falhas.historico = "insert";
  erro = null;
  try { await aplicarListaCompraConfirmadaOperacional(db5, "ev-5", { servicoId: "svc-1", confirmadoTudoEmMaos: true }); } catch (e) { erro = e.message; }
  checar("falha no meio (histórico) não passa em silêncio: estoura erro", !!erro, erro);
  checar("estado parcial fica visível — o serviço já mudou antes da falha (é o que a RPC do P0 nº 1 vai resolver)", db5.dados.servicos[0].status === "producao", db5.dados.servicos[0].status);

  // =========================================================================
  grupo("Idempotência por ciclo de confirmação");
  // =========================================================================
  const svcA = { id: "svc-1", materiais_necessarios: [{ item: "Espuma", comprado: true }] };
  const svcAdeNovo = { id: "svc-1", materiais_necessarios: [{ item: "espuma ", comprado: true }] };
  const svcB = { id: "svc-1", materiais_necessarios: [{ item: "Espuma", comprado: true }, { item: "Pés de canto", comprado: true }] };
  const svcArquivado = { id: "svc-1", materiais_necessarios: [{ item: "Espuma", comprado: true, arquivado: true }, { item: "Pés de canto", comprado: true }] };
  checar("mesmo clique, mesma assinatura (idempotente)", assinaturaDaLista(svcA) === assinaturaDaLista(svcAdeNovo), [assinaturaDaLista(svcA), assinaturaDaLista(svcAdeNovo)]);
  checar("item novo no mesmo dia muda a assinatura (não cai no checkpoint anterior)", assinaturaDaLista(svcA) !== assinaturaDaLista(svcB), [assinaturaDaLista(svcA), assinaturaDaLista(svcB)]);

    servicos: [{ id: "svc-1", status: "agendado", titulo: "Reforma", materiais_necessarios: materiais }],
    financeiro: financeiro || [], historico: [],
  });

  let db6 = bancoBusca([{ item: "Espuma", comprado: false }]);
  let r6 = await aplicarCompromissoConcluidoOperacional(db6, "ev-6", { agendaId: "ag-1", data: "2026-08-15" });
  checar("busca concluída com item faltando: serviço NÃO vai pra produção", r6.statusServico !== "producao", r6);
  checar("e a próxima ação manda comprar", db6.dados.servicos[0].proxima_acao === "Comprar o material", db6.dados.servicos[0].proxima_acao);

  let db7 = bancoBusca([{ item: "Espuma", comprado: true }]);

  let db8 = bancoBusca([]);
  let r8 = await aplicarCompromissoConcluidoOperacional(db8, "ev-8", { agendaId: "ag-1", data: "2026-08-15" });

  grupo("Entrega com material em aberto");

  const bancoEntrega = (materiais) => bancoFalso({

  let db10 = bancoEntrega([{ item: "Pés", comprado: false }]);

  checar("com override explícito, a entrega passa", db10.dados.servicos[0].status === "entregue", db10.dados.servicos[0].status);
  const hist = (db10.dados.historico || []).map((h) => h.detalhe || "").join(" ");
  checar("e o histórico registra a exceção com o motivo", /ENTREGUE COM MATERIAL PENDENTE/.test(hist) && /engano/.test(hist), hist);

  let db11 = bancoEntrega([{ item: "Pés", comprado: true }]);
  await aplicarEntregaConcluidaOperacional(db11, "ev-11", { servicoId: "svc-1", valor: 1000 });
  const hist11 = (db11.dados.historico || []).map((h) => h.detalhe || "").join(" ");
  checar("entrega normal não vira exceção no histórico", db11.dados.servicos[0].status === "entregue" && !/MATERIAL PENDENTE/.test(hist11), hist11);

  // =========================================================================

  checar("domingo também sugere (sem rotina)", horariosSugeridos("2026-08-23", "presencial", [], "Luziânia").length > 0, horariosSugeridos("2026-08-23", "presencial", [], "Luziânia"));
  checar("nada de madrugada: presencial vai de 08:00 a 20:00", igual([horariosParaTipo("2026-08-17", "presencial", [])[0], horariosParaTipo("2026-08-17", "presencial", []).slice(-1)[0]], ["08:00", "20:00"]), horariosParaTipo("2026-08-17", "presencial", []));
  const agoraMinTeste = new Date().getHours() * 60 + new Date().getMinutes();
  checar("hoje não sugere horário que já passou", horariosSugeridos(hojeISO(), "presencial", [], "Luziânia").every((h) => minutosDoHorario(h) > agoraMinTeste), horariosSugeridos(hojeISO(), "presencial", [], "Luziânia"));
  checar("horário ocupado sai da lista", !horariosSugeridos("2026-08-17", "presencial", ["14:00"], "Luziânia").includes("14:00"), horariosSugeridos("2026-08-17", "presencial", ["14:00"], "Luziânia"));
  // Igreja passou de 18h30 para 20h em 14/09/2026.
  checar("18h em Brasília numa segunda conflita com a igreja das 20h", conflitaComIgreja("2026-08-17", "18:00", "presencial", "Brasília"), null);
  checar("17h em Brasília numa segunda já não conflita (antes, com 18h30, conflitava)", !conflitaComIgreja("2026-08-17", "17:00", "presencial", "Brasília"), null);
  checar("rótulo da igreja na tela sai da constante", IGREJA_ROTULO === "20h", IGREJA_ROTULO);
  checar("17h em Luziânia numa segunda não conflita", !conflitaComIgreja("2026-08-17", "17:00", "presencial", "Luziânia"), null);
  checar("tarefa remota nunca conflita com a igreja", !conflitaComIgreja("2026-08-17", "19:00", "remoto", null), null);
  checar("horaSugerida pega o primeiro horário seguro (sem preferência de tarde)", horaSugerida("2026-08-17", "presencial", [], "Brasília") === "08:00", horaSugerida("2026-08-17", "presencial", [], "Brasília"));

  // =========================================================================
  grupo("Contas a pagar — entram no Painel 3 dias antes (recado de 14/09)");
  // =========================================================================
  const contaT = (id, data, extra) => ({ id, tipo: "saida", status: "a_pagar", escopo: "empresa", categoria: "Cartão", valor: 30, descricao: "Conta " + id, data, ...extra });
  const hojeT = "2026-09-14";
  const rc = resumoContas([
    contaT("d4", "2026-09-18"), contaT("d3", "2026-09-17"), contaT("d2", "2026-09-16"), contaT("d1", "2026-09-15"),
    contaT("d0", "2026-09-14"), contaT("venc2", "2026-09-12"), contaT("venc5", "2026-09-09"),
    contaT("vale", "2026-09-15", { categoria: "Vale" }), contaT("mao", "2026-09-15", { categoria: CATEGORIA_MAO_DE_OBRA }),
    contaT("paga", "2026-09-15", { status: "pago" }), contaT("semprazo", "2026-09-14", { descricao: "Pagar assim que houver saldo" }),
  ], [], hojeT);
  checar("D-3, D-2, D-1 e D0 entram no alerta, em ordem de vencimento", igual(rc.urgentes.map((f) => f.id), ["d0", "d1", "d2", "d3"]), rc.urgentes.map((f) => f.id));
  checar("D+4 não entra no alerta", ![...rc.vencidas, ...rc.urgentes].some((f) => f.id === "d4"), null);
  checar("vencidas ficam no alerta, a mais antiga primeiro", igual(rc.vencidas.map((f) => f.id), ["venc5", "venc2"]), rc.vencidas.map((f) => f.id));
  checar("Vale, Mão de obra e conta paga não entram", ![...rc.vencidas, ...rc.urgentes].some((f) => ["vale", "mao", "paga"].includes(f.id)), null);
  checar("conta sem prazo não vira urgente nem vencida", rc.semVencimento.some((f) => f.id === "semprazo") && ![...rc.vencidas, ...rc.urgentes].some((f) => f.id === "semprazo"), null);
  const rotT = (id) => rotuloVencimento([...rc.vencidas, ...rc.urgentes].find((f) => f.id === id), hojeT).texto;
  checar("rótulos: vencida, hoje, amanhã, 2 e 3 dias", igual(["venc2", "d0", "d1", "d2", "d3"].map(rotT), ["VENCIDA HÁ 2 DIAS", "VENCE HOJE", "VENCE AMANHÃ", "VENCE EM 2 DIAS", "VENCE EM 3 DIAS"]), ["venc2", "d0", "d1", "d2", "d3"].map(rotT));
  checar("depois de paga, a conta sai do alerta", resumoContas([contaT("x", "2026-09-15", { status: "pago" })], [], hojeT).urgentes.length === 0, null);
  checar("total do alerta soma só o intervalo (vencidas + D0..D3)", rc.totalVencidas + rc.totalUrgentes === 180, rc.totalVencidas + rc.totalUrgentes);

  // =========================================================================
  grupo("Compromisso que pode já ter sido feito (caso Karol, 16/09/2026)");
  // =========================================================================
  // A regra tem que ser ESTREITA: ela só aponta, mas quem lê o aviso decide fechar um compromisso. Um falso
  // positivo aqui faz o Diego marcar como feito algo que não aconteceu — pior que não avisar nada.
  const agK = [
    { id: "k1", servico_id: "sv1", titulo: "Enviar orçamento — Karol", criado_em: "2026-09-10T10:00:00Z" },
    { id: "k2", servico_id: "sv1", titulo: "Checar resposta da Karol", criado_em: "2026-09-16T18:00:00Z" },
    { id: "k3", servico_id: "sv2", titulo: "Outro serviço, mais novo", criado_em: "2026-09-16T19:00:00Z" },
    { id: "k4", servico_id: null, titulo: "Compromisso sem serviço", criado_em: "2026-09-16T20:00:00Z" },
  ];
  checar("ação criada depois, no mesmo serviço, acende o aviso", sucessorMaisNovoNoServico(agK[0], agK)?.id === "k2", sucessorMaisNovoNoServico(agK[0], agK));
  checar("a ação mais nova não acusa a si mesma nem a anterior", sucessorMaisNovoNoServico(agK[1], agK) === null, sucessorMaisNovoNoServico(agK[1], agK));
  checar("serviço diferente não conta, mesmo sendo mais novo", sucessorMaisNovoNoServico(agK[2], agK) === null, null);
  checar("compromisso sem serviço nunca acende", sucessorMaisNovoNoServico(agK[3], agK) === null, null);
  checar("sem criado_em não dá pra afirmar ordem: não acende", sucessorMaisNovoNoServico({ id: "k5", servico_id: "sv1" }, agK) === null, null);
  checar("agenda vazia não quebra", sucessorMaisNovoNoServico(agK[0], []) === null, null);

  grupo("Aplicar a melhor ordem da rota (fase 2, 19/09/2026)");
  // =========================================================================
  // Isto reescreve HORÁRIO de compromisso com cliente. A regra tem que ser burra e previsível: os horários
  // do dia são os mesmos, muda só quem ocupa cada um. Se um dia ela inventar horário, o Diego chega na casa
  // de alguém que não estava esperando.
  const pA = { id: "p1", titulo: "Entrega — Ana", cidade: "Valparaíso", hora: "08:00" };
  const pB = { id: "p2", titulo: "Visita — Bruno", cidade: "Luziânia", hora: "10:30" };
  const pC = { id: "p3", titulo: "Retirada — Célia", cidade: "Taguatinga", hora: "14:00" };
  const trocas1 = trocasDeHorario([pA, pB, pC], [pB, pA, pC]);
  checar("os horários do dia continuam os mesmos, só trocam de dono",
    JSON.stringify(trocas1.map((t) => t.para).sort()) === JSON.stringify(["08:00", "10:30"]), trocas1.map((t) => t.para));
  checar("quem sobe na ordem recebe o horário mais cedo",
    trocas1.find((t) => t.id === "p2")?.para === "08:00" && trocas1.find((t) => t.id === "p1")?.para === "10:30", trocas1);
  checar("quem não muda de horário fica fora da lista",
    !trocas1.some((t) => t.id === "p3"), trocas1);
  checar("ordem já ótima não gera troca nenhuma",
    trocasDeHorario([pA, pB, pC], [pA, pB, pC]).length === 0, trocasDeHorario([pA, pB, pC], [pA, pB, pC]));
  checar("o rótulo diz de quem é o compromisso e a cidade",
    /Bruno/.test(trocas1[0].rotulo) && /Luziânia|Valparaíso/.test(trocas1[0].rotulo), trocas1[0].rotulo);
  checar("segundos no banco não viram troca falsa (09:30 = 09:30:00)",
    trocasDeHorario([{ id: "x", hora: "09:30:00" }, { id: "y", hora: "11:00:00" }],
                    [{ id: "x", hora: "09:30:00" }, { id: "y", hora: "11:00:00" }]).length === 0, "sem troca");
  checar("lista vazia não quebra", trocasDeHorario([], []).length === 0, null);
  // O QUE NÃO SE MOVE — compromisso pessoal. Este caso nasceu de um defeito real visto na demonstração:
  // o bloqueio "Apresentação na escola do filho" entrava na permutação como qualquer parada.
  const pessoal = { id: "pp", titulo: "Apresentação na escola", cidade: "Luziânia", hora: "19:00", pessoal_id: "x1" };
  const comPessoal = trocasDeHorario([pA, pB, pessoal], [pessoal, pB, pA]);
  checar("compromisso pessoal nunca muda de horário",
    !comPessoal.some((t) => t.id === "pp"), comPessoal);
  checar("os móveis só disputam os horários que já eram deles (o das 19h fica de fora)",
    comPessoal.every((t) => ["08:00", "10:30"].includes(t.para)), comPessoal.map((t) => t.para));
  checar("pessoal virtual (sem linha na agenda) também não se move",
    !trocasDeHorario([pA, { id: "pv", hora: "16:00", cidade: "Luziânia", pessoal_virtual: true }],
                     [{ id: "pv", hora: "16:00", cidade: "Luziânia", pessoal_virtual: true }, pA]).some((t) => t.id === "pv"), null);
  // NADA SE MOVE SEM O DIEGO LIBERAR (recado de 19/09 sobre rigidez da agenda). A tabela `agenda` não tem
  // campo de FIXO/JANELA, então o app não pode adivinhar o que foi combinado com cliente: o padrão é
  // travado e a liberação é dele, item por item.
  const so = (ids) => (p) => ids.includes(p.id);
  checar("nada liberado, nada se move",
    trocasDeHorario([pA, pB, pC], [pB, pA, pC], so([])).length === 0, null);
  checar("um só liberado não gera troca — ele fica com o próprio horário",
    trocasDeHorario([pA, pB, pC], [pB, pA, pC], so(["p2"])).length === 0, trocasDeHorario([pA, pB, pC], [pB, pA, pC], so(["p2"])));
  const doisLiberados = trocasDeHorario([pA, pB, pC], [pB, pA, pC], so(["p1", "p2"]));
  checar("dois liberados fora de ordem trocam entre si",
    doisLiberados.length === 2 && doisLiberados.find((t) => t.id === "p2").para === "08:00", doisLiberados);
  checar("quem ficou travado não aparece na troca nem cede o horário",
    !doisLiberados.some((t) => t.id === "p3" || t.para === "14:00"), doisLiberados);
  checar("liberar um compromisso pessoal não o destrava",
    trocasDeHorario([pA, pessoal], [pessoal, pA], so(["pp", "p1"])).every((t) => t.id !== "pp"),
    trocasDeHorario([pA, pessoal], [pessoal, pA], so(["pp", "p1"])));

  // A economia prometida é a da ordem APLICÁVEL, com os fixos parados — não a da ordem ideal.
  const rotaComFixo = analisarRotaDoDia([
    { id: "f1", tipo: "presencial", cidade: "Valparaíso", hora: "08:00" },
    { id: "f2", tipo: "presencial", cidade: "Luziânia", hora: "10:00" },
    { id: "f3", tipo: "presencial", cidade: "Valparaíso", hora: "12:00" },
  ]);
  checar("a economia aplicável nunca é maior que a da ordem ideal",
    rotaComFixo.economiaAplicavel <= rotaComFixo.economia, [rotaComFixo.economiaAplicavel, rotaComFixo.economia]);
  // A análise só devolve trocas quando de fato vale a pena — o corte de 15 min continua mandando.
  const rota = analisarRotaDoDia([
    { id: "r1", tipo: "presencial", cidade: "Valparaíso", hora: "08:00" },
    { id: "r2", tipo: "presencial", cidade: "Luziânia", hora: "10:00" },
    { id: "r3", tipo: "presencial", cidade: "Valparaíso", hora: "12:00" },
  ]);
  checar("rota que volta pra trás traz trocas junto do aviso", !!rota && rota.trocas.length > 0, rota && rota.trocas);
  checar("um compromisso só não vira sugestão de rota",
    analisarRotaDoDia([{ id: "r1", tipo: "presencial", cidade: "Valparaíso", hora: "08:00" }]) === null, null);

  placar.textContent = `${passou} passaram · ${falhou} falharam`;
  placar.style.color = falhou ? "#e8776a" : "#7fbf8f";
})();
</script>
